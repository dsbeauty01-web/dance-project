<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nova.riv inspector</title>
<style>
  body{ margin:0; background:#140022; color:#eee; font-family:-apple-system,Segoe UI,sans-serif; padding:18px; }
  h1{ font-size:18px; color:#ff8ae2; }
  #wrap{ display:flex; gap:20px; flex-wrap:wrap; }
  canvas{ background:#1f0838; border-radius:16px; border:2px solid #ff5fd8; }
  pre{ flex:1; min-width:320px; background:#000; padding:14px; border-radius:12px;
       white-space:pre-wrap; font-size:13px; line-height:1.5; max-height:80vh; overflow:auto; color:#9fffce; }
  .err{ color:#ff6b6b; }
  .btn{ display:inline-block; margin:6px 6px 0 0; padding:8px 14px; background:#8b5cf6; color:#fff;
        border:0; border-radius:999px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>🔍 nova.riv inspector — what's riggable?</h1>
<p>This loads <code>nova.riv</code> and dumps its artboards, state machines, and inputs. Screenshot the right-hand panel and send it to me.</p>
<div id="wrap">
  <canvas id="c" width="360" height="360"></canvas>
  <pre id="out">loading rive runtime…</pre>
</div>
<div id="btns"></div>

<script src="https://unpkg.com/@rive-app/canvas@2.21.6"></script>
<script>
const out=document.getElementById('out');
const log=(s)=>{ out.textContent += "\n"+s; };
function dump(){
  try{
    out.textContent = "rive runtime loaded ✓\n";
    if(typeof rive==='undefined'){ out.innerHTML='<span class="err">Rive runtime failed to load (CDN blocked?).</span>'; return; }
    const r = new rive.Rive({
      src: 'nova.riv',
      canvas: document.getElementById('c'),
      autoplay: true,
      onLoad: ()=>{
        try{
          r.resizeDrawingSurfaceToCanvas();
          const c = r.contents;  // full structure: artboards → stateMachines → inputs, animations
          log("=== nova.riv CONTENTS ===");
          log(JSON.stringify(c, null, 2));
          // also list state-machine names + inputs the practical way
          try{
            const sms = r.stateMachineNames || [];
            log("\n=== stateMachineNames: "+JSON.stringify(sms));
            sms.forEach(sm=>{
              try{
                const inputs = r.stateMachineInputs(sm) || [];
                log("  ["+sm+"] inputs: "+inputs.map(i=>i.name+" ("+({0:'?',56:'trigger',59:'number',58:'boolean'}[i.type]||i.type)+")").join(", "));
              }catch(e){ log("  ["+sm+"] input read err: "+e.message); }
            });
          }catch(e){ log("sm list err: "+e.message); }
          log("\n=== animationNames: "+JSON.stringify(r.animationNames||[]));
          // buttons to test each state machine visually
          const bd=document.getElementById('btns');
          (r.stateMachineNames||[]).forEach(sm=>{
            const b=document.createElement('button'); b.className='btn'; b.textContent='play SM: '+sm;
            b.onclick=()=>{ try{ r.stop(); r.play(sm); }catch(e){ alert(e.message); } };
            bd.appendChild(b);
          });
        }catch(e){ log('onLoad dump err: '+e.message); }
      },
      onLoadError: (e)=>{ out.innerHTML='<span class="err">load error: '+(e&&e.message||e)+'</span>'; }
    });
  }catch(e){ out.innerHTML='<span class="err">init error: '+e.message+'</span>'; }
}
if(document.readyState!=='loading') dump(); else window.addEventListener('DOMContentLoaded', dump);
</script>
</body>
</html>
