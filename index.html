<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nova v66 ONYX — Real Build</title>

<!-- Fonts: Fredoka (display, friendly geometric) + Quicksand (body, soft sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════════
   v66 ONYX — ground-up rebuild
   Aesthetic: deep night sky + aurora + warm pink-rose-gold accents
   Lexi pattern: adaptive avatar sizing per phase
   ════════════════════════════════════════════════════════════════ */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: #0a0517;
  color: #f5e9ff;
  font-family: 'Quicksand', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Aurora background — animated glows behind everything */
body::before, body::after {
  content: ''; position: fixed; pointer-events: none; z-index: 0;
}
body::before {
  inset: -20% -20% auto auto;
  width: 80vw; height: 80vh;
  background: radial-gradient(ellipse, #9b3aa3 0%, transparent 60%);
  filter: blur(80px); opacity: 0.55;
  animation: aurora-1 18s ease-in-out infinite alternate;
}
body::after {
  inset: auto auto -20% -20%;
  width: 80vw; height: 80vh;
  background: radial-gradient(ellipse, #ff4d9e 0%, transparent 60%);
  filter: blur(90px); opacity: 0.4;
  animation: aurora-2 22s ease-in-out infinite alternate;
}
@keyframes aurora-1 { to { transform: translate(-10vw, 8vh) rotate(8deg); } }
@keyframes aurora-2 { to { transform: translate(8vw, -6vh) rotate(-6deg); } }

/* Subtle starfield */
.stars {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 25% 30%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 65%, #ffd6f5 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 80%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 88% 12%, #fff 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 15% 55%, #ffd6f5 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 25%, #fff 0%, transparent 100%);
  opacity: 0.6;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: 0.4; } to { opacity: 0.8; } }

/* ─── version banner (always visible for testing) ─── */
#vbanner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  text-align: center; padding: 5px 12px;
  background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706);
  color: #1a0d2b;
  font: 700 13px/1 'Fredoka', sans-serif;
  letter-spacing: 1.5px;
}

/* ─── status bar (debug at bottom) ─── */
#status {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  text-align: center; padding: 6px 16px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  font: 500 12px/1.4 'Quicksand', monospace;
  color: rgba(255,255,255,0.7);
}

/* ─── main stage ─── */
#stage {
  position: fixed; inset: 28px 0 28px 0;
  z-index: 10;
}

/* ════════════════════════════════════════════════════════════════
   PHASE 1: IDLE — magic orb
   ════════════════════════════════════════════════════════════════ */
#idle-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 30px;
  transition: opacity 0.6s ease;
}
#idle-screen.hidden { opacity: 0; pointer-events: none; }

#idle-title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: clamp(32px, 7vw, 72px);
  background: linear-gradient(135deg, #ffd6f5 0%, #ff4d9e 50%, #fbbf24 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
  text-align: center;
  line-height: 1;
  filter: drop-shadow(0 4px 20px rgba(255, 77, 158, 0.4));
}
#idle-subtitle {
  font-family: 'Quicksand', sans-serif;
  font-weight: 500;
  font-size: clamp(15px, 2vw, 18px);
  color: rgba(255, 214, 245, 0.75);
  text-align: center;
  max-width: 320px;
  line-height: 1.4;
}
#magic-orb {
  width: clamp(180px, 30vmin, 280px);
  height: clamp(180px, 30vmin, 280px);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #fff 0%, #ffd6f5 15%, #ff4d9e 45%, #9b3aa3 75%, #4a1d6e 100%);
  position: relative;
  cursor: pointer;
  border: none;
  box-shadow:
    0 0 80px rgba(255, 77, 158, 0.6),
    0 0 160px rgba(155, 58, 163, 0.4),
    inset 0 -10px 40px rgba(74, 29, 110, 0.6);
  animation: orb-float 4s ease-in-out infinite;
  transition: transform 0.3s ease;
}
#magic-orb:hover { transform: scale(1.05); }
#magic-orb:active { transform: scale(0.97); }
#magic-orb::after {
  content: ''; position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.4) 0%, transparent 50%);
  pointer-events: none;
}
@keyframes orb-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

/* sparkles around the orb */
.sparkle {
  position: absolute; width: 6px; height: 6px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 12px #fff, 0 0 24px #ffd6f5;
  animation: sparkle 3s ease-in-out infinite;
}
@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50%      { opacity: 1; transform: scale(1); }
}

/* ════════════════════════════════════════════════════════════════
   PHASE 2 + 4: CLOSEUP MODE — Nova big center, kid small corner
   ════════════════════════════════════════════════════════════════ */
#play-screen {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease;
}
#play-screen.active { opacity: 1; pointer-events: auto; }

/* Nova frame — sized + positioned by phase class */
#nova-frame {
  position: absolute;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #2d1448, #0a0517);
  border: 3px solid rgba(255, 77, 158, 0.5);
  box-shadow:
    0 0 60px rgba(255, 77, 158, 0.4),
    0 0 120px rgba(155, 58, 163, 0.25),
    inset 0 0 30px rgba(0,0,0,0.4);
  transition: all 0.7s cubic-bezier(0.65, 0, 0.35, 1);
}
#nova-frame video {
  width: 100%; height: 100%;
  object-fit: cover;
}
#nova-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 8px;
  color: #ffd6f5;
}
#nova-placeholder .emoji { font-size: 48px; }
#nova-placeholder .text {
  font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14px;
  opacity: 0.85;
}

/* ─── PHASE: closeup (greeting / end) — Nova BIG center ─── */
.phase-closeup #nova-frame {
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(70vmin, 540px);
  height: min(70vmin, 540px);
}
.phase-closeup #webcam-frame {
  bottom: 60px; right: 24px;
  width: 140px; height: 180px;
}
.phase-closeup #dance-frame { display: none; }

/* ─── PHASE: lesson (during song) — MP4 LEFT 60%, kid RIGHT 35%, Nova orb middle ─── */
.phase-lesson #dance-frame {
  /* MP4 LEFT, 60% of screen */
  display: block;
  top: 16px;
  left: 16px;
  width: 60%;
  height: calc(100% - 32px);
  border-radius: 24px;
  background: #000;
  transform: none;
  right: auto; bottom: auto;
}
.phase-lesson #dance-frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.phase-lesson #webcam-frame {
  /* Kid RIGHT, ~35% of screen */
  top: 16px;
  right: 16px;
  width: calc(35% - 32px);
  height: calc(100% - 32px);
  border-radius: 24px;
  transform: none;
  left: auto; bottom: auto;
}
.phase-lesson #webcam-frame video {
  border-radius: 0;
}
.phase-lesson #nova-frame {
  /* Nova orb floats in the MIDDLE between MP4 and webcam */
  position: absolute;
  top: 50%;
  left: 60%;
  transform: translate(-50%, -50%);
  width: 130px;
  height: 130px;
  border-radius: 50%;
  z-index: 60;
  border: 3px solid rgba(255, 77, 158, 0.6);
  box-shadow: 0 0 40px rgba(255, 77, 158, 0.5),
              0 12px 32px rgba(0, 0, 0, 0.6);
  right: auto; bottom: auto;
}
.phase-lesson #state-badge {
  bottom: 6px;
  font-size: 10px;
  padding: 5px 12px;
}

/* ─── PHASE: conversation (countdown) — both medium side-by-side ─── */
.phase-conversation #nova-frame {
  top: 50%; left: 25%;
  transform: translate(-50%, -50%);
  width: min(40vmin, 320px);
  height: min(40vmin, 320px);
}
.phase-conversation #webcam-frame {
  top: 50%; left: 75%;
  transform: translate(-50%, -50%);
  width: min(40vmin, 320px);
  height: min(40vmin, 320px);
  border-radius: 50%;
}
.phase-conversation #dance-frame { display: none; }

/* ─── webcam frame ─── */
#webcam-frame {
  position: absolute;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(155, 58, 163, 0.5);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  background: #0a0517;
  transition: all 0.7s cubic-bezier(0.65, 0, 0.35, 1);
}
#webcam-frame video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* mirror */
}

/* ─── dance video frame ─── */
#dance-frame {
  position: absolute;
  border-radius: 24px;
  overflow: hidden;
  background: #0a0517;
  border: 2px solid rgba(255, 214, 245, 0.15);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  transition: all 0.7s cubic-bezier(0.65, 0, 0.35, 1);
}
#dance-frame video {
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ─── state badge (on Nova) ─── */
#state-badge {
  position: absolute;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(10px);
  font: 600 11px/1 'Quicksand', sans-serif;
  color: #fff;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
  z-index: 5;
}
.state-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #fbbf24;
  box-shadow: 0 0 8px currentColor;
}
.state-dot.watching  { background: #fbbf24; }
.state-dot.listening { background: #22c55e; animation: pulse 1.2s infinite; }
.state-dot.talking   { background: #ff4d9e; animation: pulse 0.6s infinite; }
.state-dot.thinking  { background: #a78bfa; animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(1.3); }
}

/* ─── always-on controls ─── */
#controls {
  position: absolute; top: 40px; right: 24px;
  z-index: 100;
  display: flex; gap: 10px;
}
.ctrl-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.ctrl-btn:hover {
  background: rgba(255, 77, 158, 0.4);
  border-color: rgba(255, 77, 158, 0.6);
  transform: scale(1.08);
}

/* hide controls during lesson if Nova frame is in top-right (overlap) */
.phase-lesson #controls {
  top: auto; bottom: 60px; right: 200px;
}

/* ─── chat bar (always visible at bottom) ─── */
#chat-bar {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: min(640px, calc(100% - 40px));
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 999px;
  background: rgba(10, 5, 23, 0.85);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 77, 158, 0.25);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 90;
}
#chat-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: #fff;
  font: 500 16px/1.4 'Quicksand', sans-serif;
  padding: 12px 16px;
}
#chat-input::placeholder { color: rgba(255,214,245,0.45); }

#audio-unmute, #chat-send {
  width: 44px; height: 44px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff4d9e, #9b3aa3);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
#audio-unmute {
  background: rgba(255,255,255,0.08);
  color: #fbbf24;
  font-size: 20px;
  display: none;  /* hidden by default; only shown if autoplay fails */
}
body.audio-needs-unmute #audio-unmute { display: flex; }
#audio-unmute.active {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
}
#audio-unmute:hover, #chat-send:hover { transform: scale(1.08); }
#chat-send:active { transform: scale(0.95); }

/* ─── score badge (only during dance) ─── */
#score-badge {
  position: absolute;
  top: 28px;
  left: 28px;
  z-index: 70;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 8px 14px;
  border-radius: 16px;
  background: rgba(10, 5, 23, 0.7);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(251, 191, 36, 0.5);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  min-width: 60px;
}
.phase-lesson #score-badge { display: flex; }
#score-badge .score-num {
  font: 800 28px/1 'Fredoka', sans-serif;
  background: linear-gradient(135deg, #fbbf24, #ff4d9e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#score-badge .score-label {
  font: 600 9px/1 'Quicksand', sans-serif;
  color: rgba(255, 214, 245, 0.7);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}
#score-badge.bump {
  animation: score-bump 0.4s ease-out;
}
@keyframes score-bump {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.18); }
}

/* ─── pose detection canvas (over webcam) ─── */
#pose-canvas {
  position: absolute;
  pointer-events: none;
  z-index: 6;
  /* matched to webcam frame in JS */
}

/* ─── cue card — has 2 states: PREP (ring filling) + FIRE (NOW flash) ─── */
#cue-card {
  position: absolute;
  top: 30%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 80;
  pointer-events: none;
  text-align: center;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#cue-card.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
/* In lesson mode, cue card floats at top of the kid panel (right 35%)
   Positioned high so it doesn't hide the kid's body */
.phase-lesson #cue-card {
  top: 25%;
  /* Center horizontally over the kid panel which is right 35% */
  left: calc(100% - (35% / 2) - 16px);
}
.phase-lesson #cue-card.show {
  transform: translate(-50%, -50%) scale(0.85);
}
.phase-lesson #cue-card.firing {
  transform: translate(-50%, -50%) scale(1);
}
.phase-lesson .cue-ring {
  /* Smaller in lesson mode so it doesn't dominate */
  width: 130px; height: 130px;
}
.phase-lesson .cue-ring svg {
  width: 130px; height: 130px;
}
.phase-lesson .cue-emoji-big {
  font-size: 56px;
}
.phase-lesson .cue-label {
  font-size: 16px;
  margin-top: 8px;
}

/* PREP state — emoji with countdown ring */
.cue-ring {
  position: relative;
  width: 160px; height: 160px;
  margin: 0 auto;
}
.cue-ring svg {
  position: absolute; inset: 0;
  transform: rotate(-90deg);
}
.cue-ring circle.bg {
  fill: rgba(10,5,23,0.85);
  stroke: rgba(255,255,255,0.15);
  stroke-width: 6;
}
.cue-ring circle.progress {
  fill: none;
  stroke: #fbbf24;
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 440;
  stroke-dashoffset: 440;  /* will animate to 0 in JS */
  filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.7));
  transition: stroke-dashoffset linear;
}
.cue-emoji-big {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 72px;
  line-height: 1;
}
.cue-label {
  margin-top: 16px;
  font: 700 22px/1.1 'Fredoka', sans-serif;
  color: #fff;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
}

/* FIRE state — NOW! window is OBVIOUS */
#cue-card.firing {
  transform: translate(-50%, -50%) scale(1.15);
}
#cue-card.firing .cue-ring circle.progress {
  stroke: #ff4d9e;
  stroke-dashoffset: 0;
  stroke-width: 12;
  animation: cue-fire-pulse 0.4s ease-out infinite alternate;
}
@keyframes cue-fire-pulse {
  to { 
    filter: drop-shadow(0 0 32px rgba(255, 77, 158, 1)) drop-shadow(0 0 64px rgba(255, 77, 158, 0.6));
    transform: scale(1.06);
  }
}
#cue-card.firing .cue-emoji-big {
  font-size: 90px;
  animation: cue-fire-bounce 0.3s ease-out infinite alternate;
}
@keyframes cue-fire-bounce {
  to { transform: scale(1.18) rotate(-4deg); }
}
#cue-card.firing .cue-label {
  color: #fff;
  background: linear-gradient(135deg, #ff4d9e, #fbbf24);
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1px;
  box-shadow: 0 8px 24px rgba(255, 77, 158, 0.5);
  animation: now-shake 0.3s ease infinite alternate;
}
@keyframes now-shake {
  to { transform: translateX(2px); }
}

/* ─── countdown overlay ─── */
#countdown {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  background: rgba(10, 5, 23, 0.55);
  backdrop-filter: blur(8px);
}
#countdown.show { display: flex; }
#countdown .count-num {
  font: 700 clamp(140px, 25vmin, 280px) / 1 'Fredoka', sans-serif;
  background: linear-gradient(135deg, #ffd6f5, #ff4d9e, #fbbf24);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 40px rgba(255, 77, 158, 0.6));
  animation: count-pop 1s ease-out;
}
@keyframes count-pop {
  0%   { transform: scale(0.3); opacity: 0; }
  50%  { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1);   opacity: 1; }
}

/* ─── hit pop (flash when kid does a move correctly) ─── */
#hit-pop {
  position: absolute;
  top: 30%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 85;
  pointer-events: none;
  font: 700 clamp(48px, 9vmin, 100px) / 1 'Fredoka', sans-serif;
  background: linear-gradient(135deg, #fbbf24, #ff4d9e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(255, 77, 158, 0.4);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#hit-pop.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* ─── Dance button ─── */
#btn-dance {
  flex-shrink: 0;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a0d2b;
  font: 700 14px/1 'Fredoka', sans-serif;
  padding: 10px 18px;
  cursor: pointer;
  margin-left: 4px;
  display: none; /* shown after Nova connects */
  transition: transform 0.15s ease;
  white-space: nowrap;
}
#btn-dance:hover { transform: scale(1.05); }
#btn-dance.ready { display: block; animation: dance-pulse 1.4s ease-in-out infinite; }
@keyframes dance-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.6); }
  50%      { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
}

/* ─── connecting overlay (during LiveKit handshake) ─── */
#connecting {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px;
  background: rgba(10, 5, 23, 0.85);
  backdrop-filter: blur(14px);
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s;
}
#connecting.show { opacity: 1; pointer-events: auto; }
.spinner {
  width: 60px; height: 60px;
  border: 4px solid rgba(255, 77, 158, 0.2);
  border-top-color: #ff4d9e;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

<body>

<div class="stars"></div>

<!-- ════════════════════════════════════════════════════════════════
     STAGE
     ════════════════════════════════════════════════════════════════ -->

<!-- TensorFlow.js + MoveNet for pose detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0/dist/pose-detection.min.js"></script>

<!-- LiveKit (Runway WebRTC) -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.13.3/dist/livekit-client.umd.min.js"></script>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════
const CFG = {
  workerUrl: 'https://long-art-8269r.dsbeauty01.workers.dev/runway-session',
  // YOUR custom Pixar Nova built in Runway portal:
  avatarId:   'e976bbb2-de60-4da6-845e-4b754050e55b',
  avatarType: 'custom',
};

// ════════════════════════════════════════════════════════════════
// DOM
// ════════════════════════════════════════════════════════════════
const stage         = document.getElementById('stage');
const idleScreen    = document.getElementById('idle-screen');
const playScreen    = document.getElementById('play-screen');
const orb           = document.getElementById('magic-orb');
const novaFrame     = document.getElementById('nova-frame');
const novaPlaceholder = document.getElementById('nova-placeholder');
const stateLabel    = document.getElementById('state-label');
const stateDot      = document.querySelector('.state-dot');
const webcamVideo   = document.getElementById('webcam-video');
const danceVideo    = document.getElementById('dance-video');
// Surface any MP4 loading failure so we don't silently get a black screen
danceVideo.addEventListener('error', (e) => {
  const err = danceVideo.error;
  console.error('[mp4 ERROR]', err?.code, err?.message);
  setStatus(`❌ MP4 error code ${err?.code} (${err?.message || 'unknown'})`);
});
danceVideo.addEventListener('loadedmetadata', () => {
  console.log('[mp4] metadata loaded, duration:', danceVideo.duration);
});
const connecting    = document.getElementById('connecting');
const connectingText = document.getElementById('connecting-text');
const errorScreen   = document.getElementById('error-screen');
const errorText     = document.getElementById('error-text');
const statusBar     = document.getElementById('status');

// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
function setStatus(msg) {
  statusBar.textContent = `v66 · ${msg}`;
  console.log('[v66]', msg);
}

function setPhase(phase) {
  stage.className = `phase-${phase}`;
  console.log('[phase]', phase);
}

function setState(state) {
  stateLabel.textContent = state;
  stateDot.className = 'state-dot ' + state;
}

function showError(msg) {
  errorText.textContent = msg;
  errorScreen.classList.add('show');
  setStatus('error · ' + msg.substring(0, 60));
}

// Sprinkle sparkles around the orb
function makeSparkles() {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (i / 6) * Math.PI * 2;
    const radius = 130 + Math.random() * 40;
    s.style.left = `calc(50% + ${Math.cos(angle) * radius}px)`;
    s.style.top  = `calc(50% + ${Math.sin(angle) * radius}px)`;
    s.style.animationDelay = (Math.random() * 3) + 's';
    idleScreen.appendChild(s);
  }
}
makeSparkles();

// ════════════════════════════════════════════════════════════════
// MAIN FLOW
// ════════════════════════════════════════════════════════════════
orb.addEventListener('click', startNova);

async function startNova() {
  setStatus('asking for camera + mic...');
  
  // 1. Get camera + mic
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: true,
    });
    webcamVideo.srcObject = stream;
  } catch(e) {
    showError('Please allow camera and microphone, then refresh.');
    return;
  }

  // 2. Switch idle → play (closeup mode for greeting)
  idleScreen.classList.add('hidden');
  playScreen.classList.add('active');
  setPhase('closeup');
  connecting.classList.add('show');
  connectingText.textContent = 'Waking Nova up…';

  // 3. Connect LiveKit
  await connectNova();
}

async function connectNova() {
  try {
    setStatus('asking Worker for session...');
    connectingText.textContent = 'Asking Worker for session…';

    const res = await fetch(CFG.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        avatarId:   CFG.avatarId,
        avatarType: CFG.avatarType,
      }),
    });
    const creds = await res.json();

    if (!creds.serverUrl || !creds.token) {
      throw new Error(`stage=${creds.stage||'?'} ${JSON.stringify(creds).substring(0,200)}`);
    }

    setStatus('connecting room ' + creds.roomName);
    connectingText.textContent = 'Connecting…';

    const room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true,
    });

    // Track subscription — attach Nova's video / audio
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      console.log('[track]', track.kind, 'from', participant.identity);

      if (track.kind === 'video') {
        novaPlaceholder.style.display = 'none';
        let v = document.getElementById('nova-video');
        if (!v) {
          v = document.createElement('video');
          v.id = 'nova-video';
          v.autoplay = true; v.playsInline = true;
          novaFrame.insertBefore(v, novaFrame.firstChild);
        }
        track.attach(v);
        connecting.classList.remove('show');
        setStatus('Nova is here!');
        setState('talking');
      }
      if (track.kind === 'audio') {
        const a = document.createElement('audio');
        a.autoplay = true;
        a.volume = 1.0;
        a.muted = false;
        track.attach(a);
        document.body.appendChild(a);
        // Force play immediately. The orb tap counted as user gesture so this should work.
        a.play().then(() => {
          // Audio confirmed playing → hide the manual unmute button
          const btn = document.getElementById('audio-unmute');
          if (btn) {
            btn.style.opacity = '0.4';
            btn.classList.add('active');
            btn.title = 'Audio on';
          }
          console.log('[audio] playing');
        }).catch(err => {
          console.warn('[audio] autoplay blocked, showing manual button:', err);
          document.body.classList.add('audio-needs-unmute');
          // Also retry on any next click
          document.body.addEventListener('click', () => {
            a.play().then(() => {
              document.body.classList.remove('audio-needs-unmute');
            }).catch(()=>{});
          }, { once: true });
        });
      }
    });

    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      // Update state badge based on who's talking
      const novaIsSpeaking = speakers.some(s => s.identity !== room.localParticipant.identity);
      const meIsSpeaking   = speakers.some(s => s.identity === room.localParticipant.identity);
      if (novaIsSpeaking)      setState('talking');
      else if (meIsSpeaking)   setState('listening');
      else                      setState('watching');
    });

    room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
      console.log('[disconnected]', reason);
      setStatus('disconnected');
    });

    await room.connect(creds.serverUrl, creds.token);
    setStatus('connected · publishing mic');
    await room.localParticipant.setMicrophoneEnabled(true);
    setStatus('mic live · waiting for Nova');
    
    // Store globally so chat input can use it
    window.novaRoom = room;
    
    // Smart intro — first time vs returning kid
    const event = novaMem.isFirstTime ? 'intro_first' : 'intro_returning';
    setTimeout(() => askBrain(event), 1500);  // small delay so Nova's audio track is ready

  } catch (err) {
    console.error('[connect error]', err);
    connecting.classList.remove('show');
    showError(err.message);
  }
}

// ════════════════════════════════════════════════════════════════
// CONTROLS
// ════════════════════════════════════════════════════════════════
document.getElementById('btn-exit').addEventListener('click', () => {
  if (window.novaRoom) window.novaRoom.disconnect();
  location.reload();
});

document.getElementById('btn-pause').addEventListener('click', async () => {
  if (window.novaRoom) {
    const enabled = window.novaRoom.localParticipant.isMicrophoneEnabled;
    await window.novaRoom.localParticipant.setMicrophoneEnabled(!enabled);
    document.getElementById('btn-pause').textContent = enabled ? '🎤' : '⏸';
    setStatus(enabled ? 'mic muted' : 'mic on');
  }
});

// ════════════════════════════════════════════════════════════════
// NOVA MEMORY (localStorage)
// ════════════════════════════════════════════════════════════════
const Memory = {
  load() {
    try {
      const raw = localStorage.getItem('nova-memory');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {
      name: null,
      isFirstTime: true,
      totalSessions: 0,
      maxStreak: 0,
      favoriteMove: null,
      lastVisit: null,
    };
  },
  save(mem) {
    try { localStorage.setItem('nova-memory', JSON.stringify(mem)); }
    catch(e) { console.warn('[memory] save failed', e); }
  },
  // Per-session live state
  session: {
    hits: 0,
    attempts: 0,
    currentStreak: 0,
    maxStreak: 0,
    consecutiveMisses: 0,
    moveHits: {},  // count per move type
  },
  reset() {
    this.session = {
      hits: 0, attempts: 0, currentStreak: 0, maxStreak: 0,
      consecutiveMisses: 0, moveHits: {},
    };
  }
};

let novaMem = Memory.load();
console.log('[memory] loaded:', novaMem);

// ════════════════════════════════════════════════════════════════
// NOVA BRAIN — Claude Haiku via Worker, structured event prompts
// Returns the text Nova should say, then we send it to Runway to speak.
// ════════════════════════════════════════════════════════════════
async function askBrain(event, context = {}, userMessage = '') {
  try {
    const fullMem = {
      ...novaMem,
      phase: stage.className.replace('phase-', ''),  // closeup | conversation | lesson
      hits: Memory.session.hits,
      attempts: Memory.session.attempts,
      maxStreak: Math.max(novaMem.maxStreak || 0, Memory.session.maxStreak),
    };
    const res = await fetch('https://long-art-8269r.dsbeauty01.workers.dev/nova-brain', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event, context, memory: fullMem, userMessage }),
    });
    const data = await res.json();
    const text = (data.text || '').trim();
    console.log(`[brain ${event}]`, text);
    if (text) await sendChatToNova(text);  // Nova speaks it
    return text;
  } catch(e) {
    console.warn('[brain] failed:', e);
  }
}

// ════════════════════════════════════════════════════════════════
// CHAT INPUT — text to Nova
// ════════════════════════════════════════════════════════════════
const chatInput = document.getElementById('chat-input');
const chatSend  = document.getElementById('chat-send');
const audioUnmute = document.getElementById('audio-unmute');

// Send chat to Nova via LiveKit data channel.
// Runway Avatars accept text messages this way to drive the conversation.
async function sendChatToNova(text) {
  if (!window.novaRoom) {
    console.warn('[chat] no room yet');
    return;
  }
  if (!text || !text.trim()) return;
  try {
    // Try the Runway message format
    const payload = {
      type: 'user_message',
      text: text.trim(),
    };
    const data = new TextEncoder().encode(JSON.stringify(payload));
    await window.novaRoom.localParticipant.publishData(data, { reliable: true });
    console.log('[chat] sent →', text);
    setStatus('sent: ' + text.substring(0, 40));
    
    // Also try to wake all <audio> elements (browsers block until user interacts)
    document.querySelectorAll('audio').forEach(a => {
      a.muted = false;
      a.volume = 1.0;
      a.play().catch(()=>{});
    });
  } catch(e) {
    console.error('[chat] send failed:', e);
    setStatus('chat send failed: ' + e.message);
  }
}

chatSend.addEventListener('click', () => {
  const t = chatInput.value.trim();
  if (!t) return;
  chatInput.value = '';
  
  // First-time name capture (heuristic: short response, mostly letters)
  if (novaMem.isFirstTime && !novaMem.name && t.length < 30 && /^[a-zA-Z\s]+$/.test(t)) {
    const possibleName = t.split(/\s+/).find(w => w.length > 1 && /^[a-zA-Z]+$/.test(w));
    if (possibleName) {
      const name = possibleName.charAt(0).toUpperCase() + possibleName.slice(1).toLowerCase();
      novaMem.name = name;
      Memory.save(novaMem);
      askBrain('name_received', { name });
      chatInput.focus();
      return;
    }
  }
  
  // Otherwise free chat through brain
  askBrain('free_chat', {}, t);
  chatInput.focus();
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    chatSend.click();
  }
});

// Audio unmute button — fixes browsers that block autoplay
audioUnmute.addEventListener('click', () => {
  let unblocked = 0;
  document.querySelectorAll('audio').forEach(a => {
    a.muted = false;
    a.volume = 1.0;
    a.play().then(() => unblocked++).catch(err => console.warn('[unmute]', err));
  });
  audioUnmute.classList.add('active');
  audioUnmute.textContent = '🔊';
  setStatus(`audio enabled (${unblocked} streams)`);
});

// ════════════════════════════════════════════════════════════════
// PHASE TRANSITIONS — stub for future use (when we add dance phase)
// ════════════════════════════════════════════════════════════════
window.NovaPhase = {
  closeup:      () => setPhase('closeup'),
  conversation: () => setPhase('conversation'),
  lesson:       () => setPhase('lesson'),
};

// ════════════════════════════════════════════════════════════════
// DANCE FLOW — song, cues, MoveNet (no dance video — Nova IS the teacher)
// ════════════════════════════════════════════════════════════════
const danceMusic = document.getElementById('dance-music');
const cueCard = document.getElementById('cue-card');
const cueEmoji = cueCard.querySelector('.cue-emoji-big');
const cueLabel = cueCard.querySelector('.cue-label');
const cueProgress = cueCard.querySelector('circle.progress');
const countdownEl = document.getElementById('countdown');
const countNum = countdownEl.querySelector('.count-num');
const hitPop = document.getElementById('hit-pop');
const btnDance = document.getElementById('btn-dance');
const poseCanvas = document.getElementById('pose-canvas');
const poseCtx = poseCanvas.getContext('2d');

// Dance state
const Dance = {
  detector: null,
  running: false,
  currentCue: null,      // active cue object
  cueState: 'idle',      // 'idle' | 'prep' | 'fire'
  cueDeadline: 0,
  hits: 0,
  attempts: 0,
  lastHitAt: 0,
  startedAt: 0,
};

// Each cue has a PREP window (2s, ring fills) and a FIRE window (2s, kid does action)
const PREP_MS = 2000;
const FIRE_MS = 2000;

// Cue timeline — Hello Hello is ~111s. Intro 0-15s no cues; cues from 16s.
// Spacing ~6s gives ~14 cues over 90s. Mix of difficulties so kid stays engaged.
const TIMELINE = [
  { at: 16,  emoji: '👋', label: 'WAVE!',          detect: 'right_hand_up' },
  { at: 22,  emoji: '🙌', label: 'BOTH HANDS UP!', detect: 'both_hands_up' },
  { at: 28,  emoji: '👏', label: 'CLAP!',          detect: 'clap' },
  { at: 34,  emoji: '✋', label: 'LEFT HAND UP!',  detect: 'left_hand_up' },
  { at: 42,  emoji: '🙌', label: 'BOTH HIGH!',     detect: 'both_hands_up' },
  { at: 48,  emoji: '🤲', label: 'HANDS ON HEAD!', detect: 'hands_on_head' },
  { at: 54,  emoji: '👏', label: 'CLAP CLAP!',     detect: 'clap' },
  { at: 60,  emoji: '✋', label: 'RIGHT HAND!',    detect: 'right_hand_up' },
  { at: 68,  emoji: '🙌', label: 'BOTH HANDS!',    detect: 'both_hands_up' },
  { at: 74,  emoji: '👏', label: 'BIG CLAP!',      detect: 'clap' },
  { at: 80,  emoji: '✋', label: 'LEFT UP!',       detect: 'left_hand_up' },
  { at: 86,  emoji: '🤸', label: 'JUMP!',          detect: 'both_hands_up' },
  { at: 92,  emoji: '👏', label: 'CLAP IT!',       detect: 'clap' },
  { at: 100, emoji: '🌟', label: 'AMAZING!',       detect: 'both_hands_up' },
];

let firedCues = new Set();

// ─── Load MoveNet (lazy, only when dance starts) ───
async function loadMoveNet() {
  if (Dance.detector) return Dance.detector;
  setStatus('loading body tracker...');
  await tf.setBackend('webgl');
  await tf.ready();
  Dance.detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
  );
  setStatus('body tracker ready');
  return Dance.detector;
}

// ─── Pose detection loop ───
async function poseLoop() {
  if (!Dance.running || !Dance.detector) return;
  try {
    const poses = await Dance.detector.estimatePoses(webcamVideo, { flipHorizontal: false });
    if (poses[0]) {
      const kp = {};
      poses[0].keypoints.forEach(p => {
        if (p.score > 0.3) kp[p.name] = p;
      });
      // Note: camera is mirrored, MoveNet's left = user's right
      // We swap in detection logic
      checkCue(kp);
      drawSkeleton(kp);
    }
  } catch(e) { console.warn('[pose] err:', e); }
  requestAnimationFrame(poseLoop);
}

function drawSkeleton(kp) {
  // Position canvas over webcam
  const wf = document.getElementById('webcam-frame');
  const r = wf.getBoundingClientRect();
  const sr = document.getElementById('stage').getBoundingClientRect();
  poseCanvas.style.top  = (r.top - sr.top)  + 'px';
  poseCanvas.style.left = (r.left - sr.left) + 'px';
  poseCanvas.style.width  = r.width + 'px';
  poseCanvas.style.height = r.height + 'px';
  poseCanvas.width  = webcamVideo.videoWidth || 640;
  poseCanvas.height = webcamVideo.videoHeight || 480;
  
  poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
  // Mirror to match the displayed video
  poseCtx.save();
  poseCtx.translate(poseCanvas.width, 0);
  poseCtx.scale(-1, 1);
  poseCtx.fillStyle = '#ff4d9e';
  Object.values(kp).forEach(p => {
    poseCtx.beginPath();
    poseCtx.arc(p.x, p.y, 5, 0, Math.PI*2);
    poseCtx.fill();
  });
  poseCtx.restore();
}

// ─── Cue detection ───
// IMPORTANT: camera is mirrored — MoveNet's left_wrist = user's RIGHT hand
function checkCue(kp) {
  // Only check hits during FIRE window (not PREP)
  if (!Dance.currentCue || Dance.cueState !== 'fire') return;
  if (Date.now() > Dance.cueDeadline) {
    // Cue window expired without a hit
    const cue = Dance.currentCue;
    Memory.session.currentStreak = 0;
    Memory.session.consecutiveMisses++;
    
    // Only react after the 3rd consecutive miss (silence first 2 — kindness)
    if (Memory.session.consecutiveMisses === 3 && cue) {
      askBrain('miss', {
        move: cue.label,
        consecutiveMisses: Memory.session.consecutiveMisses,
      });
    }
    hideCue();
    return;
  }
  if (Date.now() - Dance.lastHitAt < 800) return;
  
  const cue = Dance.currentCue;
  let hit = false;
  
  // Camera-mirrored: kp.left_* = user's right side, kp.right_* = user's left side
  const userRight = { wrist: kp.left_wrist, shoulder: kp.left_shoulder };
  const userLeft  = { wrist: kp.right_wrist, shoulder: kp.right_shoulder };
  
  switch(cue.detect) {
    case 'right_hand_up':
      // Wrist above shoulder by any amount (lower y = higher in frame)
      if (userRight.wrist && userRight.shoulder && userRight.wrist.y < userRight.shoulder.y - 10) hit = true;
      break;
    case 'left_hand_up':
      if (userLeft.wrist && userLeft.shoulder && userLeft.wrist.y < userLeft.shoulder.y - 10) hit = true;
      break;
    case 'both_hands_up':
      if (userRight.wrist && userLeft.wrist && userRight.shoulder && userLeft.shoulder
          && userRight.wrist.y < userRight.shoulder.y - 10
          && userLeft.wrist.y  < userLeft.shoulder.y  - 10) hit = true;
      break;
    case 'clap':
      // Hands close together horizontally + roughly chest height
      if (userRight.wrist && userLeft.wrist) {
        const dx = Math.abs(userRight.wrist.x - userLeft.wrist.x);
        if (dx < 100) hit = true;  // simpler: just close together
      }
      break;
    case 'hands_on_head':
      // Either wrist above the nose
      if (kp.nose) {
        if ((userRight.wrist && userRight.wrist.y < kp.nose.y) ||
            (userLeft.wrist  && userLeft.wrist.y  < kp.nose.y)) hit = true;
      }
      break;
  }
  
  if (hit) {
    Dance.lastHitAt = Date.now();
    Dance.hits++;
    
    // Update memory session
    Memory.session.hits++;
    Memory.session.currentStreak++;
    Memory.session.consecutiveMisses = 0;
    if (Memory.session.currentStreak > Memory.session.maxStreak) {
      Memory.session.maxStreak = Memory.session.currentStreak;
    }
    Memory.session.moveHits[cue.detect] = (Memory.session.moveHits[cue.detect] || 0) + 1;
    
    // Update score badge with bump animation
    const scoreBadge = document.getElementById('score-badge');
    scoreBadge.querySelector('.score-num').textContent = Memory.session.hits;
    scoreBadge.classList.remove('bump');
    void scoreBadge.offsetWidth;  // force reflow to restart animation
    scoreBadge.classList.add('bump');
    
    showHit();
    hideCue();
    
    // Ask the brain for a reaction — streak first, then plain hit
    if ([3, 5, 7, 10].includes(Memory.session.currentStreak)) {
      askBrain('streak', { streak: Memory.session.currentStreak });
    } else {
      askBrain('hit', { move: cue.label, streak: Memory.session.currentStreak });
    }
  }
}

function showCuePrep(cue) {
  Dance.currentCue = cue;
  Dance.cueState = 'prep';
  Dance.attempts++;
  Memory.session.attempts++;
  cueEmoji.textContent = cue.emoji;
  cueLabel.textContent = 'GET READY...';
  cueCard.classList.remove('firing');
  cueCard.classList.add('show');
  // Reset ring then animate fill over PREP_MS
  cueProgress.style.transition = 'none';
  cueProgress.style.strokeDashoffset = '440';
  // force reflow
  cueProgress.getBoundingClientRect();
  cueProgress.style.transition = `stroke-dashoffset ${PREP_MS}ms linear`;
  cueProgress.style.strokeDashoffset = '0';
}

function fireCue() {
  if (!Dance.currentCue) return;
  Dance.cueState = 'fire';
  Dance.cueDeadline = Date.now() + FIRE_MS;
  cueLabel.textContent = Dance.currentCue.label;
  cueCard.classList.add('firing');
}

function hideCue() {
  cueCard.classList.remove('show', 'firing');
  Dance.currentCue = null;
  Dance.cueState = 'idle';
}

function showHit() {
  const messages = ['NICE!', 'YES!', 'WOW!', 'AMAZING!', 'PERFECT!', '🌟', 'LOOK AT YOU!'];
  hitPop.textContent = messages[Math.floor(Math.random() * messages.length)];
  hitPop.classList.add('show');
  setTimeout(() => hitPop.classList.remove('show'), 800);
}

// ─── Countdown ───
async function runCountdown() {
  countdownEl.classList.add('show');
  for (const n of ['3', '2', '1', 'GO!']) {
    countNum.textContent = n;
    countNum.style.animation = 'none';
    countNum.offsetHeight;  // reflow to restart animation
    countNum.style.animation = '';
    await new Promise(r => setTimeout(r, 800));
  }
  countdownEl.classList.remove('show');
}

// ─── Start the dance ───
async function startDance() {
  if (Dance.running) return;
  
  btnDance.classList.remove('ready');
  btnDance.style.display = 'none';
  
  // Reset session memory for this dance
  Memory.reset();
  document.getElementById('score-badge').querySelector('.score-num').textContent = '0';
  
  // 1. Lazy-load MoveNet
  await loadMoveNet();
  
  // 2. Switch to lesson layout
  setPhase('lesson');
  
  // 3. MP4 src is already set, rewind to start
  danceVideo.currentTime = 0;
  
  // 4. Visual 3-2-1 countdown — no Nova talking, just numbers
  await runCountdown();
  
  // 6. GO! Start music + MP4 together at exactly the same moment
  Dance.running = true;
  Dance.startedAt = Date.now();
  Dance.hits = 0;
  Dance.attempts = 0;
  firedCues.clear();
  
  // ⚠ MUSIC ONLY STARTS HERE
  if (!danceMusic.src) danceMusic.src = 'hello.mp3';
  danceMusic.currentTime = 0;
  danceMusic.volume = 0.65;
  
  // Safety net: when music actually ends, end dance
  danceMusic.onended = () => {
    if (Dance.running) endDance();
  };
  
  // Start both together
  Promise.all([
    danceVideo.play().then(() => {
      console.log('[mp4] playing');
    }).catch(e => {
      console.error('[mp4] play failed:', e);
      setStatus('❌ MP4 failed: ' + e.message);
    }),
    danceMusic.play().then(() => {
      console.log('[music] playing');
    }).catch(e => {
      console.error('[music] play failed:', e);
      setStatus('❌ music failed: ' + e.message);
    }),
  ]);
  
  poseLoop();
  
  // Cue scheduler — checks every 200ms whether to start PREP for next cue
  const scheduler = setInterval(() => {
    if (!Dance.running) { clearInterval(scheduler); return; }
    const elapsed = (Date.now() - Dance.startedAt) / 1000;
    
    TIMELINE.forEach((cue, idx) => {
      if (firedCues.has(idx)) return;
      // PREP starts (PREP_MS / 1000) sec BEFORE cue.at
      const prepStart = cue.at - (PREP_MS / 1000);
      if (elapsed >= prepStart && Dance.cueState === 'idle') {
        firedCues.add(idx);
        showCuePrep(cue);
        // Schedule the FIRE moment
        setTimeout(() => fireCue(), PREP_MS);
        // And the auto-hide if not hit
        setTimeout(() => {
          if (Dance.cueState === 'fire') hideCue();
        }, PREP_MS + FIRE_MS);
      }
    });
    
    // Mid-song energy boost (only fires once around 55s)
    if (elapsed > 55 && elapsed < 56 && !Dance.midSongDone) {
      Dance.midSongDone = true;
      askBrain('mid_song');
    }
    
    // End of song — last cue fires at 92s, give 5s for outro celebration
    if (elapsed > 97) {
      clearInterval(scheduler);
      endDance();
    }
  }, 200);
  
  setStatus('dance started');
}

async function endDance() {
  Dance.running = false;
  Dance.midSongDone = false;
  danceMusic.pause();
  if (danceVideo.src) danceVideo.pause();
  hideCue();
  poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
  
  // Switch back to closeup for the celebration moment
  setPhase('closeup');
  
  // Compute score + best move
  const hits = Memory.session.hits;
  const attempts = Memory.session.attempts;
  const score = attempts > 0 ? Math.round((hits / attempts) * 100) : 0;
  
  // Best move = move type with most hits
  let bestMove = null, bestCount = 0;
  Object.entries(Memory.session.moveHits).forEach(([move, count]) => {
    if (count > bestCount) { bestMove = move; bestCount = count; }
  });
  
  // Brain reaction — celebration vs quiet ending based on score
  const event = score >= 30 ? 'end_celebration' : 'end_quiet';
  askBrain(event, {
    hits,
    attempts,
    bestMove: bestMove?.replace(/_/g, ' '),
    maxStreak: Memory.session.maxStreak,
  });
  
  // Persist memory across sessions
  novaMem.totalSessions = (novaMem.totalSessions || 0) + 1;
  novaMem.maxStreak = Math.max(novaMem.maxStreak || 0, Memory.session.maxStreak);
  novaMem.lastVisit = new Date().toISOString();
  novaMem.isFirstTime = false;
  if (bestMove) novaMem.favoriteMove = bestMove.replace(/_/g, ' ');
  Memory.save(novaMem);
  
  setStatus(`done · ${hits}/${attempts} (${score}%)`);
  
  // Show dance button again for replay
  setTimeout(() => {
    btnDance.classList.add('ready');
    btnDance.style.display = 'block';
    btnDance.textContent = '💃 Again?';
  }, 6000);
}

// Wire the dance button
btnDance.addEventListener('click', startDance);

// Show dance button once Nova has spoken at least once (audio track arrived)
// Hook into the existing track-subscribed handler by checking periodically
setInterval(() => {
  if (window.novaRoom && !btnDance.classList.contains('ready') && btnDance.style.display !== 'block') {
    const hasNovaAudio = document.querySelector('audio[autoplay]');
    if (hasNovaAudio) {
      btnDance.classList.add('ready');
    }
  }
}, 1000);

</script>
