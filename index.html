<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova v52c — meet Nova</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     v52c — production design pass
     ═══════════════════════════════════════════════════════════════════════
     Skills applied:
       • frontend-design   → bold dreamy aesthetic, distinctive typography,
                             aurora atmosphere instead of generic AI gradient
       • lexi-ux-patterns  → CLOSEUP mode for intro (Nova hero + small webcam
                             bubble), state pill, pause/exit always reachable
       • ai-companion-presence → warm loading copy, no corporate language
       
     Aesthetic direction: a stage at twilight. Soft aurora drifts behind Nova,
     stars twinkle, Nova breathes. Typography mixes Fraunces (soft serif with
     personality) for hero text + Plus Jakarta Sans (clean rounded geometric)
     for UI. Pink/coral/lavender on deep indigo night.
     
     This is INTRO/CLOSEUP mode only. v53 will add dance mode (Nova shrinks to
     corner bubble, dance video takes the stage).
═══════════════════════════════════════════════════════════════════════ -->

<!-- distinctive font pair — NOT Inter/Roboto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ─── design tokens ─── */
  :root {
    /* night sky — depth via 3 layers */
    --night-deep:    #0a0420;
    --night-mid:     #1a0a3a;
    --night-soft:    #2d1456;
    /* aurora colors — dreamy not corporate */
    --aurora-rose:   #ff7eb6;
    --aurora-coral:  #ffa980;
    --aurora-lilac:  #c899ff;
    --aurora-mint:   #7fffd4;
    /* pink for Nova brand */
    --pink:          #ff5ea3;
    --pink-soft:     #ffb7d5;
    --pink-deep:     #d62b7c;
    /* text */
    --ink:           #fdf9ff;
    --ink-mute:      #c6b4e0;
    --ink-soft:      rgba(253, 249, 255, 0.5);
    /* shape */
    --radius-hero:   28px;  /* organic-rounded — between square and circle */
    --radius-pill:   100px;
    --radius-soft:   18px;
    /* motion */
    --ease-out:      cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--night-deep);
    /* layered background: deep night + aurora drift + stars */
    background-image:
      radial-gradient(ellipse 80% 60% at 30% 30%, rgba(200, 153, 255, 0.18), transparent 60%),
      radial-gradient(ellipse 60% 80% at 70% 70%, rgba(255, 126, 182, 0.18), transparent 55%),
      radial-gradient(ellipse 100% 60% at 50% 100%, rgba(127, 255, 212, 0.08), transparent 60%);
  }
  
  /* ─── twinkling starfield ─── */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.5), transparent 50%),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.8), transparent 50%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.6), transparent 50%),
      radial-gradient(1.5px 1.5px at 70% 40%, rgba(255,200,230,0.7), transparent 50%),
      radial-gradient(1px 1px at 10% 60%, rgba(200,170,255,0.6), transparent 50%),
      radial-gradient(1.5px 1.5px at 90% 85%, rgba(255,255,255,0.5), transparent 50%),
      radial-gradient(1px 1px at 50% 15%, rgba(255,255,255,0.7), transparent 50%);
    background-size: 100% 100%;
    animation: twinkle 8s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
  }
  
  /* ─── breathing aurora layers ─── */
  .aurora {
    position: fixed;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 50% 40% at 25% 25%, rgba(255, 169, 128, 0.25), transparent 70%),
      radial-gradient(ellipse 40% 50% at 75% 60%, rgba(200, 153, 255, 0.28), transparent 70%),
      radial-gradient(ellipse 60% 30% at 50% 90%, rgba(255, 126, 182, 0.18), transparent 70%);
    filter: blur(40px);
    animation: aurora-drift 24s ease-in-out infinite;
  }
  @keyframes aurora-drift {
    0%, 100% { transform: translate(0%, 0%) scale(1); }
    33%      { transform: translate(2%, -2%) scale(1.05); }
    66%      { transform: translate(-2%, 2%) scale(0.98); }
  }
  
  /* ═══════════════════════════════════════════════════════════════
     VERSION TAG
  ═══════════════════════════════════════════════════════════════ */
  #version-tag {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 4, 32, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 94, 163, 0.25);
    border-top: none;
    color: var(--pink-soft);
    padding: 6px 16px;
    border-radius: 0 0 var(--radius-pill) var(--radius-pill);
    font: 600 11px/1 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 999;
  }
  
  /* ═══════════════════════════════════════════════════════════════
     STAGE LAYOUT — single closeup mode
     Nova hero centered. Webcam bubble bottom-right. Controls top-right.
  ═══════════════════════════════════════════════════════════════ */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: grid;
    place-items: center;
    padding: 60px 24px 40px;
  }
  
  #stage-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    max-width: 100%;
  }
  
  /* ─── greeting block ─── */
  #greeting {
    text-align: center;
    opacity: 0;
    animation: rise-in 0.9s var(--ease-out) 0.2s forwards;
  }
  
  #nova-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(48px, 7vw, 86px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-variation-settings: "SOFT" 60, "WONK" 1;
    background: linear-gradient(
      135deg,
      var(--pink-soft) 0%,
      var(--pink) 35%,
      var(--aurora-lilac) 75%,
      var(--aurora-coral) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    /* subtle glow */
    filter: drop-shadow(0 0 30px rgba(255, 94, 163, 0.3));
  }
  
  #nova-tagline {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(15px, 1.5vw, 19px);
    color: var(--ink-mute);
    letter-spacing: 0.01em;
    max-width: 480px;
    margin: 0 auto;
  }
  
  /* ─── Nova hero frame ─── */
  #nova-frame {
    position: relative;
    width: clamp(280px, 38vw, 480px);
    aspect-ratio: 1;
    border-radius: var(--radius-hero);
    overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 30%, var(--night-soft) 0%, var(--night-deep) 80%);
    /* soft pink halo + crisp 1px ring */
    box-shadow:
      0 0 0 1px rgba(255, 183, 213, 0.4),
      0 0 60px 0 rgba(255, 94, 163, 0.25),
      0 0 140px 20px rgba(214, 43, 124, 0.18),
      0 30px 80px -20px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: scale(0.94);
    animation: rise-in 1.1s var(--ease-spring) 0.4s forwards,
               nova-breathe 6s ease-in-out 1.5s infinite;
  }
  @keyframes nova-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.008); }
  }
  
  /* placeholder shown while widget loads */
  #nova-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: var(--ink-mute);
    text-align: center;
    padding: 24px;
    transition: opacity 0.4s;
  }
  #nova-placeholder.fading { opacity: 0; }
  
  .placeholder-orb {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--pink-soft), var(--pink) 60%, var(--pink-deep));
    box-shadow: 0 0 30px rgba(255, 94, 163, 0.6);
    animation: placeholder-pulse 2s ease-in-out infinite;
  }
  @keyframes placeholder-pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.08); opacity: 1; }
  }
  
  .placeholder-text {
    font: 500 14px/1.5 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.01em;
  }
  .placeholder-sub {
    font: 400 12px/1.5 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
  }
  
  /* ─── state pill (lexi pattern) — bottom of Nova frame ─── */
  #state-pill {
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 4, 32, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 183, 213, 0.3);
    color: var(--ink);
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    font: 600 12px/1 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transition: all 0.4s var(--ease-out);
    pointer-events: none;
    z-index: 10;
  }
  #state-pill.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #state-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--aurora-mint);
    animation: dot-pulse 1.4s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.5; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }
  /* state-specific colors */
  #state-pill[data-state="listening"] .dot { background: var(--aurora-mint); }
  #state-pill[data-state="thinking"]  .dot { background: var(--aurora-lilac); animation-duration: 0.9s; }
  #state-pill[data-state="talking"]   .dot { background: var(--pink); animation-duration: 0.6s; }
  
  /* ─── webcam bubble (lexi corner) ─── */
  #webcam-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: clamp(120px, 14vw, 180px);
    aspect-ratio: 3/4;
    border-radius: 22px;
    overflow: hidden;
    background: var(--night-deep);
    border: 1px solid rgba(255, 183, 213, 0.25);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 12px 40px -8px rgba(0, 0, 0, 0.5);
    z-index: 50;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s var(--ease-out);
  }
  #webcam-bubble.show {
    opacity: 1;
    transform: translateY(0);
  }
  #webcam-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #webcam-label {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(10, 4, 32, 0.7);
    backdrop-filter: blur(10px);
    color: var(--ink);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font: 600 10px/1 'Plus Jakarta Sans', sans-serif;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  
  /* ─── floating control buttons (top-right) — pause + exit ─── */
  #controls {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
    z-index: 60;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #controls.show { opacity: 1; }
  
  .ctrl-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 183, 213, 0.25);
    background: rgba(10, 4, 32, 0.7);
    backdrop-filter: blur(12px);
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s var(--ease-out);
    font-size: 16px;
  }
  .ctrl-btn:hover {
    background: rgba(255, 94, 163, 0.2);
    border-color: var(--pink);
    transform: scale(1.05);
  }
  .ctrl-btn:active { transform: scale(0.95); }
  
  /* ═══════════════════════════════════════════════════════════════
     START OVERLAY — first impression, magical entry
  ═══════════════════════════════════════════════════════════════ */
  #start-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 24px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255, 94, 163, 0.12), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(200, 153, 255, 0.15), transparent 70%),
      var(--night-deep);
    transition: opacity 0.8s var(--ease-out);
  }
  #start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  /* magical orb that explodes into starlight on tap */
  #start-orb {
    position: relative;
    width: 220px;
    height: 220px;
    cursor: pointer;
    transition: transform 0.3s var(--ease-spring);
  }
  #start-orb:hover { transform: scale(1.04); }
  #start-orb:active { transform: scale(0.96); }
  
  #start-orb::before,
  #start-orb::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transition: all 0.6s var(--ease-out);
  }
  #start-orb::before {
    /* main orb */
    background:
      radial-gradient(circle at 30% 25%,
        var(--pink-soft) 0%,
        var(--pink) 30%,
        var(--aurora-lilac) 60%,
        var(--pink-deep) 100%);
    box-shadow:
      inset 0 0 60px rgba(255, 255, 255, 0.3),
      0 0 80px rgba(255, 94, 163, 0.5),
      0 0 200px rgba(214, 43, 124, 0.4);
    animation: orb-pulse 3s ease-in-out infinite;
  }
  #start-orb::after {
    /* outer glow ring */
    inset: -20px;
    background: radial-gradient(circle, transparent 50%, rgba(255, 94, 163, 0.1) 60%, transparent 70%);
    animation: orb-pulse 3s ease-in-out infinite reverse;
  }
  @keyframes orb-pulse {
    0%, 100% {
      box-shadow:
        inset 0 0 60px rgba(255, 255, 255, 0.3),
        0 0 80px rgba(255, 94, 163, 0.5),
        0 0 200px rgba(214, 43, 124, 0.4);
    }
    50% {
      box-shadow:
        inset 0 0 80px rgba(255, 255, 255, 0.45),
        0 0 120px rgba(255, 94, 163, 0.7),
        0 0 280px rgba(214, 43, 124, 0.55);
    }
  }
  
  #start-content {
    text-align: center;
    max-width: 440px;
  }
  
  #start-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(32px, 4.5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-variation-settings: "SOFT" 80, "WONK" 1;
    color: var(--ink);
    margin-bottom: 14px;
  }
  #start-title em {
    font-style: italic;
    background: linear-gradient(135deg, var(--pink-soft), var(--aurora-coral) 60%, var(--aurora-lilac));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
  }
  
  #start-hint {
    font: 400 15px/1.55 'Plus Jakarta Sans', sans-serif;
    color: var(--ink-mute);
    letter-spacing: 0.01em;
  }
  
  #start-permissions {
    margin-top: 8px;
    font: 500 12px/1.4 'Plus Jakarta Sans', sans-serif;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  #start-permissions span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  
  /* ═══════════════════════════════════════════════════════════════
     ENTRANCE ANIMATIONS
  ═══════════════════════════════════════════════════════════════ */
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  
  /* ═══════════════════════════════════════════════════════════════
     RESPONSIVE
  ═══════════════════════════════════════════════════════════════ */
  @media (max-width: 640px) {
    #stage { padding: 70px 16px 32px; }
    #stage-inner { gap: 22px; }
    #webcam-bubble { width: 96px; bottom: 16px; right: 16px; }
    #controls { top: 16px; right: 16px; }
    .ctrl-btn { width: 38px; height: 38px; }
    #start-orb { width: 170px; height: 170px; }
  }
  
  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- decorative atmosphere -->
<div class="aurora"></div>
<div class="stars"></div>

<!-- version chip -->
<div id="version-tag">v52c · indigo · runway</div>

<!-- ═══════════════════════════════════════════════════════════════
     MAIN STAGE
═══════════════════════════════════════════════════════════════ -->
<div id="stage">
  <div id="stage-inner">
    
    <!-- greeting -->
    <div id="greeting">
      <h1 id="nova-name">Nova</h1>
      <p id="nova-tagline">Your dance friend, ready when you are.</p>
    </div>
    
    <!-- Nova frame — Runway widget will render its bubble somewhere on screen,
         this frame holds the placeholder + state pill.
         Note: the Runway widget renders as its own floating element managed by
         their script; this frame is our "stage" presence even before/around it. -->
    <div id="nova-frame">
      <div id="nova-placeholder">
        <div class="placeholder-orb"></div>
        <div class="placeholder-text">Nova is getting ready…</div>
        <div class="placeholder-sub">she'll appear in a moment</div>
      </div>
      
      <!-- state pill — lexi pattern -->
      <div id="state-pill" data-state="listening">
        <span class="dot"></span>
        <span class="label">Listening</span>
      </div>
    </div>
    
  </div>
</div>

<!-- ─── floating webcam bubble (lexi corner pattern) ─── -->
<div id="webcam-bubble">
  <video id="webcam-video" autoplay playsinline muted></video>
  <div id="webcam-label">You</div>
</div>

<!-- ─── controls (lexi pattern: always reachable) ─── -->
<div id="controls">
  <button class="ctrl-btn" id="btn-pause" title="Pause">⏸</button>
  <button class="ctrl-btn" id="btn-exit" title="Exit">✕</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     START OVERLAY
═══════════════════════════════════════════════════════════════ -->
<div id="start-overlay">
  <div id="start-orb"></div>
  <div id="start-content">
    <h2 id="start-title">Tap to <em>meet Nova</em></h2>
    <p id="start-hint">She'll dance with you, hear you, and remember your name.</p>
    <div id="start-permissions">
      <span>🎤 microphone</span>
      <span>📷 camera</span>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     RUNWAY CHARACTERS WIDGET
     ───────────────────────────────────────────────────────────────
     CDN URL: https://cdn.dev.runwayml.com/prod/widget.js
     Public key safe to expose (designed for browser use, domain-locked).
     Configuration (personality, voice, expanded mode, character icon)
     lives in the dev portal: https://dev.runwayml.com → Characters
═══════════════════════════════════════════════════════════════ -->
<script
  src="https://cdn.dev.runwayml.com/prod/widget.js"
  data-pub-key="pub_e3144a6a07a1e5862dd8eb5ddcd9877113c2149a97ae53c40525f956425f4a191"
></script>

<script>
// ═══════════════════════════════════════════════════════════════
// v52c — minimal client wiring
// ───────────────────────────────────────────────────────────────
// Runway's widget owns: mic capture, brain, voice, lipsync.
// Our job: warm intro stage, permissions, state pill, controls.
// ═══════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const startOverlay = $('start-overlay');
const startOrb     = $('start-orb');
const webcamBubble = $('webcam-bubble');
const webcamVideo  = $('webcam-video');
const controls     = $('controls');
const novaPlaceholder = $('nova-placeholder');
const statePill    = $('state-pill');

const setState = (state, label) => {
  statePill.dataset.state = state;
  statePill.querySelector('.label').textContent = label;
  statePill.classList.add('show');
};
const hideState = () => statePill.classList.remove('show');

// ─── orb tap → permissions → reveal stage ───
startOrb.addEventListener('click', async () => {
  startOrb.style.pointerEvents = 'none';
  console.log('[v52c] orb tapped → requesting cam + mic');
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: true,
    });
    webcamVideo.srcObject = stream;
    console.log('[v52c] cam + mic granted ✓');
  } catch(e) {
    console.error('[v52c] permission denied:', e);
    // soft failure — let the show go on, kid can retry by refreshing
    alert('We need the camera and microphone to dance with Nova. Please allow them and refresh.');
    startOrb.style.pointerEvents = 'auto';
    return;
  }
  
  // dismiss the start overlay with smooth fade
  startOverlay.classList.add('hidden');
  setTimeout(() => startOverlay.style.display = 'none', 800);
  
  // bring webcam bubble + controls into view
  setTimeout(() => {
    webcamBubble.classList.add('show');
    controls.classList.add('show');
  }, 600);
  
  // initial state pill
  setTimeout(() => setState('thinking', 'Nova is loading…'), 800);
  // optimistic: switch to listening once the widget probably mounted
  setTimeout(() => setState('listening', 'Nova is here'), 4500);
});
