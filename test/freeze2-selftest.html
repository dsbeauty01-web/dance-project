<!doctype html>
<html><head><meta charset="utf-8"><title>freeze2 self-test</title>
<style>body{margin:0;background:#0b0718;color:#9f9;font:12px monospace;display:flex}
iframe{width:70vw;height:100vh;border:0}#log{width:30vw;height:100vh;overflow:auto;padding:8px;white-space:pre-wrap}</style>
</head><body>
<iframe id="game"></iframe><div id="log">self-test starting…</div>
<script>
/* test/freeze2-selftest.html — drives beta/freeze2.html for real, locally, BEFORE any pod time.
   Chrome plays a dance clip as the camera (--use-file-for-fake-video-capture), this page loads the
   game same-origin, clicks its start button, and records everything the game logs — including the
   [STOP] lines that carry the audio-clock accuracy the founder's step 6 asks for.
   Without a pod there is no LiveKit token, so her video never attaches: that path is proven on the
   pod, this proves the GAME (music clock, stops, judging, verdicts, lines, score, ending).
   Usage: /test/freeze2-selftest.html?lang=en&secs=260 */
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') || 'en', SECS = parseFloat(Q.get('secs') || '260');
const lines = [], t0 = Date.now();
const el = document.getElementById('log');
const put = (tag, s) => { const L = `${((Date.now()-t0)/1000).toFixed(1)}s ${tag} ${s}`; lines.push(L);
  el.textContent = lines.slice(-120).join('\n'); el.scrollTop = el.scrollHeight; };
const f = document.getElementById('game');
f.src = `/beta/freeze2.html?lang=${LANG}&g=m&debug=1`;
f.onload = () => {
  const w = f.contentWindow, d = f.contentDocument;
  for (const m of ['log','warn','error']){ const o = w.console[m].bind(w.console);
    w.console[m] = (...a) => { put(m === 'log' ? '·' : m.toUpperCase(), a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ')); o(...a); }; }
  w.addEventListener('error', e => put('PAGE-ERR', e.message));
  w.addEventListener('unhandledrejection', e => put('REJECT', e.reason?.message || e.reason));
  const start = d.getElementById('start');
  if (!start) return put('FATAL', 'no #start button');
  /* Keep pressing ▶ until the gate actually closes. A single timed click raced the page's own
     start-up three times and each dead run looked like a hung game rather than a missed click. */
  let tries = 0;
  const clicker = setInterval(() => {
    const gate = d.getElementById('gate');
    if (!gate || gate.classList.contains('hidden')) { clearInterval(clicker); put('ACT', `gate open after ${tries} click(s)`); return; }
    if (start.disabled) return;                       // not wired yet — the page says so now
    tries++; if (tries === 1 || tries % 5 === 0) put('ACT', `click ▶ (#${tries})`);
    start.click();
    if (tries > 60) { clearInterval(clicker); put('FATAL', 'gate never opened'); }
  }, 700);
  // the game waits for a consent event or the ✓ button before round 1 — no child here, so press ✓
  const iv = setInterval(() => { const ok = d.getElementById('okBtn'); if (ok){ clearInterval(iv); put('ACT', 'click ✓ (stands in for the child\'s yes)'); ok.click(); } }, 500);
  setInterval(() => { const b = d.getElementById('banner');
    if (b && !b.classList.contains('hidden') && b.textContent) put('BANNER', b.textContent); }, 1000);
  // body[data-boot] — DOM, not console, so it is actually readable from here
  let lastBoot = '';
  setInterval(() => { const s = d.body?.dataset?.boot || ''; if (s && s !== lastBoot){ lastBoot = s; put('BOOT', s); } }, 300);
  /* HER VIDEO — the check that must pass BEFORE any link is handed to a child: a live track,
     real dimensions, not a black panel. This is the exact failure that wasted three plays on
     2026-09-26, and it was invisible because the page looked fine until the game gave up. */
  let vlogged = 0;
  setInterval(() => { const v = d.getElementById('novaMain'); if (!v) return;
    const tr = v.srcObject?.getVideoTracks?.()[0];
    const state = tr ? `${v.videoWidth}x${v.videoHeight} track=${tr.readyState} muted=${tr.muted}` : 'NO TRACK';
    if (vlogged++ < 3 || vlogged % 20 === 0) put('HER-VIDEO', state); }, 3000);
  setTimeout(async () => {
    const sc = d.getElementById('scorecard');
    put('END', `scorecard ${sc && sc.style.display === 'flex' ? 'SHOWN pts=' + d.getElementById('finalScore').textContent : 'NOT shown'}`);
    const body = JSON.stringify({ game:'freeze2-selftest', tag:'selftest-' + LANG, lines });
    // local run → the probe server writes a file; on the POD → /pulse appends to /workspace/pulse.log
    for (const url of ['/probe-result', '/pulse'])
      await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body }).catch(()=>{});
    document.title = 'SELFTEST-DONE';
  }, SECS * 1000);
};
</script></body></html>
