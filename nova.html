<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nova — Dance with me</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; }
  :root{ --gold:#FFD27A; --amber:#FFA63D; --core:#FFFDF5; }
  html,body{ height:100%; font-family:'Fredoka',system-ui,Segoe UI,sans-serif; color:#fff; overflow:hidden; }
  body{ background:
      radial-gradient(140% 90% at 50% -10%, #ffe9c9 0%, #ffd0e6 32%, #b89bff 60%, #2a1052 100%);
  }
  /* magic sparkle canvas behind everything */
  #sky{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #wrap{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:clamp(14px,3vh,30px); padding:24px 18px; text-align:center; }

  /* Nova presence — portrait in a glowing gold ring */
  .nova{ position:relative; width:clamp(120px,30vw,168px); aspect-ratio:1; border-radius:50%;
    background:#2a1052 center/cover no-repeat url('nova-face.png'); background-position:center 22%;
    box-shadow:0 0 0 5px rgba(255,210,122,.9), 0 0 44px 6px rgba(255,166,61,.7), 0 14px 50px rgba(0,0,0,.4);
    animation:breathe 3.4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ box-shadow:0 0 0 5px rgba(255,210,122,.9),0 0 40px 4px rgba(255,166,61,.6),0 14px 50px rgba(0,0,0,.4);} 50%{ box-shadow:0 0 0 6px rgba(255,221,150,1),0 0 60px 12px rgba(255,180,90,.85),0 14px 50px rgba(0,0,0,.4);} }
  h1{ font-size:clamp(30px,8vw,52px); font-weight:800; letter-spacing:1px;
    text-shadow:0 2px 0 rgba(0,0,0,.12), 0 0 26px rgba(255,210,122,.6); }
  .tag{ margin-top:-6px; font-size:clamp(14px,3.6vw,18px); color:#3a0a4a; font-weight:600; opacity:.85; }

  /* game cards */
  .games{ display:flex; gap:clamp(10px,2.4vw,18px); flex-wrap:wrap; justify-content:center; max-width:760px; }
  .card{ position:relative; width:clamp(150px,42vw,210px); border:none; cursor:pointer; color:#3a0a00;
    border-radius:24px; padding:18px 16px 16px; text-decoration:none; display:flex; flex-direction:column;
    align-items:center; gap:6px; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.4); }
  .card:hover,.card:active{ transform:translateY(-4px) scale(1.03); }
  .card .emoji{ font-size:clamp(38px,9vw,54px); filter:drop-shadow(0 3px 6px rgba(0,0,0,.25)); }
  .card .name{ font-weight:800; font-size:clamp(16px,4.4vw,21px); letter-spacing:.4px; }
  .card .desc{ font-size:clamp(11px,3vw,13px); font-weight:600; opacity:.78; line-height:1.2; }
  .c1{ background:linear-gradient(160deg,#ffe39a,#ff9ad1); }
  .c2{ background:linear-gradient(160deg,#bfe0ff,#a78bfa); color:#16124a; }
  .c3{ background:linear-gradient(160deg,#ffd27a,#ff8ae2); }
  .card:hover{ box-shadow:0 14px 40px rgba(0,0,0,.34), 0 0 28px rgba(255,210,122,.55), inset 0 0 0 2px rgba(255,255,255,.55); }

  .foot{ font-size:12px; color:#3a0a4a; opacity:.6; margin-top:4px; }
  .badge{ position:fixed; top:10px; right:12px; z-index:3; font-size:11px; background:rgba(42,16,82,.5);
    padding:4px 10px; border-radius:12px; color:#ffe9c9; backdrop-filter:blur(6px); }
</style>
</head>
<body>
<div class="badge">✨ Nova · magic v1</div>
<canvas id="sky"></canvas>
<div id="wrap">
  <div class="nova" aria-label="Nova"></div>
  <div>
    <h1>Hi, I'm Nova!</h1>
    <div class="tag">pick a dance — let's move together ✨</div>
  </div>
  <div class="games">
    <a class="card c1" href="nova-mobile.html">
      <div class="emoji">🕺</div><div class="name">Up Groove</div>
      <div class="desc">head · shoulders · hips</div>
    </a>
    <a class="card c2" href="nova-wave.html">
      <div class="emoji">👋</div><div class="name">Hand Wave</div>
      <div class="desc">wrist · elbow · shoulder</div>
    </a>
    <a class="card c3" href="nova-hello.html">
      <div class="emoji">🙌</div><div class="name">Hello Hello</div>
      <div class="desc">clap · reach up · wave</div>
    </a>
  </div>
  <div class="foot">made with love for little dancers</div>
</div>

<script>
// Signature element: warm gold magic dust drifting up — the same light language as the cues.
const sky=document.getElementById('sky'), ctx=sky.getContext('2d');
let W,H,parts=[];
function resize(){ W=sky.width=innerWidth; H=sky.height=innerHeight; }
addEventListener('resize',resize); resize();
function spawn(){ return { x:Math.random()*W, y:H+10, r:0.6+Math.random()*2.4,
  vy:-(0.2+Math.random()*0.7), vx:(Math.random()-0.5)*0.3, a:0, life:0, ttl:300+Math.random()*400,
  hue:Math.random()<0.5?'255,210,122':'255,253,245' }; }
for(let i=0;i<70;i++){ const p=spawn(); p.y=Math.random()*H; parts.push(p); }
function tick(t){
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    p.life++; p.x+=p.vx; p.y+=p.vy; p.vy-=0.0008;
    const tw=0.5+0.5*Math.sin(t/300+p.x);
    const al=Math.min(1,p.life/40)*(1-p.life/p.ttl)*tw;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
    g.addColorStop(0,'rgba('+p.hue+','+(0.9*al)+')'); g.addColorStop(1,'rgba(255,166,61,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,7); ctx.fill();
    if(p.life>p.ttl||p.y<-20){ Object.assign(p,spawn()); }
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
