<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Freeze! · Nova</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;color:#fff;
  background:radial-gradient(ellipse at 50% 30%,#0e2340 0%,#081228 60%,#000 100%)}

#banner{position:fixed;top:0;left:0;right:0;z-index:200;text-align:center;
  font-family:'SF Mono',Consolas,monospace;font-size:11px;letter-spacing:.12em;
  padding:4px;background:linear-gradient(90deg,#7dd8ff,#3aa0ff,#7dd8ff);color:#04203c;font-weight:700}

/* ── stage ── */
#stage{position:fixed;inset:26px 0 0 0;display:grid;grid-template-columns:1fr 1.2fr;gap:10px;padding:10px}
@media(max-width:820px){#stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.panel{position:relative;border-radius:16px;overflow:hidden;background:#000;border:3px solid rgba(125,216,255,.25)}
#nova-panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .15s linear}
#nova-panel video.on{opacity:1}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter .3s}
#cam-panel.icy #cam{filter:saturate(.45) brightness(1.05) hue-rotate(-12deg)}
#nova-tag{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.5);padding:4px 12px;
  border-radius:20px;font-size:12px;z-index:5}

/* hold ring around kid panel */
#ring{position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s}
#ring.show{opacity:1}
#ring::before{content:'';position:absolute;inset:0;border-radius:16px;padding:5px;
  background:conic-gradient(#7df0ff calc(var(--p)*1%), rgba(125,216,255,.15) 0);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}

/* frost + snow */
#frost{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .35s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(125,216,255,.28) 100%)}
#frost.on{opacity:1}
.flake{position:fixed;top:-30px;z-index:41;pointer-events:none;font-size:22px;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(240deg)}}
.shard{position:fixed;z-index:42;pointer-events:none;font-size:20px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}

/* animal badge */
#badge{position:fixed;top:12%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:60;
  text-align:center;transition:transform .3s cubic-bezier(.34,1.7,.6,1)}
#badge.show{transform:translate(-50%,-50%) scale(1)}
#badge .emo{font-size:clamp(64px,12vw,120px);filter:drop-shadow(0 0 24px rgba(125,240,255,.8))}
#badge .nm{font-family:'Fredoka';font-weight:700;font-size:clamp(22px,4vw,38px);
  background:linear-gradient(135deg,#bfefff,#7dd8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* big cue text */
#cue{position:fixed;bottom:16%;left:50%;transform:translateX(-50%);z-index:60;
  font-family:'Fredoka';font-weight:700;font-size:clamp(26px,5vw,52px);text-align:center;
  text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;white-space:nowrap}
#cue.show{opacity:1}
#cue.whisper{font-size:clamp(18px,3vw,30px);letter-spacing:.2em;color:#bfefff}

/* score + stamps */
#hud{position:fixed;top:34px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center}
#score{font-family:'Fredoka';font-weight:700;font-size:26px;color:#ffe27d;text-shadow:0 2px 10px #000}
#stamps{display:flex;gap:6px}
.stamp{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);
  border:2px solid rgba(125,216,255,.3);display:flex;align-items:center;justify-content:center;
  font-size:20px;filter:grayscale(1);opacity:.45;transition:all .4s}
.stamp.got{filter:none;opacity:1;background:rgba(125,240,255,.2);transform:scale(1.12);border-color:#7df0ff}
.fly{position:fixed;z-index:70;font-family:'Fredoka';font-weight:700;font-size:30px;color:#7df0ff;
  pointer-events:none;animation:flyup 1.1s ease-out forwards;text-shadow:0 2px 12px #000}
@keyframes flyup{to{transform:translateY(-90px);opacity:0}}

/* screens */
.screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:rgba(4,14,30,.92);text-align:center;padding:20px}
.screen h1{font-family:'Fredoka';font-weight:700;font-size:clamp(34px,7vw,64px);
  background:linear-gradient(135deg,#bfefff,#7dd8ff,#ffe27d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.screen p{font-size:17px;color:rgba(255,255,255,.75);max-width:480px}
.bigbtn{padding:16px 44px;border:none;border-radius:32px;font-family:'Fredoka';font-weight:700;
  font-size:22px;cursor:pointer;background:linear-gradient(135deg,#3aa0ff,#7df0ff);color:#04203c}
.bigbtn:active{transform:scale(.96)}
#count{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;
  font-family:'Fredoka';font-weight:700;font-size:clamp(90px,22vw,220px);color:#7df0ff;
  text-shadow:0 0 60px rgba(125,240,255,.7);background:rgba(4,14,30,.5)}
#pausebtn{position:fixed;top:34px;right:12px;z-index:90;width:42px;height:42px;border-radius:50%;
  border:none;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
#status{position:fixed;bottom:8px;left:10px;z-index:90;font-size:11px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="banner">❄ ANIMAL FREEZE v1 · ICE · clip-bank Nova · song=clock ❄</div>

<div id="stage">
  <div class="panel" id="nova-panel"><div id="nova-tag">🌟 Nova</div></div>
  <div class="panel" id="cam-panel">
    <video id="cam" autoplay playsinline muted></video>
    <div id="ring"></div>
  </div>
</div>

<div id="hud"><div id="score">0</div><div id="stamps"></div></div>
<button id="pausebtn" title="pause">⏸</button>
<div id="frost"></div>
<div id="badge"><div class="emo"></div><div class="nm"></div></div>
<div id="cue"></div>
<div id="status">loading…</div>

<div class="screen" id="start-screen">
  <h1>❄ Animal Freeze! ❄</h1>
  <p>Dance when the music plays… and when Nova freezes into an animal — <b>FREEZE with her!</b> Hold as still as a statue. Collect all 5 animal stamps!</p>
  <button class="bigbtn" id="start-btn">▶ Let's Play!</button>
</div>

<div class="screen" id="pause-screen" style="display:none">
  <h1>⏸ Taking a breath!</h1>
  <p>Nova is waiting for you…</p>
  <button class="bigbtn" id="resume-btn">▶ Keep dancing!</button>
</div>

<div class="screen" id="end-screen" style="display:none">
  <h1 id="end-title">🌟 Amazing!</h1>
  <div id="end-stamps" style="font-size:52px;letter-spacing:8px"></div>
  <p id="end-line"></p>
  <button class="bigbtn" onclick="location.reload()">🔁 Play again!</button>
</div>

<div id="count"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   ANIMAL FREEZE — the first gesture-bank game. No MP4 dance video.
   Nova = idle clips + freeze-pose clips. The SONG is the only clock.
   Laws honored: audio time only (no wall-clock cues) · countdown gates
   play AND resume · soft law (misses don't exist, wobble never punished,
   detection failure = full credit) · no kid-visible errors.
   ═══════════════════════════════════════════════════════════════════ */

const ASSETS = {
  song: 'freezegame/animal-freeze-song.mp3',
  clips: {
    idle1:    { file:'freezegame/idle_sway.mp4' },
    idle2:    { file:'freezegame/idle-walkalong.mp4' },
    star:     { file:'freezegame/freeze-star.mp4',      pauseAt:3.0, emo:'⭐', name:'STAR' },
    frog:     { file:'freezegame/freezefrog.mp4',       pauseAt:2.4, emo:'🐸', name:'FROG' },
    bear:     { file:'freezegame/freezebear.mp4',       pauseAt:2.2, emo:'🐻', name:'BEAR' },
    flamingo: { file:'freezegame/flamingo_freeze.mp4',  pauseAt:2.9, emo:'🦩', name:'FLAMINGO' },
  }
};

/* Timeline (song = 132.3s; freezes sit in the measured energy dips).
   whisper fires 1.5s before each freeze. holds escalate 3.5s → 6s. */
const FREEZES = [
  { at: 31.5, hold: 3.5, clip:'star',     pts: 200 },
  { at: 55.0, hold: 3.5, clip:'frog',     pts: 250 },
  { at: 77.0, hold: 4.0, clip:'bear',     pts: 300 },
  { at:100.0, hold: 4.0, clip:'flamingo', pts: 400 },
  { at:121.0, hold: 6.0, clip:'star',     pts: 800, final:true },
];
const DANCE_CUES = [
  { at: 2.0,  text:'Dance dance dance! 💃' },
  { at: 14.0, text:'Shake it out! ✨' },
  { at: 37.0, text:'Dance again! 🎵' },
  { at: 60.5, text:'Wiggle time! 🌀' },
  { at: 83.0, text:'Groove it! 🕺' },
  { at:106.0, text:'LAST DANCE — everything! 🔥' },
  { at:128.0, text:'YOU DID IT! 🎉' },
];
const SONG_END = 131.5;

/* ── elements ── */
const $ = id => document.getElementById(id);
const novaPanel=$('nova-panel'), camEl=$('cam'), ring=$('ring'), frost=$('frost'),
      badge=$('badge'), cue=$('cue'), scoreEl=$('score'), stampsEl=$('stamps'),
      statusEl=$('status'), countEl=$('count');

/* ═══ Nova clip player — two-pool bank, boundary swaps, invisible seams ═══ */
const Nova = {
  vids:{}, current:null, idleKeys:['idle1','idle2'], idleIdx:0, mode:'idle',
  init(){
    for(const [k,c] of Object.entries(ASSETS.clips)){
      const v=document.createElement('video');
      v.src=c.file; v.preload='auto'; v.muted=true; v.playsInline=true;
      v.addEventListener('ended',()=>this._onEnd(k));
      novaPanel.appendChild(v); this.vids[k]=v;
    }
  },
  _show(k){
    if(this.current) this.vids[this.current].classList.remove('on');
    this.current=k; this.vids[k].classList.add('on');
  },
  playIdle(){
    this.mode='idle';
    const k=this.idleKeys[this.idleIdx%this.idleKeys.length]; this.idleIdx++;
    const v=this.vids[k]; v.currentTime=0; this._show(k);
    v.play().catch(()=>{});
  },
  _onEnd(k){
    if(this.mode==='idle' && k===this.current) this.playIdle();     // rotate idles forever
    if(this.mode==='melt' && k===this.current) this.playIdle();     // pose returned → idle
  },
  freeze(clipKey){                       // snap into pose, PAUSE frozen at the hold frame
    this.mode='freeze';
    const v=this.vids[clipKey], c=ASSETS.clips[clipKey];
    v.currentTime=0; this._show(clipKey); v.play().catch(()=>{});
    const chk=()=>{ if(this.mode==='freeze' && v.currentTime>=c.pauseAt){ v.pause(); }
                    else if(this.mode==='freeze') requestAnimationFrame(chk); };
    requestAnimationFrame(chk);
  },
  melt(){                                // resume the clip: she un-freezes back to neutral
    if(this.mode!=='freeze') return;
    this.mode='melt';
    const v=this.vids[this.current]; v.play().catch(()=>{});
  },
};

/* ═══ Audio: the clock + the duck engine (WebAudio gain) ═══ */
const Music = {
  el:null, ctx:null, gain:null,
  init(){
    this.el=new Audio(ASSETS.song); this.el.preload='auto';
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=this.ctx.createMediaElementSource(this.el);
    this.gain=this.ctx.createGain(); src.connect(this.gain); this.gain.connect(this.ctx.destination);
  },
  t(){ return this.el ? this.el.currentTime : 0; },
  duck(v,ms){ const g=this.gain.gain, now=this.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value,now);
    g.linearRampToValueAtTime(v, now+ms/1000); },
};

/* ═══ Pose: stillness only — this game tracks ONE thing ═══ */
const Pose = {
  det:null, ok:false, lastKp:null, still:true, motion:0,
  async init(){
    try{
      await tf.setBackend('webgl');
      this.det=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
        { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
      this.ok=true; statusEl.textContent='✓ Nova sees you';
      this.loop();
    }catch(e){ statusEl.textContent='playing without tracking'; /* soft: game still works */ }
  },
  async loop(){
    try{
      const poses=await this.det.estimatePoses(camEl,{flipHorizontal:false});
      const kp=poses[0]?.keypoints?.filter(p=>p.score>0.3);
      if(kp && kp.length>=4){
        if(this.lastKp){
          const prev=Object.fromEntries(this.lastKp.map(p=>[p.name,p]));
          let d=0,n=0, sw=1;
          const ls=kp.find(p=>p.name==='left_shoulder'), rs=kp.find(p=>p.name==='right_shoulder');
          if(ls&&rs) sw=Math.max(30,Math.hypot(ls.x-rs.x,ls.y-rs.y));
          for(const p of kp){ const q=prev[p.name]; if(q){ d+=Math.hypot(p.x-q.x,p.y-q.y); n++; } }
          this.motion = n? (d/n)/sw : 0;                 // shoulder-normalized: age-fair
          this.still = this.motion < 0.045;
        }
        this.lastKp=kp;
      }
    }catch(e){}
    requestAnimationFrame(()=>this.loop());
  },
};

/* ═══ FX: frost, snow, shatter, badge, fly-ups ═══ */
const FX = {
  snowTimer:null,
  frostOn(){ frost.classList.add('on'); $('cam-panel').classList.add('icy');
    this.snowTimer=setInterval(()=>this.flake(),160); },
  frostOff(){ frost.classList.remove('on'); $('cam-panel').classList.remove('icy');
    clearInterval(this.snowTimer); },
  flake(){ const f=document.createElement('div'); f.className='flake'; f.textContent='❄';
    f.style.left=(Math.random()*100)+'vw'; f.style.animationDuration=(2+Math.random()*2)+'s';
    f.style.fontSize=(14+Math.random()*16)+'px';
    document.body.appendChild(f); setTimeout(()=>f.remove(),4200); },
  shatter(){ const cx=innerWidth/2, cy=innerHeight/2;
    for(let i=0;i<18;i++){ const s=document.createElement('div'); s.className='shard';
      s.textContent=['❄','✦','💠','✧'][i%4];
      s.style.left=cx+'px'; s.style.top=cy+'px';
      s.style.setProperty('--dx',(Math.cos(i/18*6.28)*(120+Math.random()*160))+'px');
      s.style.setProperty('--dy',(Math.sin(i/18*6.28)*(120+Math.random()*160))+'px');
      document.body.appendChild(s); setTimeout(()=>s.remove(),900); } },
  badge(emo,name){ badge.querySelector('.emo').textContent=emo;
    badge.querySelector('.nm').textContent=name; badge.classList.add('show'); },
  badgeOff(){ badge.classList.remove('show'); },
  cue(text,whisper=false,ms=2600){ cue.textContent=text;
    cue.classList.toggle('whisper',whisper); cue.classList.add('show');
    clearTimeout(this._ct); this._ct=setTimeout(()=>cue.classList.remove('show'),ms); },
  fly(text){ const f=document.createElement('div'); f.className='fly'; f.textContent=text;
    f.style.left=(45+Math.random()*10)+'vw'; f.style.top='42vh';
    document.body.appendChild(f); setTimeout(()=>f.remove(),1200); },
};

/* ═══ Game state ═══ */
const G = {
  score:0, stamps:[], running:false, paused:false,
  fired:{c:new Set(), f:new Set(), w:new Set()},
  freeze:null,   // active: {def, startedAt, heldMs, lastT}
  addScore(n){ this.score+=n; scoreEl.textContent=this.score; },
};
FREEZES.forEach((f,i)=>{ const s=document.createElement('div'); s.className='stamp';
  s.id='stamp'+i; s.textContent=ASSETS.clips[f.clip].emo; stampsEl.appendChild(s); });

/* ═══ The scheduler — SONG TIME ONLY, no wall clock ═══ */
function tick(){
  if(!G.running){ requestAnimationFrame(tick); return; }
  const t=Music.t();

  if(!G.freeze){
    DANCE_CUES.forEach((c,i)=>{ if(t>=c.at && !G.fired.c.has(i)){ G.fired.c.add(i); FX.cue(c.text); }});
    FREEZES.forEach((f,i)=>{
      if(t>=f.at-1.5 && !G.fired.w.has(i)){ G.fired.w.add(i);
        FX.cue(f.final?'shhh… the BIG one is coming…':'shhh… statue time…',true,1600); }
      if(t>=f.at && !G.fired.f.has(i)){ G.fired.f.add(i); startFreeze(f,i); }
    });
  } else {
    const f=G.freeze;
    const now=t;
    if(Pose.ok ? Pose.still : true){                  // no tracking → always credited (soft)
      f.heldMs += (now-f.lastT)*1000;
    }
    f.lastT=now;
    const p=Math.min(100, f.heldMs/(f.def.hold*1000)*100);
    ring.style.setProperty('--p',p);
    if(now >= f.def.at + f.def.hold) endFreeze();
  }

  if(t>=SONG_END) return endGame();
  requestAnimationFrame(tick);
}

function startFreeze(def,idx){
  const c=ASSETS.clips[def.clip];
  G.freeze={def, idx, heldMs:0, lastT:Music.t()};
  Music.duck(0.08,300);
  Nova.freeze(def.clip);
  FX.frostOn(); FX.badge(c.emo, def.final?('BIG '+c.name+'!'):(c.name+'!'));
  FX.cue('FREEZE! 🧊',false,def.hold*1000);
  ring.classList.add('show'); ring.style.setProperty('--p',0);
}

function endFreeze(){
  const f=G.freeze; G.freeze=null;
  const ratio=Math.min(1, f.heldMs/(f.def.hold*1000));
  const credit=Math.max(0.4, ratio);                  // soft floor: showing up counts
  const pts=Math.round(f.def.pts*credit);
  Music.duck(1.0,450);
  Nova.melt();
  FX.frostOff(); FX.badgeOff(); FX.shatter(); ring.classList.remove('show');
  G.addScore(pts); FX.fly('+'+pts);
  $('stamp'+f.idx).classList.add('got'); G.stamps.push(f.idx);
  const lines= ratio>0.85 ? ['PERFECT STATUE! 🌟','FROZEN SOLID! ❄️','ICE LEGEND! 💎']
             : ratio>0.5  ? ['So close to stone! ✨','Almost solid ice! 🧊']
                          : ['You wobbled and SAVED it! 😄','Silly statue! Love it! 💙'];
  FX.cue(lines[Math.floor(Math.random()*lines.length)]);
}

/* ═══ flow: start → countdown → play · pause → countdown → resume ═══ */
async function countdown(){
  countEl.style.display='flex';
  for(const n of ['3','2','1','GO!']){ countEl.textContent=n; await new Promise(r=>setTimeout(r,700)); }
  countEl.style.display='none';
}
$('start-btn').addEventListener('click', async ()=>{
  $('start-btn').disabled=true; statusEl.textContent='getting camera…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:960,height:720},audio:false});
    camEl.srcObject=stream;
  }catch(e){ statusEl.textContent='no camera — playing anyway'; }   // soft: never block the fun
  Music.init(); Nova.init(); Pose.init();
  statusEl.textContent='warming up…';
  await new Promise(r=>setTimeout(r,900));                          // let clips buffer a beat
  $('start-screen').style.display='none';
  Nova.playIdle();
  await countdown();                                                 // countdown GATES play — the law
  try{ await Music.ctx.resume(); }catch(e){}
  Music.el.play().catch(()=>{});
  G.running=true; requestAnimationFrame(tick);
});

$('pausebtn').addEventListener('click',()=>{
  if(!G.running||G.paused) return;
  G.paused=true; G.running=false; Music.el.pause();
  if(G.freeze){ Music.duck(1.0,200); Nova.melt(); FX.frostOff(); FX.badgeOff(); ring.classList.remove('show'); G.freeze=null; }
  $('pause-screen').style.display='flex';                            // Nova keeps idling — free pause state
});
$('resume-btn').addEventListener('click', async ()=>{
  $('pause-screen').style.display='none';
  await countdown();                                                 // resume gates through 3-2-1 — same law
  Music.el.play().catch(()=>{}); G.paused=false; G.running=true; requestAnimationFrame(tick);
});

function endGame(){
  G.running=false; Music.duck(0.0,1500);
  const n=G.stamps.length;
  $('end-stamps').textContent=FREEZES.map((f,i)=>G.stamps.includes(i)?ASSETS.clips[f.clip].emo:'▫️').join(' ');
  $('end-title').textContent = n>=5?'🏆 ALL ANIMALS FROZEN!':'🌟 Amazing freezing!';
  $('end-line').textContent  = n>=5?'You collected the whole zoo — '+G.score+' points of pure ice!'
                                   :'You froze '+n+' animals and scored '+G.score+'! The rest are waiting next time…';
  $('end-screen').style.display='flex';
}
</script>
</body>
</html>
