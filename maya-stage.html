<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYA · LIVE</title>
<!-- ═══════════════════════════════════════════════════════════════════════════
     MAYA STAGE — THIS PAGE IS THE STREAM. OBS captures it; nothing operator-ish here.
     Phase 1 of MAYA-PLAN. Design target 1920x1080 landscape.

     Reuses, deliberately, what was proven on animal-freeze.html:
       - 9:16 stage with aspect-ratio LOCKED to the source (1080/1920). A stage sized
         width:100%/height:100% takes the PANEL's shape, so the pod page's cover-crop
         has to cut something -- and it cuts her legs. Locking the ratio means the
         crop removes nothing: head to shoes.
       - Room-fill behind the stage instead of black gutters (the PANEL-FILL trick).
       - {type:'frame',mode:'full'} to the pod page, whose MODE defaults to 'closeup'
         (waist-up) "until the app says otherwise".
       - Persona sent on AWAKE-FLIP, never on iframe load: at load the pod page's
         websocket is still CONNECTING and its bridge drops the message silently.
     ═══════════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --accent:#e8b4b8;            /* one accent per client, configurable */
  --bg:#0d0f13; --panel:#151920; --line:#252b36;
  --ink:#f2f4f8; --dim:#9aa4b4;
  --live:#ff3b30;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Hebrew',sans-serif;overflow:hidden}

#room{position:fixed;inset:0;display:grid;grid-template-columns:minmax(280px,26%) 1fr minmax(220px,18%);
  gap:0;align-items:stretch}

/* ── MAYA: 9:16 stage, ratio locked to the bake so cover-crop crops nothing ── */
#maya-panel{position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--bg) url('maya/maya-bg.jpg') center/cover no-repeat;overflow:hidden}
#maya-panel::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  backdrop-filter:blur(30px) brightness(.55) saturate(1.05);
  -webkit-backdrop-filter:blur(30px) brightness(.55) saturate(1.05)}
#maya-stage{position:relative;z-index:1;height:100%;aspect-ratio:1080/1920;max-width:100%;
  overflow:hidden;background:#10131a;box-shadow:0 0 60px 24px rgba(6,8,12,.55)}
#maya-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;z-index:3;
  background:linear-gradient(180deg,#20242e,#141820)}
#maya-fallback{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--dim);font-size:15px;letter-spacing:.04em}
#maya-fallback .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ── PRODUCT PANEL (left third) ── */
#product{position:relative;z-index:2;background:linear-gradient(180deg,var(--panel),#0f1218);
  border-inline-end:1px solid var(--line);padding:34px 30px;display:flex;flex-direction:column;
  justify-content:center;gap:16px;transform:translateX(-8%);opacity:0;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
#product.show{transform:none;opacity:1}
#p-badge{align-self:flex-start;background:var(--accent);color:#1a1013;font-weight:800;font-size:14px;
  padding:6px 14px;border-radius:999px;letter-spacing:.02em}
#p-img{width:100%;aspect-ratio:1/1;border-radius:14px;object-fit:cover;background:#1c212b;border:1px solid var(--line)}
#p-name{font-size:clamp(20px,2vw,30px);font-weight:700;line-height:1.25;margin:0}
#p-prices{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#p-price{font-size:clamp(34px,4.2vw,60px);font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1}
#p-old{font-size:clamp(16px,1.6vw,22px);color:var(--dim);text-decoration:line-through}
#p-note{color:var(--dim);font-size:15px;line-height:1.5;margin:0}

/* ── CHAT RAIL (right edge) ── */
#chat{position:relative;z-index:2;background:rgba(10,12,16,.72);border-inline-start:1px solid var(--line);
  padding:18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.msg{font-size:14px;line-height:1.45;color:#dbe2ee;animation:slide .35s ease}
.msg b{color:var(--accent);font-weight:700}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── OVERLAYS ── */
#live{position:fixed;top:22px;inset-inline-start:22px;z-index:20;display:flex;align-items:center;gap:9px;
  background:rgba(10,12,16,.72);padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  font-weight:800;font-size:14px;letter-spacing:.08em}
#live .d{width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite}
#lower{position:fixed;bottom:0;inset-inline:0;z-index:20;padding:16px 30px;
  background:linear-gradient(0deg,rgba(8,10,14,.94),transparent);
  font-size:clamp(17px,1.8vw,26px);font-weight:700;text-align:center;
  transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#lower.show{transform:none}
#lower span{color:var(--accent)}
#brb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(8,10,14,.97);text-align:center;padding:24px}
#brb.show{display:flex}
#brb h1{font-size:clamp(30px,4vw,56px);margin:0}
#brb p{color:var(--dim);margin:0;font-size:18px}
#countdown{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
</style>
</head>
<body>

<div id="room">
  <!-- PRODUCT (left) -->
  <aside id="product">
    <div id="p-badge">🔥 מבצע לייב</div>
    <img id="p-img" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect width='400' height='400' fill='%231c212b'/></svg>">
    <h2 id="p-name">—</h2>
    <div id="p-prices"><div id="p-price">—</div><div id="p-old"></div></div>
    <p id="p-note"></p>
  </aside>

  <!-- MAYA (centre) -->
  <main id="maya-panel">
    <div id="maya-stage">
      <div id="maya-fallback"><div class="dot"></div><div>מתחברת…</div></div>
    </div>
  </main>

  <!-- CHAT (right) -->
  <aside id="chat"></aside>
</div>

<div id="live"><span class="d"></span>LIVE</div>
<div id="lower">כתבו <span>"אני רוצה"</span> בצ'אט</div>
<div id="brb"><h1>נחזור עוד רגע 💫</h1><p>we'll be right back</p></div>

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

/* ── POD RESOLUTION: same registry as the Nova app; ?saray= always wins ── */
const SARAY = Q.get('saray') || (window.NOVA_PODS && window.NOVA_PODS.saray && window.NOVA_PODS.saray()) || null;

/* ── MAYA PERSONA. [GAME-MODE] marker makes the brain REPLACE instructions rather
      than append them under its base prompt. Nova proved appending never wins. ── */
const MAYA_PERSONA =
 "[GAME-MODE] You are MAYA, hosting a LIVE shopping stream to real viewers right now. "+
 "Broadcast energy, 1-2 sentences per line. Answer viewers BY NAME. Mirror their language "+
 "(Hebrew or English). Product facts come ONLY from your PRODUCT NOTES - no note, no claim: "+
 "say you'll check, warmly. Never invent a price, discount, deadline or review. "+
 "End a line with at most ONE tag when it fits: [WAVE] [POINT] [REVEAL] [NUDGE] [BYE]. "+
 "Never read a tag aloud.";

/* ── DEMO PRODUCT (Phase 1 hardcodes this; Phase 2 drives it from the backend) ── */
const DEMO_PRODUCT = {
  name:'סרום ויטמין C מרוכז', price:'₪149', old:'₪249',
  note:'20% ויטמין C טהור · 30 מ״ל · משלוח חינם מעל ₪200',
  badge:'🔥 מבצע לייב',
  /* NOTES = the ONLY facts she may state. TRUTH LAW. */
  notes:'Product: Concentrated Vitamin C Serum. Price: 149 ILS (was 249 ILS). Size: 30ml. '+
        '20% pure vitamin C. Free shipping over 200 ILS. In stock. Delivery 3-5 business days.'
};

/* ═══ GESTURE ENGINE (03) — registry-driven, queue depth 1, manual preempts ═══ */
const Gestures = {
  reg:null, cur:'idle', timer:null, queued:null, lastAuto:0,
  async load(){
    try{ const r = await fetch('maya-gestures.json',{cache:'no-store'}); this.reg = await r.json(); }
    catch(e){ console.warn('[GEST] registry failed, gestures disabled', e); }
  },
  byTag(tag){
    if(!this.reg) return null;
    for(const [k,v] of Object.entries(this.reg)){
      if(k.startsWith('_')) continue;
      if((v.tags||[]).includes(String(tag).toUpperCase())) return k;
    }
    return null;
  },
  /* manual=true (director) always preempts and clears the queue */
  fire(name, manual){
    if(!this.reg || !this.reg[name] || name==='idle') return;
    const now = Date.now();
    const gap = (this.reg._runtime && this.reg._runtime.min_auto_gap_secs || 4) * 1000;
    if(!manual && now - this.lastAuto < gap){ console.log('[GEST] rate-limited', name); return; }
    if(!manual) this.lastAuto = now;
    if(this.timer && !manual){ this.queued = name; return; }   // depth 1, newest wins
    if(manual){ clearTimeout(this.timer); this.timer=null; this.queued=null; }
    this._play(name);
  },
  _play(name){
    const g = this.reg[name]; if(!g) return;
    Live.setAvatar(g.avatar); this.cur = name;
    console.log('[GEST] ->', name, g.avatar);
    this.timer = setTimeout(()=>{
      this.timer=null;
      const next = this.queued; this.queued=null;
      if(next) this._play(next); else this.toIdle();
    }, (g.secs||5)*1000);
  },
  toIdle(){
    const g = this.reg && this.reg.idle; if(!g) return;
    Live.setAvatar(g.avatar); this.cur='idle';
  }
};

/* ═══ LIVE MAYA — the pod iframe (owns voice) ═══ */
const Live = {
  frame:null, on:false, dead:false, alive:false,
  init(){
    if(!SARAY){ this.fail('no pod configured (?saray=)'); return; }
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const to = setTimeout(()=>{ try{ctl&&ctl.abort();}catch(_){}; this.fail('pod not reachable in 5s'); },5000);
    fetch(SARAY,{mode:'no-cors',cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(()=>{ if(this.dead) return; clearTimeout(to); this.mount(); })
      .catch(()=>{ clearTimeout(to); this.fail('pod probe failed'); });
  },
  mount(){
    if(this.on||this.dead) return; this.on=true;
    const f=document.createElement('iframe');
    f.id='maya-frame'; f.src=SARAY;
    f.allow='microphone; camera; autoplay; fullscreen';
    f.addEventListener('load',()=>{
      /* frame-mode has NO websocket dependency (pure CSS on the pod page), so it is
         safe at load. The persona is NOT — it waits for awake-flip. */
      this.frame && this.frame.contentWindow &&
        this.frame.contentWindow.postMessage({type:'frame',mode:'full'},'*');
    });
    $('maya-stage').appendChild(f); this.frame=f;
    $('maya-fallback').style.display='none';
  },
  fail(why){
    if(this.dead) return; this.dead=true; this.on=false;
    console.warn('[LIVE] off:', why);
    const fb=$('maya-fallback'); if(fb){ fb.style.display='flex'; fb.lastChild.textContent='אופליין'; }
  },
  post(msg){ try{ this.frame && this.frame.contentWindow && this.frame.contentWindow.postMessage(msg,'*'); }catch(_){} },
  setAvatar(id){ if(!this.on) return; this.post({type:'set-avatar', id}); },
  say(text){ this.post({type:'say', text}); },
  cue(intent,ctx){ this.post({type:'cue', intent, ctx:ctx||''}); },
  chat(name,text){ this.post({type:'chat', name, text}); },
  scene(name,notes){ this.post({type:'scene', scene:name, product_notes:notes||''}); },
  product(notes){ this.post({type:'product', notes}); },
  hold(on){ this.post({type:'hold', on:!!on}); },
  persona(text){ this.post({type:'persona', text}); }
};

/* ═══ SCENES ═══ */
const Scenes = {
  cur:null,
  set(name){
    if(!name) return;
    this.cur = name;
    const p=$('product'), l=$('lower');
    p.classList.toggle('show', name==='product'||name==='offer');
    l.classList.toggle('show', name==='offer'||name==='product');
    if(name==='offer'){ $('p-badge').textContent='⏳ מחיר לייב בלבד'; }
    else { $('p-badge').textContent=DEMO_PRODUCT.badge; }
    $('brb').classList.remove('show');
    Live.scene(name, DEMO_PRODUCT.notes);
    /* scene-default gestures (03: open->wave, close->bye) */
    const d = Gestures.reg && Gestures.reg._runtime && Gestures.reg._runtime.scene_defaults;
    if(d && d[name]) setTimeout(()=>Gestures.fire(d[name], false), 400);
    console.log('[SCENE]', name);
  }
};

/* ═══ CHAT RAIL ═══ */
const ChatRail = {
  add(name,text){
    const el=document.createElement('div'); el.className='msg';
    el.innerHTML='<b></b> <span></span>';
    el.querySelector('b').textContent=name+':';
    el.querySelector('span').textContent=text;
    const c=$('chat'); c.appendChild(el);
    while(c.children.length>12) c.removeChild(c.firstChild);
  }
};

/* ═══ inbound from the pod page ═══ */
window.addEventListener('message',(e)=>{
  const d=e.data; if(!d||typeof d!=='object') return;
  const type=(d.type||d.event||'').toString().toLowerCase();

  /* AWAKE-FLIP: first message from the iframe proves its websocket is OPEN.
     Sending the persona at iframe-load races a CONNECTING socket and is dropped
     silently by the bridge -- the exact bug that kept Nova stuck in her intro. */
  if(Live.on && !Live.alive){
    Live.alive=true;
    Live.persona(MAYA_PERSONA);
    Live.product(DEMO_PRODUCT.notes);
    Live.scene(Scenes.cur || (Q.get('scene')||'open'), DEMO_PRODUCT.notes);
    console.log('[LIVE] awake -> persona + product + scene sent');
  }

  if(type==='gesture' && d.tag){          /* brain emits at speech-START */
    const g=Gestures.byTag(d.tag); if(g) Gestures.fire(g,false);
  }
  const text=(d.text||d.message||d.transcript||'').toString().trim();
  if(!text) return;
  if(/kid|user|you|human|viewer/.test(type)) ChatRail.add('צופה', text);
});

/* ═══ boot ═══ */
(async function(){
  $('p-name').textContent=DEMO_PRODUCT.name;
  $('p-price').textContent=DEMO_PRODUCT.price;
  $('p-old').textContent=DEMO_PRODUCT.old;
  $('p-note').textContent=DEMO_PRODUCT.note;
  $('p-badge').textContent=DEMO_PRODUCT.badge;
  await Gestures.load();
  Live.init();
  Scenes.set(Q.get('scene')||'open');
  if(Q.get('lang')==='en'){ document.documentElement.lang='en'; document.documentElement.dir='ltr'; }
})();

/* Director drives the stage in Phase 1 via postMessage from the parent/opener.
   Phase 2 replaces this with the backend websocket. */
window.addEventListener('message',(e)=>{
  const d=e.data; if(!d||d.__maya!==true) return;
  if(d.act==='say')      Live.say(d.text);
  if(d.act==='cue')      Live.cue(d.intent,d.ctx);
  if(d.act==='chat')     { ChatRail.add(d.name,d.text); Live.chat(d.name,d.text); }
  if(d.act==='gesture')  Gestures.fire(d.name,true);          /* manual preempts */
  if(d.act==='scene')    Scenes.set(d.name);
  if(d.act==='hold')     { Live.hold(d.on); $('brb').classList.toggle('show',!!d.on); }
  if(d.act==='kill')     { Live.hold(true); Gestures.toIdle(); $('brb').classList.add('show'); }
});
</script>
</body>
</html>
