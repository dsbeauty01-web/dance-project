<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wave FX — meteor of light</title>
<!-- WAVE FX — PIXAR-QUALITY (wave-fx-pixar.md), self-contained, ?nonova. ONE arm-wave meteor:
     wrist→elbow→shoulder→across→shoulder→elbow→wrist. No Nova, no LiveKit, no backend.
     Canvas over video; per-frame FADE (never clearRect); additive 'lighter'; radial gradients only;
     body-relative k; color ramp heats red→gold→white; travel paced by the user's REAL motion. -->
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;background:#0a0612;font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;color:#fff;overflow:hidden}
  #stage{position:fixed;inset:0;background:#06070b;overflow:hidden}
  #cam,#fx{position:absolute;inset:0;width:100%;height:100%}
  #cam{object-fit:contain;transform:scaleX(-1)}            /* mirror display; contain = whole body */
  #fx{object-fit:contain;pointer-events:none}              /* canvas NOT css-mirrored; coords mirrored in JS */
  #start-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 25%,#2a1052,#0a0612 70%)}
  #start-screen.hidden{display:none}
  h1{font-size:clamp(30px,8vw,56px);font-weight:800;background:linear-gradient(90deg,#ffb27a,#ffd27a,#fff6e8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,166,61,.5))}
  p{opacity:.85;max-width:440px;line-height:1.5;font-size:clamp(14px,4vw,18px)}
  button{background:linear-gradient(135deg,#ffe39a,#ff9ad1);color:#3a0a00;border:none;cursor:pointer;font:800 clamp(18px,5vw,24px) inherit;padding:16px 46px;border-radius:40px;box-shadow:0 10px 36px rgba(255,166,61,.5)}
  #warn{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>
</div>
<div id="start-screen">
  <h1>Wave FX ✨</h1>
  <p>Raise a hand and wave — a meteor of light travels up your arm. Stand back so your arm shows.</p>
  <button id="start">▶ Start</button>
  <div id="warn"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cam=$('cam'), fx=$('fx'), ctx=fx.getContext('2d');
let detector=null, stream=null;

// ── COLOR RAMP (heats up the arm) ──
const C_START='242,115,12';   // wrist red-orange (igniting spark)
const C_MID  ='255,210,122';  // elbow gold
const C_HOT  ='255,253,245';  // shoulder/core near-white
const C_DEEP ='242,115,12';   // tail deep (→0 alpha)
const C_AMBER='255,122,61';   // messy tint
const C_MINT ='191,255,200';  // clean tint
const FADE=0.16;
function lerp(a,b,t){return a+(b-a)*t;}
function mix(t1,t2,f){const a=t1.split(',').map(Number),b=t2.split(',').map(Number);return a.map((v,i)=>Math.round(lerp(v,b[i],f))).join(',');}
// ramp by progress 0(wrist)→1(shoulder); past 1 stays hot
function rampColor(p){ p=Math.max(0,Math.min(1,p)); return p<0.5 ? mix(C_START,C_MID,p/0.5) : mix(C_MID,C_HOT,(p-0.5)/0.5); }

// ── camera + model ──
async function ensureCamera(){ if(stream) return true;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false}); cam.srcObject=stream; await cam.play(); sizeFx(); return true; }
  catch(e){ $('warn').textContent='allow the camera 📷'; return false; } }
async function ensureModel(){ if(detector) return; try{await tf.setBackend('webgl');}catch(e){try{await tf.setBackend('cpu');}catch(_){}} await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}); }
function sizeFx(){ if(cam.videoWidth){ fx.width=cam.videoWidth; fx.height=cam.videoHeight; } }
cam.addEventListener('loadedmetadata',sizeFx); addEventListener('resize',sizeFx);

// contain-map video px → canvas px, X mirrored (matches #cam scaleX(-1) + flipHorizontal:true)
function mapper(){ const cw=fx.width||640, ch=fx.height||480, vw=cam.videoWidth||640, vh=cam.videoHeight||480;
  const scale=Math.min(cw/vw,ch/vh), ox=(cw-vw*scale)/2, oy=(ch-vh*scale)/2;
  return { X:p=>cw-(p.x*scale+ox), Y:p=>p.y*scale+oy }; }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ── EMA smoothing + gates ──
const GATE={ wrist:0.40, elbow:0.45, shoulder:0.50 };
const sm={}; function ema(name,x,y){ const a=0.5; if(!sm[name]) sm[name]={x,y}; sm[name].x=lerp(sm[name].x,x,1-a); sm[name].y=lerp(sm[name].y,y,1-a); return sm[name]; }
const _last={};   // last-good screen positions (elbow-hold)
let M={}, prevRaw=null, motion=0;
function gate(name){ const t=name.indexOf('wrist')>=0?GATE.wrist:name.indexOf('elbow')>=0?GATE.elbow:GATE.shoulder; const k=M[name]; return (k&&k.score>=t)?k:null; }

// ── 3 ADDITIVE GLOW PASSES (radial gradient only — never a hard arc) ──
function orb(x,y,r,trip,alpha){ if(r<=0)return; const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+trip+','+alpha+')'); g.addColorStop(0.45,'rgba('+trip+','+(alpha*0.5)+')'); g.addColorStop(1,'rgba('+trip+',0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
function glow3(x,y,baseR,rampTrip){   // pass1 bloom amber, pass2 body ramp, pass3 core near-white
  orb(x,y,baseR*3.5,C_AMBER,0.14); orb(x,y,baseR*1.8,rampTrip,0.45); orb(x,y,baseR*0.6,C_HOT,0.95); }

// ── CHAIN (live, mirror-aware): wrist→elbow→shoulder→MID(chest)→shoulder→elbow→wrist ──
// Every point is the LIVE MoveNet position this frame; 'mid' is synthesized from the live shoulders.
const PATH=['right_wrist','right_elbow','right_shoulder','mid','left_shoulder','left_elbow','left_wrist'];
function pathPoints(X,Y){ const pts=[]; let seen=0;
  for(const n of PATH){ let p=null;
    if(n==='mid'){ const ls=gate('left_shoulder'), rs=gate('right_shoulder');
      if(ls&&rs){ const sw=dist({x:X(ls),y:Y(ls)},{x:X(rs),y:Y(rs)});
        const lh=gate('left_hip'), rh=gate('right_hip');
        const cy=(lh&&rh)? lerp((Y(ls)+Y(rs))/2,(Y(lh)+Y(rh))/2,0.40) : (Y(ls)+Y(rs))/2 + 0.45*sw;  // mid-CHEST, well below the chin (never on the face)
        p={x:(X(ls)+X(rs))/2, y:cy}; _last.mid=p; }
      else if(_last.mid) p=_last.mid; }
    else { const k=gate(n); if(k){ const s=ema(n,X(k),Y(k)); p={x:s.x,y:s.y}; _last[n]=p; } else if(_last[n]) p=_last[n]; }  // ELBOW HOLDS / flicker hold — never disappear
    if(p){ pts.push(p); seen++; } else pts.push(null); }
  window.__wfxSeen=seen+'/7';
  return pts.filter(Boolean); }
function along(P,ph){ if(P.length<2) return P[0]?{...P[0],vi:0,seg:0}:null;
  const seg=[]; let total=0; for(let i=1;i<P.length;i++){const d=dist(P[i],P[i-1]); seg.push(d); total+=d;}
  if(total<=0) return {x:P[0].x,y:P[0].y,vi:0,seg:0};
  let tgt=ph*total,i=0; while(i<seg.length&&tgt>seg[i]){tgt-=seg[i];i++;} i=Math.min(i,seg.length-1);
  const f=seg[i]?tgt/seg[i]:0,a=P[i],b=P[i+1]||P[i];
  return {x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),vi:i+(f>0.5?1:0),seg:i+f}; }

// ── sparkles + meteor state ──
let sparks=[], phase=0, dir=1, reversals=0, started=null, prevVi=-1, lastBloom={}, headTrail=[];
function bloom(x,y,k,trip){ lastBloom={x,y,t:performance.now(),k,trip}; const n=6+Math.floor(Math.random()*5);
  for(let s=0;s<n;s++){ const a=Math.random()*6.283; sparks.push({x,y,vx:Math.cos(a)*0.9*k,vy:Math.sin(a)*0.9*k-0.5*k,born:performance.now(),ttl:400+Math.random()*500,r:(1+Math.random()*1.6)*k,seed:Math.random()*6.28}); } }
function drawSparks(){ const now=performance.now(); sparks=sparks.filter(s=>{ const age=(now-s.born)/s.ttl; if(age>=1)return false;
  s.x+=s.vx; s.y+=s.vy; s.vy+=0.02*0; const tw=(0.6+0.4*Math.sin(now*0.08+s.seed)); orb(s.x,s.y,s.r*(1-age*0.4),C_HOT,(1-age)*tw); return true; }); }

// ── main loop ──
let lastT=performance.now();
async function loop(){
  const now=performance.now(), dt=Math.min(50,now-lastT); lastT=now;
  if(detector && cam.readyState>=2){
    let poses=[]; try{ poses=await detector.estimatePoses(cam,{flipHorizontal:true}); }catch(e){}
    if(poses[0]){ M={}; poses[0].keypoints.forEach(k=>M[k.name]={name:k.name,x:k.x,y:k.y,score:(k.score==null?k.confidence:k.score)});
      window.__wfxJoints=poses[0].keypoints.filter(k=>(k.score==null?k.confidence:k.score)>0.3).length;
      // overall motion (drives meteor pace)
      const raw=poses[0].keypoints;
      if(prevRaw){ let t=0,c=0; for(let i=0;i<raw.length;i++){ const a=raw[i],b=prevRaw[i]; const sa=a.score==null?a.confidence:a.score; if(sa>0.3&&b&&(b.score>0.3)){t+=Math.hypot(a.x-b.x,a.y-b.y);c++;} } const u=unit(); motion=c?0.6*motion+0.4*Math.min(1,(t/c)/u*4):motion; }
      prevRaw=raw.map(k=>({x:k.x,y:k.y,score:(k.score==null?k.confidence:k.score)}));
    }
  }
  render(dt,now);
  requestAnimationFrame(loop);
}
function unit(){ const l=M.left_shoulder,r=M.right_shoulder; return (l&&r&&l.score>=0.5&&r.score>=0.5)?dist(l,r):180; }

function render(dt,now){
  const W=fx.width,H=fx.height; if(!W) return;
  // FADE the light trail WITHOUT darkening the camera: destination-out erases FADE% of the
  // canvas's existing alpha each frame (old light fades), leaving empty areas TRANSPARENT so the
  // webcam shows through. (source-over black accumulated to opaque → it blacked out the camera.)
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,'+FADE+')'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const {X,Y}=mapper();
  const u=unit(); const k=Math.max(0.4,Math.min(3.0,u/220));
  const P=pathPoints(X,Y);
  if(P.length>=2){
    if(started==null){ started=now; phase=0; dir=1; prevVi=-1; headTrail.length=0; }
    const segCount=P.length-1;
    // TIMING: ~1s per joint hop (baseline) so the full chain flows even when still; BLENDED with the
    // user's REAL motion so the light rides the actual arm; a small floor keeps it alive; lead in the
    // travel direction to guide. It is NOT animate(A,B,dur) — POINT is recomputed from LIVE joints below.
    const perHop=900; const baseFull=dt/(perHop*segCount);
    const moveBoost=baseFull*Math.min(2.5, motion*6);
    const step=Math.max(baseFull*0.35, baseFull+moveBoost);
    phase += dir*step;
    // REVERSAL: at the far wrist, flip direction and bounce back — wrist↔wrist, like a real wave.
    if(phase>=1){ phase=1; dir=-1; reversals++; prevVi=-1; headTrail.length=0; const e=P[P.length-1]; bloom(e.x,e.y,k,C_START); }
    else if(phase<=0){ phase=0; dir=1; reversals++; prevVi=-1; headTrail.length=0; const e=P[0]; bloom(e.x,e.y,k,C_START); }
    const lead=0.04*dir;
    const head=along(P, Math.max(0.001,Math.min(0.999, phase+lead)));
    const segProg=head.seg/segCount;                 // 0(right wrist)→1(left wrist)
    const colorProg=1-Math.abs(2*segProg-1);         // HEATS toward the chest (mid), cools at the wrists
    const trip=rampColor(colorProg);
    const rHead=lerp(11,16,colorProg)*k;             // hottest/biggest crossing the core, narrows at the wrists

    // EVENT 1 · START PULSE + expanding ring at whichever wrist this sweep ignites from (both ends)
    const nearStart=(dir>0 && phase<0.10) || (dir<0 && phase>0.90);
    if(nearStart){
      const e=(dir>0?phase:1-phase)/0.10; const a=0.9*(1-Math.pow(1-e,2));         // ease-out
      const w=dir>0?P[0]:P[P.length-1]; const pr=14*k*(1+0.35*Math.sin(now*0.018));
      glow3(w.x,w.y,pr*0.5,C_START); orb(w.x,w.y,pr,C_START,a*0.6);
      const rr=lerp(8,30,e)*k; ctx.strokeStyle='rgba('+C_START+','+(0.5*(1-e))+')'; ctx.lineWidth=2.5*k;
      ctx.beginPath(); ctx.arc(w.x,w.y,rr,0,7); ctx.stroke();
    }
    // EVENT 2 · DIRECTION LEAN — narrowing teardrop wrist→elbow, shimmering tip (early)
    if(phase<0.16 && P.length>=2){
      const a=P[0], b=P[1]; const tipF=0.40; const ang=Math.atan2(b.y-a.y,b.x-a.x);
      const sh=Math.sin(now*0.02)*4*k; const px=Math.cos(ang+Math.PI/2)*sh, py=Math.sin(ang+Math.PI/2)*sh;
      const tx=lerp(a.x,b.x,tipF)+px, ty=lerp(a.y,b.y,tipF)+py;
      const g=ctx.createLinearGradient(a.x,a.y,tx,ty); g.addColorStop(0,'rgba('+C_START+',0.6)'); g.addColorStop(1,'rgba('+C_MID+',0)');
      ctx.strokeStyle=g; ctx.lineCap='round'; ctx.lineWidth=16*k; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.lineWidth=3*k; ctx.strokeStyle='rgba('+C_HOT+',0.5)'; ctx.beginPath(); ctx.moveTo(lerp(a.x,b.x,tipF*0.7),lerp(a.y,b.y,tipF*0.7)); ctx.lineTo(tx,ty); ctx.stroke();
    }

    // EVENT 3 · METEOR TRAVEL — tail beam + comet head
    headTrail.unshift({x:head.x,y:head.y,trip}); if(headTrail.length>16) headTrail.pop();
    if(headTrail.length>=2){
      // tapered tail with sine shimmer
      const hd=headTrail[0], tl=headTrail[headTrail.length-1];
      const ang=Math.atan2(hd.y-tl.y,hd.x-tl.x)+Math.PI/2;
      ctx.beginPath();
      for(let i=0;i<headTrail.length;i++){ const t=i/headTrail.length; const off=Math.sin(now*0.006*6+i*0.6)*5*k*t;
        const x=headTrail[i].x+Math.cos(ang)*off, y=headTrail[i].y+Math.sin(ang)*off; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      const g=ctx.createLinearGradient(hd.x,hd.y,tl.x,tl.y); g.addColorStop(0,'rgba('+trip+',0.85)'); g.addColorStop(1,'rgba('+C_DEEP+',0)');
      ctx.strokeStyle=g; ctx.lineWidth=10*k; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
    }
    glow3(head.x,head.y,rHead,trip);   // comet head (3-pass)

    // EVENT 4 · ARRIVAL BLOOM at each vertex + residual joint glow
    if(head.vi!==prevVi && head.vi>0){ prevVi=head.vi; const j=P[Math.min(head.vi,P.length-1)]; bloom(j.x,j.y,k,trip); }
    // residual glow on already-passed joints
    for(let vi=1; vi<=Math.min(head.vi,P.length-1); vi++){ const j=P[vi]; orb(j.x,j.y,8*k,rampColor(vi/segCount),0.4); }
    // arrival flare overshoot (+45% for 130ms)
    if(lastBloom.t){ const age=(now-lastBloom.t)/130; if(age<1){ const fl=1+0.45*Math.sin(age*Math.PI); glow3(lastBloom.x,lastBloom.y,12*k*fl,lastBloom.trip); } }
    drawSparks();
  } else { started=null; drawSparks(); }   // EVENT 5 · no path → fade out gently (fade-rect handles it)
  ctx.globalCompositeOperation='source-over';
}

// ── start ──
$('start').addEventListener('click', async ()=>{
  $('start').disabled=true;
  if(!await ensureCamera()){ $('start').disabled=false; return; }
  $('start-screen').classList.add('hidden');
  await Promise.race([ensureModel().catch(()=>{}), new Promise(r=>setTimeout(r,12000))]);
  requestAnimationFrame(loop);
});
window.__wfx={ get joints(){return window.__wfxJoints||0;}, get seen(){return window.__wfxSeen||'-';}, get phase(){return phase;}, get dir(){return dir;}, get reversals(){return reversals;} };
</script>
</body>
</html>
