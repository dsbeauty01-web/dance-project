<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freeze v4 · Nova's live face</title>
<!-- beta/freeze4.html — FREEZE v4 (b0.27): the SAME honest Freeze as beta/freeze-nova.html (freeze3 logic, freeze2 judge,
     nova-lights, stars) with two changes and nothing else:
       1. her VOICE is the live V2V voice through shared/nova-bridge.js (attachNova / routeVoice / note) — no speech
          synthesis, no recorded speech; the only canned audio left is the FREEZE sting (CONTEXT: "Voice = live V2V only").
       2. her FACE is a live stream from the face engine (SoulX-FlashHead) shown in a panel on the SIDE of the screen
          (shared/face-panel.js). No lips are drawn on her body. No fallback face: a missing stream = red banner.
     Spec, the pod contract and every value: docs/FREEZE4-SOULX-FACE.md.
     [CLI-FILL] name: the Freeze pages on beta are freeze.html → freeze2/ → freeze3.html → freeze-nova.html, so "v4" = freeze4.html.
     beta/freeze-nova.html and beta/freeze.html are NOT touched. -->
<link rel="stylesheet" href="play.css">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script><!-- same line as beta/novasays.html:4 -->
<style>
/* ── layout ──────────────────────────────────────────────────────────────────────────────────────────────
   [ face rail | Nova's body clips ]  |  [ the child: camera + lights ]
   · The child's pane is a flex sibling with a FIXED 50% (exactly freeze-nova's share). The face rail lives only
     inside Nova's half, so it can never cover the child's body or the joint lights, and when it grows it takes
     room from Nova's body pane — the child's pane and its light canvas never change size.
   · lexi-ux-patterns Pattern 1: in the game "Nova shrinks to corner bubble"; "when she has something specific to
     say, she briefly grows" → two rail widths, small (quiet) and big (talking).
   · game-cues-lights layout law: "Adaptive width transition 0.5s"; "zero black anywhere"; full figure never cropped
     (her body clip stays object-fit:contain).
   · Rail widths [CLI-FILL — derived, no spec gives them]: her clips are 1076x1924 (measured, ffprobe), so at full height
     her figure needs 56.2vh of width; on a 16:9 screen Nova's half is 88.9vh wide, which leaves 32.7vh = 18.4vw free.
     small = min(18vw, 32vh) → her figure keeps its full height. big = 24vw → her figure is still whole, drawn at 82 %.
     Stacked (phone, portrait): her half is 100vw x 50vh, the figure needs 28.1vh; small = 34vw, big = 46vw. */
#stage{display:flex;flex-direction:row}
#novaSide{display:flex;flex:0 0 50%;min-width:0;min-height:0;background:#1b1030}
#camPane{position:relative;flex:0 0 50%;min-width:0;min-height:0;overflow:hidden}
#novaPane{position:relative;flex:1 1 0;min-width:0;min-height:0;background:#1b1030;overflow:hidden}
#nova{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
/* zero black bars: the margins around her whole figure are filled by a blurred copy of the same clip
   (game-cues-lights layout law: "ambient room-stretch fills margins (blurred self-copy scaleX 2.2, blur 28px)") */
#novaAmb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(2.2);filter:blur(28px);z-index:1}
#camPane #cam,#camPane #fx{position:absolute;inset:0;width:100%;height:100%}

/* NOVA-FINAL (2026-11-12, Refael's spec items 2-3): the side rail is gone. Her face is a small PiP TOP-LEFT INSIDE her
   room (shared/face-pip.js, the same tile in every game), shown only in the game. Before the music starts and at the end
   she talks WIDE: her live Ditto body (#novaWide — her talk body in her room, Ditto lips) fills her pane instead of the
   clip. The child's pane keeps exactly 50 % (unchanged). */
#novaWide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;background:transparent}
#novaPane[data-stage=wide] #nova{visibility:hidden}
#novaPane[data-stage=game] #novaWide{visibility:hidden}
#novaPane[data-live-wide="0"] #novaWide{visibility:hidden}
#wideBanner{position:absolute;left:8%;right:8%;top:40%;z-index:8;padding:12px;border-radius:14px;text-align:center;
  background:#3a0d0d;color:#ffb3b3;font:800 clamp(12px,1.5vw,17px)/1.25 Nunito,system-ui}
#wideBanner[hidden]{display:none}
#wideBadge{display:none}
#novaTag{position:absolute;left:12px;top:56px;z-index:7;font:800 16px 'Baloo 2',Nunito,system-ui;color:var(--gold);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
/* the whole-screen red banner: something the game needs is missing → it refuses to start (CLAUDE.md law 4) */
#banner{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
  background:#3a0d0d;color:#ffb3b3;font:800 clamp(18px,3vw,26px)/1.3 Nunito,system-ui}
#banner small{font:600 clamp(13px,1.8vw,16px)/1.4 Nunito,system-ui;color:#ffd0d0;max-width:720px}
#banner.hidden{display:none}
/* the medal screen leaves Nova's half uncovered: her ending lines are said there (pod run 2026-11-11: the full-screen
   medal hid her face for the whole ending) */
#end{left:50%}   /* NOVA-FINAL: the medal screen covers the child's half only — her WIDE ending is said in her room */
@media (max-aspect-ratio: 1/1){
  #end{left:0;top:50vh}
  #stage{flex-direction:column}
}
</style>
</head><body>
<div id="stage">
  <div id="novaSide">
    <div id="novaPane" data-stage="wide" data-live-wide="0"><video id="novaAmb" playsinline muted loop></video><video id="nova" playsinline muted loop></video><video id="novaWide" playsinline muted autoplay></video><div id="wideBanner" hidden></div><div id="wideBadge"></div></div>
  </div>
  <div id="camPane"><video id="cam" playsinline muted></video><canvas id="fx"></canvas></div>
</div>
<div id="topbar"><button class="back" id="back">←</button><div id="stars"></div><div id="dots"></div></div>
<div id="doctor"><div class="outline"></div><div class="msg"></div><div class="bar"><i></i></div><button class="big go"></button></div>
<div id="ring"></div><div id="card"></div><div id="cap"></div>
<div class="screen on" id="startScr"><h1 id="title">Freeze!</h1><p id="howto"></p><button class="big" id="go">▶</button></div>
<div class="screen" id="end"><div id="medal"></div><div id="medalStars"></div><p id="endLine"></p>
  <div class="row"><button class="big" id="again"></button><button class="big alt" id="back2"></button></div><button class="save" id="save"></button></div>
<div id="banner" class="hidden"></div>
<script type="module">
import { createFreezeGame } from './lib/freeze-game.js';
import { toJudge } from './lib/kp.js';
import { createLights } from '../shared/nova-lights.js';
import { Q, getLang, applyLang, COMMON, createHud, caption, card, ring, medalScreen, createSource, createRecorder, audio, guideFor } from './lib/play.js';
import { createNovaEvents } from './lib/events.js';
import { createLocalBrain } from './lib/brain-local.js';
import { runDoctor } from './lib/doctor.js';
import { attachNova, routeVoice, note, onHerAudio, bridgeState } from '../shared/nova-bridge.js';
import { createFacePanel } from '../shared/face-panel.js';
import { mountFacePip } from '../shared/face-pip.js';

const $ = id => document.getElementById(id);
const lang = getLang(); applyLang(lang);
const voiceDir = lang === 'he' ? (Q.get('g') === 'm' ? 'he-m' : 'he-f') : 'en';
const TXT = {
  en: { title: 'Freeze!', howto: 'Dance while the music plays. When it stops — FREEZE like the animal!', calib: 'Stand still for a moment…', dance: 'Dance! 💃',
        freeze: a => `FREEZE like a ${a}!`, star: 'Frozen! ⭐', notyet: "Next one's yours!", warming: "Nova's warming up ✨",
        animals: { flamingo: 'flamingo', bear: 'bear', frog: 'frog', star: 'star', statue: 'statue' },
        refuse: 'Freeze v4 cannot start', noFace: "Nova's live face (SoulX) is not streaming", noVoice: "Nova's live voice is not connected", noBody: 'A Nova body clip is missing: ',
        op: 'For the operator: this page needs the Nova pod — a live voice and a face stream published as "nova-face". Nothing is faked when they are missing.' },
  he: { title: 'קופאים!', howto: 'רוקדים כשיש מוזיקה. כשהיא נעצרת — קופאים כמו החיה!', calib: 'רגע אחד בלי לזוז…', dance: 'רוקדים! 💃',
        freeze: a => `קופאים כמו ${a}!`, star: 'קפאת! ⭐', notyet: 'הפעם הבאה שלך!', warming: 'נובה מתעוררת ✨',
        animals: { flamingo: 'פלמינגו', bear: 'דוב', frog: 'צפרדע', star: 'כוכב', statue: 'פסל' },
        refuse: 'קופאים v4 לא יכול להתחיל', noFace: 'הפנים החיות של נובה (SoulX) לא משודרות', noVoice: 'הקול החי של נובה לא מחובר', noBody: 'חסר קליפ גוף של נובה: ',
        op: 'למפעיל: הדף צריך את הפוד של נובה — קול חי וזרם פנים בשם "nova-face". כשהם חסרים שום דבר לא מזויף.' },
}[lang];
const L = COMMON[lang];
const EMO = { flamingo: '🦩', bear: '🐻', frog: '🐸', star: '⭐', statue: '🗿' };
$('title').textContent = TXT.title; $('howto').textContent = TXT.howto; $('back').textContent = lang === 'he' ? '→' : '←';
$('back').onclick = () => location.href = 'index.html' + location.search;

/* ── the run log: everything the proof harness (and a curious founder) reads back — window.freeze4Log ── */
const LOG = window.freeze4Log = []; const T0 = performance.now();
const log = (kind, detail = '') => { const e = { t: +((performance.now() - T0) / 1000).toFixed(2), kind, detail }; LOG.push(e); console.log('[FREEZE4]', e.t, kind, detail); };
function refuse(reasons){ const b = $('banner'); b.innerHTML = ''; const h = document.createElement('div'); h.textContent = '⛔ ' + TXT.refuse; b.appendChild(h);
  for (const r of reasons){ const d = document.createElement('div'); d.textContent = r; b.appendChild(d); }
  const s = document.createElement('small'); s.textContent = TXT.op; b.appendChild(s); b.classList.remove('hidden'); caption(''); log('refused', reasons.join(' | ')); }

const tune = (await (await fetch('freeze2/script.json')).json()).tune;
const fast = Q.get('fast') === '1';
const pace = fast ? { danceS: [2.6, 3.2], resultS: 1.2 } : {};
if (+Q.get('rounds') > 0) pace.rounds = +Q.get('rounds');        // shorter games for the lobby demo
/* Nova's body pane: which of HER clips plays in which phase (all from ../freezegame — the approved Freeze assets; same map as freeze-nova) */
const NOVA = { idle: '../freezegame/idle_sway.mp4', dance: ['../freezegame/dance-active.mp4', '../freezegame/dance-sub.mp4'],
  freeze: { flamingo: '../freezegame/flamingo_freeze.mp4', bear: '../freezegame/freezebear.mp4', frog: '../freezegame/freezefrog.mp4', star: '../freezegame/freeze-star.mp4', statue: '../freezegame/freeze-star.mp4' } };
const novaV = $('nova'), novaAmb = $('novaAmb'); let novaCur = '';
function novaPlay(srcUrl, { loop = true, holdEnd = false } = {}){
  if (novaCur === srcUrl && !novaV.paused && !novaV.ended) return;
  novaCur = srcUrl; novaV.loop = loop && !holdEnd; novaV.src = srcUrl; novaV.currentTime = 0;
  novaV.onended = holdEnd ? () => { novaV.pause(); } : null;          // the freeze pose: play once, then HOLD her still frame
  novaV.play().catch(() => {});
  novaAmb.src = srcUrl; novaAmb.play().catch(() => {});               // the blurred room behind her (picture only, never a cue)
}
novaV.addEventListener('error', () => { if (novaCur) refuse([TXT.noBody + novaCur]); });      // a body clip that will not play is never silent
novaPlay(NOVA.idle);
const sting = () => audio(`../audio/freeze2/${voiceDir}/sting.freeze.${1 + Math.floor(Math.random() * 3)}.mp3`);   // the ONE canned sound (law)
const music = new Audio('../freezegame/animal-freeze-song.mp3'); music.loop = true; music.volume = 0.6;

const lights = createLights($('fx'), { video: $('cam') });
const rec = createRecorder('freeze4', lang);
const brain = createNovaEvents('freeze', ev => rec.nova(ev));     // reaction triggers for the avatar: window.novaEvents

/* ── her FACE: the side panel. The stream comes from the bridge (onFace); the panel only shows it. ── */
const pip = mountFacePip($('novaPane'), { lang, log, onHealth: live => { if (!live) rec.event('face_missing', {}, performance.now() / 1000); } });
pip.video.id = 'face';                                                        // the proof probe reads #face (mouth motion)
const face = pip.panel;
/* her WIDE talking body (Ditto) — same watchdog/red-banner engine as the face, on her pane */
const wide = createFacePanel({ root: $('novaPane'), video: $('novaWide'), badge: $('wideBadge'), banner: $('wideBanner'), lang, log: (k, d) => log('wide-' + k, d),
  missingTag: 'Ditto', missingText: lang === 'he' ? 'הגוף החי של נובה (דיטו) לא משודר' : "Nova's live talking body is not streaming",
  onHealth: live => { $('novaPane').dataset.liveWide = live ? '1' : '0'; if (!live) rec.event('wide_missing', {}, performance.now() / 1000); } });
window.freeze4Wide = wide;
let dual = false;                                                             // the pod runs FACE_RENDERER=dual (a wide track exists)
/* the stage: 'wide' = intro/ending (she talks on her body in her room, Ditto lips) · 'game' = her clips + the PiP face.
   It follows the voice routing exactly (routeVoice is the phase machine's one switch): engine = wide, air/mute = game. */
function stage(st){ if (!dual) { pip.show(true); return; }
  $('novaPane').dataset.stage = st; pip.show(st === 'game'); face.setActive(st === 'game'); wide.setActive(st === 'wide'); log('stage', st); }
window.freeze4Face = face;

/* ── her VOICE: live V2V only, through the bridge. What she is asked to say is chosen by the same Truth-Law brain as
      freeze-nova (beta/lib/brain-local.js — only what the judge really saw); the pod's speak-gate is the rate limiter
      (pod/rt_lk.py SPEAK-GATE: one staged line per gap in 'air', none in a hold). ── */
const mind = createLocalBrain({ lang, g: Q.get('g') === 'm' ? 'm' : 'f' });
window.novaBrainLog = [];
let voiceMode = 'engine', holding = false, gapLine = false;
/* In the game ('air') she gets ONE line per gap (game-cues-lights juice checklist: "≤1 line/gap"; pod speak-gate: "this
   gap's ONE allowed line"). A gap = from the end of one hold to the start of the next. The first line asked for wins —
   that is the one about what the judge just saw; a second one is held back, never stacked on top of her own voice. */
function setVoice(mode){ if (mode === voiceMode && setVoice.sent) return; setVoice.sent = true; voiceMode = mode; routeVoice(mode); log('voice', mode); stage(mode === 'engine' ? 'wide' : 'game'); }      // routeVoice() is the only thing that changes routing
/* SHE TALKS LESS (founder, 2026-11-11: "she should talk a bit less"). In the game a line is cut to its first sentence and
   said only if that is ≤ 6 words — beta/tiers.js kids `maxWordsMidGame: 6`; game-cues-lights juice checklist "voice or
   badge (fact-fed, ≤6 words, not every hit — ≤1 line/gap)". A longer line is not said at all: the badge, the card and the
   stars carry that moment. brain-local.js is not changed (freeze-nova still uses it whole). */
const MAX_GAME_WORDS = 6;
function gameLine(text){
  const words = s => s.split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length;
  const first = (text.match(/^.*?[.!?](?=\s|$)/) || [text])[0].trim();
  if (words(first) <= MAX_GAME_WORDS) return first;
  const clause = first.split(/\s+—\s+/)[0].trim();                          // "The bear got away — the music…" → "The bear got away!"
  return clause !== first && words(clause) <= MAX_GAME_WORDS ? clause.replace(/[,;:]$/, '') + '!' : null;
}
function novaSays(text, delayMs = 0){
  if (!text) return;
  setTimeout(() => {
    if (voiceMode === 'air' && !holding){ const short = gameLine(text);
      if (!short){ log('line-held-back', 'over ' + MAX_GAME_WORDS + ' words: ' + text); window.novaBrainLog.push({ t: performance.now() / 1000, text, delayMs, mode: voiceMode, sent: false }); return; }
      text = short; }
    const entry = { t: performance.now() / 1000, text, delayMs, mode: voiceMode, sent: !holding };
    window.novaBrainLog.push(entry);
    if (holding){ entry.sent = false; log('line-held-back', 'hold: ' + text); return; }        // HOLDS = hard mute: nothing is asked for during a freeze
    if (voiceMode === 'air'){ if (gapLine){ entry.sent = false; log('line-held-back', 'one per gap: ' + text); return; } gapLine = true; }
    note(`say exactly: "${text}"`); face.thinking(); log('line', text);
    pip.say(text);
  }, delayMs);
}
/* No 'fact:' notes in v4: on the pod (2026-11-11) every note in the game's 'air' mode was credited as the gap's spoken
   line (pod/rt_lk.py SPEAK-GATE, nova-cue arm), so a "silent" fact could make her talk on her own. Everything she says
   about the round is already in the exact line the page stages (Truth Law: only what the judge saw). */
function mindReact(type, d){ const r = mind.react(type, d); if (r) novaSays(r.text, r.delayMs); }
onHerAudio({ playing: () => { face.speaking(true); log('her-voice', 'start'); }, ended: () => { face.speaking(false); log('her-voice', 'end'); } });
addEventListener('nova:kid', () => face.thinking());                          // the child said something → she is about to answer

const animalByRound = {};
let doc = null, game, hud, src, phaseCap = ['', ''], freezeAt = 0, holdS = 2.5, animal = 'statue', ended = false, lastFrame = null;

function say(text, cls = ''){ phaseCap = [text, cls]; if (game?.state.seen !== false) caption(text, cls); }

/* the game's own cues, lights and scoring — line for line what freeze-nova does; only the voice calls differ */
function onEvent(type, d){
  const t = performance.now() / 1000; rec.event(type, d, t); brain(type, d);
  if (type === 'phase'){
    if (d.phase === 'calib') say(TXT.calib, 'wait');
    if (d.phase === 'dance'){ holding = false; setVoice('air'); face.setBase('watching');          // GAME = her voice in the air
      card(null); ring(null); lights.ice(false); lights.speedGlow(true); hud.now(d.round); say(TXT.dance, 'gold'); music.play().catch(() => {});
      novaPlay(NOVA.dance[(d.round - 1) % NOVA.dance.length]); /* Nova dances with the music */
      if (d.round > 1) src.next(); }
    if (d.phase === 'result'){ holding = false; gapLine = false; setVoice('air'); face.setBase('watching'); }        // the hold is over: one line may ride this gap
  }
  if (type === 'freeze'){ holding = true; setVoice('mute'); face.setBase('freeze');                 // HOLDS = hard mute
    animal = d.animal; animalByRound[d.round] = d.animal; music.pause(); sting(); novaPlay(NOVA.freeze[d.animal] || NOVA.freeze.star, { holdEnd: true }); /* Nova strikes the animal pose and holds it */ lights.speedGlow(false); lights.ice(true); freezeAt = t; holdS = game.pace.holdS;
    card(TXT.animals[animal], EMO[animal]); say(TXT.freeze(TXT.animals[animal]), 'wait'); }
  if (type === 'star'){ hud.star(); hud.mark(d.round, 'star'); ring(1, true); lights.ice(false); lights.snow('nose'); lights.burst('nose', 'gold'); say(TXT.star, 'good'); }
  if (type === 'notyet'){ hud.mark(d.round, 'notyet'); ring(null); lights.ice(false); say(TXT.notyet, 'wait'); }
  if (type === 'skip'){ hud.mark(d.round, 'skip'); ring(null); lights.ice(false); lights.guide('tooClose'); say(L.cantSee, 'wait'); }
  if (type === 'seen'){ if (d.seen){ lights.guide(null); caption(...phaseCap); } else { lights.guide(guideFor(lastFrame)); caption(L.cantSee, 'wait'); } }
  mindReact(type, d);                                                        // after the routing above, so a line is never asked for inside a hold
  if (type === 'end') finish(d);
}

function finish(d){
  ended = true; holding = false; music.pause(); src.stop(); card(null); ring(null); caption(''); lights.clearAll(); novaPlay(NOVA.idle);
  setVoice('engine'); face.setBase('listening');                              // ENDING = she has the floor again
  rec.end(d, src.state);
  /* the after-game story: at most 2 lines — the verdict and the choice (ai-companion-presence "Conversation: 2 sentences MAX";
     founder 2026-11-11 "talk a bit less"). freeze-nova says all 2–3. Timing as freeze-nova. */
  /* TRUTH: the judge's result rows carry no animal, so brain-local's recap named "the statue" as her best freeze whatever
     the animal was (seen in the 2026-11-10 stand-in run). Her real voice must not say that: give it the real animals. */
  const truth = { ...d, results: (d.results || []).map(r => ({ ...r, animal: animalByRound[r.round] })) };
  const all = mind.recap(truth), story = all.length > 2 ? [all[0], all[all.length - 1]] : all;
  story.forEach((txt, i) => novaSays(txt, 1400 + i * 3600));
  medalScreen({ ...d, lang, onAgain: () => location.reload(), onBack: () => location.href = 'index.html' + location.search, onSave: () => { rec.save(); $('save').textContent = '✓ ' + L.saved; } });
}

/* How long the page waits for her face + voice before it refuses. [CLI-FILL] 15 s — no spec gives it; the pod is
   already warm when a page is opened (the tester package's "waking-up" state covers a cold pod). QUESTION. ?facewait=<s> overrides. */
const FACE_WAIT_MS = (+Q.get('facewait') > 0 ? +Q.get('facewait') : 15) * 1000;
async function bodyClipsOk(){
  const all = [NOVA.idle, ...NOVA.dance, ...new Set(Object.values(NOVA.freeze))], bad = [];
  await Promise.all(all.map(async u => { try { const r = await fetch(u, { method: 'HEAD' }); if (!r.ok) bad.push(u); } catch { bad.push(u); } }));
  return bad;
}

async function begin(){
  $('startScr').classList.remove('on');
  caption(TXT.warming, 'wait');                                               // game-cues-lights: the "Nova's warming up ✨" loading state
  const missingClips = await bodyClipsOk();
  if (missingClips.length) return refuse(missingClips.map(u => TXT.noBody + u));
  /* her live face + live voice — both must be really there, or the game does not start (no silent fallbacks) */
  log('attach', 'start');
  try { await attachNova({ intro: 'freeze4', onFace: s => face.attach(s), onWide: s => { dual = dual || !!s; wide.attach(s); } }); } catch (e) { log('attach-error', String(e?.message || e)); }
  const deadline = performance.now() + FACE_WAIT_MS;
  /* NOVA-FINAL: a dual pod starts on the WIDE body (the SoulX face is not rendered until the game) — wait for whichever
     face this pod streams first; with no wide track it is the freeze4 pod (face only) exactly as before. */
  let faceOk = false;
  while (performance.now() < deadline){
    if (wide.state.live){ dual = true; faceOk = true; break; }
    if (face.state.live && !bridgeState().wide){ faceOk = true; break; }
    await new Promise(r => setTimeout(r, 200));
  }
  if (dual){ face.setActive(false); stage('wide'); } else { wide.setActive(false); $('novaPane').dataset.stage = 'game'; pip.show(true); }
  let st = bridgeState();
  while (!(st.ws && st.voice) && performance.now() < deadline){ await new Promise(r => setTimeout(r, 200)); st = bridgeState(); }
  log('attach', JSON.stringify({ face: faceOk, dual, ...st }));
  const why = []; if (!faceOk) why.push(TXT.noFace); if (!st.ws || !st.voice) why.push(TXT.noVoice);
  if (why.length) return refuse(why);

  setVoice('engine'); face.setBase('listening');                              // INTRO = she talks, the child may answer
  if (!fast){ mindReact('intro'); await new Promise(r => setTimeout(r, 3400)); }     // she explains the game first (skipped with ?fast=1) — freeze-nova timing
  game = createFreezeGame({ tune, pace, on: onEvent });
  hud = createHud(game.pace.rounds);
  src = await createSource($('cam'), (frame, t) => {
    if (ended) return; lastFrame = frame;
    const k = toJudge(frame); if (k) lights.feed(k);
    if (doc){ doc(frame); return; }                       // Camera Doctor first — the game isn't running yet
    rec.frame(frame, t, src?.state); game.feed(frame, t); game.tick(t);
    if (game.state.phase === 'freeze') ring(Math.min(1, (t - freezeAt) / holdS));
  });
  if (!src.state.modelOk) caption(src.state.cameraError ? L.noCamera : L.cantSee, 'wait');
  src.start();
  if (Q.get('checked') !== '1' && Q.get('doctor') !== '0') await runDoctor({ lights, lang, onFrameHook: h => doc = h });
  face.setBase('watching');
  game.start(performance.now() / 1000);
  setInterval(() => { if (!ended) game.tick(performance.now() / 1000); }, 100);     // the game always ends, frames or not
}
$('go').textContent = '▶ ' + L.start; $('go').onclick = begin;
if (Q.get('autostart') === '1') begin();
</script>
