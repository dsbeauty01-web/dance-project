       2. her FACE is a live stream from the face engine (SoulX-FlashHead) shown in a panel on the SIDE of the screen

<style>
/* ── layout ──────────────────────────────────────────────────────────────────────────────────────────────
   [ face rail | Nova's body clips ]  |  [ the child: camera + lights ]
   · The child's pane is a flex sibling with a FIXED 50% (exactly freeze-nova's share). The face rail lives only
     inside Nova's half, so it can never cover the child's body or the joint lights, and when it grows it takes
     room from Nova's body pane — the child's pane and its light canvas never change size.
   · lexi-ux-patterns Pattern 1: in the game "Nova shrinks to corner bubble"; "when she has something specific to
     say, she briefly grows" → two rail widths, small (quiet) and big (talking).
   · game-cues-lights layout law: "Adaptive width transition 0.5s"; "zero black anywhere"; full figure never cropped
     (her body clip stays object-fit:contain).
   · Rail widths [CLI-FILL — derived, no spec gives them]: her clips are 1076x1924 (measured, ffprobe), so at full height
     her figure needs 56.2vh of width; on a 16:9 screen Nova's half is 88.9vh wide, which leaves 32.7vh = 18.4vw free.
     small = min(18vw, 32vh) → her figure keeps its full height. big = 24vw → her figure is still whole, drawn at 82 %.
     Stacked (phone, portrait): her half is 100vw x 50vh, the figure needs 28.1vh; small = 34vw, big = 46vw. */
#stage{display:flex;flex-direction:row}
#novaSide{display:flex;flex:0 0 50%;min-width:0;min-height:0;background:#1b1030}
#camPane{position:relative;flex:0 0 50%;min-width:0;min-height:0;overflow:hidden}
#novaPane{position:relative;flex:1 1 0;min-width:0;min-height:0;background:#1b1030;overflow:hidden}
#nova{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
/* zero black bars: the margins around her whole figure are filled by a blurred copy of the same clip
   (game-cues-lights layout law: "ambient room-stretch fills margins (blurred self-copy scaleX 2.2, blur 28px)") */
#novaAmb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(2.2);filter:blur(28px);z-index:1}
#camPane #cam,#camPane #fx{position:absolute;inset:0;width:100%;height:100%}

/* NOVA-FINAL (2026-11-12, Refael's spec items 2-3): the side rail is gone. Her face is a small PiP TOP-LEFT INSIDE her
   room (shared/face-pip.js, the same tile in every game), shown only in the game. Before the music starts and at the end
   she talks WIDE: her live Ditto body (#novaWide — her talk body in her room, Ditto lips) fills her pane instead of the
   clip. The child's pane keeps exactly 50 % (unchanged). */
#novaWide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;background:transparent}
#novaPane[data-stage=wide] #nova{visibility:hidden}
/* NOVA-GO3 flag noblink: the last picture of her clip / of the blurred room, held on a canvas while the next clip loads */
#novaHold{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none}
#novaAmbHold{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(2.2);filter:blur(28px);z-index:1;pointer-events:none;display:none}
#novaPane[data-stage=wide] #novaHold{visibility:hidden}
#novaPane[data-stage=game] #novaWide{visibility:hidden}
#novaPane[data-live-wide="0"] #novaWide{visibility:hidden}
#wideBanner{position:absolute;left:8%;right:8%;top:40%;z-index:8;padding:12px;border-radius:14px;text-align:center;
  background:#3a0d0d;color:#ffb3b3;font:800 clamp(12px,1.5vw,17px)/1.25 Nunito,system-ui}
#wideBanner[hidden]{display:none}
#wideBadge{display:none}
#novaTag{position:absolute;left:12px;top:56px;z-index:7;font:800 16px 'Baloo 2',Nunito,system-ui;color:var(--gold);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
/* the whole-screen red banner: something the game needs is missing → it refuses to start (CLAUDE.md law 4) */
#banner{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
  background:#3a0d0d;color:#ffb3b3;font:800 clamp(18px,3vw,26px)/1.3 Nunito,system-ui}
#banner small{font:600 clamp(13px,1.8vw,16px)/1.4 Nunito,system-ui;color:#ffd0d0;max-width:720px}
#banner.hidden{display:none}
/* the medal screen leaves Nova's half uncovered: her ending lines are said there (pod run 2026-11-11: the full-screen
   medal hid her face for the whole ending) */
/* ── READY GATE (Refael after his play, 2026-11-22: "camera and mic permission first, before Nova. The user needs to be
   fully ready, seeing himself on camera. Nova only appears when she is fully ready: visible, full lips and voice").
   While body[data-gate] is set the child's own picture fills the whole screen and COVERS Nova's half: her pane stays laid
   out underneath (so her live video keeps decoding and the frame counter in shared/face-panel.js keeps counting), but
   nothing of her — no half-loaded picture, no empty box, no red line — can be seen until the gate opens. ── */
body[data-gate] #camPane{position:fixed;inset:0;z-index:30;background:var(--bg)}
/* ── what the player says, live (Refael 2026-11-22: "the text of what I say should appear live somewhere"). A small cyan
   line on the PLAYER's own picture — Nova's captions are the big gold/amber/mint line at the bottom centre (play.css #cap)
   and the white bubble under her face, so the two can never be confused. [CLI-FILL] size/place: no spec gives them;
   lexi-ux-patterns conversation UI = the child's words sit on the child's side. QUESTION for the founder. ── */
#you{position:absolute;left:50%;bottom:24vh;transform:translateX(-50%);z-index:9;width:max-content;max-width:86%;text-align:center;pointer-events:none;
  font:700 clamp(14px,2vw,22px)/1.25 Nunito,system-ui;color:var(--cyan);background:rgba(8,20,34,.78);border:2px solid rgba(125,240,255,.55);
  padding:7px 14px;border-radius:14px;opacity:0;transition:opacity .25s}
#you.on{opacity:1}
#you.unsure{color:var(--soft);border-color:rgba(215,205,240,.35)}
#banner button{margin-top:8px}
/* ── NOVA-GO4 (2026-11-23) · flag `split`, default off. Refael after his live play: "the game started with my camera BIG,
   full screen" - he wants a SPLIT SCREEN from the very start: Nova on one side, him on the other. With the flag the ready
   gate no longer blows his picture up over her half: his pane keeps its game size and place from the first second. Her
   half is her room behind a curtain (a still, blurred picture of her own room + a soft sparkle) until she is fully ready
   - her live picture is laid out underneath and keeps decoding, exactly as it did under his full-screen picture, and
   the curtain is dropped at the same moment the gate used to open (her first word). Nothing half-loaded is ever seen. ── */
body.f-split[data-gate] #camPane{position:relative;inset:auto;z-index:auto;background:transparent}
#novaCurtain{display:none}
body.f-split[data-gate] #novaCurtain{display:flex;position:absolute;inset:0;z-index:9;align-items:center;justify-content:center;overflow:hidden;background:#1b1030}
#novaCurtain canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(2.2);filter:blur(28px)}
#novaCurtain span{position:relative;font-size:clamp(44px,9vw,90px);animation:f4spark 1.5s ease-in-out infinite;text-shadow:0 0 30px rgba(255,214,90,.6)}
@keyframes f4spark{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.12);opacity:1}}
/* ── NOVA-GO4 · flag `hear`: the microphone chip on the PLAYER's own picture (the commercial page's "HEARD-YOU" ear,
   d92e252: pulses on voice, green on an accepted turn). No numbers, never red: soft = listening, dim = her turn, cyan =
   she hears a voice, mint = she got it, amber + one line = the microphone gives nothing (no silent failure). ── */
#mic{position:absolute;left:10px;top:54px;z-index:9;display:flex;align-items:flex-end;gap:3px;padding:6px 10px;border-radius:999px;pointer-events:none;
  background:rgba(8,20,34,.7);border:2px solid rgba(215,205,240,.3);font:700 clamp(12px,1.6vw,16px)/1 Nunito,system-ui;color:var(--soft);--l:0;transition:opacity .2s,border-color .2s}
#mic[hidden]{display:none}
#mic .ic{font-size:1.15em;margin-inline-end:3px;align-self:center}
#mic i{width:4px;border-radius:2px;background:currentColor;height:calc(4px + var(--l) * 14px)}
#mic i:nth-of-type(2){height:calc(4px + var(--l) * 22px)} #mic i:nth-of-type(3){height:calc(4px + var(--l) * 18px)} #mic i:nth-of-type(4){height:calc(4px + var(--l) * 10px)}
#mic b{align-self:center;font-weight:800}
#mic[data-s=her]{opacity:.45}
#mic[data-s=hearing]{color:var(--cyan);border-color:rgba(125,240,255,.8)}
#mic[data-s=ok]{color:var(--mint);border-color:var(--mint)}
#mic[data-s=dead]{color:var(--amber);border-color:var(--amber);pointer-events:auto;cursor:pointer;opacity:1}
#mic[data-s=dead] i{display:none} #mic[data-s=dead] b{margin-inline-start:4px}
#end{left:50%}   /* NOVA-FINAL: the medal screen covers the child's half only — her WIDE ending is said in her room */
@media (max-aspect-ratio: 1/1){
  #end{left:0;top:50vh}
  #stage{flex-direction:column}
}
</style>

  he: { title: 'קופאים!', howto: 'רוקדים כשיש מוזיקה. כשהיא נעצרת — קופאים כמו החיה!', calib: 'רגע אחד בלי לזוז…', dance: 'רוקדים! 💃',
        freeze: a => `קופאים כמו ${a}!`, star: 'קפאת! ⭐', notyet: 'הפעם הבאה שלך!', warming: 'נובה מתעוררת ✨',
        animals: { flamingo: 'פלמינגו', bear: 'דוב', frog: 'צפרדע', star: 'כוכב', statue: 'פסל' },
        refuse: 'קופאים v4 לא יכול להתחיל', noFace: 'הפנים החיות של נובה (SoulX) לא משודרות', noVoice: 'הקול החי של נובה לא מחובר', noBody: 'חסר קליפ גוף של נובה: ',
        op: 'למפעיל: הדף צריך את הפוד של נובה — קול חי וזרם פנים בשם "nova-face". כשהם חסרים שום דבר לא מזויף.',
        asking: 'צריך לאשר את המצלמה ואת המיקרופון', getReady: 'זה אתם! מתכוננים… ✨', coming: 'נובה בדרך… ✨', you: 'אמרת',
        noCam: 'המצלמה לא מאושרת.', noMic: 'המיקרופון לא מאושר.', noMedia: 'הדפדפן הזה לא נותן לדף מצלמה או מיקרופון.',
        camFail: 'המצלמה לא נפתחה: ', noGreet: 'נובה לא התחילה לדבר', retry: 'לנסות שוב', micDead: 'אני לא שומעת — לחצו כאן',
        allow: 'איך מאשרים: לוחצים על סמל המנעול (או המצלמה) ליד כתובת האתר, בוחרים "אישור" למצלמה ולמיקרופון, ואז "לנסות שוב". נובה צריכה את שניהם: מצלמה כדי לראות את הקפיאה, מיקרופון כדי לשמוע אתכם.' },
}[lang];
const L = COMMON[lang];
/* NOVA-AUDIT flags: ?name=1 / ?name=0 for one visit, else the build's beta/freeze4-flags.js (all off in the repo) */
const FLAG = name => Q.get(name) === '1' || (Q.get(name) !== '0' && !!(window.__F4_FLAGS || {})[name]);
if (FLAG('split')) document.body.classList.add('f-split');
const EMO = { flamingo: '🦩', bear: '🐻', frog: '🐸', star: '⭐', statue: '🗿' };
$('title').textContent = TXT.title; $('howto').textContent = TXT.howto; $('back').textContent = lang === 'he' ? '→' : '←';
$('back').onclick = () => location.href = 'index.html' + location.search;

/* ── the run log: everything the proof harness (and a curious founder) reads back — window.freeze4Log ── */
const LOG = window.freeze4Log = []; const T0 = performance.now();
/* NOVA-GO4 flag `hear`: the same lines also go to the brain (pod NOVA_HEAR=1 prints them as [PAGE] in rtlk.log), so what a
   real player's browser did - permission, microphone level, what was heard - can be read back after a live session. */
const F_HEAR = Q.get('hear') === '1' || (Q.get('hear') !== '0' && !!(window.__F4_FLAGS || {}).hear);
const log = (kind, detail = '') => { const e = { t: +((performance.now() - T0) / 1000).toFixed(2), kind, detail }; LOG.push(e); console.log('[FREEZE4]', e.t, kind, detail);
  if (F_HEAR && kind !== 'fps') pageLog(kind, detail); };
function refuse(reasons, { help = '', retry = false } = {}){ const b = $('banner'); b.innerHTML = ''; const h = document.createElement('div'); h.textContent = '⛔ ' + TXT.refuse; b.appendChild(h);
  for (const r of reasons){ const d = document.createElement('div'); d.textContent = r; b.appendChild(d); }
  const s = document.createElement('small'); s.textContent = help || TXT.op; b.appendChild(s);
  if (retry){ const again = document.createElement('button'); again.className = 'big'; again.textContent = TXT.retry; again.onclick = () => location.reload(); b.appendChild(again); }
  b.classList.remove('hidden'); caption(''); log('refused', reasons.join(' | ')); }

const tune = (await (await fetch('freeze2/script.json')).json()).tune;
const fast = Q.get('fast') === '1';
const pace = fast ? { danceS: [2.6, 3.2], resultS: 1.2 } : {};
if (+Q.get('rounds') > 0) pace.rounds = +Q.get('rounds');        // shorter games for the lobby demo
/* Nova's body pane: which of HER clips plays in which phase (all from ../freezegame — the approved Freeze assets; same map as freeze-nova) */
const NOVA = { idle: '../freezegame/idle_sway.mp4', dance: ['../freezegame/dance-active.mp4', '../freezegame/dance-sub.mp4'],
  freeze: { flamingo: '../freezegame/flamingo_freeze.mp4', bear: '../freezegame/freezebear.mp4', frog: '../freezegame/freezefrog.mp4', star: '../freezegame/freeze-star.mp4', statue: '../freezegame/freeze-star.mp4' } };
const novaV = $('nova'), novaAmb = $('novaAmb'); let novaCur = '';
function novaPlay(srcUrl, { loop = true, holdEnd = false } = {}){
  if (novaCur === srcUrl && !novaV.paused && !novaV.ended) return;
  if (FLAG('noblink')){ holdOn(novaV, $('novaHold'), 'contain'); holdOn(novaAmb, $('novaAmbHold'), 'cover'); }
  novaCur = srcUrl; novaV.loop = loop && !holdEnd; novaV.src = srcUrl; novaV.currentTime = 0;
  novaV.onended = holdEnd ? () => { novaV.pause(); } : null;          // the freeze pose: play once, then HOLD her still frame
  novaV.play().catch(() => {});
  novaAmb.src = srcUrl; novaAmb.play().catch(() => {});               // the blurred room behind her (picture only, never a cue)
  ambFor($('novaPane').dataset.stage);
}
/* NOVA-GO2 · flag `ambstill` (default off). Pod run 8ezbrmtmzsfk1j: her stream ARRIVED at 25 a second while she was hidden
   and fell to 17-20 the moment she was shown, with her own clip (#nova) also at 13-17 in that stage — the page, not the
   stream. Measured offline (headless Chrome, software compositing like the proof pod; /tmp bench b.html): her 720x1280 live
   picture over the PLAYING blurred room (#novaAmb, blur 28px x2.2) = 20.3 / 21.6 pictures a second; the same blurred room
   PAUSED = 24.9; no room = 24.9. While her live body is shown (stage wide) the room behind her is held as a still blurred
   picture — same look, nothing moves in a 28 px blur anyway. In the game it plays as before. */
/* NOVA-GO3 · flag `noblink` (default off). Coordinator on nova_fixed_8s.mp4: her half went DARK for 2 frames (luma 36 vs
   ~150) at the intro->game hand-over. A new src empties a <video> until its first frame is decoded, so her pane showed
   its bare background (#1b1030) — both her clip and the blurred room switch src at that moment (and at every clip change
   in the game, and at the ending). On: the last picture of each is drawn on a canvas on top, kept until the new clip has
   a decoded frame and it has been painted; the hand-over itself waits for that (see matchCut). Cap 2 s. */
function holdOn(v, c, fit){
  if (v.readyState < 2 || !v.videoWidth) return;
  const W = v.clientWidth, H = v.clientHeight; if (!W || !H) return;
  c.width = W; c.height = H; const g = c.getContext('2d'), ar = v.videoWidth / v.videoHeight;
  let w = W, h = W / ar; if (fit === 'contain' ? h > H : h < H){ h = H; w = H * ar; }
  try { g.clearRect(0, 0, W, H); g.drawImage(v, (W - w) / 2, (H - h) / 2, w, h); } catch (_){ return; }
  if (fit === 'contain'){ c.style.transformOrigin = v.style.transformOrigin; c.style.transform = v.style.transform; c.style.clipPath = v.style.clipPath; }
  const tok = c._tok = (c._tok || 0) + 1; c.style.display = 'block';
  const off = () => { if (c._tok === tok){ c.style.display = 'none'; } };
  v.addEventListener('loadeddata', () => requestAnimationFrame(() => requestAnimationFrame(off)), { once: true });
  setTimeout(off, 2000);
}
function holdOff(){ for (const id of ['novaHold', 'novaAmbHold']){ const c = $(id); c._tok = (c._tok || 0) + 1; c.style.display = 'none'; } }
/* wait until her clip and the blurred room both have a decoded picture of their CURRENT src, then two paints */
async function clipReady(cap = 1500){
  const t0 = performance.now();
  while (performance.now() - t0 < cap && !(novaV.readyState >= 2 && novaAmb.readyState >= 2 && !novaV.seeking)) await new Promise(r => setTimeout(r, 15));
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return Math.round(performance.now() - t0);
}
function ambFor(st){ if (!FLAG('ambstill')) return;
  if (st === 'wide'){ const hold = () => { novaAmb.pause(); }; if (novaAmb.readyState >= 2) hold(); else novaAmb.addEventListener('loadeddata', hold, { once: true }); }
  else novaAmb.play().catch(() => {}); }

const gate = st => { if (st) document.body.dataset.gate = st; else delete document.body.dataset.gate; log('gate', st || 'open'); };
/* Camera AND microphone are asked for FIRST, in one question; if that is refused each is asked alone so the red message
   can say which one. The streams are only the permission: the game opens its own (createSource, the bridge's mic). */
async function askPermissions(hear = false){
  const md = navigator.mediaDevices, out = { cam: false, mic: false, streams: [], err: {} };
  if (!md?.getUserMedia){ out.err.all = 'no mediaDevices'; return out; }
  /* flag `hear`: this stream's microphone is the one the game keeps, so it is asked for with the bridge's own settings */
  const audio = hear ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true } : true;
  try { out.streams.push(await md.getUserMedia({ video: { facingMode: 'user' }, audio })); out.cam = out.mic = true; return out; }
  catch (e){ out.err.both = e?.name || String(e); }
  try { out.streams.push(await md.getUserMedia({ video: { facingMode: 'user' } })); out.cam = true; } catch (e){ out.err.cam = e?.name || String(e); }
  try { out.streams.push(await md.getUserMedia({ audio })); out.mic = true; } catch (e){ out.err.mic = e?.name || String(e); }
  return out;
}
/* her greeting is really coming out: the first audible sample of her live voice (0.01 rms = the bridge's own "she is
   speaking" level, shared/nova-bridge.js routeHerAudio), looked at every 20 ms instead of the bridge's 100 ms so she
   appears WITH her first word. The face server sends her voice and her Ditto lips together (docs/NOVA-FINAL.md: "voice
   delayed by DITTO_PRIME with the Ditto frames"), so first voice = first lips. */
async function waitVoiceStart(capMs){
  const t0 = performance.now(); let buf = null;
  while (performance.now() - t0 < capMs){
    const an = window.__novaVoiceAnalyser;
    if (an){ if (!buf || buf.length !== an.fftSize) buf = new Float32Array(an.fftSize); an.getFloatTimeDomainData(buf);
      let q = 0; for (let i = 0; i < buf.length; i++) q += buf[i] * buf[i]; if (Math.sqrt(q / buf.length) > 0.01) return true; }
    if (herV.startedAt > t0) return true;
    await sleep(20);
  }
  return false;
}
/* [CLI-FILL] the "get ready" beat: he looks at himself for at least 1.5 s before anything else happens (no spec gives it;
   long enough to see the picture is him, short enough not to feel stuck). In practice the pose model's load is longer. QUESTION */
const READY_BEAT_MS = 1500;
/* [CLI-FILL] how long her greeting may take to become audible once it is asked for: measured 4.4 s on the pod
   (docs/NOVA-FINAL.md run #4: "asked 5.4 s, her voice 9.8"), her worst measured reply 7.0 s (docs/TALK-TEST.md, quoted in
   shared/face-panel.js) + Ditto's 1.4 s constant delay = 8.4 s -> 12 s. No spec gives it. QUESTION */
const GREET_WAIT_MS = 12000;
/* ── SHE ANSWERS IN THE INTRO (Refael 2026-11-22: his "Hi Nova, can you hear me?" was heard and got no answer).
   Why: the page started the game 1.2 s after her intro line, whatever the child was doing; his question was still being
   recognised when the music phase switched the brain's speak-gate on, and from then on the brain (correctly, by the phase
   law) stores a kid turn without answering. The laws stay as they are; the INTRO simply does not end while a child's turn
   is in flight: after her line the page listens, and if he speaks it waits for her answer (said WIDE, on the calm body,
   voice mode 'engine') before the game starts.
   [CLI-FILL] all four numbers, no spec gives them, QUESTION for the founder:
     LISTEN 3 s of quiet after her line / after her answer (on top of waitHerLine's 1.2 s) = time for a person to start talking
     TURN 6 s for a heard voice to become words (the brain's own transcription timeout is 8 s, pod/rt_lk.py rest_transcribe)
     ANSWER 12 s cap for her reply (= GREET_WAIT_MS) · at most 2 answered turns and 20 s in total, so the game always starts. */
const INTRO_LISTEN_MS = 3000, INTRO_TURN_MS = 6000, INTRO_ANSWER_MS = 12000, INTRO_MAX_TURNS = 2, INTRO_TALK_CAP_MS = 20000;
/* NOVA-GO4 flag `hear` — her "Ready?" really waits for him (the commercial intro: READY.md Part 1 "consent gate (real yes
   / tap) -> startGame()", 0471c0e "music waits for the kid's yes"). nova-go3 gave him 3 s and started whatever happened.
   With the flag: 6 s of quiet instead of 3, a real "yes / ready" ends the wait at once (after her answer), up to 3 answered
   turns / 30 s. Nobody speaks -> the game still starts (DUAL-INPUT law: "a kid NEVER fails here"). [CLI-FILL] 6 s / 3 / 30 s. */
async function introListen(sinceAsk){
  const HEARF = FLAG('hear'), LISTEN_MS = HEARF ? 6000 : INTRO_LISTEN_MS, MAX_TURNS = HEARF ? 3 : INTRO_MAX_TURNS, CAP_MS = HEARF ? 30000 : INTRO_TALK_CAP_MS;
  const t0 = performance.now(); let quietFrom = t0, handledAt = sinceAsk, answered = 0;
  log('intro-listen', 'open');
  while (true){
    const now = performance.now();
    if (kid.textAt > handledAt){ handledAt = kid.textAt; log('intro-kid', kid.text);
      const ok = await waitHerLine(INTRO_ANSWER_MS, kid.textAt); log('intro-answer', String(ok)); answered++; quietFrom = performance.now();
      if (HEARF && kid.consentAt >= handledAt - 100){ log('intro-listen', 'he said yes - the game starts'); break; }
      if (answered >= MAX_TURNS) break; continue; }
    if (kid.pending){ if (now - kid.hearingAt > INTRO_TURN_MS){ kid.pending = false; log('intro-listen', 'a heard voice gave no words'); } quietFrom = now; }
    else if (now - quietFrom > LISTEN_MS) break;
    if (now - t0 > CAP_MS){ log('intro-listen', 'cap'); break; }
    await sleep(100);
  }
  log('intro-listen', 'closed answered=' + answered);
}

/* ── NOVA-AUDIT (2026-11-22) · THE SHOULDER LIGHT — flag `shoulder`, default off.
   Refael on the v4 entry flow: "not the correct intro. The ORIGINAL intro is with the LIGHT ON HER SHOULDER." The intro he
   approved is origin/main nova-commercial.html INTRO-V2V (75396a4 / d29b13f PROMOTE v1.0.4) + SHOULDER-BEAT §4b (33f83fe):
   she greets, a golden light lands on the child's right shoulder, she says the exact light line, a REAL shrug pops the light
   and she celebrates; nobody lifts → one exact retry at 8 s, a silent release at 20 s (never a claimed win — TRUTH LAW,
   law-shoulder). Then she explains Freeze. All numbers and lines live in beta/lib/shoulder-beat.js with their sources.
   Phase machine: the whole beat is INTRO = voice 'engine' (her calm wide body, lips on); no judge, no music. */
const shoulderBeat = {
  on: false, beat: null, res: null, waiters: [],
  light(){ lights.sparkle('rShoulder'); lights.meter('rShoulder', 0); log('shoulder', 'light on (rShoulder)'); },
  /* the shrug check and its clock start only AFTER she has said the light line (main L4016: "light her shoulder AFTER she
     explains it"). Pod run exarcvmcwq6czb: armed at the light, a lifted arm "won" 1.1 s in, while she was still saying hello. */
  start(){ const cam = $('cam'); const aspect = cam.videoWidth ? cam.videoHeight / cam.videoWidth : 16 / 9;
    this.beat = createShoulderBeat({ aspect }); this.beat.start(performance.now()); this.on = true; this.res = null;
    lights.sparkle('rShoulder'); lights.meter('rShoulder', 0); log('shoulder', 'armed (rShoulder) aspect=' + aspect.toFixed(3));
    this.timer = setInterval(() => { const e = this.beat.tick(performance.now()); if (e === 'retry'){ log('shoulder', 'retry (8 s, no lift seen)'); introSay(SL.retry); } if (e === 'release') this.end('release'); }, 100); },
  feed(k){ const r = this.beat.feed(k, performance.now()); lights.meter('rShoulder', this.beat.progress()); if (r === 'win') this.end('win'); },
  end(res){ if (!this.on) return; this.on = false; clearInterval(this.timer); this.res = res; lights.meter(null); lights.sparkle(null);
    if (res === 'win'){ lights.flash('rShoulder'); lights.burst('rShoulder', 'gold'); introSay(SL.win); }   // a REAL detected lift, nothing else
    log('shoulder', res === 'win' ? 'WIN — a real lift was detected' : 'release — no lift seen in 20 s (nothing claimed)');
    this.waiters.splice(0).forEach(w => w(res)); },
  done(){ return this.res ? Promise.resolve(this.res) : new Promise(r => this.waiters.push(r)); },
};
window.freeze4Shoulder = shoulderBeat;
/* An intro line after her first one needs a speaking moment from the brain (pod/rt_lk.py PRODUCER-SILENT: a staged line
   waits for a boundary). Pod run exarcvmcwq6czb: "Yes! The light caught it!" and the Freeze explanation were queued "not a
   boundary" and came out later IN THE GAME. The page reports the section change the way it reports every intro/ending
   (speak-gate off = routeVoice('engine'), a phase-end boundary; with NOVA_INTRO_ANSWER it files the intro note, not "the
   game ended"), then stages the exact line. */
function introSay(text){ if (voiceMode !== 'engine') return novaSays(text); routeVoice('engine'); log('intro-boundary', text.slice(0, 40)); novaSays(text); }
/* the shoulder beat's opener: her greeting = her approved commercial first line (c43ea92: "Hi! I'm Nova, your magical AI dance
   teacher!") + the exact light line. [CLI-FILL] the Hebrew greeting words (the approved Hebrew greet was improvised live). */
const HE_N = lang === 'he' && FLAG('heneutral');                             // NOVA-GO2: Hebrew lines in the plural (no boy-only form)
const SL = HE_N ? { ...SHOULDER_LINES.he, ...HE_NEUTRAL } : SHOULDER_LINES[lang];
const HELLO = HE_N ? HE_NEUTRAL.hello : { en: "Hi! I'm Nova, your magical AI dance teacher!", he: 'היי! אני נובה, המורה הקסומה שלך לריקוד!' }[lang];

/* ── NOVA-AUDIT · FPS PROBE — flag `fpsprobe`, default off. Read-only. Once a second: how many NEW pictures of Nova were
   presented in the browser (requestVideoFrameCallback), for her live wide body (#novaWide) and her clip (#nova), plus the
   browser's own dropped-frame count. This is what the child really sees — the proof recording (x11grab) cannot tell a
   picture the browser never got from one the recorder missed. ── */
function startFpsProbe(){
  const cnt = { wide: 0, clip: 0 }, vids = { wide: $('novaWide'), clip: $('nova') };
  for (const [k, v] of Object.entries(vids)){ if (!v.requestVideoFrameCallback) continue;
    const cb = () => { cnt[k]++; v.requestVideoFrameCallback(cb); }; v.requestVideoFrameCallback(cb); }
  setInterval(() => { const q = vids.wide.getVideoPlaybackQuality?.();
    log('fps', JSON.stringify({ stage: $('novaPane').dataset.stage, wide: cnt.wide, clip: cnt.clip, wideDropped: q?.droppedVideoFrames ?? null, wideTotal: q?.totalVideoFrames ?? null, wideRes: vids.wide.videoWidth + 'x' + vids.wide.videoHeight }));
    cnt.wide = cnt.clip = 0; }, 1000);
  log('fps', 'probe on');
}
if (FLAG('fpsprobe')) startFpsProbe();

/* NOVA-GO4 flag `split`: her room, still and blurred, on the curtain (the same look as the margins around her). */
function curtainRoom(){
  const v = novaAmb, c = $('novaCurtainRoom'), W = c.clientWidth, H = c.clientHeight;
  if (v.readyState < 2 || !v.videoWidth || !W || !H) return false;
  c.width = W; c.height = H; const ar = v.videoWidth / v.videoHeight; let w = W, h = W / ar; if (h < H){ h = H; w = H * ar; }
  try { c.getContext('2d').drawImage(v, (W - w) / 2, (H - h) / 2, w, h); return true; } catch (_){ return false; }
}
/* NOVA-GO4 flag `hear`: the microphone chip + the watch on the microphone itself (shared/nova-bridge.js 'nova:mic') */
function micChip(){
  const m = $('mic'); let okUntil = 0, deadShown = null;
  addEventListener('nova:mic', e => { const d = e.detail, now = performance.now(); m.hidden = false; m.style.setProperty('--l', d.level.toFixed(2));
    const st = d.dead ? 'dead' : now < okUntil ? 'ok' : kidLive() ? 'hearing' : d.open ? 'open' : 'her';
    if (m.dataset.s !== st) m.dataset.s = st;
    if (d.dead !== deadShown){ deadShown = d.dead; m.querySelector('b').textContent = d.dead ? TXT.micDead : ''; log('mic', (d.dead ? 'NOT WORKING (' + d.dead + ') ' : 'working ') + JSON.stringify(micState())); } });
  addEventListener('nova:kid', () => { okUntil = performance.now() + 1500; });
  m.onclick = async () => { if (m.dataset.s !== 'dead') return; log('mic', 'restart asked'); log('mic', 'restart ' + await restartMic()); };
  setInterval(() => { if (!ended) log('mic', JSON.stringify(micState())); }, 5000);
}
async function begin(){
  $('startScr').classList.remove('on');
  /* NOVA-GO4 flag `hear`: still inside the tap - her voice's audio and the microphone's are unlocked by this gesture */
  const HEARF = FLAG('hear'); if (HEARF) log('audio-unlock', JSON.stringify(primeAudio()));

  /* 1 · PERMISSION FIRST — camera and microphone, before anything of Nova. A refusal is said in red, with which one and how
     to allow it, and nothing continues (no silent fallback: the old path went on with a black pane / a deaf Nova). */
  gate('perm'); caption(TXT.asking, 'wait'); log('permission', 'ask');
  if (FLAG('split')){ let n = 0; const draw = () => { if (!curtainRoom() && n++ < 40 && document.body.dataset.gate) setTimeout(draw, 150); }; requestAnimationFrame(draw); }   // the curtain is laid out now
  const perm = await askPermissions(HEARF);
  /* NOVA-GO4 flag `hear`: ONE microphone. The track the permission question returned IS the game's microphone (handed to
     the bridge); it is never stopped and no second capture is opened next to it. */
  const micTrack = HEARF ? perm.streams.flatMap(st => st.getAudioTracks()).find(t => t.readyState === 'live') : null;
  const micStream = micTrack ? new MediaStream([micTrack]) : null;
  const dropPerm = () => { perm.streams.forEach(st => st.getTracks().forEach(t => { if (t !== micTrack) t.stop(); })); perm.streams = []; };
  log('permission', JSON.stringify({ cam: perm.cam, mic: perm.mic, err: perm.err }));
  if (!perm.cam || !perm.mic){ dropPerm();
    return refuse(perm.err.all ? [TXT.noMedia] : [!perm.cam && TXT.noCam, !perm.mic && TXT.noMic].filter(Boolean), { help: TXT.allow, retry: true }); }
  /* 2 · HIS OWN PICTURE, large (the whole screen), with a short "get ready" — Nova is not connected yet.
     Nothing is judged: the game does not exist until the intro is over. (?replay= proof runs: the recorded child stands
     in for the camera picture; the permission question above is still the real one.) */
  gate('cam'); caption(TXT.getReady, 'gold'); const tCam = performance.now();
  src = await createSource($('cam'), (frame, t) => {
    if (ended) return; lastFrame = frame;
    const k = toJudge(frame); if (k) lights.feed(k);
    if (doc){ doc(frame); return; }                       // Camera Doctor first — the game isn't running yet
    if (shoulderBeat.on && k) shoulderBeat.feed(k);       // NOVA-AUDIT: the intro's shoulder light watches the real shoulders
    if (!game) return;                                    // intro: picture and lights only, no judge
    rec.frame(frame, t, src?.state); game.feed(frame, t); game.tick(t);
    if (game.state.phase === 'freeze') ring(Math.min(1, (t - freezeAt) / holdS));
  });
  src.start();
  if (src.state.cameraError){ dropPerm(); return refuse([TXT.camFail + src.state.cameraError], { help: TXT.allow, retry: true }); }
  const camV = $('cam'); let camOk = false;
  for (const t0 = performance.now(); performance.now() - t0 < 8000 && !(camOk = camV.videoWidth > 0 && camV.readyState >= 2); ) await sleep(100);   // [CLI-FILL] 8 s for the first real camera frame; no spec. QUESTION
  log('own-camera', JSON.stringify({ frame: camOk, w: camV.videoWidth, h: camV.videoHeight, source: src.state.kind, model: !!src.state.modelOk }));
  if (!camOk){ dropPerm(); return refuse([TXT.camFail + 'no picture'], { help: TXT.allow, retry: true }); }
  await sleep(Math.max(0, READY_BEAT_MS - (performance.now() - tCam)));
  const missingClips = await bodyClipsOk();
  if (missingClips.length){ dropPerm(); return refuse(missingClips.map(u => TXT.noBody + u)); }
  /* 3 · ONLY NOW Nova is connected — and she stays completely hidden (his own picture covers her half, ONE loading line)
     until ALL are true: her wide live picture has delivered a real frame · her voice bridge is connected · the first
     sound (= first lips) of her greeting is playing. Not ready in time = the red refusal, as before. */
  gate('nova'); caption(TXT.coming, 'wait');
  log('attach', 'start');
  if (HEARF) micChip();
  try { await attachNova({ intro: 'freeze4', echoGuard: true, onFace: s => face.attach(s), onWide: s => { dual = dual || !!s; wide.attach(s); },
                           ...(HEARF ? { micStream, micMeter: true } : {}) }); } catch (e) { log('attach-error', String(e?.message || e)); }
  if (HEARF){ pageLog('browser', navigator.userAgent + ' | ' + innerWidth + 'x' + innerHeight); LOG.filter(e => e.kind !== 'fps').forEach(e => pageLog(e.kind, e.detail)); log('mic', 'start ' + JSON.stringify(micState())); }
  dropPerm();                                             // the game's own camera + mic are open now; the permission streams go
  const deadline = performance.now() + FACE_WAIT_MS;
  /* NOVA-FINAL: a dual pod starts on the WIDE body (the SoulX face is not rendered until the game) — wait for whichever
     face this pod streams first; with no wide track it is the freeze4 pod (face only) exactly as before. */
  let faceOk = false;
  while (performance.now() < deadline){
    if (wide.state.live){ dual = true; faceOk = true; break; }
    if (face.state.live && !bridgeState().wide){ faceOk = true; break; }
    await sleep(200);
  }
  if (faceOk) log('nova-picture', JSON.stringify({ wide: dual, frames: dual ? wide.state.frames : face.state.frames, hidden: document.body.dataset.gate === 'nova' }));
  if (dual){ face.setActive(false); stage('wide'); } else { wide.setActive(false); $('novaPane').dataset.stage = 'game'; pip.show(true); ambFor('game'); }
  let st = bridgeState();
  while (!(st.ws && st.voice) && performance.now() < deadline){ await sleep(200); st = bridgeState(); }
  log('attach', JSON.stringify({ face: faceOk, dual, ...st }));
  const why = []; if (!faceOk) why.push(TXT.noFace); if (!st.ws || !st.voice) why.push(TXT.noVoice);
  if (why.length) return refuse(why);
  log('nova-voice', 'connected');

  if (dual && FLAG('warmgate')) await waitWarm('intro');                      // NOVA-GO2: she is revealed only on a smooth stream
  setVoice('engine'); face.setBase('listening');                              // INTRO = she talks, the child may answer
  const tAsk = performance.now();
  const withShoulder = !fast && FLAG('shoulder');
  if (!fast){                                                                 // she explains the game first (skipped with ?fast=1)
    if (withShoulder) novaSays(HELLO + ' ' + SL.arm); else mindReact('intro');   // NOVA-AUDIT: the approved intro opens on the light
    log('greeting', 'asked (Nova still hidden)' + (withShoulder ? ' — shoulder intro' : ''));
    if (!await waitVoiceStart(GREET_WAIT_MS)) return refuse([TXT.noGreet]);
    log('greeting', 'first sound after ' + Math.round(performance.now() - tAsk) + ' ms');
    if (!(dual ? wide.state.live : face.state.live)) return refuse([TXT.noFace]);
  }
  caption(''); gate(null);                                                    // THE GATE OPENS: she appears with her first word
  log('nova-shown', JSON.stringify({ wideLive: wide.state.live, wideFrames: wide.state.frames, voice: bridgeState().voice, speaking: !fast }));
  if (withShoulder){
    shoulderBeat.light();                                                     // the light lands on his shoulder as she appears
    if (dual) log('light-line-said', String(await waitHerLine(15000, tAsk)));
    shoulderBeat.start();                                                     // now he has heard what to do: the check starts
    const res = await shoulderBeat.done();
    if (dual) log('shoulder-said', String(await waitHerLine(20000, res === 'win' ? performance.now() - 50 : tAsk)));
    const tExplain = performance.now();
    { const r = mind.react('intro'); if (r) introSay(r.text); } log('explain', 'asked');                              // THEN she explains Freeze (the original arc: light → invite to the game)
    if (dual) log('intro-said', String(await waitHerLine(20000, tExplain))); else await sleep(3400);
    await introListen(tExplain);
  } else if (!fast){
    if (dual) log('intro-said', String(await waitHerLine(20000, tAsk))); else await sleep(3400);
    await introListen(tAsk);                                                  // a question said to her now gets its answer before the game
  }
  game = createFreezeGame({ tune, pace, on: onEvent });
  hud = createHud(game.pace.rounds);
  if (!src.state.modelOk) caption(src.state.cameraError ? L.noCamera : L.cantSee, 'wait');
  if (Q.get('checked') !== '1' && Q.get('doctor') !== '0') await runDoctor({ lights, lang, onFrameHook: h => doc = h });
  face.setBase('watching');
  game.start(performance.now() / 1000);
  setInterval(() => { if (!ended) game.tick(performance.now() / 1000); }, 100);     // the game always ends, frames or not
}
$('go').textContent = '▶ ' + L.start; $('go').onclick = begin;
if (Q.get('autostart') === '1') begin();
</script>
