<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova · Wave</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
:root{--amber:#f2c66d;--amber-hot:#ffe0a3;--hoodie:#7c5cbf;--ice:#aee8ff;--ink:#f3eefb}
html,body{margin:0;height:100%;background:radial-gradient(130% 130% at 50% 12%,#241046 0%,#140a2c 55%,#080513 100%);font-family:Nunito,system-ui;color:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0}
/* the KID is the hero: their camera fills the whole stage */
#camWrap{position:absolute;inset:0;overflow:hidden}
#usercam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
/* a soft dark vignette so the gold comet + ice glow read against a bright room */
#camWrap::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(8,5,19,.55) 100%)}
/* NOVA = a small rounded coach panel (bigger while she talks in intro/ending) */
#novaWrap{position:absolute;right:16px;bottom:16px;width:min(26vw,220px);aspect-ratio:3/4;border-radius:20px;overflow:hidden;z-index:9;background:#0c0720;box-shadow:0 10px 34px rgba(0,0,0,.55);border:2px solid rgba(242,198,109,.5);transition:width .45s ease,opacity .3s}
#stage[data-phase=intro] #novaWrap,#stage[data-phase=ending] #novaWrap{width:min(46vw,380px)}
#stage[data-phase=game] #novaWrap,#stage[data-phase=hold] #novaWrap{opacity:0;pointer-events:none}   /* no wave bake → hide her mid-game, no black box */
#novaMain{position:absolute;left:50%;top:0;height:100%;width:auto;transform:translateX(-50%);z-index:2}
#novaAmbient{display:none}
/* handywave.mp4 is ONLY the hidden audio + timeline clock now (never shown). */
#clock{display:none!important}
/* the visible "copy me" reference = an ACTUAL arm-wave (maya leftwave), a small thumbnail during play */
#ref{position:absolute;left:16px;bottom:16px;width:min(24vw,160px);aspect-ratio:9/16;object-fit:cover;border-radius:16px;z-index:9;display:none;box-shadow:0 10px 30px rgba(0,0,0,.55);border:2px solid rgba(174,232,255,.6);background:#0c0720}
#stage[data-phase=game] #ref,#stage[data-phase=hold] #ref{display:block}
#refTag{position:absolute;left:16px;bottom:calc(16px + min(24vw,160px)*16/9 + 6px);z-index:9;color:var(--ice);font-weight:800;font-size:12px;background:rgba(8,5,19,.6);padding:3px 9px;border-radius:8px;display:none}
#stage[data-phase=game] #refTag,#stage[data-phase=hold] #refTag{display:block}
/* PRESENCE GATE — shown after the camera opens, until arms are in frame */
#presence{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(8,5,19,.62);backdrop-filter:blur(3px)}
#presence .pring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ice) calc(var(--p,0)*360deg),rgba(255,255,255,.14) 0);-webkit-mask:radial-gradient(circle,transparent 56px,#000 57px);mask:radial-gradient(circle,transparent 56px,#000 57px);transition:background .2s}
#presence.ok .pring{background:conic-gradient(#7CFFB2 calc(var(--p,0)*360deg),rgba(124,255,178,.18) 0)}
#presence .ptxt{font-family:'Baloo 2';font-weight:800;font-size:clamp(22px,4.4vw,34px);text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.6);max-width:80vw}
#presence .psub{font-weight:700;font-size:15px;color:#c7bde6}
#presence.ok .ptxt::after{content:" ✅"}
#badge{position:absolute;left:14px;top:14px;z-index:8;background:rgba(12,7,32,.6);color:#fff;padding:5px 14px;border-radius:999px;font-weight:800;font-size:13px}
#hud{position:fixed;top:2vh;left:0;right:0;display:flex;gap:16px;justify-content:center;align-items:center;z-index:50}
#score{font-family:'Baloo 2';font-size:44px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#flow{display:flex;gap:6px}#flow i{width:26px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}#flow i.on{background:var(--amber);box-shadow:0 0 10px var(--amber)}
#phaseTag{background:var(--hoodie);color:#fff;border-radius:999px;padding:5px 16px;font-weight:800}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,19,.66);z-index:90}
#gate button{font:800 26px 'Baloo 2';padding:18px 44px;border:0;border-radius:18px;background:var(--amber);color:#2a2140;box-shadow:0 10px 30px rgba(242,198,109,.4)}
#pause,#exit{position:fixed;top:2vh;z-index:60;background:rgba(12,7,32,.55);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-size:16px}#pause{right:64px}#exit{right:14px}
.hidden{display:none!important}
</style></head><body>
<div id="stage" data-phase="intro">
  <div id="novaWrap"><video id="novaAmbient" autoplay muted playsinline></video><video id="novaMain" autoplay muted playsinline></video><video id="clock" playsinline preload="auto" src="/media/handywave.mp4"></video><div id="badge">Watching</div></div>
  <div id="camWrap"><video id="usercam" autoplay muted playsinline></video><canvas id="fx"></canvas></div>
  <video id="ref" muted loop playsinline autoplay preload="auto" src="/gallery/preview_maya_leftwave.mp4"></video>
  <div id="refTag">👋 copy this ↓</div>
  <div id="hud"><div id="phaseTag">WAVE</div><div id="score">0</div><div id="flow"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <button id="pause">⏸</button><button id="exit">✕</button>
  <div id="presence" class="hidden"><div class="pring" style="--p:0"></div><div class="ptxt">Step back — I need to see your arms 🙆</div><div class="psub"></div></div>
  <div id="gate"><button id="start">▶ Let's wave</button></div>
</div>
<script type="module">
import { MoverEngine } from '/shared/mover-engine.js';
import { WaveRule, RULES } from '/shared/mover-rules.js';
import { LightEngine } from '/shared/light-engine.js';
import { startPose } from '/shared/pose-engine.js';            // b0.10: emits toNova() frames (MediaPipe → MoveNet fallback)
import { attachNova, setBody, routeVoice, note, onHerAudio } from '/shared/nova-bridge.js';   // the page↔pod bridge (b0.13)
import { pulseSend } from '/shared/pulse.js';

const MIRROR = true, TIER = 'adult';
const HE = /[?&]lang=he/.test(location.search);
const BODY = { talk:'nova_idle2', game:'nova_wave_a' };
const clock = document.getElementById('clock'), stage = document.getElementById('stage');
const E = new MoverEngine(), L = new LightEngine(document.getElementById('fx'), { tier:TIER, mirror:MIRROR });
L.fit = () => { L.cv.width = innerWidth; L.cv.height = innerHeight; };   // full-window buffer, 1:1 with the stage
L.fit(); addEventListener('resize', () => L.fit());
const waveR = new WaveRule(E,'R'), waveL = new WaveRule(E,'L');

// WAVE GUIDE (b0.15 fix): a wave cue must LOOK like a wave — a light traveling down the arm
// chain, not a static circle. Repeat the comet along the arm while the cue is active so the
// kid sees the motion to mirror. (The ring/orb is right for freeze/hold, wrong for a wave.)
const CHAIN = { R:['rShoulder','rElbow','rWrist','rIndex'], L:['lShoulder','lElbow','lWrist','lIndex'] };
// b0.18 (WAVE-COMET-ACCURATE): the wave light is the PHASE-DRIVEN comet. cometLive (started at game
// start) rides whichever arm actually waves; the cue just previews the path once with a slow sweep.
function startGuide(arm){ L.cometCue(CHAIN[arm==='L'?'L':'R']); }
function stopGuide(){ /* the comet self-expires; nothing to tear down */ }

// ── CUES (the WAVE-FULL timeline) ──
const CUES = [
  { t:5.0,  arm:'R' }, { t:8.0,  arm:'R' }, { t:11.0, arm:'R' },
  { t:14.0, arm:'L' }, { t:17.0, arm:'L' }, { t:20.0, arm:'L' },
  { t:23.0, arm:'ANY' }, { t:25.0, arm:'ANY' },
  { t:26.0, hold:1.5 },
];
// lines: EN default; HE via ?lang=he (founder-approved strings, WAVE-FULL note c)
const LINES_EN = [ [0.5,'Right arm — let it travel: fingers, wrist, elbow.'], [13.0,'Now the left — pass it across.'], [22.0,'Both arms — keep it flowing.'], [26.0,'Hold the wave... freeze it.'] ];
const LINES_HE = [ [0.5,'יד ימין — תני לה לזרום: אצבעות, שורש כף היד, מרפק.'], [13.0,'עכשיו שמאל — תעבירי את זה.'], [22.0,'שתי הידיים — שמרי על הזרימה.'], [26.0,'החזיקי את הגל... תקפאי.'] ];
const LINES = HE ? LINES_HE : LINES_EN;
const INTRO_LINE = HE ? 'גל — ידיים כמו מים. מוכנה?' : 'Wave — arms like water. Ready?';
const WIN_BEFORE = 0.3, WIN_AFTER = 1.4, LEAD = 1.0;

let phase='intro', score=0, streak=0, stats={R:[],L:[]}, ci=0, li=0, holdWin=null, done=false;
function setPhase(p){ phase=p; stage.dataset.phase=p; document.getElementById('badge').textContent = p==='intro'||p==='ending' ? 'Talking' : p==='hold' ? 'FREEZE!' : 'Watching';
  if (p==='intro'||p==='ending'){ routeVoice('engine'); setBody(BODY.talk); }
  if (p==='game'){ routeVoice('air'); setBody(BODY.game); }
  if (p==='hold'){ routeVoice('mute'); } }

// ── INTRO (engine path, lips): conversation → consent → start ──
document.getElementById('start').onclick = async () => {
  document.getElementById('gate').classList.add('hidden');
  // CAMERA: acquire the kid's camera and feed the <video> that startPose reads (pose-engine
  // only reads frames — it never opens the camera itself). Without this the panel is black.
  try {
    const cam = document.getElementById('usercam');
    cam.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ width:960, height:720 }, audio:false });
    await cam.play().catch(()=>{});
  } catch (e) { document.getElementById('badge').textContent = 'camera blocked: ' + (e && e.name || 'error'); }
  // the avatar/voice come from the pod; if it isn't up (e.g. a headless lights test) don't block the
  // game — the camera + pose + comet + clock still run, only the Nova panel stays blank.
  try { await attachNova({ intro:'wave', onVideo: v => { document.getElementById('novaMain').srcObject = v; document.getElementById('novaAmbient').srcObject = v; } }); }
  catch (e) { document.getElementById('badge').textContent = 'no pod: lights-only'; }
  E.startCal();                                                                          // calibrate while they get in frame
  awaitingPresence = true; document.getElementById('presence').classList.remove('hidden');   // PRESENCE GATE first
};
// once arms are in frame ≥1s, run the normal intro → consent/safety → game
let _introStarted = false;
function proceedToIntro(){
  if (_introStarted) return; _introStarted = true;
  document.getElementById('presence').classList.add('hidden');
  setPhase('intro');
  note('intro-adult: greet + name; then say exactly "'+INTRO_LINE+'" and wait for a real yes.');
  setTimeout(()=>{ if(phase==='intro') startGame(); }, (parseInt(new URLSearchParams(location.search).get('auto'),10)||12)*1000);
}
// ── PRESENCE detector: shoulders + elbows + wrists all visible ──
let awaitingPresence = false, _presT0 = 0;
function updatePresence(k){
  const need = ['lShoulder','rShoulder','lElbow','rElbow','lWrist','rWrist'];
  const seen = need.filter(n => k[n] && (k[n].vis ?? k[n].score ?? 0) > 0.4).length;
  const el = document.getElementById('presence'), now = performance.now();
  if (seen >= 6) {
    if (!_presT0) _presT0 = now; const held = now - _presT0;
    el.classList.add('ok'); el.querySelector('.pring').style.setProperty('--p', Math.min(1, held/1000));
    el.querySelector('.ptxt').textContent = 'Perfect — hold it'; el.querySelector('.psub').textContent = '';
    if (held >= 1000) { awaitingPresence = false; proceedToIntro(); }
  } else {
    _presT0 = 0; el.classList.remove('ok'); el.querySelector('.pring').style.setProperty('--p', 0);
    el.querySelector('.ptxt').textContent = 'Step back — I need to see your arms 🙆';
    el.querySelector('.psub').textContent = 'I can see ' + seen + '/6 (shoulders · elbows · wrists)';
  }
}
onHerAudio({ playing: ()=>{ if(phase==='game') duck(true); }, ended: ()=>duck(false) });
// consent arrives from the bridge as a validated turn:
window.addEventListener('nova:consent', startGame, { once:true });
function startGame(){ if(phase!=='intro') return;   // idempotent: consent OR the 12s safety, whichever first
  E.finishCal(); setPhase('game');
  L.cometLive(waveR, CHAIN.R); L.cometLive(waveL, CHAIN.L);   // b0.18: the comet now rides the real detected wave
  clock.currentTime=0; clock.play(); requestAnimationFrame(tick); }

// ── POSE ──
// ALIGN THE LIGHTS: the webcam is object-fit:cover (cropped) + CSS-mirrored, but pose joints are in
// raw video space. Remap them through the SAME cover transform so the comet lands on the real arm.
const _cam = document.getElementById('usercam');
function coverRemap(out){
  const vw = _cam.videoWidth || 640, vh = _cam.videoHeight || 480, cw = innerWidth, ch = innerHeight;
  const s = Math.max(cw / vw, ch / vh), dw = vw * s, dh = vh * s, ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  const o = {};
  for (const [n, j] of Object.entries(out)) {
    if (!j || typeof j.x !== 'number') continue;
    const nx = j.x > 2 ? j.x / vw : j.x, ny = j.y > 2 ? j.y / vh : j.y;   // movenet=px, mediapipe=0..1
    o[n] = { x: (ox + nx * dw) / cw, y: (oy + ny * dh) / ch, dir: j.dir };
  }
  return o;
}
startPose(document.getElementById('usercam'), k => {
  const out = E.update(k); L.setJoints(coverRemap(out));
  if (awaitingPresence) { updatePresence(k); return; }   // gate the game until arms are in frame
  // feed BOTH wave rules EVERY frame — they build the peak history that phase() (the comet) reads,
  // and a detected wave adds the fingertip overshoot on the arm that actually waved.
  const rR = waveR.check(), rL = waveL.check();
  if (rR?.hit) L.cometHit(rR.quality, waveR);
  if (rL?.hit) L.cometHit(rL.quality, waveL);
  if (phase!=='game' && phase!=='hold') return;
  const t = clock.currentTime, c = CUES[ci];
  if (phase==='hold' && holdWin){ const f = RULES.freeze(E, 0.12); holdWin.samples++; if(!f.still){ if(!holdWin.broke) L.freezeBreak(); holdWin.broke = holdWin.broke || (performance.now()-holdWin.t0); } return; }
  if (!c || c.hold) return;
  const r = c.arm==='R' ? rR : c.arm==='L' ? rL : (rR || rL);
  if (r?.hit && t >= c.t - WIN_BEFORE && t <= c.t + WIN_AFTER){
    const arm = r===waveR.lastResult ? 'R' : 'L';
    const base = r.quality==='smooth'?160 : r.quality==='good'?140 : 120;
    const pts = base + (r.iso ? 20 : 0);
    streak = r.quality==='smooth' ? streak+1 : 0; const mult = streak>=3 ? 2 : 1;
    score += pts*mult; stats[arm].push(r.quality); ci++;
    L.hit(arm==='R'?'rWrist':'lWrist', r.iso?'iso':'good', pts*mult); if(mult>1) flyText('×2');   // the comet overshoot already fired via cometHit
    document.getElementById('score').textContent = score; flowBar(ci);
    note(`fact: wave ${arm} ${r.quality}${r.iso?' isolated':''} streak ${streak}`);   // facts only — adult tier says nothing mid-run
  }
});

// ── CLOCK: cues, lights, lines, hold, end ──
function tick(){
  const t = clock.currentTime, c = CUES[ci];
  if (li < LINES.length && t >= LINES[li][0]){ note(`say exactly: "${LINES[li][1]}"`); li++; }
  if (c && !c.hold && !c.lit && t >= c.t - LEAD){ c.lit = true; startGuide(c.arm); }   // wave guide = comet flowing down the arm
  if (c && !c.hold && t > c.t + WIN_AFTER){ stopGuide(); ci++; }   // missed: comet stops, no punishment
  if (c && c.hold && phase==='game' && t >= c.t){ setPhase('hold'); stopGuide(); holdWin={t0:performance.now(),broke:0,samples:0}; L.cometStop(); L.freezeStart(c.hold*1000); }   // b0.18: hold = the ice glow (no ring/orb)
  if (phase==='hold' && holdWin && performance.now()-holdWin.t0 >= c.hold*1000){ const held = !holdWin.broke && holdWin.samples>5; L.freezeEnd(held); if(held){ score+=50; L.hit('shoulderC','iso',50); flyText('FROZEN!'); }
    holdWin=null; ci++; setPhase('game'); L.cometLive(waveR,CHAIN.R); L.cometLive(waveL,CHAIN.L); note(`fact: hold ${held?'held':'broke'}`); }
  if (!done && t >= 28.0){ done=true; clock.pause(); ending(); return; }
  if (!done) requestAnimationFrame(tick);
}
function ending(){ setPhase('ending'); const q = a => ({ smooth:a.filter(x=>x==='smooth').length, good:a.filter(x=>x==='good').length, rough:a.filter(x=>x==='rough').length });
  note(`ending-adult: score=${score} right=${JSON.stringify(q(stats.R))} left=${JSON.stringify(q(stats.L))} streakMax=${streak}. Say: ONE quality note (external focus, e.g. "smoother on the left — lead with the wrist"), then the real score, then goodbye with the name.`);
  pulseSend({ game:'wave', score, stats }); }
function flowBar(n){ document.querySelectorAll('#flow i').forEach((el,i)=>el.classList.toggle('on', i<n)); }
function flyText(s){ const p = L.P('shoulderC'); if(p) L.flyUp(p, s); }
function duck(on){ clock.volume = on ? 0.35 : 0.6; }
document.getElementById('pause').onclick = ()=>{ clock.paused ? clock.play() : clock.pause(); };
document.getElementById('exit').onclick = ()=>location.href='/';
clock.volume = 0.6;
</script></body></html>
