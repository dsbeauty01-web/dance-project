<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nova — Glow Style Tester (LIVE camera)</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,Segoe UI,sans-serif; color:#fff; }
  #stage{ position:fixed; inset:0; }
  #cam{ display:none; }
  #fx{ position:absolute; inset:0; width:100%; height:100%; }
  #status{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(0,0,0,.55); padding:6px 14px; border-radius:14px; font-size:13px; backdrop-filter:blur(6px); }
  /* control bars */
  .bar{ position:absolute; left:0; right:0; z-index:20; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:8px; }
  #parts{ bottom:64px; } #styles{ bottom:8px; }
  .bar button{ border:1px solid rgba(255,255,255,.25); background:rgba(20,0,40,.6); color:#fff;
    padding:9px 14px; border-radius:20px; font-size:14px; font-weight:600; backdrop-filter:blur(6px); cursor:pointer; }
  .bar button.on{ background:linear-gradient(90deg,#ffd84d,#ff8ae2); color:#3a0a00; border-color:transparent; }
  #styles button.on{ background:linear-gradient(90deg,#6ee7ff,#a78bfa); }
  #hint{ position:absolute; bottom:120px; left:50%; transform:translateX(-50%); z-index:19; font-size:12px; color:#cdb6e8; opacity:.85; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
</div>
<div id="status">starting camera…</div>
<div id="hint">move around — the glow follows the chosen body part</div>
<div class="bar" id="parts"></div>
<div class="bar" id="styles"></div>

<script>
const $=id=>document.getElementById(id);
const cam=$('cam'), fx=$('fx'), ctx=fx.getContext('2d');
const oc=document.createElement('canvas'), octx=oc.getContext('2d');   // offscreen for image-bloom
let detector=null, W=0, H=0;
let PART='head', STYLE='bloom', DIR=-1;   // DIR -1 left / +1 right

const PARTS=['head','shoulders','arm','hips'];
const STYLES=[['bloom','Bloom'],['image','Skin-Glow'],['halo','Halo+Core'],['liquid','Liquid Aura']];
function mkBar(el,items,cur,set){ el.innerHTML=''; items.forEach(it=>{ const [v,label]=Array.isArray(it)?it:[it,it[0].toUpperCase()+it.slice(1)];
  const b=document.createElement('button'); b.textContent=label; if(v===cur) b.classList.add('on');
  b.onclick=()=>{ set(v); [...el.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); }; el.appendChild(b); }); }
mkBar($('parts'),PARTS,PART,v=>PART=v);
mkBar($('styles'),STYLES,STYLE,v=>STYLE=v);

async function start(){
  try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720},audio:false});
    cam.srcObject=s; await cam.play(); }catch(e){ $('status').textContent='camera blocked: '+e.message; return; }
  $('status').textContent='loading tracker…';
  await tf.setBackend('webgl'); await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
  $('status').textContent='✨ move! pick a part + a style below';
  resize(); requestAnimationFrame(loop);
}
function resize(){ W=fx.width=innerWidth; H=fx.height=innerHeight; }
addEventListener('resize',resize);

function cover(){ const vw=cam.videoWidth||1280, vh=cam.videoHeight||720; const s=Math.max(W/vw,H/vh);
  return { s, ox:(W-vw*s)/2, oy:(H-vh*s)/2, vw, vh }; }
// keypoint(raw, flip:false) -> screen, mirrored to match the selfie-flipped draw
function mapX(kx,c){ return W-(c.ox+kx*c.s); }
function mapY(ky,c){ return c.oy+ky*c.s; }

function drawVideoMirrored(c){ ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage(cam, c.ox, c.oy, c.vw*c.s, c.vh*c.s); ctx.restore(); }

let t0=performance.now();
async function loop(){
  requestAnimationFrame(loop);
  if(!detector||cam.readyState<2){ return; }
  const c=cover();
  drawVideoMirrored(c);
  let kps=null;
  try{ const ps=await detector.estimatePoses(cam,{flipHorizontal:false}); if(ps[0]) kps=ps[0].keypoints; }catch(e){}
  if(!kps) return;
  const m={}; kps.forEach(k=>m[k.name]=k);
  const geo=partGeo(PART,m,c); if(!geo) return;
  const col = DIR<0?'120,180,255' : DIR>0?'255,120,225' : '255,210,90';
  const pulse=0.5+0.5*Math.sin((performance.now()-t0)/520);
  renderGlow(STYLE,geo,col,pulse,c);
  drawArrow(geo,col,pulse);
}

// geometry of each body part in SCREEN space
function partGeo(part,m,c){
  const P=(n)=>{ const k=m[n]; return (k&&k.score>0.2)?{x:mapX(k.x,c),y:mapY(k.y,c)}:null; };
  const nose=P('nose'), ls=P('left_shoulder'), rs=P('right_shoulder'), lh=P('left_hip'), rh=P('right_hip');
  const le=P('left_ear'), re=P('right_ear'), rw=P('right_wrist'), rel=P('right_elbow'), lw=P('left_wrist'), lel=P('left_elbow');
  const shW = (ls&&rs)?Math.hypot(ls.x-rs.x,ls.y-rs.y):160;
  if(part==='head'){ if(!nose) return null; const r=(le&&re)?Math.hypot(le.x-re.x,le.y-re.y)*0.62:shW*0.42||70;
    return {kind:'blob', cx:nose.x, cy:nose.y, rx:Math.max(46,r), ry:Math.max(60,r*1.25)}; }
  if(part==='shoulders'){ if(!ls||!rs) return null; return {kind:'bar', ax:ls.x,ay:ls.y, bx:rs.x,by:rs.y, thick:shW*0.42}; }
  if(part==='hips'){ if(!lh||!rh) return null; return {kind:'bar', ax:lh.x,ay:lh.y, bx:rh.x,by:rh.y, thick:shW*0.42}; }
  if(part==='arm'){ const a=rel||lel, b=rw||lw, sh=rs||ls; const p1=sh,p2=a,p3=b; const pts=[p1,p2,p3].filter(Boolean);
    if(pts.length<2) return null; return {kind:'limb', pts, thick:shW*0.30}; }
  return null;
}

function withCol(s,col,a){ return 'rgba('+col+','+a+')'; }

function renderGlow(style,g,col,pulse,c){
  if(style==='image'){ return imageGlow(g,col,pulse,c); }
  // vector styles work on a center+size or a thick segment
  const segs = g.kind==='blob' ? [[g.cx,g.cy,g.rx,g.ry]] :
               g.kind==='bar'  ? barSamples(g) :
               g.kind==='limb' ? limbSamples(g) : [];
  if(style==='bloom') segs.forEach(([x,y,rx,ry])=>bloom(x,y,rx,ry,col,pulse));
  if(style==='halo')  segs.forEach(([x,y,rx,ry])=>halo(x,y,rx,ry,col,pulse));
  if(style==='liquid')segs.forEach(([x,y,rx,ry])=>liquid(x,y,rx,ry,col,pulse));
}
function barSamples(g){ const n=5,out=[]; for(let i=0;i<=n;i++){ const t=i/n; out.push([g.ax+(g.bx-g.ax)*t, g.ay+(g.by-g.ay)*t, g.thick*0.6, g.thick*0.6]); } return out; }
function limbSamples(g){ const out=[]; for(let s=0;s<g.pts.length-1;s++){ const a=g.pts[s],b=g.pts[s+1]; for(let i=0;i<=4;i++){ const t=i/4; out.push([a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,g.thick*0.6,g.thick*0.6]); } } return out; }

function bloom(cx,cy,rx,ry,col,pulse){ ctx.save(); ctx.globalCompositeOperation='screen';
  const k=1+0.12*pulse; const layers=[[1.7,.16],[1.25,.26],[0.85,.40],[0.5,.55]];
  for(const [f,a] of layers){ const r=Math.max(rx,ry)*f*k; const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba('+col+','+a+')'); g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,r*(rx/Math.max(rx,ry)),r*(ry/Math.max(rx,ry)),0,0,7); ctx.fill(); }
  ctx.restore(); }
function halo(cx,cy,rx,ry,col,pulse){ ctx.save();
  ctx.shadowBlur=24; ctx.shadowColor='rgba('+col+',.95)';
  ctx.lineWidth=6+3*pulse; ctx.strokeStyle='rgba('+col+',.95)'; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.stroke();
  ctx.globalCompositeOperation='lighter'; const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry)*1.1);
  g.addColorStop(0,'rgba('+col+',.22)'); g.addColorStop(1,'rgba('+col+',0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,rx*1.2,ry*1.2,0,0,7); ctx.fill();
  ctx.restore(); }
function liquid(cx,cy,rx,ry,col,pulse){ ctx.save(); ctx.globalCompositeOperation='lighter';
  const T=performance.now()/600; for(let i=0;i<3;i++){ const a=T+i*2.1; const ox=Math.cos(a)*rx*0.12, oy=Math.sin(a*1.3)*ry*0.12;
    const r=Math.max(rx,ry)*(0.8+0.12*Math.sin(a)); const g=ctx.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,r);
    g.addColorStop(0,'rgba('+col+',.18)'); g.addColorStop(1,'rgba('+col+',0)'); ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(cx+ox,cy+oy,r*(rx/Math.max(rx,ry)),r*(ry/Math.max(rx,ry)),0,0,7); ctx.fill(); }
  ctx.restore(); }

// IMAGE GLOW — the body part's OWN pixels, masked + blurred + tinted + added back as light
function imageGlow(g,col,pulse,c){
  oc.width=W; oc.height=H; octx.clearRect(0,0,W,H);
  // 1) mirrored video
  octx.save(); octx.translate(W,0); octx.scale(-1,1); octx.drawImage(cam,c.ox,c.oy,c.vw*c.s,c.vh*c.s); octx.restore();
  // 2) keep only the part region (soft mask)
  octx.globalCompositeOperation='destination-in';
  const mask=(x,y,rx,ry)=>{ const r=Math.max(rx,ry)*(1.05+0.1*pulse); const rg=octx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(.65,'rgba(0,0,0,.85)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    octx.fillStyle=rg; octx.beginPath(); octx.ellipse(x,y,r*(rx/Math.max(rx,ry)),r*(ry/Math.max(rx,ry)),0,0,7); octx.fill(); };
  if(g.kind==='blob') mask(g.cx,g.cy,g.rx,g.ry); else (g.kind==='bar'?barSamples(g):limbSamples(g)).forEach(([x,y,rx,ry])=>mask(x,y,rx,ry));
  // 3) tint it the cue colour
  octx.globalCompositeOperation='source-atop'; octx.fillStyle='rgba('+col+',.55)'; octx.fillRect(0,0,W,H);
  octx.globalCompositeOperation='source-over';
  // 4) add it back as glowing light — 'screen' so it can't blow out, soft blur, gentle core
  ctx.save();
  ctx.globalCompositeOperation='screen'; ctx.filter='blur(14px)'; ctx.globalAlpha=0.9; ctx.drawImage(oc,0,0);
  ctx.filter='blur(5px)'; ctx.globalAlpha=0.55; ctx.drawImage(oc,0,0);
  ctx.filter='none'; ctx.globalAlpha=1; ctx.restore();
}

function drawArrow(g,col,pulse){ let cx,cy,glyph,off=46;
  if(g.kind==='blob'){ cx=g.cx; cy=g.cy; glyph=DIR<0?'←':DIR>0?'→':'↔'; cx+=DIR*(g.rx+34); }
  else if(g.kind==='bar'){ cx=(g.ax+g.bx)/2; cy=(g.ay+g.by)/2 - g.thick*0.9; glyph='↑'; }
  else { const p=g.pts[g.pts.length-1]; cx=p.x; cy=p.y-off; glyph='↑'; }
  ctx.save(); ctx.translate(0, Math.sin(performance.now()/300)*3);
  ctx.font='900 34px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(glyph,cx,cy);
  ctx.shadowBlur=12; ctx.shadowColor='rgba('+col+',.9)'; ctx.fillStyle='rgba('+col+',.98)'; ctx.fillText(glyph,cx,cy);
  ctx.restore(); }

// tap left/right half flips the arrow direction (for head/hips)
addEventListener('click',e=>{ if(e.target.tagName==='BUTTON') return; DIR = (e.clientX < innerWidth/2)? -1 : 1; });
start();
</script>
</body>
</html>
