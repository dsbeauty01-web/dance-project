<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nova Light</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #06070b; overflow: hidden;
    font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #e7ecf5; }
  #stage { position: fixed; inset: 0; background: #06070b; }
  /* video + canvas both stretch to the same box and are mirrored → glow drawn at
     MoveNet's raw coords lands exactly on the limb in the selfie view. */
  #cam, #fx { position: absolute; inset: 0; width: 100%; height: 100%;
    transform: scaleX(-1); }
  #cam { object-fit: fill; background: #06070b; }
  #fx { background: transparent; pointer-events: none; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 4; font-size: 15px; color: #aeb9cd; text-align: center; padding: 0 20px; }
  /* live tuning panel — not mirrored (lives outside #stage's transform context) */
  #panel { position: fixed; top: 10px; right: 10px; z-index: 10; width: 232px;
    background: #0d1320e6; border: 1px solid #243049; border-radius: 12px;
    padding: 10px 12px; font-size: 12px; backdrop-filter: blur(6px); }
  #panel h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .5px; color: #9fd0ff;
    display: flex; justify-content: space-between; cursor: pointer; }
  #panel.collapsed .body { display: none; }
  .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { flex: 0 0 96px; color: #aeb9cd; }
  .row input[type=range] { flex: 1; }
  .row .val { flex: 0 0 34px; text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
  .row.toggle label { flex: 1; }
  #dbgLabel { position: fixed; left: 10px; top: 10px; z-index: 10; font-size: 12px;
    color: #ffd27a; background: #0d1320c0; padding: 3px 9px; border-radius: 999px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="msg">tap to start — allow the camera ✨</div>
</div>
<div id="dbgLabel">active: –</div>
<div id="panel">
  <h3 id="panelHead">NOVA LIGHT <span id="caret">▾</span></h3>
  <div class="body" id="panelBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
"use strict";

// ════════════════ TOP CONSTANTS (all tunable via the panel) ════════════════
const CONFIG = {
  CONFIDENCE_GATE: 0.5,        // skip MoveNet keypoints below this score
  SMOOTH_FRAMES: 3,            // moving-average window per keypoint
  VELOCITY_THRESHOLD: 6,       // px/frame min to count as "moving" (× body unit k)

  GLOW_RADIUS: 36,             // px head-orb radius (scales with body unit)
  TRAIL_LENGTH: 14,            // comet length in past positions
  GLOW_COLOR_CORE:  '#FFFDF5', // hot center
  GLOW_COLOR_BODY:  '#FFD27A', // warm gold mid
  GLOW_COLOR_BLOOM: '#FFA63D', // amber outer halo

  TRAIL_FADE_ALPHA: 0.22,      // per-frame fade (0.10 long ghost, 0.30 snappy)
  TRAIL_TAPER: true,

  SPARK_ENABLED: true,
  SPARK_RATE: 0.04,            // P(spawn)/frame × velocity
  SPARK_TTL_MS: [400, 900],
  SPARK_SIZE: [1, 3],

  REFERENCE_SHOULDER_PX: 220,  // baseline shoulder width for scaling

  TRACKED_JOINTS: ['left_wrist','right_wrist','left_elbow','right_elbow',
                   'left_shoulder','right_shoulder','nose'],

  DEBUG_DRAW_KEYPOINT: false,
  DEBUG_SHOW_ACTIVE: false,
};

// ════════════════ helpers ════════════════
const $ = id => document.getElementById(id);
const canvas = $('fx'), ctx = canvas.getContext('2d');
const video = $('cam');
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

// per-joint buffers
const raw = {};   // last SMOOTH_FRAMES raw positions (for moving average)
const hist = {};  // last N smoothed positions (the comet spine)
let sparks = [];
function blank(j){ raw[j]=[]; hist[j]=[]; }
CONFIG.TRACKED_JOINTS.forEach(blank);

// radial-gradient orb (never a hard arc fill)
function orb(x,y,r,coreC,bodyC,alpha){
  if(r<=0) return;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, rgba(coreC, alpha));
  g.addColorStop(0.45, rgba(bodyC, alpha*0.6));
  g.addColorStop(1, rgba(bodyC, 0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}

// ════════════════ THE PER-FRAME LOGIC ════════════════
function drawFrame(map, now){
  const W=canvas.width, H=canvas.height;
  const CORE=hexRgb(CONFIG.GLOW_COLOR_CORE), BODY=hexRgb(CONFIG.GLOW_COLOR_BODY), BLOOM=hexRgb(CONFIG.GLOW_COLOR_BLOOM);

  // 1) FADE OLD TRAIL — destination-out keeps the FX canvas transparent so the
  //    webcam shows through (a plain black fillRect would pile up to opaque).
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,'+CONFIG.TRAIL_FADE_ALPHA+')';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  // 3) FILTER + SMOOTH (per tracked joint)
  for(const j of CONFIG.TRACKED_JOINTS){
    const k=map[j];
    if(!k || k.score < CONFIG.CONFIDENCE_GATE){ blank(j); continue; } // missing limb = no light, no stale smear
    const rb=raw[j]; rb.push({x:k.x,y:k.y}); if(rb.length>CONFIG.SMOOTH_FRAMES) rb.shift();
    let ax=0,ay=0; for(const p of rb){ ax+=p.x; ay+=p.y; } ax/=rb.length; ay/=rb.length;
    const h=hist[j]; h.push({x:ax,y:ay}); if(h.length>30) h.shift();
  }

  // 4) BODY UNIT k
  const ls=map.left_shoulder, rs=map.right_shoulder;
  let k=1;
  if(ls&&rs&&ls.score>=CONFIG.CONFIDENCE_GATE&&rs.score>=CONFIG.CONFIDENCE_GATE){
    k=clamp(Math.hypot(ls.x-rs.x, ls.y-rs.y)/CONFIG.REFERENCE_SHOULDER_PX, 0.3, 4);
  }

  // 5) VELOCITY per joint  +  6) PICK ACTIVE (single joint, max speed over gate)
  let active=null, bestSpeed=0, bestHist=0;
  for(const j of CONFIG.TRACKED_JOINTS){
    const h=hist[j]; if(h.length<2) continue;
    const a=h[h.length-1], b=h[h.length-2];
    const speed=Math.hypot(a.x-b.x, a.y-b.y);
    if(speed > CONFIG.VELOCITY_THRESHOLD*k){
      if(speed>bestSpeed || (speed===bestSpeed && h.length>bestHist)){ active=j; bestSpeed=speed; bestHist=h.length; }
    }
  }

  // 7) DRAW GLOW + TRAIL at the active joint (additive bloom)
  if(active){
    const h=hist[active]; const N=Math.min(CONFIG.TRAIL_LENGTH, h.length);
    ctx.globalCompositeOperation='lighter';
    ctx.shadowBlur=CONFIG.GLOW_RADIUS*k*0.6; ctx.shadowColor=CONFIG.GLOW_COLOR_BLOOM;

    // a) comet trail — head (newest) → tail (oldest)
    for(let i=0;i<N;i++){
      const p=h[h.length-1-i];
      const tail=N>1 ? i/(N-1) : 0;
      const r=CONFIG.GLOW_RADIUS*k*(CONFIG.TRAIL_TAPER ? (1-tail*0.85) : 1);
      orb(p.x,p.y,r,CORE,BODY,1-tail);
    }
    // b) head orb — extra bright spot
    const head=h[h.length-1];
    orb(head.x,head.y,CONFIG.GLOW_RADIUS*k*1.15,[255,255,255],CORE,1);
    orb(head.x,head.y,CONFIG.GLOW_RADIUS*k*0.4,[255,255,255],[255,255,255],1);

    // c) sparkles ∝ velocity
    if(CONFIG.SPARK_ENABLED && Math.random() < CONFIG.SPARK_RATE*bestSpeed){
      sparks.push({ x:head.x, y:head.y,
        vx:(Math.random()-0.5)*1.4, vy:-Math.random()*0.6-0.2, born:now,
        ttl: CONFIG.SPARK_TTL_MS[0]+Math.random()*(CONFIG.SPARK_TTL_MS[1]-CONFIG.SPARK_TTL_MS[0]),
        r: (CONFIG.SPARK_SIZE[0]+Math.random()*(CONFIG.SPARK_SIZE[1]-CONFIG.SPARK_SIZE[0]))*k });
    }
    ctx.shadowBlur=0;
  }

  // sparkles update (always, so they finish their life even after the joint stops)
  ctx.globalCompositeOperation='lighter';
  sparks = sparks.filter(s=>{
    const age=(now-s.born)/s.ttl; if(age>=1) return false;
    s.x+=s.vx; s.y+=s.vy; s.vy-=0.01;
    const tw=0.6+0.4*Math.sin(now/80+s.x);
    orb(s.x,s.y,s.r*(1-age*0.5),[255,255,255],CORE,(1-age)*tw);
    return true;
  });
  ctx.globalCompositeOperation='source-over';

  // 9) DEBUG overlays
  if(CONFIG.DEBUG_DRAW_KEYPOINT){
    ctx.strokeStyle='rgba(120,220,255,0.9)'; ctx.lineWidth=2;
    for(const j of CONFIG.TRACKED_JOINTS){ const kp=map[j]; if(!kp||kp.score<CONFIG.CONFIDENCE_GATE) continue;
      ctx.beginPath(); ctx.moveTo(kp.x-6,kp.y); ctx.lineTo(kp.x+6,kp.y);
      ctx.moveTo(kp.x,kp.y-6); ctx.lineTo(kp.x,kp.y+6); ctx.stroke(); }
  }
  const dl=$('dbgLabel');
  if(CONFIG.DEBUG_SHOW_ACTIVE){ dl.style.display='block'; dl.textContent='active: '+(active||'–'); }
  else dl.style.display='none';
}

// ════════════════ camera + MoveNet ════════════════
let detector=null;
function sizeCanvas(){ if(video.videoWidth){ canvas.width=video.videoWidth; canvas.height=video.videoHeight; } }
video.addEventListener('loadedmetadata', sizeCanvas);
window.addEventListener('resize', sizeCanvas); // CSS handles display; buffer stays video-space

async function boot(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 }, audio:false });
    video.srcObject=stream; await video.play(); sizeCanvas();
    $('msg').textContent='loading pose model…';
    await tf.setBackend('webgl').catch(()=>tf.setBackend('cpu')); await tf.ready();
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
    $('msg').style.display='none';
    loop();
  }catch(e){ $('msg').textContent='camera blocked: '+e.message; }
}
async function loop(){
  let map={};
  try{
    if(detector && video.readyState>=2){
      const poses=await detector.estimatePoses(video,{ flipHorizontal:false });
      if(poses[0]) poses[0].keypoints.forEach(k=>{ map[k.name]={x:k.x,y:k.y,score:(k.score==null?k.confidence:k.score)}; });
    }
  }catch(e){}
  drawFrame(map, performance.now());
  requestAnimationFrame(loop);
}

// ════════════════ live tuning panel ════════════════
const SLIDERS=[
  ['CONFIDENCE_GATE',0.3,0.8,0.01],
  ['VELOCITY_THRESHOLD',2,20,1],
  ['GLOW_RADIUS',10,80,1],
  ['TRAIL_LENGTH',4,25,1],
  ['TRAIL_FADE_ALPHA',0.05,0.40,0.01],
];
const TOGGLES=['SPARK_ENABLED','DEBUG_DRAW_KEYPOINT','DEBUG_SHOW_ACTIVE'];
(function buildPanel(){
  const b=$('panelBody');
  for(const [key,min,max,step] of SLIDERS){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<label>'+key.replace(/_/g,' ').toLowerCase()+'</label>'+
      '<input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+CONFIG[key]+'">'+
      '<span class="val">'+CONFIG[key]+'</span>';
    const inp=row.querySelector('input'), val=row.querySelector('.val');
    inp.addEventListener('input',()=>{ CONFIG[key]=parseFloat(inp.value); val.textContent=inp.value; });
    b.appendChild(row);
  }
  for(const key of TOGGLES){
    const row=document.createElement('div'); row.className='row toggle';
    row.innerHTML='<label>'+key.replace(/_/g,' ').toLowerCase()+'</label>'+
      '<input type="checkbox" '+(CONFIG[key]?'checked':'')+'>';
    row.querySelector('input').addEventListener('change',e=>{ CONFIG[key]=e.target.checked; });
    b.appendChild(row);
  }
})();
$('panelHead').addEventListener('click',()=>{ const p=$('panel'); p.classList.toggle('collapsed');
  $('caret').textContent=p.classList.contains('collapsed')?'▸':'▾'; });

// ════════════════ start / self-test hook ════════════════
const params=new URLSearchParams(location.search);
window.__nova={ CONFIG, drawFrame, hist, raw, get sparks(){return sparks;},
  reset(){ CONFIG.TRACKED_JOINTS.forEach(blank); sparks=[]; ctx.clearRect(0,0,canvas.width,canvas.height); } };

if(params.has('selftest')){
  // no camera / no model — the test feeds synthetic keypoints into drawFrame
  canvas.width=640; canvas.height=480; $('msg').style.display='none';
  window.__selftest=true;
} else {
  // gesture-gated start (mobile autoplay/camera policies)
  const go=()=>{ $('msg').textContent='starting…'; boot(); window.removeEventListener('pointerdown',go); };
  window.addEventListener('pointerdown',go);
  $('msg').textContent='tap to start — allow the camera ✨';
}
</script>
</body>
</html>
