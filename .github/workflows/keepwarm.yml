# TASK 1 (fable5): keep the free-tier Render server warm so create-session is never a
# 30-50s cold start. GitHub cron minimum is 5 min (often delayed to ~10-15 under load) —
# combined with the page-level pings this keeps the server hot for nearly all visits.
name: keep-nova-warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health
        run: |
          curl -sS -m 25 -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://novapython.onrender.com/health || echo "ping failed (server may be waking)"
