name: Nova Laws

# The wall. Every push and PR runs the law-tests. If an ACTIVE law's marker has
# vanished from the code, this job goes RED with the law's name — a registered
# fix cannot silently disappear. Known-LOST laws (see LAWS.md red-list) report
# loudly but do not fail the build until the founder restores + activates them.
#
# Do not "fix" a red build by deleting a test. Restore the law. See
# START-HERE-CLI.md and LAWS.md (append-only).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  laws:
    name: Nova Laws        # must match the branch-protection required check EXACTLY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the freeze guardian can diff against base
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Freeze lockdown guardian (2026-08-15)
        # Freeze is DONE and founder-approved. Any PR that touches the freeze files must
        # carry a commit whose message contains FREEZE-APPROVED, or the build goes RED.
        # Freeze is not a parts bin — this stops silent drift into the approved game.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FREEZE_FILES="animal-freeze.html pod/pages/animal-freeze.html"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          touched=""
          for f in $FREEZE_FILES; do
            echo "$changed" | grep -qxF "$f" && touched="$touched $f"
          done
          if [ -n "$touched" ]; then
            echo "PR touches freeze files:$touched"
            if git log --format=%B "$BASE_SHA".."$HEAD_SHA" | grep -q 'FREEZE-APPROVED'; then
              echo "FREEZE-APPROVED found in a commit message — allowed."
            else
              echo "::error::Freeze is DONE + founder-approved. A PR touching$touched must include FREEZE-APPROVED in a commit message. Restore the approved version or get sign-off."
              exit 1
            fi
          else
            echo "No freeze files touched — guardian passes."
          fi
      - name: law-tracks — main is frozen; game changes come via PROMOTE (2026-09-07)
        # Beta track: any PR to MAIN that changes a game file must carry "PROMOTE vX.Y"
        # in its title (promotion from a founder-approved beta). Work lands on beta first.
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          GAME_GLOB='pod/pages/.*\.html|nova-commercial\.html|.*freeze.*\.html|upperbody\.html|up-groove\.html'
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if echo "$changed" | grep -qE "$GAME_GLOB"; then
            echo "PR to main changes game files:"; echo "$changed" | grep -E "$GAME_GLOB"
            if echo "$PR_TITLE" | grep -qE 'PROMOTE v[0-9]+\.[0-9]+'; then
              echo "PROMOTE tag in title — allowed."
            else
              echo "::error::main is frozen. A game-file PR to main must be a promotion: put 'PROMOTE vX.Y' in the PR title and reference the approved beta tag. Land work on beta first."
              exit 1
            fi
          else
            echo "No game files changed on this main PR — law-tracks passes."
          fi
      - name: law-skills — game PRs to beta must include a SKILL-CHECK (2026-09-07)
        # Every game-changing PR to beta must ship the audit table so skill compliance
        # is visible before it can be promoted.
        if: github.event_name == 'pull_request' && github.base_ref == 'beta'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          GAME_GLOB='pod/pages/.*\.html|beta/.*\.html'
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if echo "$changed" | grep -qE "$GAME_GLOB"; then
            if echo "$changed" | grep -qiE 'SKILL-CHECK'; then
              echo "SKILL-CHECK included — allowed."
            else
              echo "::error::A game PR to beta must include a SKILL-CHECK.md (audit vs the 3 skills). Add it and re-push."
              exit 1
            fi
          else
            echo "No game files changed — law-skills passes."
          fi
      - name: Run Nova law-tests (walls)
        run: bash tools/laws/run-all.sh
