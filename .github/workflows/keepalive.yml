name: keep-nova-warm
# Pings the Nova web server every ~10 min so the free Render instance never
# sleeps → no more ~50s cold start when a kid opens the app.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub best-effort)
  workflow_dispatch: {}        # allow manual run from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Nova /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://novapython.onrender.com/health)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "health not 200 after retries (server may be mid-deploy)"
          exit 0   # never fail the workflow / spam emails
