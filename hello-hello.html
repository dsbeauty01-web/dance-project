<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Hello Hello — Nova Dance</title>
<!--
  HELLO HELLO — STANDALONE (hello-hello-standalone.md). Self-contained single file.
  THE CLOCK IS THE SOURCE OF TRUTH (JS performance.now), NOT the audio — so the game runs
  WITH the song, with a dropped-in song (🎵 Load song), or SILENT (111s timeline). This is
  the fix for "only camera shows": cues fire off the clock, never blocked on the media.
  Webcam + MoveNet (CDN). Smart light: focus dot + directional lean + flare + fade-rect trail,
  body-relative, confidence-gated ≥0.5, additive, one joint at a time (both wrists on clap/both-up).
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;-webkit-user-select:none;user-select:none}
  :root{--gold:#FFD27A;--mint:#BFFFC8;--bg:#0a0612}
  html,body{height:100%;background:var(--bg);font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;color:#fff;overflow:hidden}
  /* webcam dominant (no MP4 — the song carries it); works portrait phone + laptop */
  #stage{position:fixed;inset:0;background:#06070b;overflow:hidden}
  /* DESKTOP: frame the camera as a phone-shaped column (not a giant full-bleed zoom) */
  @media (orientation:landscape){ #stage{ left:50%; transform:translateX(-50%); width:min(520px,56svh); box-shadow:0 0 0 1px #2a1a3a, 0 0 60px rgba(0,0,0,.6) } }
  #cam,#fx{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
  #fx{pointer-events:none}
  /* top strip: cue label + timing bar (never on the body) */
  #strip{position:absolute;top:0;left:0;right:0;height:15%;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px}
  #bar{width:80%;height:7px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;transition:opacity .25s}
  #bar.show{opacity:1} #bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd27a,#ffa63d);transition:width .1s linear}
  #cue{font-size:clamp(16px,5vw,24px);font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .2s} #cue.show{opacity:1}
  /* Nova: voice/glow only — a small breathing corner orb */
  #nova{position:absolute;top:10px;right:10px;width:54px;height:54px;border-radius:50%;z-index:3;
    background:center/cover no-repeat url('nova-face.png'),#2a1052;box-shadow:0 0 0 3px rgba(255,210,122,.8),0 0 22px rgba(255,166,61,.5);animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  #nova.hit{box-shadow:0 0 0 3px var(--mint),0 0 30px rgba(191,255,200,.7)}
  #streak{position:absolute;top:74px;right:10px;z-index:3;font-size:13px;font-weight:800;color:var(--gold);background:rgba(10,6,18,.5);padding:3px 9px;border-radius:12px;opacity:0;transition:.3s}
  #streak.show{opacity:1}
  /* controls — thumb zone bottom */
  #load{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:12px;z-index:4;background:rgba(20,10,40,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:18px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:radial-gradient(120% 90% at 50% 25%,#2a1052,#0a0612 70%)}
  .screen.hidden{display:none} .hero{font-size:clamp(28px,8vw,44px);font-weight:800;text-shadow:0 0 24px rgba(255,210,122,.5)}
  .sub{font-size:clamp(14px,4vw,18px);color:#e9d5ff;opacity:.85;max-width:82%}
  .big-btn{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-width:72vw;min-height:64px;border:none;border-radius:34px;cursor:pointer;color:#3a0a00;font-weight:800;font-size:clamp(18px,5.4vw,24px);background:linear-gradient(160deg,#ffe39a,#ff9ad1);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 26px rgba(255,210,122,.5)}
  #songnote{position:absolute;bottom:8px;font-size:12px;opacity:.65}
  #warn{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);z-index:21;font-size:15px;color:#ffd27a;background:rgba(20,10,40,.7);backdrop-filter:blur(6px);padding:8px 16px;border-radius:16px;opacity:0;transition:.3s;text-align:center;max-width:88vw}#warn.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="strip"><div id="cue"></div><div id="bar"><i></i></div></div>
  <div id="nova"></div><div id="streak"></div>
  <button id="load">🎵 Load song</button>
</div>
<div class="screen" id="s-launch">
  <div class="hero">Hello Hello! 👋</div>
  <div class="sub">Sing &amp; dance with me — clap, reach up high, and wave! I'll show you each move.</div>
  <button class="big-btn" id="play">▶ Play with Nova</button>
  <div id="songnote">song optional — runs with or without it</div>
</div>
<div class="screen hidden" id="s-end">
  <div class="hero">You're a little STAR! 🌟</div>
  <div class="sub" id="endsub"></div>
  <button class="big-btn" id="again">🔄 Again!</button>
</div>
<div id="warn"></div>
<input id="songinput" type="file" accept="audio/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cam=$('cam'), fx=$('fx'), ctx=fx.getContext('2d');
let detector=null, stream=null, started=false;

// ── THE CLOCK (source of truth). Audio layered ON it; runs silent if no song. ──
let startMs=null, audio=new Audio('./shit.mp3'), audioOK=false;
audio.preload='auto';
audio.addEventListener('canplaythrough',()=>{ audioOK=true; });
audio.addEventListener('error',()=>{ audioOK=false; });
function clockS(){ if(audioOK && audio && !audio.paused && audio.currentTime>0) return audio.currentTime; return startMs?(performance.now()-startMs)/1000:0; }
$('load').addEventListener('click',()=>$('songinput').click());
$('songinput').addEventListener('change',e=>{ const f=e.target.files[0]; if(f){ try{ audio.src=URL.createObjectURL(f); audioOK=true; if(started){ audio.currentTime=Math.max(0,clockS()); audio.play().catch(()=>{}); } warn('song loaded 🎵'); }catch(_){}} });

// ── CUE TIMELINE (locked from spec) — clock-driven, never blocked on media ──
const HELLO_CUES=[
  {t:17,move:'right_hand_up',label:'RIGHT hand UP! ✋'}, {t:21,move:'left_hand_up',label:'LEFT hand UP! ✋'},
  {t:25,move:'clap',label:'CLAP! 👏'}, {t:28,move:'both_up',label:'BOTH hands UP! 🙌'},
  {t:30,move:'right_hand_up',label:'RIGHT hand UP! ✋'}, {t:34,move:'clap',label:'CLAP! 👏'},
  {t:38,move:'left_hand_up',label:'LEFT hand UP! ✋'}, {t:42,move:'hands_on_head',label:'Hands on HEAD! 🙆'},
  {t:45,move:'both_up',label:'BOTH UP! 🙌'}, {t:50,move:'clap',label:'CLAP! 👏'},
  {t:53,move:'right_hand_up',label:'RIGHT UP! ✋'}, {t:57,move:'left_hand_up',label:'LEFT UP! ✋'},
  {t:62,move:'right_hand_up',label:'Nova says… RIGHT! ✋'}, {t:65,move:'left_hand_up',label:'Nova says… LEFT! ✋'},
  {t:69,move:'both_up',label:'Nova says… BOTH! 🙌'}, {t:73,move:'clap',label:'Nova says… CLAP! 👏'},
  {t:78,move:'right_hand_up',label:'FAST — RIGHT! ✋'}, {t:80,move:'left_hand_up',label:'FAST — LEFT! ✋'},
  {t:82,move:'clap',label:'CLAP! 👏'}, {t:84,move:'both_up',label:'BOTH! 🙌'},
  {t:86,move:'hands_on_head',label:'HEAD! 🙆'}, {t:88,move:'FREEZE',label:'FREEZE! 🛑',until:93},
];
const SONG_END=111;
// per-cue window: next cue's t (or +3.5s), capped
HELLO_CUES.forEach((c,i)=>{ c.close = c.until ? c.until : Math.min((HELLO_CUES[i+1]?HELLO_CUES[i+1].t:c.t+3.5), c.t+3.6); });

// ── MoveNet + detection (mirror, body-relative, ≥0.5) ──
async function ensureCamera(){ if(stream) return true;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}},audio:false}); cam.srcObject=stream; await cam.play(); sizeFx(); return true; }
  catch(e){ warn("allow the camera 📷"); return false; } }
async function ensureModel(){ if(detector) return; try{await tf.setBackend('webgl');}catch(e){try{await tf.setBackend('cpu');}catch(_){}} await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}); }
function sizeFx(){ if(cam.videoWidth){ fx.width=cam.videoWidth; fx.height=cam.videoHeight; } }
cam.addEventListener('loadedmetadata',sizeFx); addEventListener('resize',sizeFx);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let M={}, prevM=null, motion=0;
function buildM(kps){ const cw=fx.width||640; const m={}; kps.forEach(k=>{ m[k.name]={name:k.name,x:cw-k.x,y:k.y,score:(k.score==null?k.confidence:k.score)}; }); return m; }
function g(n,fl){ const k=M[n]; return (k&&k.score>=(fl||0.5))?k:null; }
function unit(){ const l=g('left_shoulder'),r=g('right_shoulder'); return (l&&r)?dist(l,r):180; }
function shY(){ const l=g('left_shoulder'),r=g('right_shoulder'); return (l&&r)?(l.y+r.y)/2:null; }
// move checks (return false | {q}); raise gate ≥0.4 for wrists (kids)
function raise(side){ const w=g(side+'_wrist',.4), sy=shY(); if(!w||sy==null) return false; const r=(sy-w.y)/unit(); return r>0.0?{q:Math.min(1,0.55+r*0.4)}:false; }
function bothRaise(){ const a=raise('left'),b=raise('right'); return (a&&b)?{q:0.9}:false; }
function clapNow(){ const lw=g('left_wrist',.4),rw=g('right_wrist',.4); if(!lw||!rw) return false; return dist(lw,rw)/unit()<0.4?{q:0.85}:false; }
function headNow(){ const lw=g('left_wrist',.4),rw=g('right_wrist',.4),no=g('nose',.4); if(!lw||!rw||!no) return false; const u=unit(); return (dist(lw,no)/u<0.7&&dist(rw,no)/u<0.7)?{q:0.85}:false; }
function frozen(){ return motion<0.02; }
function checkMove(move){ switch(move){
  case 'right_hand_up': return raise('right'); case 'left_hand_up': return raise('left');
  case 'both_up': return bothRaise(); case 'clap': return clapNow(); case 'hands_on_head': return headNow();
  case 'FREEZE': return frozen()?{q:0.9}:false; default: return false; } }
function anchorsFor(move){ const o=[];
  if(move==='right_hand_up'){ const w=g('right_wrist',.4); if(w)o.push(w); }
  else if(move==='left_hand_up'){ const w=g('left_wrist',.4); if(w)o.push(w); }
  else if(move==='both_up'||move==='clap'){ [g('left_wrist',.4),g('right_wrist',.4)].forEach(w=>w&&o.push(w)); }
  else if(move==='hands_on_head'){ [g('left_ear',.4),g('right_ear',.4)].forEach(e=>e&&o.push(e)); }
  else if(move==='FREEZE'){ const s=shY(); const l=g('left_shoulder'),r=g('right_shoulder'); if(l&&r)o.push({x:(l.x+r.x)/2,y:s}); }
  return o; }

// ── SMART LIGHT (inline): focus dot + directional lean + flare + fade-rect trail, additive ──
const COL={core:'255,253,245',gold:'255,210,122',amber:'255,166,61',mint:'191,255,200'};
let spine={}, sparks=[], _confirmed={}, _flareAt={};
function orb(x,y,r,trip,a){ if(r<=0)return; const grd=ctx.createRadialGradient(x,y,0,x,y,r); grd.addColorStop(0,'rgba('+trip+','+a+')'); grd.addColorStop(.45,'rgba('+trip+','+a*0.5+')'); grd.addColorStop(1,'rgba('+trip+',0)'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
function drawLight(activeCue, elapsed, hit){
  const W=fx.width,H=fx.height;
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';
  if(!activeCue){ sparkUpdate(); return; }
  const k=Math.max(0.4,Math.min(3,unit()/220));
  const anchors=anchorsFor(activeCue.move);
  const trip = hit ? COL.mint : COL.gold;
  ctx.globalCompositeOperation='lighter';
  anchors.forEach((p,i)=>{
    if(!hit && elapsed<0.3){ const r=16*k*(1+0.35*Math.sin(elapsed*12*Math.PI)); orb(p.x,p.y,r*1.8,COL.gold,0.4); orb(p.x,p.y,r*0.6,COL.core,0.9); }
    else { // lean UP (these moves go up; clap converges — keep simple: lean up)
      const sp=spine[i]||(spine[i]=[]); sp.unshift({x:p.x,y:p.y}); if(sp.length>10)sp.pop();
      for(let j=1;j<sp.length;j++){ sp[j].x=sp[j].x*0.6+sp[j-1].x*0.4; sp[j].y=sp[j].y*0.6+sp[j-1].y*0.4; }
      const reach=40*k*(hit?1:0.6); ctx.beginPath();
      for(let j=0;j<8;j++){ const f=j/7; const x=p.x, y=p.y-reach*f; j?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      const grd=ctx.createLinearGradient(p.x,p.y,p.x,p.y-reach); grd.addColorStop(0,'rgba('+trip+','+(hit?0.9:0.5)+')'); grd.addColorStop(1,'rgba(242,115,12,0)');
      ctx.strokeStyle=grd; ctx.lineWidth=13*k; ctx.lineCap='round'; ctx.stroke();
      orb(p.x,p.y,16*k*(hit?1.1:0.7),trip,hit?0.95:0.6);
      if(hit && Math.random()<0.3){ sparks.push({x:p.x,y:p.y,vx:(Math.random()-.5)*1.4,vy:-Math.random()*1.2-0.3,born:performance.now(),ttl:600,r:(1+Math.random()*2)*k}); }
    }
  });
  sparkUpdate();
  ctx.globalCompositeOperation='source-over';
}
function sparkUpdate(){ const now=performance.now(); ctx.globalCompositeOperation='lighter';
  sparks=sparks.filter(s=>{ const age=(now-s.born)/s.ttl; if(age>=1)return false; s.x+=s.vx; s.y+=s.vy; s.vy-=0.01; orb(s.x,s.y,s.r*(1-age*.5),COL.core,(1-age)*0.8); return true; }); }

// ── Nova voice (local, optional) ──
function say(t){ $('cue').textContent=t; $('cue').classList.add('show'); clearTimeout(say._t); say._t=setTimeout(()=>$('cue').classList.remove('show'),2400);
  if(!/[?&](novoice|nonova)/.test(location.search)){ try{ const u=new SpeechSynthesisUtterance(t.replace(/[^\w !?.,'-]/g,'')); u.rate=1; u.pitch=1.3; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} } }
function warn(t){ const w=$('warn'); if(!t){w.classList.remove('show');return;} w.textContent=t; w.classList.add('show'); clearTimeout(warn._t); warn._t=setTimeout(()=>w.classList.remove('show'),2200); }

// ── main loop: clock → active cue → detect → light. ONE clock, never blocked on song. ──
let game={running:false,hits:0,combo:0,announced:{}}, lastCueIdx=-1;
function activeCueIdx(s){ let idx=-1; for(let i=0;i<HELLO_CUES.length;i++){ const c=HELLO_CUES[i]; if(s>=c.t && s<c.close) idx=i; } return idx; }
async function loop(){
  if(detector && cam.readyState>=2){
    let poses=[]; try{ poses=await detector.estimatePoses(cam,{flipHorizontal:true}); }catch(e){}
    if(poses[0]){ M=buildM(poses[0].keypoints);
      // motion (for freeze)
      if(prevM){ let t=0,c=0; for(const n in M){ const a=M[n],b=prevM[n]; if(a&&b&&a.score>.3&&b.score>.3){t+=dist(a,b);c++;} } motion=c?Math.min(1,(t/c)/unit()*3):0; } prevM=M;
    } else { ctx.clearRect(0,0,fx.width,fx.height); requestAnimationFrame(loop); return; }
  }
  if(game.running){
    const s=clockS();
    if(s>=SONG_END){ endGame(); return; }
    const idx=activeCueIdx(s);
    if(idx!==lastCueIdx){ lastCueIdx=idx; spine={}; }
    if(idx>=0){
      const c=HELLO_CUES[idx], elapsed=s-c.t;
      if(!game.announced[idx]){ game.announced[idx]=true; say(c.label); }   // Nova CALLS the move (she leads)
      if(_confirmed[idx]===undefined) _confirmed[idx]=false;
      if(!_confirmed[idx] && checkMove(c.move)){ _confirmed[idx]=true; onHit(idx,c); }
      drawLight(c, elapsed, !!_confirmed[idx]);
      const b=$('bar'); b.classList.add('show'); b.firstElementChild.style.width=Math.round(Math.max(0,1-elapsed/(c.close-c.t))*100)+'%';
    } else { drawLight(null,0,false); $('bar').classList.remove('show');
      // fill the no-cue windows so it never feels blank: intro = "get ready", outro = celebrate
      const lbl = s<17 ? ('Watch me… first move in '+Math.max(1,Math.ceil(17-s))+'s ✨') : 'you did it — wave goodbye! 👋';
      const ce=$('cue'); if(ce.textContent!==lbl){ ce.textContent=lbl; ce.classList.add('show'); } }
  }
  requestAnimationFrame(loop);
}
function onHit(idx,c){ game.hits++; game.combo++; $('nova').classList.add('hit'); setTimeout(()=>$('nova').classList.remove('hit'),700);
  $('streak').classList.add('show'); $('streak').textContent='🌟 '+game.combo; }

$('play').addEventListener('click', start);
async function start(){
  $('play').disabled=true;
  if(!await ensureCamera()){ $('play').disabled=false; return; }
  $('s-launch').classList.add('hidden');
  await Promise.race([ensureModel().catch(()=>{}), new Promise(r=>setTimeout(r,12000))]);
  started=true; startMs=performance.now();                 // ← THE CLOCK STARTS (independent of song)
  try{ audio.currentTime=0; if(!/[?&](nonova|novoice)/.test(location.search)) audio.play().then(()=>{audioOK=true;}).catch(()=>{audioOK=false;}); }catch(e){}
  game.running=true; lastCueIdx=-1; game.announced={}; _confirmed={};
  say('Hello hello! Watch me — copy my moves! 👋');
  loop();
}
function endGame(){ game.running=false; $('bar').classList.remove('show'); $('streak').classList.remove('show'); ctx.clearRect(0,0,fx.width,fx.height); try{audio.pause();}catch(e){}
  $('endsub').textContent='You did '+game.hits+' moves! Come dance again? 💜'; $('s-end').classList.remove('hidden'); say('You did it! wave goodbye! 👋'); }
$('again').addEventListener('click',()=>location.reload());
// self-test hook
window.__hh={ get clock(){return clockS();}, get game(){return game;}, cues:HELLO_CUES, get audioOK(){return audioOK;}, activeCueIdx };
</script>
</body>
</html>
