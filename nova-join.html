<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova Join · Dance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/livekit-client@2.13.3/dist/livekit-client.umd.min.js"></script>
<style>
  :root{ --pink:#ff5fd8; --grn:#00ff99; --yel:#ffd84d; --bg:#140022; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Fredoka','Segoe UI',system-ui,sans-serif; color:#fff; overflow:hidden;
    background:
      radial-gradient(70% 55% at 18% 0%, rgba(255,138,226,.20), transparent 60%),
      radial-gradient(70% 55% at 92% 8%, rgba(110,231,255,.16), transparent 60%),
      radial-gradient(120% 120% at 50% 0%, #46157033 0%, #45146e 0%, #1d0838 52%, #0b0017 100%);
    -webkit-user-select:none; user-select:none;
  }
  body::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.7),transparent),
      radial-gradient(2px 2px at 72% 62%,rgba(255,255,255,.5),transparent),
      radial-gradient(1.5px 1.5px at 42% 82%,rgba(255,216,77,.7),transparent),
      radial-gradient(1.5px 1.5px at 86% 24%,rgba(110,231,255,.7),transparent),
      radial-gradient(1.5px 1.5px at 12% 70%,rgba(255,138,226,.7),transparent);
    animation:twinkle 4.5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.35} 50%{opacity:.75} }
  .screen{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .hidden{ display:none !important; }

  /* ── START ── */
  #start-screen{ gap:18px; text-align:center; padding:24px; }
  #start-screen h1{ font-size:clamp(40px,10vw,72px); font-weight:700; letter-spacing:.5px;
    background:linear-gradient(90deg,#ff8ae2,#a78bfa,#6ee7ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 24px rgba(167,139,250,.55)); }
  #start-screen p{ opacity:.85; font-size:clamp(14px,4vw,18px); max-width:440px; line-height:1.55; }
  .moves-preview{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:480px; margin:8px 0 6px; }
  .moves-preview .chip{ background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 20px rgba(120,60,160,.25);
    border-radius:18px; padding:10px 12px; display:flex; flex-direction:column; align-items:center; gap:4px; width:90px; }
  .moves-preview .chip svg{ width:48px; height:62px; }
  .moves-preview .chip span{ font-size:11px; opacity:.9; font-weight:500; }
  .big-btn{ background:linear-gradient(135deg,#ff7ae0,#a06bff 60%,#6ee7ff); color:#1a0030; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:clamp(20px,5.5vw,26px); padding:18px 50px; border-radius:50px;
    box-shadow:0 10px 40px rgba(160,107,255,.55); transition:transform .15s, box-shadow .15s; animation:btnGlow 2.4s ease-in-out infinite; }
  .big-btn:hover{ transform:translateY(-2px) scale(1.03); }
  .big-btn:active{ transform:scale(.95); }
  @keyframes btnGlow{ 0%,100%{ box-shadow:0 10px 40px rgba(160,107,255,.45) } 50%{ box-shadow:0 14px 54px rgba(255,138,226,.7) } }
  #cam-warn{ font-size:13px; opacity:.7; min-height:18px; }

  /* ── GREET (live Nova says hi first) ── */
  #greet-screen{ gap:18px; padding:24px; z-index:35; }
  #greet-avatar-wrap{ width:min(90vw,560px); aspect-ratio:1; border-radius:36px; overflow:hidden; position:relative;
    border:5px solid var(--pink); box-shadow:0 0 60px rgba(255,95,216,.5), inset 0 0 30px rgba(255,138,226,.15);
    background:radial-gradient(circle,#3a1060,#1a0030); display:flex; align-items:center; justify-content:center;
    animation:greetGlow 2.6s ease-in-out infinite; }
  @keyframes greetGlow{ 0%,100%{ box-shadow:0 0 50px rgba(255,95,216,.4),inset 0 0 30px rgba(255,138,226,.15) }
    50%{ box-shadow:0 0 80px rgba(255,95,216,.7),inset 0 0 30px rgba(255,138,226,.2) } }
  #greet-avatar{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(.8); transition:opacity .55s ease, transform .75s cubic-bezier(.34,1.56,.64,1); }
  #greet-avatar.show{ opacity:1; transform:scale(1); }                       /* MAGIC REVEAL: spring-in, not a flat fade */
  @keyframes revealBurst{ 0%{ box-shadow:0 0 0 0 rgba(255,138,226,.85), 0 0 70px 12px rgba(255,216,77,.7) } 100%{ box-shadow:0 0 0 48px rgba(255,138,226,0), 0 0 50px rgba(255,95,216,.4) } }
  #greet-avatar-wrap.reveal{ animation:revealBurst 1s ease-out; }            /* one-shot sparkle ring on arrival */
  @keyframes phPoof{ 0%{ transform:scale(1); opacity:1 } 100%{ transform:scale(2.3); opacity:0 } }
  #greet-placeholder.poof{ animation:phPoof .5s ease-out forwards; }         /* the 🌟 poofs away as she arrives */
  #greet-placeholder{ font-size:100px; filter:drop-shadow(0 0 20px rgba(255,216,77,.6)); animation:twinkle 3s ease-in-out infinite; }
  #greet-status{ opacity:.9; font-size:clamp(15px,4.2vw,20px); font-weight:500; min-height:24px; }
  #greet-cam{ position:fixed; bottom:16px; right:16px; width:clamp(180px,40vw,320px); aspect-ratio:3/4;
    object-fit:cover; transform:scaleX(-1); border-radius:16px; border:2px solid rgba(110,231,255,.5);
    box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:36; background:#000; }

  /* ── COUNTDOWN ── */
  #countdown{ background:rgba(8,0,20,.45); z-index:40; } /* translucent — camera/detection visible behind */
  #cd-num{ font-size:min(48vw,300px); font-weight:700; color:#fff; text-shadow:0 0 40px var(--pink);
    animation:cdPop .9s ease-out; }
  #cd-sub{ font-size:clamp(16px,5vw,24px); opacity:.85; margin-top:10px; }
  @keyframes cdPop{ 0%{ transform:scale(.4); opacity:0 } 30%{ transform:scale(1.1); opacity:1 } 100%{ transform:scale(1); opacity:1 } }

  /* ── INTRO VIDEO ── */
  #intro-screen{ background:#000; z-index:50; padding:0; }
  #intro-vid{ width:100%; height:100%; object-fit:contain; }
  #intro-skip{ position:absolute; bottom:18px; right:18px; z-index:51; cursor:pointer;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff;
    font-family:inherit; font-weight:600; padding:9px 20px; border-radius:22px; }

  /* ── GAME ── */
  #game{ justify-content:flex-start; }
  #hud{ width:100%; display:flex; align-items:center; gap:12px; padding:10px 16px;
    position:relative; z-index:20; background:linear-gradient(rgba(15,0,32,.6),transparent); }
  #score-box{ font-weight:700; font-size:clamp(22px,6vw,30px); color:var(--yel); min-width:78px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,216,77,.3); border-radius:14px; padding:4px 12px;
    text-shadow:0 0 14px rgba(255,216,77,.5); }
  #score-box small{ display:block; font-size:10px; color:#fff9; font-weight:500; letter-spacing:1px; text-shadow:none; }
  #progress-wrap{ flex:1; height:12px; background:rgba(255,255,255,.12); border-radius:8px; overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4); }
  #progress{ height:100%; width:0%; background:linear-gradient(90deg,#ff5fd8,#a78bfa,#ffd84d); border-radius:8px;
    box-shadow:0 0 12px rgba(255,138,226,.7); transition:width .2s linear; }
  #combo-box{ font-weight:700; font-size:clamp(16px,4.5vw,22px); color:var(--grn); min-width:58px; text-align:right;
    text-shadow:0 0 14px rgba(0,255,150,.6); }
  #combo-box.pulse{ animation:comboPulse .4s; }
  @keyframes comboPulse{ 50%{ transform:scale(1.35) } }
  #quit{ background:rgba(255,255,255,.1); border:none; color:#fff; font-size:18px; width:34px; height:34px; border-radius:50%; cursor:pointer; }

  /* split screen: Nova LEFT, you RIGHT — both big */
  #stage{ position:relative; width:100%; flex:1; display:flex; flex-direction:row; gap:6px; padding:6px; align-items:stretch; overflow:hidden; }
  #nova-side{ position:relative; flex:1 1 50%; min-width:0; border-radius:24px; overflow:hidden;
    background:#1a0030; border:3px solid rgba(167,139,250,.4); box-shadow:0 10px 40px rgba(120,60,160,.4), inset 0 0 30px rgba(255,138,226,.08); }
  #nova-vid{ width:100%; height:100%; object-fit:cover; object-position:center 28%;
    transform-origin:center 28%; will-change:transform; } /* DANCE video fills the panel (zoom set in JS).
    Scoped to #nova-vid ONLY — the old '#nova-side video' selector also hit #nova-live (higher
    specificity) and blew her live face up to full-panel, covering the dance. */
  .side-tag{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); z-index:9;
    font-size:12px; font-weight:600; letter-spacing:1px; background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
    padding:3px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.18); }
  /* Nova's LIVE reacting face (Runway avatar over the LiveKit session) */
  /* Nova LIVE face — ELLIPSE framing her WHOLE FACE, floating TOP-CENTER "watching"
     over the game (not far-left, never covering the kid's body or the glow-cues). LOCKED shape. */
  #nova-live{ position:fixed; top:54px; left:50%; transform:translateX(-50%); width:min(23vw,172px); aspect-ratio:1/1.32;
    object-fit:cover; object-position:center 26%;
    border-radius:50% / 64%; border:3px solid var(--pink); box-shadow:0 0 26px rgba(255,95,216,.6);   /* EGG shape (taller) */
    z-index:30; display:none; background:#1a0030; transition:border-color .18s, box-shadow .18s; }
  #nova-live.show{ display:block; }
  @keyframes novaReact{ 0%{box-shadow:0 0 26px rgba(255,95,216,.6)} 40%{box-shadow:0 0 52px rgba(0,255,150,.9); border-color:var(--grn)} 100%{box-shadow:0 0 26px rgba(255,95,216,.6)} }
  #nova-live.react{ animation:novaReact .6s ease-out; }   /* face reacts on every hit (she talks less) */
  /* P5 closing-mode: grow to center for the goodbye (whole face kept) */
  #nova-live.closing{ position:fixed; top:50%; left:50%; width:min(70vw,400px); height:auto; aspect-ratio:3/4;
    transform:translate(-50%,-50%); border-radius:32px; z-index:60; box-shadow:0 0 70px rgba(255,95,216,.65);
    transition:all .7s cubic-bezier(.34,1.56,.64,1); }
  #closing-veil{ position:fixed; inset:0; z-index:55; opacity:0; pointer-events:none; transition:opacity .5s;
    background:radial-gradient(circle,rgba(26,0,48,.78),rgba(0,0,0,.93)); }
  #closing-veil.show{ opacity:1; }
  #nova-live.talking{ border-color:var(--grn); box-shadow:0 0 38px rgba(0,255,150,.7); }
  #nova-status{ position:absolute; top:8px; left:8px; z-index:9; font-size:11px;
    background:rgba(0,0,0,.6); color:#ffd84d; padding:3px 10px; border-radius:12px; }
  #cam-wrap{ position:relative; flex:1 1 50%; min-width:0; border-radius:24px; overflow:hidden; background:#000;
    border:4px solid rgba(110,231,255,.35); box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(110,231,255,.06); transition:border-color .15s, box-shadow .15s; }
  /* phone held upright → stack Nova on top, You on bottom (no squishing). Laptop /
     landscape keeps side-by-side. */
  @media (orientation:portrait){ #stage{ flex-direction:column; } }
  #cam, #overlay{ position:absolute; inset:0; width:100%; height:100%; }
  #cam{ object-fit:contain; transform:scaleX(-1); filter:brightness(1.28) contrast(1.06) saturate(1.05); } /* mirror; contain = whole body visible; brighten for backlit rooms so the kid sees itself + pose tracks better */
  /* overlay is NOT css-mirrored: poses come from estimatePoses(flipHorizontal:true)
     which are already in mirrored space, so they match the mirrored video as-is. */
  /* detection window state */
  #cam-wrap.armed{ border-color:var(--yel); box-shadow:0 0 0 4px rgba(255,216,77,.35),0 14px 50px rgba(0,0,0,.5); }
  #cam-wrap.hit{ border-color:var(--grn); box-shadow:0 0 0 6px rgba(0,255,150,.5),0 14px 50px rgba(0,0,0,.5); }
  #cam-wrap.miss{ border-color:#ff4d6d; box-shadow:0 0 0 6px rgba(255,77,109,.45),0 14px 50px rgba(0,0,0,.5); }

  /* ── DETECTION ZONES (half = sideways move, full = full-body move) ── */
  .zone{ position:absolute; top:0; bottom:0; z-index:7; pointer-events:none; opacity:0;
    display:flex; align-items:center; font-size:64px; font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,.7); transition:opacity .14s; }
  #zone-left{ left:0; width:58%; justify-content:flex-start; padding-left:5%; }
  #zone-right{ right:0; width:58%; justify-content:flex-end; padding-right:5%; }
  #zone-full{ left:0; width:100%; justify-content:center; align-items:flex-start; padding-top:64px; font-size:42px; }
  .zone.show{ opacity:1; }
  /* glow from the CUED edge → fades to centre (where you stand), so it never hides you */
  #zone-left.armed { background:linear-gradient(to right,rgba(90,170,255,.34),transparent 70%); color:#bfe0ff; } /* LEFT = blue */
  #zone-right.armed{ background:linear-gradient(to left, rgba(255,95,216,.34),transparent 70%); color:#ffd0f1; } /* RIGHT = pink */
  #zone-full.armed { background:radial-gradient(circle,rgba(255,216,77,.20),transparent 72%); color:#ffe98a; }
  #zone-left.hit  { background:linear-gradient(to right,rgba(0,255,150,.45),transparent 72%); color:#caffe4; }
  #zone-right.hit { background:linear-gradient(to left, rgba(0,255,150,.45),transparent 72%); color:#caffe4; }
  #zone-full.hit  { background:radial-gradient(circle,rgba(0,255,150,.28),transparent 74%); color:#caffe4; }
  #zone-left.miss { background:linear-gradient(to right,rgba(255,77,109,.38),transparent 72%); color:#ffd3db; }
  #zone-right.miss{ background:linear-gradient(to left, rgba(255,77,109,.38),transparent 72%); color:#ffd3db; }
  #zone-full.miss { background:radial-gradient(circle,rgba(255,77,109,.24),transparent 74%); color:#ffd3db; }

  /* ── DEBUG / MONITOR PANEL ── */
  #dbg{ position:fixed; bottom:6px; left:6px; z-index:60; max-width:42vw;
    background:rgba(0,0,0,.55); color:#7dd3fc; font:9px/1.4 'SF Mono',Consolas,monospace;
    padding:5px 7px; border-radius:7px; border:1px solid rgba(125,211,252,.25); white-space:pre; opacity:.45; }
  #dbg:hover{ opacity:.95; }
  #dbg.off{ opacity:.12; }
  #dbg b{ color:#fff; }
  #dbg .on{ color:#22c55e; font-weight:700; }
  #dbg .no{ color:#64748b; }
  #copy-log{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    font-family:inherit; padding:10px 18px; border-radius:20px; cursor:pointer; font-size:14px; }
  #end-table{ font:12px/1.5 'SF Mono',Consolas,monospace; text-align:left; background:rgba(0,0,0,.3);
    border-radius:10px; padding:10px 14px; margin:4px auto; max-width:340px; }
  #end-table .bad{ color:#ff8da3; } #end-table .good{ color:#6ee7b7; }

  /* (Nova is now the left split panel — see #nova-side above) */

  /* CUE CARD */
  #cue{ position:absolute; top:8px; left:50%; transform:translateX(-50%) scale(.85); z-index:8; width:min(50%,178px);
    background:linear-gradient(160deg,rgba(40,0,70,.9),rgba(20,0,40,.88)); backdrop-filter:blur(8px); border:2px solid var(--pink);
    border-radius:16px; padding:6px 10px 7px; text-align:center; opacity:0; transition:opacity .18s, transform .18s;
    box-shadow:0 8px 26px rgba(255,95,216,.4); }   /* compact — must NOT cover the kid */
  #cue.show{ opacity:1; transform:translateX(-50%) scale(1); animation:cuePop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cuePop{ 0%{ transform:translateX(-50%) scale(.7) } 60%{ transform:translateX(-50%) scale(1.06) } 100%{ transform:translateX(-50%) scale(1) } }
  #cue-figure{ width:48px; height:58px; margin:0 auto -2px; filter:drop-shadow(0 2px 10px rgba(255,216,77,.4)); }
  #cue-figure div{ font-size:40px !important; }   /* warm-up emoji cue — keep compact too */
  #cue-label{ font-weight:700; font-size:clamp(13px,3vw,18px); margin-top:0; line-height:1.05; letter-spacing:.5px;
    text-shadow:0 0 16px rgba(255,138,226,.6); }
  #cue-timer-wrap{ height:8px; background:rgba(255,255,255,.15); border-radius:6px; margin-top:8px; overflow:hidden; }
  #cue-timer{ height:100%; width:100%; background:linear-gradient(90deg,#ffd84d,#ff8ae2); transform-origin:left; box-shadow:0 0 10px rgba(255,216,77,.7); }
  /* GAME cue: lean = just a thin timer; the pulsing body DOT is the cue (no "stupid text") */
  #cue.lean{ width:min(40%,130px); padding:4px 8px; background:rgba(20,0,40,.5); border-width:1px; box-shadow:none; }
  #cue.lean #cue-figure, #cue.lean #cue-label{ display:none; }
  #cue.lean #cue-timer-wrap{ margin-top:0; }

  /* ── KEYPOINT-ANCHORED AURA CUES (HTML/CSS driven by MoveNet joints) ──
     A transparent "lighten-up" glow that sits ON the body part + a glowing
     direction arrow. Transparent centre + screen-blend = it brightens the kid,
     never covers them. Positions come from positionAuras() each frame. */
  #aura-layer{ position:absolute; inset:0; z-index:6; pointer-events:none; overflow:hidden; }
  .aura{ position:absolute; left:0; top:0; width:0; height:0; --c:255,216,77; --x:-500px; --y:-500px; --size:170px;
    opacity:0; transform:translate(var(--x),var(--y)); transition:opacity .22s ease;
    animation:auraPulse 1.05s ease-in-out infinite; }
  .aura.on{ opacity:1; }
  @keyframes auraPulse{ 0%,100%{ transform:translate(var(--x),var(--y)) scale(.92);}
                        50%{ transform:translate(var(--x),var(--y)) scale(1.09);} }
  /* glow auto-sizes to the body part (--size, set per-frame from shoulder width).
     Bright ring + dark contrast shadow → visible on ANY background (bright café OR dark room).
     Transparent centre (40%) so the face/part shows THROUGH — it rings the part, never covers. */
  .aura .glow{ position:absolute; left:calc(var(--size) / -2); top:calc(var(--size) / -2);
    width:var(--size); height:var(--size); border-radius:50%;
    background:radial-gradient(circle, rgba(var(--c),0) 46%, rgba(var(--c),.72) 56%,
      rgba(var(--c),.22) 67%, rgba(var(--c),0) 80%);
    filter: drop-shadow(0 0 4px rgba(0,0,0,.45)) drop-shadow(0 0 11px rgba(var(--c),.55)); }
  /* small, elegant direction arrow (scales gently with the part) */
  .aura .arrow{ position:absolute; left:0; top:0; --ax:0px; --ay:0px;
    font:900 calc(var(--size) * 0.26)/1 system-ui,sans-serif; white-space:nowrap; color:rgba(var(--c),.98);
    text-shadow:0 0 10px rgba(var(--c),.95), 0 0 22px rgba(var(--c),.5), 0 2px 4px rgba(0,0,0,.6);
    transform:translate(calc(-50% + var(--ax)), calc(-50% + var(--ay))); }
  /* freestyle: gentle full-panel golden breathe — edges only, kid stays clear */
  #aura-full{ position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; border-radius:20px;
    background:radial-gradient(circle at 50% 55%, transparent 46%, rgba(255,216,77,.18) 100%);
    transition:opacity .25s ease; animation:fullBreathe 1.5s ease-in-out infinite; }
  #aura-full.on{ opacity:1; }
  @keyframes fullBreathe{ 0%,100%{ box-shadow:inset 0 0 40px rgba(255,216,77,.22);}
                          50%{ box-shadow:inset 0 0 85px rgba(255,216,77,.5);} }

  /* feedback popups */
  #fx{ position:absolute; inset:0; pointer-events:none; z-index:15; display:flex; align-items:center; justify-content:center; }
  .pop{ position:absolute; font-weight:700; font-size:clamp(28px,9vw,52px); animation:popUp .9s ease-out forwards; text-shadow:0 3px 12px rgba(0,0,0,.5); }
  @keyframes popUp{ 0%{ transform:translateY(20px) scale(.6); opacity:0 } 25%{ transform:translateY(0) scale(1.1); opacity:1 } 100%{ transform:translateY(-50px) scale(1); opacity:0 } }

  /* coach line */
  #coach{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:9;
    background:rgba(20,0,40,.6); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.18);
    padding:9px 18px; border-radius:22px; font-size:clamp(14px,4vw,18px); font-weight:500;
    max-width:90%; text-align:center; opacity:0; transition:opacity .2s; }
  #coach.show{ opacity:1; }

  /* ── END ── */
  #end-screen{ gap:14px; text-align:center; padding:28px; z-index:30; }
  #end-stars{ font-size:54px; letter-spacing:8px; min-height:60px; filter:drop-shadow(0 0 18px rgba(255,216,77,.6)); }
  #end-title{ font-size:clamp(30px,8vw,50px); font-weight:700;
    background:linear-gradient(90deg,#ff8ae2,#6ee7ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 18px rgba(167,139,250,.5)); }
  #end-score{ font-size:clamp(22px,6vw,32px); color:var(--yel); font-weight:700; text-shadow:0 0 16px rgba(255,216,77,.5); }
  #end-detail{ opacity:.85; }
  #end-hook{ color:var(--yel); font-weight:600; font-size:15px; margin-top:4px;
    border:1px solid rgba(255,216,77,.3); border-radius:16px; padding:8px 16px; }
</style>
</head>
<body>

<!-- END -->

  <div id="end-detail"></div>
  <div id="end-table"></div>
  <div id="end-hook"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="big-btn" id="replay-btn">▶ Dance again</button>
    <button id="copy-log">📋 Copy debug log</button>
  </div>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   NOVA JOIN — self-contained dance game (frontend only).
   MoveNet pose detection + beat-timed cues + live scoring. No backend.
   ════════════════════════════════════════════════════════════════════ */

// ---- MOVE DEFINITIONS ---------------------------------------------------
// 6 moves. `check(d, base)` returns true when the current pose `d` (deltas vs the
// calibrated `base`) matches. Detection is per-part + directional where it makes
// sense. Thresholds are normalised by shoulder width — tune in THRESH below.
// tuned from real session data: looser, and head/shoulder accept EITHER direction
// (kids often tilt the opposite way — the arrow guides, any tilt of that part scores).
const THRESH = { head:0.09, sh:0.045, hip:0.06, knee:0.10, motion:0.06 };

// UP GROOVE moves (per nova-games-joints-timing.md): head → shoulder → HIPS(visual only,
// always passes — kids sitting can't do them) → knee → freestyle.
const MOVES = {
  'head-right':     { name:'HEAD →',      coach:'tilt your head RIGHT',  pts:100, check:d=> Math.abs(d.headDX) > THRESH.head },
  'head-left':      { name:'← HEAD',      coach:'tilt your head LEFT',   pts:100, check:d=> Math.abs(d.headDX) > THRESH.head },
  'shoulder-right': { name:'SHOULDER →',  coach:'lift your RIGHT shoulder', pts:120, check:d=> Math.abs(d.shTilt) > THRESH.sh },
  'shoulder-left':  { name:'← SHOULDER',  coach:'lift your LEFT shoulder',  pts:120, check:d=> Math.abs(d.shTilt) > THRESH.sh },
  'hips-left':      { name:'← HIPS',      coach:'sway your hips!',  pts:80, visual:true, check:d=> false },  // visual only — always passes
  'hips-right':     { name:'HIPS →',      coach:'sway your hips!',  pts:80, visual:true, check:d=> false },
  'knee-left':      { name:'← KNEE',      coach:'lift your knee!',  pts:140, needs:'lower', check:d=> d.kneeLift > THRESH.knee },
  'knee-right':     { name:'KNEE →',      coach:'lift your knee!',  pts:140, needs:'lower', check:d=> d.kneeLift > THRESH.knee },
  'free':           { name:'FREESTYLE!',  coach:'move it ALL!',     pts:60,  check:d=> d.motion > THRESH.motion },
};

// which detection ZONE lights up: half-screen for sideways moves, full for full-body
const ZONE = { 'head-left':'left','shoulder-left':'left','hips-left':'left','knee-left':'left',
  'head-right':'right','shoulder-right':'right','hips-right':'right','knee-right':'right',
  'free':'full' };
function setZone(z, state){
  ['zone-left','zone-right','zone-full'].forEach(id=>$(id).classList.remove('show','armed','hit','miss'));
  if(!z) return;
  const id = z==='left'?'zone-left':z==='right'?'zone-right':'zone-full';
  const e=$(id); e.textContent = z==='full'?'🕺':(z==='left'?'←':'→'); e.classList.add('show', state||'armed');
}
function zoneState(state){ const z=game.cueZone; if(!z) return;
  const id=z==='left'?'zone-left':z==='right'?'zone-right':'zone-full';
  const e=$(id); e.classList.remove('armed','hit','miss'); e.classList.add(state); }

// ---- CUE TIMELINE (video.currentTime ms; music = nova-joined-small.mp4) -
// 98.5 BPM, beat≈609ms. We jump the video to ~28s (skip the walk-up) and run the
// routine: slow alternating build, then double-speed, then freestyle.
const VIDEO_START = 0;           // start from the very beginning (no seek glitch) so the
                                 // kid watches Nova's intro and can anticipate the moves
const CUES = (()=>{
  // Exact timeline from nova-games-joints-timing.md (GAME 2 — UP GROOVE).
  // SLOW build 4-25s (1.22s spacing, ~1.05s window): head→shoulder→HIPS(visual)→knee.
  // DOUBLE-SPEED reverse 25-35s (0.61s spacing, ~0.55s window): knee→hips→shoulder→head.
  // FREESTYLE 36-56s (3 windows).
  const out=[]; const add=(sec,action,durMs)=>out.push({ t:Math.round(sec*1000), dur:durMs, action });
  const SLOW=1050, FAST=550;
  [[6.0,'head-left'],[7.2,'head-right'],[8.4,'head-left'],[9.6,'head-right'],
   [10.8,'shoulder-left'],[12.0,'shoulder-right'],[13.2,'shoulder-left'],[14.4,'shoulder-right'],
   [15.6,'hips-left'],[16.8,'hips-right'],[18.0,'hips-left'],[19.2,'hips-right'],
   [20.4,'knee-left'],[21.6,'knee-right'],[22.8,'knee-left'],[24.0,'knee-right']
  ].forEach(([s,a])=>add(s,a,SLOW));
  [[25.5,'knee-right'],[26.1,'knee-left'],[26.7,'knee-right'],[27.3,'knee-left'],
   [27.9,'hips-right'],[28.5,'hips-left'],[29.1,'hips-right'],[29.7,'hips-left'],
   [30.3,'shoulder-right'],[30.9,'shoulder-left'],[31.5,'shoulder-right'],[32.1,'shoulder-left'],
   [32.7,'head-right'],[33.3,'head-left'],[33.9,'head-right'],[34.5,'head-left']
  ].forEach(([s,a])=>add(s,a,FAST));
  add(36,'free',6000); add(44,'free',6000); add(52,'free',4000);
  return out.sort((a,b)=>a.t-b.t);
})();
const SONG_END = 56.0;           // seconds — stop + show results

// ---- SVG MOVE FIGURES ---------------------------------------------------
// A simple front-facing figure (mirror of the kid). Active part glows + arrow.
function figureSVG(action){
  const P='#ff5fd8', HI='#ffd84d', base='#cfc2e8', S=4;
  const stroke=(extra='')=>`stroke="${base}" stroke-width="${S}" stroke-linecap="round" fill="none" ${extra}`;
  const glow=`stroke="${HI}" stroke-width="${S+2}" stroke-linecap="round" fill="none"`;
  // shoulder y's & knee positions per move
  let lShY=46, rShY=46, headCx=50, headTilt=0, lLeg='M38,86 L34,124', rLeg='M62,86 L66,124';
  let hi='', arrow='';
  if(action==='head-right'){ headCx=58; headTilt=12; hi='head'; arrow=`<text x="80" y="30" font-size="22" fill="${HI}">→</text>`; }
  else if(action==='head-left'){ headCx=42; headTilt=-12; hi='head'; arrow=`<text x="6" y="30" font-size="22" fill="${HI}">←</text>`; }
  else if(action==='shoulder-right'){ rShY=34; hi='rsh'; arrow=`<text x="76" y="30" font-size="20" fill="${HI}">↑</text>`; }
  else if(action==='shoulder-left'){ lShY=34; hi='lsh'; arrow=`<text x="14" y="30" font-size="20" fill="${HI}">↑</text>`; }
  else if(action==='hips'){ hi='hips'; arrow=`<text x="34" y="80" font-size="20" fill="${HI}">↔</text>`; }
  else if(action==='knee'){ rLeg='M62,86 L70,104 L58,112'; hi='knee'; arrow=`<text x="74" y="104" font-size="20" fill="${HI}">↑</text>`; }
  const head = `<circle cx="${headCx}" cy="22" r="13" transform="rotate(${headTilt} ${headCx} 22)" ${hi==='head'?glow:stroke()}/>`;
  const neck = `<line x1="50" y1="35" x2="50" y2="50" ${stroke()}/>`;
  const shoulders = `<line x1="28" y1="${lShY}" x2="72" y2="${rShY}" ${(hi==='lsh'||hi==='rsh')?glow:stroke()}/>`;
  const torso = `<line x1="50" y1="48" x2="50" y2="86" ${stroke()}/>`;
  const lArm = `<line x1="28" y1="${lShY}" x2="18" y2="72" ${stroke()}/>`;
  const rArm = `<line x1="72" y1="${rShY}" x2="82" y2="72" ${stroke()}/>`;
  const hips = `<line x1="36" y1="86" x2="64" y2="86" ${hi==='hips'?glow:stroke()}/>`;
  const legs = `<path d="${lLeg}" ${stroke()}/><path d="${rLeg}" ${(hi==='knee')?glow:stroke()}/>`;
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">${head}${neck}${shoulders}${torso}${lArm}${rArm}${hips}${legs}${arrow}</svg>`;
}

// ---- STATE --------------------------------------------------------------
let detector=null, camStream=null, rafId=0;
let det = { headDX:0, shTilt:0, hipDX:0, kneeLift:0, motion:0, present:false };
let base = { headDX:0, shTilt:0, hipDX:0, kneeY:0, sw:120, ok:false };
let smooth = {};
let game = { running:false, score:0, combo:0, maxCombo:0, hits:0, total:0, idx:0, cue:null, cueResolved:false, cueEnd:0 };
let prevKp = null;

const $ = id => document.getElementById(id);

// auto-telemetry → local logserver (sessions.jsonl). No-op when served from Pages.
const SID='S'+Date.now(); let _lastTick=0;
function logPost(kind,data){ try{ fetch(location.origin+'/log',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(Object.assign({kind,sid:SID,ts:Date.now()},data||{}))}); }catch(e){} }

// ── MEMORY (P10) — persistent per-kid state in localStorage; the bonding/continuity ──
const MEM_KEY='nova_mem_v1';
function loadMem(){ try{ return JSON.parse(localStorage.getItem(MEM_KEY))||{}; }catch(e){ return {}; } }
function saveMem(patch){ try{ const m=Object.assign(loadMem(),patch||{}); m.last_session_at=new Date().toISOString();
  localStorage.setItem(MEM_KEY, JSON.stringify(m)); MEM=m; return m; }catch(e){ return MEM; } }
let MEM=loadMem();
if(!MEM.kid_id){ MEM=saveMem({ kid_id:'kid-'+Math.random().toString(36).slice(2,10), first_session_at:new Date().toISOString(), sessions_count:0, best_moments:[], reactions_used:[] }); }
window.__kidId = MEM.kid_id;
let AGE_TIER = MEM.age_tier || 'KID';        // indirect age read (stored; refined by vision)
const RETURNING = !!MEM.name;               // we've met this kid before
// P3 — indirect age read from one vision frame (Gemini → LITTLE/KID/TEEN/ADULT).
// Returning kids trust the stored tier (saves a call). Updates the worker live.
async function readAge(){
  if(RETURNING && MEM.age_tier) return;
  try{ const v=document.getElementById('cam'); if(!v||!v.videoWidth) return;
    const c=document.createElement('canvas'); c.width=320; c.height=Math.round(320*v.videoHeight/Math.max(1,v.videoWidth));
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const r=await fetch(NOVA.RENDER_URL+'/v2/age-estimate',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ frameDataUrl:c.toDataURL('image/jpeg',0.6), kidId:window.__kidId }) });
    const d=await r.json();
    if(d&&d.ok&&d.tier){ AGE_TIER=d.tier; saveMem({ age_tier:d.tier });
      if(novaRoom) novaSend({ kind:'game-event', event:{ event:'age', tier:d.tier } });
      console.log('[age] read', d.tier); }
  }catch(e){}
}

// ---- INIT ---------------------------------------------------------------
function renderMovesPreview(){
  const wrap=$('moves-preview');
  [['head-right','Head'],['shoulder-right','Shoulder'],['hips','Hips'],['knee','Knee']].forEach(([a,lbl])=>{
    const c=document.createElement('div'); c.className='chip';
    c.innerHTML = figureSVG(a)+`<span>${lbl}</span>`;
    wrap.appendChild(c);
  });
}
renderMovesPreview();

async function ensureModel(){
  if(detector) return;
  await tf.setBackend('webgl'); await tf.ready();
  detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
    { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
}

async function ensureCamera(){
  if(camStream) return true;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ width:{ideal:640}, height:{ideal:480}, facingMode:'user' }, audio:false });
    const v=$('cam'); v.srcObject=camStream; await v.play();
    return true;
  }catch(e){ $('cam-warn').textContent='⚠ Camera blocked — allow camera and reload.'; return false; }
}

// ---- POSE LOOP ----------------------------------------------------------
function kp(kps,name){ return kps.find(k=>k.name===name); }
function sm(key,x,y){ const a=0.6; if(!smooth[key]) smooth[key]={x,y}; smooth[key].x=smooth[key].x*a+x*(1-a); smooth[key].y=smooth[key].y*a+y*(1-a); return smooth[key]; }

async function poseLoop(){
  const v=$('cam');
  if(detector && v && v.readyState>=2){
    let poses=[];
    try{ poses = await detector.estimatePoses(v,{flipHorizontal:true}); }catch(e){}
    if(poses[0]){ analyze(poses[0].keypoints); drawSkeleton(poses[0].keypoints); }
    else { det.present=false; clearOverlay(); hideAuras(); }
  }
  updateDbg();
  const _n=performance.now();
  if(_n-_lastTick>1500){ _lastTick=_n; logPost('tick',{ present:det.present, joints:det.joints,
    headDX:+det.headDX.toFixed(2), shTilt:+det.shTilt.toFixed(2), hipDX:+det.hipDX.toFixed(2),
    knee:+det.kneeLift.toFixed(2), motion:+det.motion.toFixed(2), playing:!!game.running, cue:game.cue&&game.cue.action }); }
  // P6 energy mirror — report the kid's movement energy so Nova matches her tone (~5s)
  if(novaRoom && _n-(window.__lastEnergy||0)>5000){ window.__lastEnergy=_n;
    const lvl = det.motion>0.12?'high':(det.motion<0.04?'low':'med');
    novaSend({ kind:'game-event', event:{ event:'energy', level:lvl } }); }
  // P1/P2 — gentle framing + lighting nudge so detection actually works (the cafe-miss fix).
  // Only during play, max once per 8s, softest possible (never alarming).
  if(window.__danceStarted && _n-(window.__lastFrameNudge||0)>8000){
    if(!det.present){ window.__lastFrameNudge=_n; coach('step in front of the camera 💜'); }
    else if(det.joints<7){ window.__lastFrameNudge=_n; coach('a little more light on you? 💡'); }
    else if(det.spanFrac>0.36){ window.__lastFrameNudge=_n; coach('scoot back so I can see you!'); }
  }
  rafId=requestAnimationFrame(poseLoop);
}

// live monitor — shows raw detection values + which moves are firing RIGHT NOW
let _dbgLast=0;
function updateDbg(){
  const el=$('dbg'); if(!el || el.classList.contains('hidden')) return;
  const now=performance.now(); if(now-_dbgLast<150) return; _dbgLast=now;
  const flag=k=> (det.present && MOVES[k].check(det,base)) ? `<span class="on">${k}</span>` : `<span class="no">${k}</span>`;
  const f=v=> (v>=0?'+':'')+v.toFixed(2);
  el.innerHTML =
    `<b>present</b> ${det.present?'<span class="on">yes</span>':'<span class="no">NO</span>'}  joints ${det.joints||0}/17\n`+
    `headDX ${f(det.headDX)}  shTilt ${f(det.shTilt)}\n`+
    `hipDX ${f(det.hipDX)}   knee ${f(det.kneeLift)}\n`+
    `motion ${det.motion.toFixed(2)}  base ${base.ok?'ok':'—'}\n`+
    `${flag('head-left')} ${flag('head-right')}\n${flag('shoulder-left')} ${flag('shoulder-right')}\n${flag('hips')} ${flag('knee')} ${flag('free')}`;
}

function analyze(kps){
  const MIN=0.25;   // a bit lower so dim / backlit rooms still register joints
  det.joints = kps.filter(k=>k.score>MIN).length;
  const ls=kp(kps,'left_shoulder'), rs=kp(kps,'right_shoulder'), nose=kp(kps,'nose');
  const lh=kp(kps,'left_hip'), rh=kp(kps,'right_hip');
  const lk=kp(kps,'left_knee'), rk=kp(kps,'right_knee');
  det.present = ls&&rs&&ls.score>MIN&&rs.score>MIN;
  if(!det.present) return;
  const Ls=sm('ls',ls.x,ls.y), Rs=sm('rs',rs.x,rs.y);
  const sw = Math.max(Math.abs(Ls.x-Rs.x),60);
  const midShX=(Ls.x+Rs.x)/2, midShY=(Ls.y+Rs.y)/2;
  // head sideways offset (flipHorizontal:true → +x = kid's right / screen-right)
  let headDX=0; if(nose&&nose.score>MIN){ const N=sm('no',nose.x,nose.y); headDX=(N.x-midShX)/sw; }
  // shoulder tilt: (right.y - left.y)/sw ; >0 left higher, <0 right higher
  const shTilt=(Rs.y-Ls.y)/sw;
  // hips
  let hipDX=0, kneeY=null;
  if(lh&&rh&&lh.score>MIN&&rh.score>MIN){ const Lh=sm('lh',lh.x,lh.y), Rh=sm('rh',rh.x,rh.y);
    hipDX=(((Lh.x+Rh.x)/2)-midShX)/sw; }
  if(lk&&rk&&lk.score>MIN&&rk.score>MIN){ kneeY=Math.min(lk.y,rk.y); }
  else if(lk&&lk.score>MIN) kneeY=lk.y; else if(rk&&rk.score>MIN) kneeY=rk.y;
  // are the legs/hips in frame at all? (used so seated players aren't punished)
  det.lowerVisible = !!((lh&&lh.score>MIN)||(rh&&rh.score>MIN)||(lk&&lk.score>MIN)||(rk&&rk.score>MIN));
  // P1 — body-relative depth + framing quality (drives the step-back / lighting nudge)
  const vw=($('cam').videoWidth)||640;
  det.spanFrac   = sw/vw;                          // shoulder span as fraction of frame (small = too far)
  det.depthRatio = base.sw ? sw/base.sw : 1;       // >1 closer than calibration, <1 farther
  det.headConf   = nose ? nose.score : 0;
  det.framingOK  = det.present && det.joints>=8 && det.spanFrac>0.10;   // enough of the kid is clearly visible
  // store deltas vs baseline
  det.headDX = headDX - base.headDX;
  det.shTilt = shTilt - base.shTilt;
  det.hipDX  = hipDX  - base.hipDX;
  det.kneeLift = (kneeY!=null && base.kneeY) ? (base.kneeY - kneeY)/sw : 0; // up = +
  det._raw = { headDX, shTilt, hipDX, kneeY, sw };
  // motion from frame-to-frame keypoint travel
  if(prevKp){ let tot=0,c=0; for(let i=0;i<kps.length;i++){ if(kps[i].score>MIN&&prevKp[i]&&prevKp[i].score>MIN){ tot+=Math.hypot(kps[i].x-prevKp[i].x,kps[i].y-prevKp[i].y); c++; } } if(c) det.motion=0.6*det.motion+0.4*Math.min(1,(tot/c)/sw*3); }
  prevKp=kps.map(k=>({x:k.x,y:k.y,score:k.score}));
}

function calibrate(){
  // snapshot the neutral standing pose as the zero point
  const r=det._raw; if(!r) return;
  base.headDX=r.headDX; base.shTilt=r.shTilt; base.hipDX=r.hipDX; base.kneeY=r.kneeY||0; base.sw=r.sw; base.ok=true;
}

// ---- OVERLAY (skeleton) -------------------------------------------------
const SKELETON=[['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],
  ['right_shoulder','right_elbow'],['right_elbow','right_wrist'],['left_shoulder','left_hip'],
  ['right_shoulder','right_hip'],['left_hip','right_hip'],['left_hip','left_knee'],['left_knee','left_ankle'],
  ['right_hip','right_knee'],['right_knee','right_ankle']];
// map MoveNet video-pixel coords → on-screen canvas coords, accounting for the
// camera's object-fit:cover crop, so the skeleton lands ON the body.
function coverMap(){
  const v=$('cam'), c=$('overlay');
  const cw=c.clientWidth||1, ch=c.clientHeight||1, vw=v.videoWidth||640, vh=v.videoHeight||480;
  if(c.width!==cw||c.height!==ch){ c.width=cw; c.height=ch; }
  const scale=Math.min(cw/vw, ch/vh);   // contain — matches #cam object-fit:contain
  return { scale, ox:(cw-vw*scale)/2, oy:(ch-vh*scale)/2 };
}
function clearOverlay(){ const c=$('overlay'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
// map a cue (warm-up label OR game action) → which body keypoints to mark ON the kid
const CUE_PARTS = {
  'head':['nose'], 'head-left':['nose'], 'head-right':['nose'],
  'shoulder':['left_shoulder','right_shoulder'], 'shoulder-left':['left_shoulder','right_shoulder'], 'shoulder-right':['left_shoulder','right_shoulder'],
  'hips':['left_hip','right_hip'], 'hips-left':['left_hip','right_hip'], 'hips-right':['left_hip','right_hip'],
  'knee-left':['left_knee'], 'knee-right':['right_knee'],
  'clap':['left_wrist','right_wrist'], 'touch shoulder':['left_shoulder','right_shoulder'],
  'free':['nose','left_shoulder','right_shoulder','left_hip','right_hip'],   // freestyle = light up the WHOLE body
};
function cuePartsFor(key){ return CUE_PARTS[(key||'').toLowerCase()] || null; }
function drawSkeleton(kps){
  const c=$('overlay'); const x=c.getContext('2d'); const {scale,ox,oy}=coverMap();
  x.clearRect(0,0,c.width,c.height);
  // X is MIRRORED to match the selfie-flipped video (#cam transform:scaleX(-1)).
  // Without this the cues land on the horizontal mirror of the body (empty air).
  const X=p=> c.width - (p.x*scale+ox), Y=p=>p.y*scale+oy;
  const m={}; kps.forEach(k=>m[k.name]=k);
  // SUBTLE base skeleton (the bright-green version looked "funny")
  x.strokeStyle='rgba(120,255,190,.26)'; x.lineWidth=2;
  SKELETON.forEach(([a,b])=>{ const A=m[a],B=m[b]; if(A&&B&&A.score>0.25&&B.score>0.25){ x.beginPath(); x.moveTo(X(A),Y(A)); x.lineTo(X(B),Y(B)); x.stroke(); }});
  x.fillStyle='rgba(255,95,216,.45)';
  kps.forEach(k=>{ if(k.score>0.25){ x.beginPath(); x.arc(X(k),Y(k),3,0,7); x.fill(); }});
  // DEBUG: bright cyan tracking dots so we can SEE where the mapping puts each joint.
  // (Temporary calibration aid — remove once the aura lands on the body.)
  if(window.__DOTS){ kps.forEach(k=>{ if(k.score>0.2){ const px=X(k),py=Y(k);
    x.beginPath(); x.arc(px,py,7,0,7); x.fillStyle='rgba(0,240,255,.95)'; x.fill();
    x.lineWidth=2; x.strokeStyle='rgba(0,0,0,.75)'; x.stroke();
    if(k.name==='nose'||k.name==='left_shoulder'||k.name==='right_shoulder'){
      x.font='bold 13px system-ui'; x.fillStyle='#fff'; x.textAlign='left'; x.textBaseline='middle';
      x.fillText(k.name.replace('_',' '), px+11, py); } }}); }
  // CUE → kid: LIGHT UP the actual body part (glowing limb segments) + a direction arrow.
  hideAuras();                 // not using the HTML circle-auras anymore
  drawSmartLight(x, m, X, Y);
}

// ── NOVA SMART LIGHT ── focus ring + direction arrow + live motion trail, drawn ON
// the cued body part (per nova-smart-light.md). Condensed, tracks the keypoint,
// colour = cue state. Never a floating text box; always fades when the cue clears.
const LIGHT_COL = { armed:'255,170,0', hit:'0,255,136', messy:'255,155,61', miss:'255,77,109', streak:'255,111,216' };
let _trail = [];            // FIFO of recent anchor {x,y} (motion trail)
let _anchorSmooth = null;   // smoothed anchor (reduce jitter)
function resetSmartLight(){ _trail.length=0; _anchorSmooth=null; }
function smartAnchor(cueKey, m){
  const mid=(a,b)=> (a&&b&&a.score>0.2&&b.score>0.2) ? {x:(a.x+b.x)/2,y:(a.y+b.y)/2,score:Math.min(a.score,b.score)} : (a&&a.score>0.2?a:(b&&b.score>0.2?b:null));
  if(/head/.test(cueKey)) return m.nose&&m.nose.score>0.2?m.nose:null;
  if(/shoulder/.test(cueKey)) return mid(m.left_shoulder,m.right_shoulder);
  if(/hip/.test(cueKey)) return mid(m.left_hip,m.right_hip);
  if(/knee/.test(cueKey)){ const k=/left/.test(cueKey)?m.left_knee:m.right_knee; return k&&k.score>0.2?k:null; }
  return m.nose&&m.nose.score>0.2?m.nose:null;   // free → head
}
function drawSmartLight(ctx, m, X, Y){
  const cueKey=(window.__cuePart||'');
  if(!cueKey){ resetSmartLight(); return; }
  const state=window.__cueState||'armed';
  const col=LIGHT_COL[state]||LIGHT_COL.armed;
  const isShoulder=/shoulder/.test(cueKey), isFree=/free/.test(cueKey);
  const dir=/right/i.test(cueKey)?1:(/left/i.test(cueKey)?-1:0);
  const a=smartAnchor(cueKey,m); if(!a){ return; }
  // smooth + trail
  const px=X(a), py=Y(a);
  if(!_anchorSmooth) _anchorSmooth={x:px,y:py}; else { _anchorSmooth.x=_anchorSmooth.x*0.55+px*0.45; _anchorSmooth.y=_anchorSmooth.y*0.55+py*0.45; }
  const cx=_anchorSmooth.x, cy=_anchorSmooth.y;
  _trail.push({x:cx,y:cy}); if(_trail.length>12) _trail.shift();
  const pulse=0.5+0.5*Math.sin(performance.now()/240);
  // 1) TRAIL — glowing streak through recent motion, fades head→tail
  if(_trail.length>2){ ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.shadowBlur=14; ctx.shadowColor='rgba('+col+',.85)';
    for(let i=1;i<_trail.length;i++){ const al=i/_trail.length;
      ctx.strokeStyle='rgba('+col+','+(al*0.8).toFixed(2)+')'; ctx.lineWidth=2+5*al;
      ctx.beginPath(); ctx.moveTo(_trail[i-1].x,_trail[i-1].y); ctx.lineTo(_trail[i].x,_trail[i].y); ctx.stroke(); }
    ctx.restore(); }
  // 2) FOCUS RING — condensed glowing ring on the keypoint (+ soft fill)
  const r=24+4*pulse;
  ctx.save(); ctx.shadowBlur=18; ctx.shadowColor='rgba('+col+',.9)';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.lineWidth=5; ctx.strokeStyle='rgba('+col+','+(0.85+0.15*pulse)+')'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.5,0,7); ctx.fillStyle='rgba('+col+',0.16)'; ctx.fill();
  ctx.restore();
  // 3) DIRECTION ARROW — only while armed (fades on resolve)
  if(state==='armed' && !isFree){
    const glyph = isShoulder ? '↑' : (dir>0?'→':dir<0?'←':'↔');
    const off=r+34, ax= isShoulder? cx : cx+dir*off, ay= isShoulder? cy-off : cy;
    ctx.save(); ctx.shadowBlur=12; ctx.shadowColor='rgba('+col+',.9)'; ctx.font='900 40px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.strokeText(glyph,ax,ay);
    ctx.fillStyle='rgba('+col+',0.96)'; ctx.fillText(glyph,ax,ay); ctx.restore();
  }
}

// ── KEYPOINT-ANCHORED AURA CUES ─────────────────────────────────────────
// Drives real HTML/CSS elements (transparent "lighten-up" glow + glowing arrow)
// so each cue sits ON the body part via the live MoveNet keypoints — pretty,
// GPU-smooth, never covers the kid (transparent centre + screen-blend = lighten).
const AURA_FREE_PARTS = ['nose','left_shoulder','right_shoulder'];
function positionAuras(m, X, Y){
  const auras = document.querySelectorAll('#aura-layer .aura');
  const cueKey=(window.__cuePart||'');
  const isFree=/free/i.test(cueKey), isSide=/head|hips/i.test(cueKey);   // head + hips = side-to-side; shoulder = up
  const dir=/right/i.test(cueKey)?1:(/left/i.test(cueKey)?-1:0);
  const parts = !cueKey ? [] : isFree ? AURA_FREE_PARTS : (cuePartsFor(cueKey)||[]);
  const COL = isFree ? '255,216,77' : dir<0 ? '90,170,255' : dir>0 ? '255,95,216' : '255,216,77'; // LEFT blue / RIGHT pink / gold
  const glyph = isFree ? '' : isSide ? (dir>0?'→':dir<0?'←':'↔') : '↑';
  const full=$('aura-full'); if(full) full.classList.toggle('on', isFree);
  // SMART SIZING: scale the glow to the kid's actual body (shoulder width on screen),
  // so it fits whether they're close or far — not a fixed blob.
  const ls=m['left_shoulder'], rs=m['right_shoulder'];
  const shoulderPx = (ls&&rs&&ls.score>0.2&&rs.score>0.2) ? Math.abs(X(ls)-X(rs)) : 0;
  const bodyW = shoulderPx>20 ? shoulderPx : 200;          // fallback if shoulders not seen
  const headSize = Math.max(60, Math.min(210, bodyW*0.74));  // subtle: rings the head, not a big circle
  const partSize = Math.max(46, Math.min(150, bodyW*0.44));  // shoulder/hip glow = smaller still
  let i=0;
  parts.forEach(n=>{ const k=m[n], a=auras[i]; if(!a) return;
    if(k && k.score>0.12){
      const isHeadPart = n==='nose';
      const size = isHeadPart ? headSize : partSize;
      a.style.setProperty('--c',COL);
      a.style.setProperty('--x', X(k).toFixed(1)+'px');
      a.style.setProperty('--y', Y(k).toFixed(1)+'px');
      a.style.setProperty('--size', size.toFixed(0)+'px');
      const ar=a.querySelector('.arrow');
      if(ar){ ar.textContent=glyph;
        // small arrow sits just OUTSIDE the glow, toward the target direction
        ar.style.setProperty('--ax', (isSide?dir*(size*0.62):0).toFixed(0)+'px');
        ar.style.setProperty('--ay', (isSide?0:-(size*0.62)).toFixed(0)+'px'); }
      a.classList.add('on'); i++;
    }
  });
  for(; i<auras.length; i++) auras[i].classList.remove('on');
}
function hideAuras(){ document.querySelectorAll('#aura-layer .aura.on').forEach(a=>a.classList.remove('on'));
  const f=$('aura-full'); if(f) f.classList.remove('on'); }

// ---- GAME FLOW ----------------------------------------------------------
async function startFlow(){
  $('start-btn').disabled=true; $('cam-warn').textContent='loading…';
  logPost('start',{ ua:navigator.userAgent, w:innerWidth, h:innerHeight });
  if(!/[?&]nonova/.test(location.search)) connectNova();   // ?nonova = game only, skip Nova
  const okCam=await ensureCamera(); if(!okCam){ $('start-btn').disabled=false; return; }
  // non-fatal: if the model is slow/unreachable, proceed anyway (pose just won't fire)
  await Promise.race([ ensureModel().catch(()=>{}), new Promise(r=>setTimeout(r,12000)) ]);
  $('cam-warn').textContent='';
  readAge();                                 // P3: indirect age read (fire & forget; updates worker)
  $('start-screen').classList.add('hidden');
  showGreet();                               // Phase 1: Nova's live avatar greets the kid (camera on)
}

// Phase 1 — live Nova says hi BEFORE any dance video. Camera is on so she "sees" the kid.
// Pose detection is NOT running yet (MoveNet would starve the CPU and choppy her greeting).
function showGreet(){
  window.__novaRevealed=false; window.__novaVideoArrived=false; window.__novaAudioArrived=false;
  $('greet-screen').classList.remove('hidden');
  const gc=$('greet-cam'); if(gc && camStream){ try{ gc.srcObject=camStream; gc.play().catch(()=>{}); }catch(e){} }
  greetStatus('waking Nova…');
  // gentle wait feedback while the worker cold-starts (~45s). Button is always tappable.
  setTimeout(()=>{ if(!window.__novaRevealed && !window.__danceStarted) greetStatus('almost there… (or tap Let\'s Dance)'); }, 9000);
}
function greetStatus(t){ const e=$('greet-status'); if(e) e.textContent=t||''; }

// "Let's Dance!" → leave the greet into the game. Detection starts NOW (not during the
// greet) so her greeting audio stays clean.
async function startDance(){
  if(window.__danceStarted) return; window.__danceStarted=true;
  $('greet-screen').classList.add('hidden');
  try{ $('greet-cam').srcObject=null; }catch(e){}
  // debug monitor: devs only (add ?debug to the URL). Kids never see the joints HUD.
  if(/[?&]debug/.test(location.search)) $('dbg').classList.remove('hidden');
  window.__DOTS = /[?&](dots|debug)/.test(location.search);   // calibration dots OFF by default (enable with ?dots)
  $('game').classList.remove('hidden');
  $('score-box').style.visibility='hidden'; $('combo-box').style.visibility='hidden'; // no score during warm-up
  cancelAnimationFrame(rafId); poseLoop();   // detection on
  await framingGate();                        // P2: make sure she can actually SEE the kid first
  await runWarmup();                         // Phase 1b: guided isolation warm-up
  await countdown();
  beginGame();
}

function _sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// P2 — STEP-BACK / FRAMING GATE: gentle check that detection can see the kid before
// play. Auto-advances when framed ~1.5s, OR after an 8s hard cap so kids NEVER stick.
async function framingGate(){
  const deadline=performance.now()+8000; let goodSince=0, last='';
  const show=t=>{ if(t!==last){ last=t; coach(t); } };
  show('let me see you... 💜');
  while(performance.now()<deadline){
    if(det.framingOK){ if(!goodSince) goodSince=performance.now(); if(performance.now()-goodSince>1500) break; }
    else { goodSince=0;
      if(!det.present)             show('step in front of the camera 💜');
      else if(det.joints<7)        show('a little more light on you? 💡');
      else if(det.spanFrac>0.40)   show('scoot back so I can see you!');
      else                         show('get your head & shoulders in view 💜');
    }
    await _sleep(350);
  }
  show("perfect — let's GO!"); await _sleep(500);
}

// Guided isolation warm-up — Nova walks the kid through each body part before the
// song. Forgiving on purpose (it's practice): the specific signal OR any movement
// counts, so every kid succeeds and gets cheered. Detection is ON; no scoring.
// P5 — age-adaptive bonding action menus (from the nova-intro spec). Detection is
// forgiving (specific signal OR motion) since the warm-up is practice, not scoring.
// P5 (rebuilt): SEATED UPPER-BODY moves only — the kid might be sitting, so NO
// legs / standing / spins. Very forgiving (specific signal OR any motion) because
// the warm-up is practice, not scoring — every kid succeeds and gets cheered.
// Thresholds are LOW on purpose: backlit rooms + partial pose tracking (9/17 joints)
// mean strict checks never fire. 'voice:true' = a sound move (yoo-hoo), motion-loose.
const WARMUP_MENUS = {
  LITTLE: [
    { emoji:'👏', label:'CLAP',           say:'clap your hands!',           check:d=> d.motion>0.045 },

    { emoji:'🙂', label:'HEAD',           say:'move your head!',            check:d=> Math.abs(d.headDX)>0.05 || d.motion>0.045 },
    { emoji:'🤷', label:'SHOULDER',       say:'pop one shoulder up!',       check:d=> Math.abs(d.shTilt)>0.03 || d.motion>0.045 },
    { emoji:'🫳', label:'TOUCH SHOULDER', say:'touch your LEFT shoulder!',  check:d=> d.motion>0.05 },
  ],
  KID: [

    { emoji:'🙂', label:'HEAD',           say:'move your head!',            check:d=> Math.abs(d.headDX)>0.055 || d.motion>0.05 },
    { emoji:'🤷', label:'SHOULDER',       say:'pop one shoulder!',          check:d=> Math.abs(d.shTilt)>0.035 || d.motion>0.05 },

    { emoji:'🤷', label:'SHOULDER',       say:'pop one shoulder',           check:d=> Math.abs(d.shTilt)>0.04 || d.motion>0.05 },
    { emoji:'🙂', label:'HEAD',           say:'head — side to side',        check:d=> Math.abs(d.headDX)>0.06 || d.motion>0.05 },
    { emoji:'🫳', label:'TOUCH SHOULDER', say:'touch your left shoulder',   check:d=> d.motion>0.05 },
  ],
  ADULT: [

    { emoji:'🙂', label:'HEAD',     say:'head side to side',  check:d=> Math.abs(d.headDX)>0.06 || d.motion>0.05 },

};
function warmupMenu(){ return WARMUP_MENUS[AGE_TIER] || WARMUP_MENUS.KID; }
async function runWarmup(){
  coach('warm up with me! 💜'); await _sleep(700); calibrate();
  for(const w of warmupMenu()){ await warmupCue(w); }
  coach("now let's DANCE!"); if(!novaRoom) say("now let's dance!"); await _sleep(1100);
}
function warmupCue(w){
  return new Promise(res=>{
    $('cue-figure').innerHTML = `<div style="font-size:84px;line-height:1.1">${w.emoji}</div>`;
    $('cue-label').textContent = w.label;
    $('cue').classList.add('show');
    setZone('full','armed');
    $('cam-wrap').classList.remove('hit','miss'); $('cam-wrap').classList.add('armed');
    const bar=$('cue-timer'); bar.style.transition='none'; bar.style.transform='scaleX(1)'; void bar.offsetWidth;
    const MAXMS=3800; bar.style.transition=`transform ${MAXMS}ms linear`; bar.style.transform='scaleX(0)';
    window.__cuePart=w.label;   // mark this body part ON the kid (subtle overlay highlight)
    coach(w.say); if(!novaRoom) say(w.say);
    // tell the brain a move is coming so she names the body part live
    novaSend({ kind:'game-event', event:{ event:'move_cue', action:w.label.toLowerCase() } });
    const t0=performance.now(); let done=false;
    const finish=ok=>{ if(done) return; done=true; clearInterval(iv); window.__cuePart=null;
      $('cam-wrap').classList.remove('armed'); $('cam-wrap').classList.add('hit'); setZone('full','hit');
      // ALWAYS celebrate — warm-up is practice, never a fail. Instant local pop so
      // Nova is NEVER silent, PLUS a result to the brain so she reacts specifically.
      pop(ok?'YES!':'nice try!', '#00ff99'); if(!novaRoom) say(ok?'yes!':'nice!');
      novaSend({ kind:'game-event', event:{ event:'move_done', action:w.label.toLowerCase(), hit:ok } });
      setTimeout(()=>{ $('cue').classList.remove('show'); setZone(null); $('cam-wrap').classList.remove('hit'); res(); }, 650); };
    const iv=setInterval(()=>{ if(det.present && w.check(det,base)) finish(true); else if(performance.now()-t0>MAXMS) finish(false); }, 70);
  });
}

function playIntro(){
  return new Promise(res=>{
    const scr=$('intro-screen'), v=$('intro-vid');
    if(!scr||!v){ res(); return; }
    scr.classList.remove('hidden');
    let done=false;
    const finish=()=>{ if(done) return; done=true; clearTimeout(safety); try{ v.pause(); }catch(e){} scr.classList.add('hidden'); res(); };
    const safety=setTimeout(finish, 15000);   // hard cap — NEVER hang here
    v.onended=finish; v.onerror=finish; $('intro-skip').onclick=finish;
    try{ v.currentTime=0; }catch(e){}
    v.muted=true;                              // muted autoplay is always allowed → never blocks
    const p=v.play();
    if(p&&p.catch) p.catch(()=>finish());      // if it still won't play, just skip to the game
    setTimeout(()=>{ try{ if(!done){ v.muted=false; v.volume=0.9; } }catch(e){} }, 350); // unmute once rolling
  });
}

function countdown(){
  return new Promise(res=>{
    $('countdown').classList.remove('hidden');
    const num=$('cd-num'), sub=$('cd-sub'); let n=3;
    const step=()=>{
      if(n>0){ num.textContent=n; num.style.animation='none'; void num.offsetWidth; num.style.animation='cdPop .9s ease-out';
        sub.textContent = n===3?'stand back, I can see you':'get ready…'; n--; setTimeout(step,900); }
      else { num.textContent='GO!'; sub.textContent='copy Nova!'; calibrate(); // zero-point on the neutral stance
        setTimeout(()=>{ $('countdown').classList.add('hidden'); res(); },700); }
    };
