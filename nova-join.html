  });
}

function beginGame(){
  Object.assign(game,{ running:true, score:0, combo:0, maxCombo:0, hits:0, total:0, idx:0, cue:null, cueResolved:false, cueEnd:0, cueZone:null, log:[], _readyShown:false });
  $('score').textContent='0'; $('combo-box').textContent='x0'; $('progress').style.width='0%';
  $('score-box').style.visibility='visible'; $('combo-box').style.visibility='visible'; // score shows now (real game)
  $('game').classList.remove('hidden');
  const nv=$('nova-vid'); nv.muted=false; nv.volume=0.8; nv.loop=false;
  try{ nv.currentTime=VIDEO_START; }catch(e){}
  nv.onended=endGame;
  nv.play().catch(()=>{ /* retry on next tick */ setTimeout(()=>nv.play().catch(()=>{}),200); });
  coach('Watch Nova — copy her when a card pops up!');
  novaSend({ kind:'game-event', event:{ event:'phase', phase:'dance' } });
  clearInterval(game.tick); game.tick=setInterval(gameTick,60);
}

function gameTick(){
  if(!game.running) return;
  const nv=$('nova-vid'); const now=nv.currentTime*1000;
  // dynamic focus (this song): Nova starts FAR/small and walks close by ~26s.
  // Zoom in early so she's big, ease back to 1.0 as she arrives.
  const z = nv.currentTime<26 ? (1.55 - 0.55*Math.min(1, nv.currentTime/26)) : 1.0;
  nv.style.transform = 'scale('+z.toFixed(3)+')';
  const span=(SONG_END-VIDEO_START)*1000;
  $('progress').style.width=Math.min(100,((nv.currentTime-VIDEO_START)/(SONG_END-VIDEO_START))*100)+'%';
  if(nv.currentTime>=SONG_END){ endGame(); return; }

  // intro lead-in — let the kid anticipate the very first move
  if(game.idx===0 && !game.cue && !game._readyShown && CUES.length){
    const lead=CUES[0].t-now;
    if(lead<=3500 && lead>300){ game._readyShown=true; coach('Get ready… first move!'); }
  }

  // open next cue
  if(!game.cue && game.idx<CUES.length && now>=CUES[game.idx].t){
    openCue(CUES[game.idx]);
  }
  // live-check active cue
  if(game.cue){
    // P3: track how much the NON-cued anchors drift during the window (less = cleaner isolation)
    if(game.cueStart){ const o=ISO_OTHERS[game.cue.action];
      if(o){ let mx=0; o.forEach(k=>{ mx=Math.max(mx, Math.abs((det[k]||0)-(game.cueStart[k]||0))); }); if(mx>game.cueMaxOther) game.cueMaxOther=mx; } }
    if(!game.cueResolved && MOVES[game.cue.action].check(det, base) && det.present){ resolveHit(); }
    if(now>=game.cueEnd){
      if(!game.cueResolved){
        const m=MOVES[game.cue.action];
        if(m.visual){ resolveHit(); }                               // hips: visual-only, always passes
        else if(m.needs==='lower' && !det.lowerVisible){ coachStand(); }  // legs off-camera → don't punish
        else resolveMiss();
      }
      closeCue();
    }
  }
}

// P3 ISOLATION SCORING — the "dance-teacher x-ray": for each cue, which anchors
// must stay STILL (the non-cued ones). Clean isolation = cued part moved, others didn't.
const ISO_OTHERS = { 'head-left':['shTilt','hipDX'], 'head-right':['shTilt','hipDX'],
  'shoulder-left':['headDX','hipDX'], 'shoulder-right':['headDX','hipDX'],
  'hips-left':['headDX','shTilt'], 'hips-right':['headDX','shTilt'] };
const ISO_TOL = 0.13;   // 'other' movement at/above this = messy (isolation → 0)
function openCue(c){
  game.cue=c; game.cueResolved=false; game.cueEnd=c.t+c.dur; game.total++;
  window.__cuePart=c.action;   // mark the cued body part ON the kid (overlay highlight)
  game.cueStart={ headDX:det.headDX, shTilt:det.shTilt, hipDX:det.hipDX }; game.cueMaxOther=0;  // P3 isolation baseline
  window.__cueState='armed'; resetSmartLight();   // smart-light: new cue → armed (yellow), fresh trail
  const m=MOVES[c.action];
  // NO floating text card — the cue is drawn ON the kid's body (halo + arrow + center line).
  $('cue-figure').innerHTML=''; $('cue-label').textContent='';
  $('cue').classList.add('show','lean');   // thin timer bar only
  $('cam-wrap').classList.remove('hit','miss'); $('cam-wrap').classList.add('armed');
  game.cueZone = ZONE[c.action]; setZone(game.cueZone,'armed');
  novaSend({ kind:'game-event', event:{ event:'move_cue', action:c.action } });
  // timer bar shrink across the window
  const bar=$('cue-timer'); bar.style.transition='none'; bar.style.transform='scaleX(1)';
  void bar.offsetWidth; bar.style.transition=`transform ${c.dur}ms linear`; bar.style.transform='scaleX(0)';
  coach(m.coach);
  // announce locally ONLY when Nova's live brain is offline (else she'd be doubled)
  if(!novaRoom) say(m.name.replace(/[←→↑↔]/g,'').trim());
}
function closeCue(){ game.cue=null; window.__cuePart=null; hideAuras(); $('cue').classList.remove('show','lean'); $('cam-wrap').classList.remove('armed'); setZone(null); game.idx++; }

// per-cue telemetry — captures the detection values at the moment of resolve so we
// can see exactly WHERE detection is weak (e.g. knee always missing = legs off-frame)
function logCue(result){
  const c=game.cue; if(!c) return;
  game.log.push({ action:c.action, result, headDX:+det.headDX.toFixed(3), shTilt:+det.shTilt.toFixed(3),
    hipDX:+det.hipDX.toFixed(3), kneeLift:+det.kneeLift.toFixed(3), motion:+det.motion.toFixed(3),
    joints:det.joints||0, present:det.present });
  logPost('cue', game.log[game.log.length-1]);
}

function resolveHit(){
  game.cueResolved=true;
  const m=MOVES[game.cue.action];
  const fast=(game.cueEnd-$('nova-vid').currentTime*1000)>game.cue.dur*0.45;
  // P3 ISOLATION QUALITY = 0.5 direction (it's a hit) + 0.3 isolation + 0.2 timing → 0.6..1.0
  const iso=Math.max(0,Math.min(1,1-(game.cueMaxOther||0)/ISO_TOL));
  const quality=0.5 + 0.3*iso + 0.2*(fast?1:0.6);
  game.lastQuality=quality; const clean=quality>=0.85;
  window.__cueState = clean ? (game.combo>=3?'streak':'hit') : 'messy';   // smart-light colour
  game.cleanHits=(game.cleanHits||0)+(clean?1:0);
  const pts=Math.round(m.pts*(fast?1.5:1)*(clean?1.25:1)*(1+Math.min(game.combo,8)*0.1)); // isolation bonus
  game.score+=pts; game.hits++; game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
  $('score').textContent=game.score;
  const cb=$('combo-box'); cb.textContent='x'+game.combo; cb.classList.remove('pulse'); void cb.offsetWidth; cb.classList.add('pulse');
  $('cam-wrap').classList.remove('armed'); $('cam-wrap').classList.add('hit'); zoneState('hit');
  pop(clean?('CLEAN! +'+pts):((fast?'PERFECT ':'+')+pts), (clean||fast)?'#ffd84d':'#00ff99');
  logCue(clean?'hit-clean':'hit');
  flashNovaFace();   // her FACE reacts EVERY hit (alive) — but she SPEAKS far less:
  // only on milestones (first / 3 / 5 / 10) or a throttled clean isolation.
  const _n=performance.now();
  const milestone = game.combo===1 || game.combo===3 || game.combo===5 || game.combo===10;
  if(milestone){
    novaSend({ kind:'game-event', event:{ event:(game.combo===1?'first_hit':'streak'),
      action:game.cue&&game.cue.action, streak:game.combo, fast, quality:+quality.toFixed(2), clean } });
  } else if(clean && _n-(window.__lastCleanVoice||0)>6000){
    window.__lastCleanVoice=_n;
    novaSend({ kind:'game-event', event:{ event:'streak', action:game.cue&&game.cue.action, streak:game.combo, fast, quality:+quality.toFixed(2), clean:true } });
  }
  novaLocalReact('hit', game.combo, fast);
}
function resolveMiss(){
  window.__cueState='miss';   // smart-light colour (soft red, gentle)
  game.combo=0; $('combo-box').textContent='x0';
  $('cam-wrap').classList.remove('armed'); $('cam-wrap').classList.add('miss'); zoneState('miss');
  pop('miss','#ff4d6d');
  logCue('miss');
  // talk less: don't say "miss" every single time — throttle to once / 5s
  const _n=performance.now();
  if(_n-(window.__lastMissVoice||0)>5000){ window.__lastMissVoice=_n;
    novaSend({ kind:'game-event', event:{ event:'miss', action:game.cue&&game.cue.action } }); }
  novaLocalReact('miss');
}

function endGame(){
  if(!game.running) return; game.running=false;
  clearInterval(game.tick);
  try{ $('nova-vid').pause(); }catch(e){}
  // P9 — feed the session's real moments to Nova so her goodbye calls them back
  try{
    const hits=game.log.filter(e=>e.result==='hit').map(e=>e.action);
    const cnt={}; hits.forEach(a=>cnt[a]=(cnt[a]||0)+1);
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,2);
    if(top.length){ const clean=(game.cleanHits||0);
      const moment=top.map(a=>`${a.replace(/-/g,' ')} x${cnt[a]}`).join(', ')+(game.maxCombo>=3?`, ${game.maxCombo}-combo`:'')+(clean>=2?`, ${clean} CLEAN isolations`:'');
      novaSend({ kind:'game-event', event:{ event:'best_moment', moment } }); }
  }catch(e){}
  novaSend({ kind:'game-event', event:{ event:'phase', phase:'goodbye' } });
  setTimeout(disconnectNova, 9000);   // let Nova say goodbye, then drop the session
  const rate=game.total?game.hits/game.total:0;
  const stars=rate>=0.85?5:rate>=0.65?4:rate>=0.45?3:rate>=0.25?2:1;
  $('end-stars').textContent='⭐'.repeat(stars)+'☆'.repeat(5-stars);
  $('end-title').textContent=['Good try!','Nice moves!','Great dancing!','Amazing!','PERFECT! 🔥'][stars-1];
  $('end-score').textContent=game.score+' pts';
  $('end-detail').textContent=`${game.hits} of ${game.total} moves · best combo x${game.maxCombo}`+((game.cleanHits||0)?` · ${game.cleanHits} CLEAN ✨`:'');
  const hooks=['tomorrow I\'ll teach you the SPIN 🌀','next time: the ROBOT 🤖','come back for the WAVE 🌊'];
  $('end-hook').textContent=hooks[(game.maxCombo+game.hits)%hooks.length];

  // P10 memory: remember THIS session so next time feels continuous
  try{
    const moves=[...new Set(game.log.filter(e=>e.result==='hit').map(e=>e.action))].slice(0,3);
    const topMove=moves[0]||''; const obs=topMove?`you're a ${topMove.replace(/-/g,' ')} mover`:'';
    saveMem({ sessions_count:(MEM.sessions_count||0)+1, age_tier:AGE_TIER,
      best_moments:[...moves, ...((MEM.best_moments)||[])].slice(0,5),
      last_promise:$('end-hook').textContent, next_session_focus:$('end-hook').textContent,
      last_observation:obs, last_clean:(game.cleanHits||0), last_score:game.score });
  }catch(e){}

  // per-move breakdown — shows WHERE detection is limited (hit rate + avg joints seen)
  const by={};
  game.log.forEach(e=>{ const b=by[e.action]||(by[e.action]={n:0,hit:0,j:0}); b.n++; if(e.result==='hit')b.hit++; b.j+=e.joints; });
  $('end-table').innerHTML = Object.keys(by).map(a=>{ const b=by[a]; const cls=(b.hit/b.n)>=0.5?'good':'bad';
    return `<div class="${cls}">${a.padEnd(15)} ${b.hit}/${b.n}  joints~${Math.round(b.j/b.n)}/17</div>`; }).join('') || '(no cues ran)';

  const summary={ date:new Date().toISOString(), score:game.score, hits:game.hits, total:game.total,
    maxCombo:game.maxCombo, thresholds:THRESH, byAction:by, log:game.log };
  window.__lastSession=summary;
  logPost('end', summary);
  console.log('[nova-join session]', summary);
  try{ const arr=JSON.parse(localStorage.getItem('nova_join_logs')||'[]');
    arr.push({date:summary.date,score:summary.score,hits:summary.hits,total:summary.total,byAction:by});
    localStorage.setItem('nova_join_logs', JSON.stringify(arr.slice(-10))); }catch(e){}

  startClosing();   // P8/P5: Nova grows to center & says goodbye, THEN the (secondary) recap
}
// P5 closing-mode + P8 beat 1: hold on Nova's face center while her live goodbye plays,
// then reveal the small recap. If she's offline, skip straight to the recap.
function startClosing(){
  const nl=$('nova-live'); const live = nl && nl.classList.contains('show');
  if(live){
    let veil=$('closing-veil'); if(!veil){ veil=document.createElement('div'); veil.id='closing-veil'; document.body.appendChild(veil); }
    veil.classList.add('show'); nl.classList.add('closing');
  }
  setTimeout(()=>{ const n2=$('nova-live'); if(n2) n2.classList.remove('closing');
    const v=$('closing-veil'); if(v) v.classList.remove('show');
    $('game').classList.add('hidden'); $('end-screen').classList.remove('hidden'); }, live?4800:500);
}

// ---- small helpers ------------------------------------------------------
function pop(text,color){ const fx=$('fx'); const e=document.createElement('div'); e.className='pop'; e.textContent=text; e.style.color=color;
  e.style.left=(20+Math.random()*55)+'%'; e.style.top=(30+Math.random()*30)+'%'; fx.appendChild(e); setTimeout(()=>e.remove(),900); }
let coachT=0; function coach(msg){ const c=$('coach'); c.textContent=msg; c.classList.add('show'); clearTimeout(coachT); coachT=setTimeout(()=>c.classList.remove('show'),1800); }
let _standT=0; function coachStand(){ const n=Date.now(); if(n-_standT<6000) return; _standT=n; coach('stand back so I can see your legs! 🦵'); }
// local reactions so Nova still feels alive when her live worker is offline
const REACT={ hit:['yes!','nice!','got it!','woo!','there!'], fast:['so fast!','boom!','wow!'],
  streak:["you're on fire!",'amazing!','keep going!','yesss!'], miss:['almost!','try again!','you got this!'] };
function novaLocalReact(kind,combo,fast){ if(novaRoom) return; // Nova's live brain handles it when online
  let arr = kind==='miss'?REACT.miss : (combo>=3?REACT.streak : (fast?REACT.fast:REACT.hit));
  const t=arr[Math.floor(Math.random()*arr.length)]; coach(t); say(t); }
// her FACE reacts on every hit (quick green pulse) so she stays alive while SPEAKING less
function flashNovaFace(){ const e=$('nova-live'); if(!e) return; e.classList.remove('react'); void e.offsetWidth; e.classList.add('react'); setTimeout(()=>{ try{e.classList.remove('react');}catch(_){} },650); }
let lastSay=0; function say(t){ if(/[?&](nonova|novoice)/.test(location.search)) return;   // silence TTS for testing
  const now=Date.now(); if(now-lastSay<1300) return; lastSay=now; // light voice; safe in a cafe (muted-friendly: low volume)
  try{ if('speechSynthesis'in window){ const u=new SpeechSynthesisUtterance(t); u.rate=1.05; u.pitch=1.3; u.volume=0.55; speechSynthesis.speak(u);} }catch(e){} }

// ════════════════════════════════════════════════════════════════════════
// LIVE NOVA — worker session + Runway avatar (like hello-hello). Optional &
// graceful: the game runs fine if she's cold/offline; she joins when ready and
// reacts to game events. No mic published — she reacts to your DANCING, not noise.
// ════════════════════════════════════════════════════════════════════════
const NOVA = { RENDER_URL:'https://novapython.onrender.com' };
let novaRoom=null, novaConnecting=false;
function novaStatus(t){ const e=$('nova-status'); if(e){ e.textContent=t||''; e.style.display=t?'block':'none'; } }
function novaSend(payload){ if(!novaRoom) return; try{ novaRoom.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(payload)),{reliable:true}); }catch(e){} }

// Audio autoplay rescue — if the browser blocks Nova's audio, show a tappable
// button so the kid can ALWAYS hear her (silent-fail = dead Nova). One tap fixes it.
function showTapToHear(a){
  if(document.getElementById('tap-hear')) return;
  const b=document.createElement('button'); b.id='tap-hear'; b.textContent='🔊 tap to hear Nova';
  b.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;'
    +'padding:14px 22px;border:0;border-radius:999px;background:#8b5cf6;color:#fff;font-size:17px;'
    +'font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.45);cursor:pointer';
  b.onclick=()=>{ try{ a.muted=false; a.volume=1.0; a.play(); }catch(e){} b.remove(); };
  document.body.appendChild(b);
}
// any tap anywhere also tries to resume Nova's audio (covers mobile autoplay locks)
document.addEventListener('pointerdown', ()=>{ const a=window.__novaAudioEl; if(a&&a.paused){ try{ a.muted=false; a.play().catch(()=>{}); }catch(e){} } }, {passive:true});

// PERCEIVED SPEED: instant "she heard you / thinking" cue. Runway's ~0.5s lipsync +
// ~1s LLM are a hard floor, so we can't make her actually faster — but showing this
// the MOMENT the kid stops talking makes the wait feel alive, not dead. Auto-hides.
(function(){ const st=document.createElement('style');
  st.textContent='@keyframes thinkDot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}'; document.head.appendChild(st); })();
let _thinkT=0;
function showThinking(on){
  let e=document.getElementById('nova-think');
  if(!e){ e=document.createElement('div'); e.id='nova-think';
    e.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;display:none;gap:7px;padding:10px 18px;background:rgba(40,0,70,.6);border-radius:999px;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(255,95,216,.35)';
    const dot='width:10px;height:10px;border-radius:50%;background:#ff8ae2;display:inline-block;animation:thinkDot 1s infinite';
    e.innerHTML='<i style="'+dot+'"></i><i style="'+dot+' .15s"></i><i style="'+dot+' .3s"></i>';
    document.body.appendChild(e); }
  clearTimeout(_thinkT);
  if(on){ e.style.display='flex'; _thinkT=setTimeout(()=>{ e.style.display='none'; }, 6000); }  // safety auto-hide
  else e.style.display='none';
}

async function connectNova(initialPhase='recognition'){
  if(novaRoom||novaConnecting||typeof LivekitClient==='undefined') return;
  novaConnecting=true; novaStatus('waking Nova…');
  window.__novaConnectStart=performance.now();   // latency: measure wake/cold-start time
  try{
    if(!window.__kidId) window.__kidId='nova-join-'+Date.now();
    const res=await fetch(NOVA.RENDER_URL+'/v2/create-session',{ method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kidId:window.__kidId }) });
    if(!res.ok) throw new Error('create-session '+res.status);
    const creds=await res.json();
    if(!creds.serverUrl||!creds.token) throw new Error('no creds');
    window.__novaSessionId=creds.sessionId||creds.id;
    const room=new LivekitClient.Room({ adaptiveStream:false, dynacast:false });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, t=>{
      if(t.kind==='video'){ ['nova-live','greet-avatar'].forEach(id=>{ const v=$(id); if(!v) return;
          try{ t.attach(v); }catch(e){} v.muted=true; v.play().catch(()=>{}); });
        window.__novaVideoArrived=true; maybeReveal(); }
      else if(t.kind==='audio'){ let a=$('nova-audio'); if(!a){ a=document.createElement('audio'); a.id='nova-audio'; a.autoplay=true; document.body.appendChild(a); }
        try{ t.attach(a); }catch(e){} a.muted=false; a.volume=1.0; window.__novaAudioEl=a;
        a.play().catch(()=>showTapToHear(a));   // autoplay blocked → give the kid a tap-to-hear button (don't fail silently)
        window.__novaAudioArrived=true; maybeReveal();
        if(!window.__novaFirstAudioLogged){ window.__novaFirstAudioLogged=true;
          const ms=Math.round(performance.now()-(window.__novaConnectStart||performance.now()));
          logPost('latency',{ connect_to_first_audio_ms:ms }); console.log('[latency] wake→first audio',ms,'ms'); } }
    });
    room.on(LivekitClient.RoomEvent.DataReceived, async payload=>{
      let msg; try{ msg=JSON.parse(new TextDecoder().decode(payload)); }catch(e){ return; }
      if(!msg) return;
      if(msg.kind==='request-vision') sendVision();
      // worker tells us the captured name → persist for next time (the "you're BACK" path)
      else if(msg.kind==='name' && msg.name){ saveMem({ name:String(msg.name).slice(0,24) }); }
    });
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, sp=>{
      const me=room.localParticipant?.identity;
      const kidTalking=sp.some(p=>p.identity===me);
      const novaTalking=sp.some(p=>p.identity!==me);
      $('nova-live').classList.toggle('talking', novaTalking);
      const nv=$('nova-vid'); if(nv) nv.volume = novaTalking?0.22:0.7;   // duck the music while she speaks
      // latency: gap from when the kid stops talking → Nova starts replying
      if(kidTalking){ window.__kidSpokeAt=performance.now(); window.__kidWasTalking=true; showThinking(false); }
      else if(novaTalking){ showThinking(false); window.__kidWasTalking=false; }    // she's answering → hide cue
      else if(window.__kidWasTalking){ showThinking(true); window.__kidWasTalking=false; } // kid just stopped → instant "thinking"
      if(novaTalking && !window.__novaReplying){
        window.__novaReplying=true;
        if(window.__kidSpokeAt){ const ms=Math.round(performance.now()-window.__kidSpokeAt);
          if(ms>150 && ms<15000){ logPost('latency',{ nova_response_ms:ms }); console.log('[latency] Nova replied in',ms,'ms'); window.__kidSpokeAt=0; } }
      }
      if(!novaTalking) window.__novaReplying=false;
    });
    room.on(LivekitClient.RoomEvent.Disconnected, ()=>{ novaRoom=null; $('nova-live').classList.remove('show'); novaStatus(''); });
    await room.connect(creds.serverUrl, creds.token);
    novaRoom=room; window.__novaRoom=room;
    try{ await room.localParticipant.setMicrophoneEnabled(true); }catch(e){}      // kid can TALK to Nova (greet chat + Deepgram STT)
    novaSend({ kind:'game-event', event:{ event:'phase', phase:initialPhase } }); // greet mode by default
    novaSend({ kind:'game-event', event:{ event:'age', tier:AGE_TIER } });          // age-aware tone
    if(MEM.name) novaSend({ kind:'game-event', event:{ event:'name', name:MEM.name } }); // returning kid → she knows them
    // NOTE: client-ready (which releases her greeting) is sent by maybeReveal()
    // AFTER both tracks arrive + a 1500ms "presence-first" hold (the magic reveal).
  }catch(e){ console.warn('Nova session failed:', e.message); novaStatus('Nova offline — game still works');
    greetStatus("Nova's napping 😴 tap Let's Dance!"); setTimeout(()=>novaStatus(''),2600); }
  finally{ novaConnecting=false; }
}

// MAGIC REVEAL — gate on BOTH tracks ready, then hold 1500ms (presence first),
// fade her in, THEN release her greeting. "She arrived, didn't load."
function maybeReveal(){
  if(window.__novaRevealed) return;
  if(!(window.__novaVideoArrived && window.__novaAudioArrived)) return;
  window.__novaRevealed=true;
  ['nova-live','greet-avatar'].forEach(id=>{ const v=$(id); if(v) v.classList.add('show'); });
  const wrap=$('greet-avatar-wrap'); if(wrap) wrap.classList.add('reveal');   // sparkle-ring burst
  const ph=$('greet-placeholder'); if(ph){ ph.classList.add('poof'); setTimeout(()=>{ ph.style.display='none'; }, 500); } // 🌟 poofs away
  greetStatus('…');                                  // held beat, no words yet
  // P1 adaptive first line: NEW kid → fire ONE silent vision look during the hold so
  // her opener can reference what she sees ("ohh wait… [observation]"). RETURNING kid
  // → name already sent, she opens with "you're BACK". (Variant a vs d.)
  if(!MEM.name) greetVision();
  setTimeout(()=>{
    novaSend({ kind:'client-ready' });               // NOW release her greeting
    novaStatus('Nova is here!'); setTimeout(()=>novaStatus(''),1500);
    greetStatus(MEM.name ? ("hey "+MEM.name+"! 💜 tap Let's Dance") : "hi! 💜 talk to me, or tap Let's Dance");
  }, 1500);                                          // 1500ms presence-first hold
}
// one silent vision "look" for the magic opener (sets observed_visual on the worker,
// no drop-in speech — her greeting weaves it in). Strategic: 1 call, only for new kids.
function greetVision(){
  try{ const v=$('cam'); if(!v||!v.videoWidth) return;
    const c=document.createElement('canvas'); c.width=320; c.height=Math.round(320*v.videoHeight/Math.max(1,v.videoWidth));
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    fetch(NOVA.RENDER_URL+'/v2/vision-observe',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ frameDataUrl:c.toDataURL('image/jpeg',0.6), kidId:window.__kidId }) })
      .then(r=>r.json()).then(d=>{ const t=(d&&d.ok&&d.text)?d.text:''; if(t) novaSend({ kind:'game-event', event:{ event:'vision', observation:t } }); }).catch(()=>{});
  }catch(e){}
}

// answer the worker's vision request with a quick snapshot so her reactions are specific
async function sendVision(){
  try{ const v=$('cam'); if(!v||!v.videoWidth){ novaSend({ kind:'vision-observation', text:'(the kid is dancing)' }); return; }
    const c=document.createElement('canvas'); c.width=320; c.height=Math.round(320*v.videoHeight/Math.max(1,v.videoWidth));
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const r=await fetch(NOVA.RENDER_URL+'/v2/vision-observe',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ frameDataUrl:c.toDataURL('image/jpeg',0.6), kidId:window.__kidId }) });
    const d=await r.json(); novaSend({ kind:'vision-observation', text:(d&&d.ok&&d.text)?d.text:'(the kid is dancing)' });
  }catch(e){ novaSend({ kind:'vision-observation', text:'(the kid is dancing)' }); }
}
function disconnectNova(){ try{ if(novaRoom) novaRoom.disconnect(); }catch(e){} novaRoom=null; }

window.addEventListener('beforeunload', ()=>{ if(camStream) camStream.getTracks().forEach(t=>t.stop()); disconnectNova(); });
