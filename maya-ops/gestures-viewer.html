<!doctype html><html lang="he"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מיה · מחוות</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0e14;color:#e9eef6;font-family:Segoe UI,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0 0 96px 0;display:flex;align-items:center;justify-content:center;background:#000}
video{height:100%;max-width:100%;object-fit:contain}
#bar{position:fixed;left:0;right:0;bottom:0;height:96px;display:flex;gap:10px;align-items:center;
 justify-content:center;background:#0f1520;border-top:1px solid #222c40;padding:0 14px;flex-wrap:wrap}
button{background:#1d2639;border:1px solid #33415e;color:#e9eef6;border-radius:999px;
 padding:12px 22px;font-size:16px;cursor:pointer;transition:background .15s}
button:hover{background:#28344e}
button.active{background:#5aa2ff;border-color:#5aa2ff;color:#fff}
#name{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:999px;
 background:rgba(0,0,0,.45);color:rgba(255,255,255,.85);font-size:15px}
</style></head><body dir="rtl">
<div id="stage"><video id="v" autoplay muted playsinline></video></div>
<div id="name">מיה — ספריית המחוות</div>
<div id="bar"></div>
<script>
/* The 6 baked gesture sources (maya-ops/gestures/). Idle loops; a gesture plays once
   and falls back to idle — the same contract the live stack uses. */
const G = [
  { key:'idle',  he:'רגיעה',            file:'idle_maya.mp4',              loop:true  },
  { key:'wave',  he:'נפנוף 👋',          file:'leftwave_maya.mp4'                      },
  { key:'nudge', he:'הנהון',            file:'mayahead_nudge.mp4'                     },
  { key:'both',  he:'שתי ידיים',        file:'maya_bothhand.mp4'                      },
  { key:'point', he:'הצבעה ודיבור',     file:'maya_left_talk_point.mp4'               },
  { key:'bye',   he:'להתראות',          file:'maya_goodvyeopnehand.mp4'               },
];
const v = document.getElementById('v'), bar = document.getElementById('bar');
let buttons = {};
function play(g){
  v.src = 'gestures/' + g.file;
  v.loop = !!g.loop;
  v.play().catch(()=>{});
  Object.values(buttons).forEach(b=>b.classList.remove('active'));
  buttons[g.key].classList.add('active');
}
for (const g of G){
  const b = document.createElement('button');
  b.textContent = g.he;
  b.onclick = () => play(g);
  bar.appendChild(b); buttons[g.key] = b;
}
v.addEventListener('ended', () => play(G[0]));   // gesture done -> back to idle
play(G[0]);
</script></body></html>
