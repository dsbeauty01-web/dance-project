<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Runway Test Button</title>
<style>
  body {
    font-family: monospace;
    background: #1a0d2b;
    color: #fff;
    padding: 40px;
    text-align: center;
  }
  h1 { color: #fb7185; }
  button {
    font-size: 32px;
    padding: 30px 60px;
    background: linear-gradient(135deg, #e11d48, #fb7185);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    margin: 30px;
    font-family: monospace;
    font-weight: bold;
  }
  button:hover { transform: scale(1.05); }
  button:disabled { opacity: 0.5; cursor: wait; }

  #result {
    margin-top: 40px;
    padding: 30px;
    border-radius: 16px;
    font-size: 18px;
    text-align: left;
    word-break: break-all;
    min-height: 100px;
  }
  .success { background: #14532d; border: 2px solid #22c55e; }
  .error   { background: #7f1d1d; border: 2px solid #ef4444; }
  .waiting { background: #422006; border: 2px solid #eab308; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>

<h1>🧪 Runway Test Button</h1>
<p>Click the button. Wait up to 30 seconds. The result shows below in plain language.</p>

<button id="testBtn" onclick="runTest()">▶ TEST RUNWAY</button>

<div id="result"></div>

<script>
async function runTest() {
  const btn = document.getElementById('testBtn');
  const result = document.getElementById('result');

  btn.disabled = true;
  btn.textContent = '⏳ Testing... wait ~30 sec';

  result.className = 'waiting';
  result.innerHTML = '<pre>⏳ Calling Cloudflare Worker...\nWorker is calling Runway API...\nWaiting for session to be ready...</pre>';

  try {
    const res = await fetch('https://long-art-8269r.dsbeauty01.workers.dev/runway-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatarId: 'music-superstar' })
    });

    const data = await res.json();

    if (data.sessionId && data.sessionKey) {
      // SUCCESS
      result.className = 'success';
      result.innerHTML = `
        <pre>✅ SUCCESS! Runway works for your account!

Session ID:  ${data.sessionId}
Session Key: ${data.sessionKey.substring(0, 30)}...

🎉 We can build Nova with Runway. Tell Claude this worked.</pre>`;
    } else {
      // ERROR FROM RUNWAY
      result.className = 'error';
      result.innerHTML = `
        <pre>❌ FAILED. Runway returned an error.

Status: ${data.status || 'unknown'}
Error:  ${data.error || 'unknown'}

Details from Runway:
${data.details || JSON.stringify(data, null, 2)}

📸 SCREENSHOT THIS WHOLE PAGE and send to Claude.</pre>`;
    }
  } catch (err) {
    // ERROR REACHING WORKER
    result.className = 'error';
    result.innerHTML = `
      <pre>❌ Could not reach the Worker.

Error: ${err.message}

Possible reasons:
- Worker not deployed
- Internet connection issue
- CORS not configured

📸 SCREENSHOT THIS and send to Claude.</pre>`;
  }

  btn.disabled = false;
  btn.textContent = '🔄 TEST AGAIN';
}
</script>

</body>
</html>
