<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: #050813;
    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ════════════════════════════════════════════════
     STAGE — full-screen container that holds every state
     ════════════════════════════════════════════════ */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
      #050813;
    transition: background 1.2s ease;
  }
  #stage.in-dance {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(236, 72, 153, 0.20) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
      #050813;
  }
  #stage.in-goodbye {
    background:
      radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.10) 0%, transparent 70%),
      #050813;
  }

  /* ════════════════════════════════════════════════
     1. ARRIVAL — soft pulsing dot, nothing else
     ════════════════════════════════════════════════ */
  #arrival {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; gap: 32px;
    transition: opacity 0.8s ease;
  }
  #arrival.hidden { opacity: 0; pointer-events: none; }
  .pulse-dot {
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c4b5fd, #a855f7 60%, #6d28d9);
    box-shadow:
      0 0 60px rgba(168, 85, 247, 0.6),
      0 0 120px rgba(168, 85, 247, 0.3);
    animation: heartbeat 2.4s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%       { transform: scale(1.08); opacity: 1; }
  }
  #arrival-text {
    font-size: 15px; font-weight: 500;
    color: rgba(244, 232, 255, 0.55);
    letter-spacing: 0.5px;
    animation: fade-in-late 3s ease-in 1.5s both;
  }
  @keyframes fade-in-late {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ════════════════════════════════════════════════
     2-4. NOVA STAGE — face, webcam, controls
     ════════════════════════════════════════════════ */
  #nova-stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; opacity: 0; pointer-events: none;
    transition: opacity 1.0s ease;
    padding: 16px;
  }
  #nova-stage.visible { opacity: 1; pointer-events: auto; }

  /* The face circle — Nova lives here */
  #face-box {
    position: relative;
    width: min(86vmin, 540px); aspect-ratio: 1;
    border-radius: 28px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1a1042, #0a0a1f 75%);
    border: 1px solid rgba(168, 85, 247, 0.25);
    box-shadow:
      0 0 0 1px rgba(168, 85, 247, 0.15),
      0 30px 80px rgba(0, 0, 0, 0.6),
      0 0 100px rgba(168, 85, 247, 0.2);
  }

  #nova-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; z-index: 2;
  }

  /* Placeholder while waking */
  #face-placeholder {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; color: #a855f7;
  }
  #face-placeholder .dot-mini {
    width: 18px; height: 18px; border-radius: 50%;
    background: #a855f7;
    animation: heartbeat 1.6s ease-in-out infinite;
  }
  #face-placeholder .text { font-size: 14px; font-weight: 500; opacity: 0.7; }

  /* Subtle music ring during dance */
  #music-ring {
    position: absolute; inset: -4px;
    border-radius: 32px;
    border: 2px solid transparent;
    pointer-events: none; z-index: 3;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #music-ring.active {
    opacity: 1;
    border-color: rgba(236, 72, 153, 0.5);
    animation: ring-pulse 1.8s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.3); }
    50%       { box-shadow: 0 0 60px rgba(236, 72, 153, 0.6); }
  }

  /* Speaking pulse — gentle glow when Nova talks */
  #speaking-pulse {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 4;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.18) 0%, transparent 60%);
    transition: opacity 0.4s ease;
  }
  #speaking-pulse.active { opacity: 1; }

  /* Webcam — small corner bubble, never the main view */
  #webcam {
    position: absolute !important;
    bottom: 14px; right: 14px;
    width: 96px; height: 96px;
    border-radius: 14px; object-fit: cover;
    border: 2px solid rgba(255,255,255,0.25);
    transform: scaleX(-1);
    z-index: 10;
    background: #000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  /* Freeze overlay during dance */
  #freeze-overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 60%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #freeze-overlay.active { opacity: 1; }
  #freeze-overlay .freeze-text {
    font-size: clamp(40px, 12vmin, 100px);
    font-weight: 700;
    color: #f5f3ff;
    text-shadow: 0 0 40px rgba(168,85,247,0.9), 0 0 80px rgba(168,85,247,0.5);
    letter-spacing: 4px;
  }

  /* ════════════════════════════════════════════════
     STATUS / NAME / CONTROLS
     ════════════════════════════════════════════════ */
  #status-strip {
    display: flex; gap: 10px; align-items: center;
    font-size: 13px; color: rgba(244, 232, 255, 0.5);
    min-height: 24px;
  }
  .status-chip {
    background: rgba(168, 85, 247, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.25);
    color: #d8b4fe;
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
  }

  /* The DANCE button — only appears after Nova has met the kid */
  #dance-btn {
    background: linear-gradient(135deg, #ec4899, #a855f7);
    color: white;
    border: none;
    padding: 16px 36px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 17px; font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow:
      0 8px 24px rgba(236, 72, 153, 0.4),
      0 0 40px rgba(168, 85, 247, 0.3);
    transition: transform 0.15s ease, box-shadow 0.3s ease, opacity 0.6s ease;
    opacity: 0; pointer-events: none;
    transform: translateY(8px);
  }
  #dance-btn.visible {
    opacity: 1; pointer-events: auto;
    transform: translateY(0);
  }
  #dance-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow:
      0 12px 36px rgba(236, 72, 153, 0.5),
      0 0 60px rgba(168, 85, 247, 0.4);
  }
  #dance-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Mic indicator — tells you if Nova can hear */
  .mic-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: rgba(244, 232, 255, 0.08);
    border: 1px solid rgba(244, 232, 255, 0.15);
    color: rgba(244, 232, 255, 0.6);
    transition: all 0.3s ease;
  }
  .mic-indicator.on {
    background: rgba(110, 231, 183, 0.12);
    border-color: rgba(110, 231, 183, 0.4);
    color: #6ee7b7;
  }
  .mic-indicator.off {
    background: rgba(252, 165, 165, 0.12);
    border-color: rgba(252, 165, 165, 0.4);
    color: #fca5a5;
  }
  .mic-indicator .dot-mic {
    width: 8px; height: 8px; border-radius: 50%; background: currentColor;
  }
  .mic-indicator.on .dot-mic { animation: heartbeat 1.6s ease-in-out infinite; }

  /* Chat input — ALWAYS visible. Never hidden behind connection state. */
  #chat-row {
    display: flex; gap: 8px; align-items: center;
    width: min(86vmin, 540px);
  }
  #chat-input {
    flex: 1;
    background: rgba(244, 232, 255, 0.08);
    border: 1px solid rgba(168, 85, 247, 0.35);
    color: #f1f5f9;
    padding: 12px 16px;
    border-radius: 14px;
    font-family: inherit; font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #chat-input:focus {
    border-color: rgba(168, 85, 247, 0.7);
    background: rgba(244, 232, 255, 0.12);
  }
  #chat-input::placeholder { color: rgba(244, 232, 255, 0.4); }
  #chat-input:disabled { opacity: 0.5; cursor: wait; }
  #chat-send {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white; border: none;
    width: 46px; height: 46px;
    border-radius: 14px;
    font-size: 18px; cursor: pointer;
    transition: transform 0.15s ease;
  }
  #chat-send:hover:not(:disabled) { transform: scale(1.05); }
  #chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* State badge on Nova's tile — Watching / Listening / Talking / Thinking */
  #state-badge {
    position: absolute; bottom: 14px; left: 14px;
    background: rgba(5, 8, 19, 0.75);
    border: 1px solid rgba(168, 85, 247, 0.3);
    color: #d8b4fe;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.3px;
    z-index: 9;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
  }
  #state-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  #state-badge.listening {
    background: rgba(110, 231, 183, 0.18);
    border-color: rgba(110, 231, 183, 0.5);
    color: #6ee7b7;
  }
  #state-badge.listening::before { animation: heartbeat 1.4s ease-in-out infinite; }
  #state-badge.talking {
    background: rgba(236, 72, 153, 0.18);
    border-color: rgba(236, 72, 153, 0.5);
    color: #f9a8d4;
  }
  #state-badge.talking::before { animation: heartbeat 0.6s ease-in-out infinite; }
  #state-badge.thinking {
    background: rgba(251, 191, 36, 0.18);
    border-color: rgba(251, 191, 36, 0.5);
    color: #fcd34d;
  }
  #state-badge.thinking::before { animation: heartbeat 0.9s ease-in-out infinite; }

  /* Chat bubble — kid's words echoed back, fades after a few seconds */
  #kid-bubble {
    position: absolute; top: 16px; right: 16px;
    max-width: 60%;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.35);
    color: #f1f5f9;
    padding: 8px 14px;
    border-radius: 14px 14px 4px 14px;
    font-size: 14px; font-weight: 500;
    z-index: 9;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  #kid-bubble.show {
    opacity: 1; transform: translateY(0);
  }
  #kid-bubble::before {
    content: 'you said';
    display: block;
    font-size: 10px; font-weight: 600;
    color: #c4b5fd; opacity: 0.8;
    margin-bottom: 2px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  /* Mic level meter — shows if your voice is being picked up */
  #mic-meter {
    display: flex; align-items: flex-end; gap: 2px;
    height: 24px; padding: 0 6px;
  }
  #mic-meter .bar {
    width: 3px; background: rgba(110, 231, 183, 0.25);
    border-radius: 1px; transition: height 60ms ease-out, background 0.3s;
  }
  #mic-meter.active .bar { background: rgba(110, 231, 183, 0.8); }

  /* Hidden until needed */
  .hidden { display: none !important; }

  /* ════════════════════════════════════════════════
     5. CLOSING — return to pulsing dot
     ════════════════════════════════════════════════ */
  #closing {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; opacity: 0; pointer-events: none;
    transition: opacity 1.0s ease;
  }
  #closing.visible { opacity: 1; pointer-events: auto; }
  #closing .pulse-dot { animation: heartbeat 2.4s ease-in-out infinite; opacity: 0.7; }
  #closing-text {
    font-size: 15px; color: rgba(244, 232, 255, 0.55);
    text-align: center; line-height: 1.5;
  }
  #closing-text .name { color: #d8b4fe; font-weight: 600; }

  /* ════════════════════════════════════════════════
     DIAGNOSTICS PANEL — open with the 🔧 icon (top-left)
     ════════════════════════════════════════════════ */
  #diag-toggle {
    position: fixed; top: 12px; left: 12px;
    width: 36px; height: 36px;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 10px;
    color: #d8b4fe;
    font-size: 16px;
    cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease;
  }
  #diag-toggle:hover { background: rgba(168, 85, 247, 0.25); }

  #diag-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px; max-width: 95vw;
    background: rgba(5, 8, 19, 0.97);
    border-left: 1px solid rgba(168, 85, 247, 0.3);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    z-index: 99;
    display: flex; flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow: hidden;
  }
  #diag-panel.open { transform: translateX(0); }

  #diag-panel h2 {
    font-size: 14px; font-weight: 700; color: #d8b4fe;
    letter-spacing: 1px; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  #diag-close {
    background: transparent; border: none; color: #94a3b8;
    cursor: pointer; font-size: 18px; padding: 4px 8px;
  }

  .diag-section {
    background: rgba(168, 85, 247, 0.06);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 10px; padding: 10px;
  }
  .diag-section h3 {
    font-size: 11px; font-weight: 600; color: #c4b5fd;
    letter-spacing: 0.8px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .diag-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; padding: 3px 0;
    color: rgba(244, 232, 255, 0.7);
  }
  .diag-row .v { font-family: ui-monospace, monospace; color: #f1f5f9; }
  .diag-row .ok { color: #6ee7b7; }
  .diag-row .bad { color: #fca5a5; }
  .diag-row .warn { color: #fbbf24; }

  #diag-log {
    flex: 1;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 10px;
    padding: 8px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    color: rgba(244, 232, 255, 0.6);
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 200px;
  }
  #diag-log .ll-tx { color: #6ee7b7; }
  #diag-log .ll-rx { color: #fbbf24; }
  #diag-log .ll-err { color: #fca5a5; }
  #diag-log .ll-sys { color: #c4b5fd; }

  .diag-actions { display: flex; gap: 8px; }
  .diag-actions button {
    flex: 1;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.3);
    color: #d8b4fe;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: inherit; font-size: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .diag-actions button:hover { background: rgba(168, 85, 247, 0.25); }
  .diag-actions button.primary {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border-color: transparent;
    color: white; font-weight: 600;
  }
</style>
</head>
<body>

<div id="stage">

  <!-- 1. Arrival — single soft pulsing dot -->
  <div id="arrival">
    <div class="pulse-dot"></div>
    <div id="arrival-text">tap to wake Nova</div>
  </div>

  <!-- 2-4. Nova stage — face, webcam, controls -->
  <div id="nova-stage">
    <div id="face-box">
      <div id="music-ring"></div>
      <div id="speaking-pulse"></div>

      <div id="face-placeholder">
        <div class="dot-mini"></div>
        <div class="text">waking…</div>
      </div>

      <video id="nova-video" autoplay playsinline></video>
      <video id="webcam" autoplay playsinline muted></video>

      <div id="freeze-overlay"><div class="freeze-text">FREEZE</div></div>

      <!-- State badge — Lexi pattern: kid sees whose turn it is -->
      <div id="state-badge">Watching</div>

      <!-- Echoed kid words — what they just said, validated on screen -->
      <div id="kid-bubble"></div>
    </div>

    <div id="status-strip">
      <span class="status-chip" id="phase-chip">getting ready…</span>
      <span class="mic-indicator" id="mic-indicator">
        <span class="dot-mic"></span>
        <span id="mic-label">mic…</span>
      </span>
      <div id="mic-meter" title="your voice level">
        <div class="bar" style="height:4px"></div>
        <div class="bar" style="height:6px"></div>
        <div class="bar" style="height:8px"></div>
        <div class="bar" style="height:10px"></div>
        <div class="bar" style="height:8px"></div>
        <div class="bar" style="height:6px"></div>
        <div class="bar" style="height:4px"></div>
      </div>
    </div>

    <button id="dance-btn">🎵 Dance with Nova</button>

    <!-- Chat — ALWAYS visible from the moment Nova stage is up. Never hidden. -->
    <div id="chat-row">
      <input id="chat-input" type="text" maxlength="200"
             placeholder="say hi to Nova…"
             autocomplete="off" autocapitalize="sentences">
      <button id="chat-send" title="Send">→</button>
    </div>
  </div>

  <!-- 5. Closing — back to dot -->
  <div id="closing">
    <div class="pulse-dot"></div>
    <div id="closing-text">see you tomorrow<span id="closing-name"></span></div>
  </div>
</div>

<!-- DIAGNOSTICS — toggle button + full panel -->
<button id="diag-toggle" title="Diagnostics">🔧</button>

<div id="diag-panel">
  <h2>
    Nova Diagnostics
    <button id="diag-close">✕</button>
  </h2>

  <div class="diag-section">
    <h3>System Status</h3>
    <div class="diag-row"><span>Front desk</span><span class="v" id="ds-frontdesk">checking…</span></div>
    <div class="diag-row"><span>Keys loaded</span><span class="v" id="ds-keys">—</span></div>
    <div class="diag-row"><span>LiveKit room</span><span class="v" id="ds-room">—</span></div>
    <div class="diag-row"><span>Nova avatar</span><span class="v" id="ds-avatar">—</span></div>
    <div class="diag-row"><span>Mic</span><span class="v" id="ds-mic">—</span></div>
    <div class="diag-row"><span>Phase</span><span class="v" id="ds-phase">—</span></div>
    <div class="diag-row"><span>Kid ID</span><span class="v" id="ds-kid">—</span></div>
  </div>

  <div class="diag-section">
    <h3>Live Log</h3>
    <div id="diag-log">waiting…</div>
  </div>

  <div class="diag-actions">
    <button id="diag-refresh">↻ Refresh status</button>
    <button id="diag-download" class="primary">⬇ Download full log</button>
  </div>
</div>

<!-- Music (hidden audio element) -->
<audio id="song" preload="auto" src="shit.mp3"></audio>

<!-- LiveKit SDK -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.5/dist/livekit-client.umd.min.js"></script>

<script>
const API_BASE = 'https://novapython.onrender.com';

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const state = {
  room: null,
  connected: false,
  kidId: null,
  kidName: null,
  phase: 'arrival',     // arrival → recognition → dance → goodbye → closing
  songStartedAt: 0,
  hits: 0,
  streak: 0,
  maxStreak: 0,
  novaSpeaking: false,  // flipped by Nova's audio track playing/pause events
};

// Stable kid id, reused across visits → enables "she remembers"
state.kidId = localStorage.getItem('nova_kid_id');
if (!state.kidId) {
  state.kidId = 'k-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('nova_kid_id', state.kidId);
}

// ════════════════════════════════════════════════
// DOM SHORTCUTS
// ════════════════════════════════════════════════
const $arrival = document.getElementById('arrival');
const $nova = document.getElementById('nova-stage');
const $closing = document.getElementById('closing');
const $face = document.getElementById('face-box');
const $facePh = document.getElementById('face-placeholder');
const $novaVideo = document.getElementById('nova-video');
const $webcam = document.getElementById('webcam');
const $musicRing = document.getElementById('music-ring');
const $speakingPulse = document.getElementById('speaking-pulse');
const $freeze = document.getElementById('freeze-overlay');
const $phaseChip = document.getElementById('phase-chip');
const $danceBtn = document.getElementById('dance-btn');
const $song = document.getElementById('song');
const $stage = document.getElementById('stage');

// ════════════════════════════════════════════════
// DIAGNOSTICS — single log feed, status tracker, downloadable bundle
// ════════════════════════════════════════════════
const $diagLog = document.getElementById('diag-log');
const $diagPanel = document.getElementById('diag-panel');
const $diagToggle = document.getElementById('diag-toggle');
const logBuffer = [];   // all events, with timestamps
const sessionStart = new Date();

function nowStr() {
  const ms = Math.floor(performance.now());
  return (ms / 1000).toFixed(2).padStart(7) + 's';
}

function log(...args) {
  const text = args.join(' ');
  const t = nowStr();
  const cls = /\b(error|fail|crash|denied|blocked)\b/i.test(text) ? 'll-err'
            : text.startsWith('rx') || text.startsWith('RX') ? 'll-rx'
            : text.startsWith('tx') || text.startsWith('TX') ? 'll-tx'
            : 'll-sys';
  logBuffer.push({ t, text, cls });
  console.log('[nova]', text);
  // Render last 200 lines, newest at TOP
  const html = logBuffer.slice(-200).map(e =>
    `<span class="${e.cls}">[${e.t}] ${e.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>`
  ).reverse().join('\n');
  if ($diagLog) $diagLog.innerHTML = html;
}

// Status tracker — reflects state on the panel
const status = {
  frontdesk: '—',
  keys: '—',
  room: '—',
  avatar: '—',
  mic: '—',
  phase: 'arrival',
  kid: state.kidId,
};

function setStatus(key, value, ok = null) {
  status[key] = value;
  const el = document.getElementById('ds-' + key);
  if (!el) return;
  el.textContent = value;
  el.className = 'v' + (ok === true ? ' ok' : ok === false ? ' bad' : ok === 'warn' ? ' warn' : '');
}
setStatus('kid', state.kidId);

});

// Ping front desk + diag endpoint to check it's alive and which keys are configured
async function refreshDiagnostics() {
  try {
    const r = await fetch(API_BASE + '/v2/diag', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      setStatus('frontdesk', '✓ alive', true);
      const ok = Object.values(j.keys || {}).every(Boolean);
      const missing = Object.entries(j.keys || {}).filter(([,v]) => !v).map(([k]) => k);
      setStatus('keys', ok ? '✓ all 8 set' : `MISSING: ${missing.join(', ')}`, ok);
    } else {
      setStatus('frontdesk', 'HTTP ' + r.status, false);
    }
  } catch (e) {
    setStatus('frontdesk', 'unreachable', false);
    setStatus('keys', 'cant check', false);
  }
  // Reflect current local state
  setStatus('room', state.connected ? '✓ connected' : '—', state.connected || null);
  setStatus('mic', $micLabel.textContent,
    $micIndicator.classList.contains('on') ? true :
    $micIndicator.classList.contains('off') ? false : null);
}

// One-click "download everything I know" — for sharing with support / me
function downloadDiagnostic() {
  const lines = [];
  lines.push('NOVA v205 — DIAGNOSTIC REPORT');
  lines.push('=' .repeat(60));
  lines.push('Generated: ' + new Date().toISOString());
  lines.push('Session started: ' + sessionStart.toISOString());
  lines.push('URL: ' + location.href);
  lines.push('User agent: ' + navigator.userAgent);
  lines.push('');
  lines.push('STATUS');
  lines.push('-'.repeat(60));
  for (const [k, v] of Object.entries(status)) lines.push(`  ${k.padEnd(12)} ${v}`);
  lines.push('');
  lines.push('STATE');
  lines.push('-'.repeat(60));
  lines.push(`  kidId        ${state.kidId}`);
  lines.push(`  kidName      ${state.kidName || '(unknown)'}`);
  lines.push(`  phase        ${state.phase}`);
  lines.push(`  connected    ${state.connected}`);
  lines.push(`  hits         ${state.hits}`);
  lines.push(`  streak       ${state.streak}`);
  lines.push(`  max streak   ${state.maxStreak}`);
  lines.push('');
  lines.push(`FULL LOG (${logBuffer.length} events)`);
  lines.push('-'.repeat(60));
  for (const e of logBuffer) lines.push(`[${e.t}] ${e.text}`);
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nova-diagnostic-${Date.now()}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log('diagnostic downloaded');
}

// ════════════════════════════════════════════════
// CONNECT — LiveKit room + camera/mic + Nova
// ════════════════════════════════════════════════
async function connect() {
  try {
    setMic('asking', 'mic…');

    // ───────────────────────────────────────────────────────────
    // Ask permissions in TWO separate prompts:
    //   1. Mic first  — Nova needs to hear (most important)
    //   2. Camera     — for "she sees me" vision moment
    // Each can be granted or denied independently. If camera is denied,
    // Nova still works on voice alone.
    // ───────────────────────────────────────────────────────────
    let micStream = null;
    let camStream = null;

    // Step 1: microphone
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      setMic('on', 'mic on');
      log('mic granted ✓');
    } catch (e) {
      log('mic denied:', e.message);
      setMic('off', 'mic denied — type below');
    }

    // Step 2: camera (separate prompt)
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { width: 320, height: 240, facingMode: 'user' },
      });
      log('camera granted ✓');
    } catch (e) {
      log('camera denied:', e.message);
    }

    // Merge into single stream for LiveKit
    let stream = null;
    if (micStream && camStream) {
      stream = new MediaStream([
        ...micStream.getAudioTracks(),
        ...camStream.getVideoTracks(),
      ]);
    } else if (micStream) {
      stream = micStream;
    } else if (camStream) {
      stream = camStream;
    }
    if (stream) $webcam.srcObject = stream;

    // Token from front desk
    const r = await fetch(API_BASE + '/v2/create-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kidId: state.kidId }),
    });
    if (!r.ok) throw new Error('session creation failed: ' + r.status);
    const creds = await r.json();
    log('room', creds.roomName);

    // Connect LiveKit
    state.room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    state.room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      log('rx track', track.kind, 'from', participant.identity);
      if (track.kind === 'video') {
        track.attach($novaVideo);
        $facePh.style.display = 'none';
        state.phase = 'recognition';
        setPhaseChip('saying hello');
        setStatus('avatar', '✓ ' + participant.identity, true);
        // Reveal dance button ~10 seconds AFTER Nova actually arrives.
        // Not on a fixed connect-timer (which was the v205 bug — if Render
        // booted slowly, the timer fired before Nova was even there).
        setTimeout(() => {
          if (state.phase === 'recognition') {
            $danceBtn.classList.add('visible');
            setPhaseChip('ready to dance?');
            log('dance button revealed');
          }
        }, 10000);

        // Start browser-side voice recognition now that we're connected.
        // This replaces the broken LiveKit STT pipeline. Text travels through
        // the same data channel that typing uses (proven working).
        startBrowserSTT();
      } else if (track.kind === 'audio') {
        const a = track.attach();
        a.autoplay = true;
        a.setAttribute('playsinline', '');
        document.body.appendChild(a);
        a.play().catch(e => log('audio play blocked:', e.message));
        a.addEventListener('playing', () => {
          state.novaSpeaking = true;
          $speakingPulse.classList.add('active');
          setBadge('talking');
          // Music ducking — drop song to 18% while Nova speaks so she's audible.
          // Snap immediately (not a long fade) — natural radio-DJ feel.
          if (!$song.paused) {
            $song._preDuck = $song.volume;
            fadeAudio($song, $song.volume, 0.18, 200);
          }
        });
        a.addEventListener('pause', () => {
          state.novaSpeaking = false;
          $speakingPulse.classList.remove('active');
          setBadge('listening');
          // Restore song volume when Nova stops speaking
          if (!$song.paused && $song._preDuck !== undefined) {
            fadeAudio($song, $song.volume, $song._preDuck, 400);
          }
        });
        a.addEventListener('ended', () => {
          state.novaSpeaking = false;
          $speakingPulse.classList.remove('active');
          setBadge('listening');
          if (!$song.paused && $song._preDuck !== undefined) {
            fadeAudio($song, $song.volume, $song._preDuck, 400);
          }
        });
      }
    });

    state.room.on(LivekitClient.RoomEvent.Disconnected, () => {
      log('room disconnected');
      state.connected = false;
      setMic('off', 'disconnected');
      setStatus('room', 'disconnected', false);
      setStatus('avatar', 'left room', false);
    });

    // Data channel — receive game commands from worker (vision frame requests, etc.)
    state.room.on(LivekitClient.RoomEvent.DataReceived, (data) => {
      try {
        const msg = JSON.parse(new TextDecoder().decode(data));
        if (msg.kind === 'request-vision' || msg.kind === 'vision-request') {
          sendVisionFrame();
        }
      } catch (e) {}
    });

    await state.room.connect(creds.serverUrl, creds.token);
    setStatus('room', '✓ ' + creds.roomName.slice(0,28), true);

    // Publish mic if we have one — Nova can hear the kid
    if (stream) {
      const micTrack = stream.getAudioTracks()[0];
      if (micTrack) {
        await state.room.localParticipant.publishTrack(micTrack);
        log('mic published');
        setMic('on', 'mic on');
        // Start live mic level meter so kid (or tester) sees their voice register
        startMicMeter(stream);
      } else {
        setMic('off', 'no mic');
      }
    }

    state.connected = true;

    // Chat is always visible — no need to toggle.
    // (Dance button is revealed when Nova's video track arrives — see above.)

  } catch (e) {
    log('connect failed:', e.message);
    setPhaseChip('hmm… try again');
    setMic('off', 'connect failed');
  }
}

function setMic(stateName, label) {
  $micIndicator.classList.remove('on', 'off');
  if (stateName === 'on') $micIndicator.classList.add('on');
  else if (stateName === 'off') $micIndicator.classList.add('off');
  $micLabel.textContent = label;
  setStatus('mic', label, stateName === 'on' ? true : stateName === 'off' ? false : null);
}

// Lexi state badge: Watching / Listening / Talking / Thinking
function setBadge(state) {
  $stateBadge.classList.remove('listening', 'talking', 'thinking');
  if (state === 'listening') {
    $stateBadge.classList.add('listening');
    $stateBadge.textContent = 'Listening';
  } else if (state === 'talking') {
    $stateBadge.classList.add('talking');
    $stateBadge.textContent = 'Nova talking';
  } else if (state === 'thinking') {
    $stateBadge.classList.add('thinking');
    $stateBadge.textContent = 'Nova thinking';
  } else {
    $stateBadge.textContent = 'Watching';
  }
}

// Echo kid's words back as a chat bubble — Lexi Pattern 6
let bubbleTimer = null;
function showKidBubble(text) {
  $kidBubble.textContent = text;
  $kidBubble.classList.add('show');
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => $kidBubble.classList.remove('show'), 6000);
}

// Live mic level meter — proves the mic is actually picking up your voice.
// Uses WebAudio to read PCM data 30x/sec, drives the bars in #mic-meter.
let micMeterRAF = null;
function startMicMeter(stream) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { log('no AudioContext'); return; }
    const ctx = new AC();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    const meter = document.getElementById('mic-meter');
    const bars = meter.querySelectorAll('.bar');
    let everHeard = false;

    function tick() {
      analyser.getByteTimeDomainData(buf);
      // RMS-ish — how loud is the kid right now?
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const d = (buf[i] - 128) / 128;
        sum += d * d;
      }
      const rms = Math.sqrt(sum / buf.length);     // 0..1
      const level = Math.min(1, rms * 5);          // amplify for visibility
      if (rms > 0.04 && !everHeard) {
        everHeard = true;
        log('mic picked up sound ✓ — Nova can hear you');
      }
      // Show "Listening" badge briefly when mic is active and Nova isn't talking
      if (rms > 0.04 && !$stateBadge.classList.contains('talking')) {
        setBadge('listening');
      }
      // Animate bars from center outward — like a real audio meter
      const baseHeights = [4, 6, 8, 12, 8, 6, 4];
      bars.forEach((b, i) => {
        const h = baseHeights[i] + level * (16 + i * 2);
        b.style.height = Math.min(24, h) + 'px';
      });
      meter.classList.toggle('active', level > 0.05);
      micMeterRAF = requestAnimationFrame(tick);
    }
    tick();
    log('mic meter started');
  } catch (e) {
    log('mic meter failed:', e.message);
  }
}

// ════════════════════════════════════════════════
// CHAT INPUT — text becomes voice (Nova replies via her own voice)
// ════════════════════════════════════════════════
async function sendChat() {
  const text = $chatInput.value.trim();
  if (!text) return;
  if (!state.connected) {
    log('cant send — not connected yet, wait for Nova');
    return;
  }
  log('YOU (typed):', text);
  showKidBubble(text);           // Echo it back to the kid visually
  setBadge('thinking');          // Show "Nova thinking" while she replies
  $chatInput.disabled = true;
  $chatSend.disabled = true;
  try {
    await send({ kind: 'user-said', text });
    $chatInput.value = '';
  } finally {
    $chatInput.disabled = false;
    $chatSend.disabled = false;
    $chatInput.focus();
  }
}
$chatSend.addEventListener('click', sendChat);
$chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

// ════════════════════════════════════════════════
// SEND helper — data channel to worker
// ════════════════════════════════════════════════
async function send(payload) {
  const kind = payload && payload.kind ? payload.kind : '?';
  // Loud logging — proves whether each packet actually goes out.
  if (!state.room) {
    log('SEND BLOCKED (no room):', kind);
    return;
  }
  if (!state.connected) {
    log('SEND BLOCKED (not connected):', kind);
    return;
  }
  try {
    const data = new TextEncoder().encode(JSON.stringify(payload));
    await state.room.localParticipant.publishData(data, { reliable: true });
    log('SENT ✓', kind, '(' + data.length + ' bytes)');
  } catch (e) {
    log('SEND FAILED:', kind, '—', e.message);
  }
}

// ════════════════════════════════════════════════
// BROWSER VOICE INPUT (Web Speech API)
// ════════════════════════════════════════════════
// The server-side STT pipeline (Deepgram + Whisper via LiveKit) never produced
// transcripts after 2.5 days of debugging. Switching to browser-side Web Speech
// API: voice → text → sent through the same data channel typing uses (proven
// working). Chrome/Edge use Google's STT under the hood — fast and accurate.
//
// Smart mute: Nova's audio track is one continuous stream from Runway, so the
// 'pause' event never fires reliably between sentences. Instead we use a
// short cooldown — STT muted for 1.5s after Nova's last audio activity.
// ════════════════════════════════════════════════
const SR_API = window.SpeechRecognition || window.webkitSpeechRecognition;
let browserSR = null;
let srRestartTimer = null;
let srLastSentText = '';
let srLastSentAt = 0;

// Cooldown gate — set this any time we want to suppress STT (e.g. Nova spoke).
// Replaces the broken `state.novaSpeaking` flag.
let muteUntil = 0;
function muteSTTFor(ms) {
  muteUntil = Math.max(muteUntil, performance.now() + ms);
}

function startBrowserSTT() {
  if (!SR_API) {
    log('browser STT not supported (use Chrome/Edge)');
    setStatus('mic', 'voice typing only — Chrome needed', false);
    return;
  }
  try {
    browserSR = new SR_API();
    browserSR.lang = 'en-US';
    browserSR.continuous = true;
    browserSR.interimResults = true;

    browserSR.onresult = (event) => {
      // Show INTERIM as live caption (kid sees their words instantly).
      // Send ONLY FINAL to worker (so Nova doesn't reply to half-words).
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        const text = (r[0].transcript || '').trim();
        if (!text) continue;

        if (!r.isFinal) {
          // Live caption — instant feedback, kid sees themself being heard
          showKidBubble(text + ' …');
          continue;
        }

        // FINAL transcript — actually send to Nova
        const now = performance.now();
        if (text === srLastSentText && now - srLastSentAt < 2000) continue;
        srLastSentText = text;
        srLastSentAt = now;

        log('HEARD:', text);
        showKidBubble(text);
        setBadge('thinking');
        send({ kind: 'user-said', text });
      }
    };

    browserSR.onerror = (e) => {
      // 'no-speech' is normal silence — don't log spam
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      log('browser STT error:', e.error);
    };

    browserSR.onend = () => {
      // Auto-restart so we keep listening (browser stops after each utterance)
      if (state.connected && !srRestartTimer) {
        srRestartTimer = setTimeout(() => {
          srRestartTimer = null;
          try { browserSR.start(); } catch (e) {}
        }, 300);
      }
    };

    browserSR.start();
    log('browser STT started ✓ — speak now');
    setStatus('mic', 'voice on (browser STT)', true);
  } catch (e) {
    log('browser STT failed to start:', e.message);
  }
}

function stopBrowserSTT() {
  if (browserSR) {
    try { browserSR.stop(); } catch (e) {}
    browserSR = null;
  }
  if (srRestartTimer) {
    clearTimeout(srRestartTimer);
    srRestartTimer = null;
  }
}

// Capture webcam frame, send to vision endpoint, forward observation to worker
async function sendVisionFrame() {
  try {
    const v = $webcam;
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = Math.min(320, v.videoWidth);
    c.height = Math.round(c.width * v.videoHeight / v.videoWidth);
    const cx = c.getContext('2d');
    cx.translate(c.width, 0); cx.scale(-1, 1);
    cx.drawImage(v, 0, 0, c.width, c.height);
    const frameDataUrl = c.toDataURL('image/jpeg', 0.7);

    // POST to server's vision endpoint (Gemini lives there)
    const r = await fetch(API_BASE + '/v2/vision-observe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ frameDataUrl, kidId: state.kidId }),
    });
    const j = await r.json();
    if (j.ok && j.text) {
      log('vision observed:', j.text);
      // Forward to worker so Nova can naturally mention it
      send({ kind: 'vision-observation', text: j.text });
    }
  } catch (e) { log('vision frame fail:', e.message); }
}

// ════════════════════════════════════════════════
// 3. DANCE — kid taps button → music + phase advance
// ════════════════════════════════════════════════
$danceBtn.addEventListener('click', startDance);

const FREEZE_AT = [22, 42, 62, 82];  // seconds into song
const SONG_DUR = 111;
let freezeTimers = [];

async function startDance() {
  if (state.phase !== 'recognition') return;
  $danceBtn.classList.remove('visible');
  state.phase = 'dance';
  state.songStartedAt = performance.now();
  $stage.classList.add('in-dance');
  setPhaseChip('getting ready…');

  // ONE packet: tell worker we're starting dance. Worker decides what Nova says
  // (uses dance-phase prompt). NO fake "user-said" stage direction — that was
  // leaking into kid text and causing Nova to read it aloud + double-reply.
  send({ kind: 'game-event', event: { event: 'phase', phase: 'dance' } });

  // Countdown overlay 3-2-1 — runs while worker is generating Nova's hype line.
  await showCountdown();

  // NOW start music + reveal music ring
  $musicRing.classList.add('active');
  setPhaseChip('🎵 dancing…');
  try {
    $song.currentTime = 0;
    $song.volume = 0;            // start silent, fade in
    await $song.play();
    fadeAudio($song, 0, 0.85, 1500);  // fade up to 85%
    log('song playing');
  } catch (e) {
    log('song play blocked:', e.message);
  }

  // Schedule freeze overlays at known music timestamps
  freezeTimers = FREEZE_AT.map(sec => setTimeout(() => {
    showFreeze();
    send({ kind: 'game-event', event: { event: 'freeze_hit' } });
  }, sec * 1000));

  // Schedule end → goodbye (with fade-out)
  freezeTimers.push(setTimeout(endDance, SONG_DUR * 1000));
}

// Countdown overlay: 3, 2, 1 in the center of Nova's face
async function showCountdown() {
  const el = document.createElement('div');
  el.id = 'countdown-overlay';
  el.style.cssText = `
    position:absolute; inset:0; z-index:8;
    display:flex; align-items:center; justify-content:center;
    font-family:Quicksand,sans-serif; font-weight:700; font-size:clamp(80px,20vmin,200px);
    color:#fff; text-shadow: 0 0 40px rgba(168,85,247,0.9), 0 0 80px rgba(236,72,153,0.6);
    transition: transform .3s ease, opacity .3s ease;
    background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 60%);
    pointer-events: none;
  `;
  $face.appendChild(el);
  for (const n of [3, 2, 1]) {
    el.textContent = n;
    el.style.transform = 'scale(1.0)'; el.style.opacity = '1';
    await new Promise(r => setTimeout(r, 80));
    el.style.transform = 'scale(1.4)'; el.style.opacity = '0';
    await new Promise(r => setTimeout(r, 720));
  }
  el.textContent = 'GO!';
  el.style.transform = 'scale(1.0)'; el.style.opacity = '1';
  await new Promise(r => setTimeout(r, 400));
  el.style.opacity = '0';
  await new Promise(r => setTimeout(r, 300));
  el.remove();
}

// Smooth audio fade utility (volume 0..1)
function fadeAudio(audioEl, from, to, durationMs) {
  const steps = 30;
  const stepMs = durationMs / steps;
  let i = 0;
  audioEl.volume = from;
  if (audioEl._fadeTimer) clearInterval(audioEl._fadeTimer);
  audioEl._fadeTimer = setInterval(() => {
    i++;
    audioEl.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
    if (i >= steps) {
      clearInterval(audioEl._fadeTimer);
      audioEl._fadeTimer = null;
    }
  }, stepMs);
}

function showFreeze() {
  $freeze.classList.add('active');
  setTimeout(() => $freeze.classList.remove('active'), 1800);
}

async function endDance() {
  if (state.phase !== 'dance') return;
  state.phase = 'goodbye';
  // Fade song OUT (don't just pause — feels jarring)
  fadeAudio($song, $song.volume, 0, 1500);
  setTimeout(() => { try { $song.pause(); } catch {} }, 1700);

  $musicRing.classList.remove('active');
  $stage.classList.remove('in-dance');
  $stage.classList.add('in-goodbye');
  setPhaseChip('goodbye…');

  // Tell Nova — she'll say the personal goodbye
  send({ kind: 'game-event', event: { event: 'phase', phase: 'goodbye' } });

  // After goodbye plays (~12s), fade to closing dot
  setTimeout(showClosing, 12000);
}

// ════════════════════════════════════════════════
// 5. CLOSING — fade to pulsing dot + name
// ════════════════════════════════════════════════
function showClosing() {
  $nova.classList.remove('visible');
  $closing.classList.add('visible');
  $stage.classList.remove('in-goodbye');
  if (state.kidName) $closingName.textContent = ', ' + state.kidName;
}

// ════════════════════════════════════════════════
// UI helpers
// ════════════════════════════════════════════════
function setPhaseChip(text) {
  $phaseChip.textContent = text;
  setStatus('phase', state.phase + ' (' + text + ')');
}

// Cleanup on unload — disconnect cleanly so Render doesn't hold a zombie session
window.addEventListener('beforeunload', () => {
  if (state.room) try { state.room.disconnect(); } catch {}
  freezeTimers.forEach(clearTimeout);
});

log('booted');
</script>
