<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nova Light — taste per game</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #06070b; overflow: hidden;
    font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #e7ecf5; }
  #stage { position: fixed; inset: 0; background: #06070b; }
  /* video + fx both mirrored → glow at MoveNet raw coords lands on the limb in the selfie view */
  #cam, #fx { position: absolute; inset: 0; width: 100%; height: 100%;
    transform: scaleX(-1); object-fit: cover; }
  #cam { background: #06070b; }
  #fx { background: transparent; pointer-events: none; }
  #msg { position: absolute; top: 52%; left: 50%; transform: translate(-50%,-50%);
    z-index: 4; font-size: 15px; color: #aeb9cd; text-align: center; padding: 0 20px; }
  /* top game bar (NOT mirrored — outside #stage) */
  #bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw;
    background: #0d1320d9; border: 1px solid #243049; border-radius: 14px; padding: 8px 10px;
    backdrop-filter: blur(6px); }
  #bar button { font: inherit; font-size: 13px; color: #cfe0f5; background: #17203400;
    border: 1px solid #2c3a55; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #bar button:hover { background: #1b2740; }
  #bar button.active { background: #2b6cff; border-color: #2b6cff; color: #fff; font-weight: 600; }
  #hud { position: fixed; left: 10px; bottom: 10px; z-index: 10; font-size: 12px; line-height: 1.5;
    background: #0d1320d9; border: 1px solid #243049; border-radius: 12px; padding: 9px 12px;
    max-width: 260px; }
  #hud b { color: #9fd0ff; } #hud .k { color: #ffd27a; } #hud .dim { color: #8ea0bd; }
  #note { position: fixed; right: 10px; bottom: 10px; z-index: 10; font-size: 11px; color: #7d8aa3;
    background: #0d132090; border-radius: 10px; padding: 6px 9px; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>
  <div id="msg">tap to start — allow the camera ✨</div>
</div>

<div id="bar">
  <button data-game="__single"  data-label="1 · Single-limb">1 · Single-limb</button>
  <button data-game="wave"      data-label="2 · Wave">2 · Wave</button>
  <button data-game="joined"    data-label="3 · Up Groove">3 · Up Groove</button>
  <button data-game="bounce"    data-label="4 · Dance">4 · Dance</button>
  <button data-game="wavemagic" data-label="Wave Magic">Wave Magic</button>
  <button data-game="hello"     data-label="Hello (calm)">Hello (calm)</button>
</div>
<div id="hud">loading light-config.json…</div>
<div id="note">move a hand/arm to light it · still limb → no light · press 1–4 / W / H</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const fx = $('fx'), ctx = fx.getContext('2d'), video = $('cam');
const GATE = 0.5, SMOOTH = 3, REF = 220;
const TRACKED = ['left_wrist','right_wrist','left_elbow','right_elbow','left_shoulder','right_shoulder'];
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

// ---- state ----
let eng = null, engPreset = null, curGame = '__single', curName = '(default) single';
const raw = {}, hist = {};
function blank(j){ raw[j]=[]; hist[j]=[]; }
TRACKED.forEach(blank);

function labelFor(game){
  const map = NovaLight.gameMap || {};
  const name = map[game] || NovaLight.defaultPreset || 'single';
  return name;
}
function setGame(game){
  curGame = game; curName = labelFor(game);
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('active', b.dataset.game===game));
  eng = null;   // force re-create with the new preset on next frame
  raw && TRACKED.forEach(blank);
  updateHud(null);
}
function updateHud(active){
  const p = (NovaLight.PRESETS && NovaLight.PRESETS[curName]) || {};
  $('hud').innerHTML =
    `<b>game:</b> ${curGame}  →  <span class="k">${curName}</span><br>` +
    `<b>mode:</b> ${p.mode||'?'} · <b>chevron:</b> ${p.chevron?'on':'off'}<br>` +
    `<span class="dim">coreR ${p.coreR??'–'} · nodes ${p.nodes??'–'} · fade ${p.fade??'–'} · intensity ${p.intensity??'–'}</span><br>` +
    `<b>active joint:</b> ${active||'–'}`;
}

// ---- per-frame driver: mirrors the flagship (isolation vs travel by preset mode) ----
function feed(map){
  for (const j of TRACKED){
    const k = map[j];
    if (!k || k.score < GATE){ blank(j); continue; }
    const rb = raw[j]; rb.push({x:k.x,y:k.y}); if (rb.length>SMOOTH) rb.shift();
    let ax=0,ay=0; for (const p of rb){ ax+=p.x; ay+=p.y; } ax/=rb.length; ay/=rb.length;
    const h=hist[j]; h.push({x:ax,y:ay}); if (h.length>30) h.shift();
  }
}
function bodyUnit(map){ const ls=map.left_shoulder, rs=map.right_shoulder;
  return (ls&&rs&&ls.score>=GATE&&rs.score>=GATE)? clamp(Math.hypot(ls.x-rs.x,ls.y-rs.y)/REF,0.3,4) : 1; }
function torso(map){ const ls=map.left_shoulder, rs=map.right_shoulder;
  return (ls&&rs&&ls.score>=GATE&&rs.score>=GATE)? {x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2} : null; }
function activeJoint(k){ let best=null,bs=0;
  for (const j of TRACKED){ const h=hist[j]; if(h.length<2) continue;
    const a=h[h.length-1], b=h[h.length-2], sp=Math.hypot(a.x-b.x,a.y-b.y);
    if (sp>6*k && sp>bs){ best={joint:j,pos:a,speed:sp}; bs=sp; } }
  return best; }

function drawFrame(map, now){
  const W=fx.width, H=fx.height;
  if (!window.NovaLight) return;
  const wantName = curName;
  const preset = (NovaLight.PRESETS && NovaLight.PRESETS[wantName]) || undefined;
  if (!eng || engPreset!==preset){ eng = NovaLight.create(ctx, preset); engPreset = preset; }
  feed(map);
  const k = bodyUnit(map), center = torso(map), act = activeJoint(k);
  const cfg = eng.cfg || {};
  let opts = { now, W, H, k, center, quality:0.75, velocity:0, active:false, anchors:[] };
  if (act){
    opts.velocity = act.speed; opts.active = true;
    if (cfg.mode==='travel'){ opts.travelHead = act.pos; }
    else {
      opts.anchors = [act.pos];
      if (cfg.chevron){ const h=hist[act.joint], a=h[h.length-1], b=h[h.length-2], dx=a.x-b.x;
        if (Math.abs(dx)>2*k) opts.dir = dx>0?'right':'left'; }
      if (act.speed > 22*k && Math.random()<0.06) eng.hit(0.9);
    }
    if (opts.anchors[0]) eng.preGlow(opts.anchors[0], k, now);
  }
  eng.render(opts);
  if (now % 200 < 34) updateHud(act ? act.joint : null);
}

// ---- camera + MoveNet ----
let detector=null;
function sizeCanvas(){ if(video.videoWidth){ fx.width=video.videoWidth; fx.height=video.videoHeight; } }
video.addEventListener('loadedmetadata', sizeCanvas);
window.addEventListener('resize', sizeCanvas);
async function boot(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 }, audio:false });
    video.srcObject=stream; await video.play(); sizeCanvas();
    $('msg').textContent='loading pose model…';
    await tf.setBackend('webgl').catch(()=>tf.setBackend('cpu')); await tf.ready();
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
    $('msg').style.display='none';
    loop();
  }catch(e){ $('msg').textContent='camera blocked: '+e.message; }
}
async function loop(){
  let map={};
  try{ if(detector && video.readyState>=2){
    const poses=await detector.estimatePoses(video,{ flipHorizontal:false });
    if(poses[0]) poses[0].keypoints.forEach(k=>{ map[k.name]={x:k.x,y:k.y,score:(k.score==null?k.confidence:k.score)}; });
  } }catch(e){}
  drawFrame(map, performance.now());
  requestAnimationFrame(loop);
}

// ---- wire buttons + keys ----
document.querySelectorAll('#bar button').forEach(b => b.addEventListener('click', ()=>setGame(b.dataset.game)));
window.addEventListener('keydown', e=>{ const m={'1':'__single','2':'wave','3':'joined','4':'bounce','w':'wavemagic','h':'hello'}[e.key.toLowerCase()];
  if(m) setGame(m); });

// ---- start (after config loads so presets are ready) + selftest hook ----
const params = new URLSearchParams(location.search);
NovaLight.ready.then(()=>{ setGame('__single'); });
if (params.has('selftest')){
  fx.width=640; fx.height=480; $('msg').style.display='none';
  window.__taste = { setGame, drawFrame, get eng(){return eng;}, get curName(){return curName;} };
  NovaLight.ready.then(()=>{ window.__selftest = true; });
} else {
  const go=()=>{ $('msg').textContent='starting…'; boot(); window.removeEventListener('pointerdown',go); };
  window.addEventListener('pointerdown',go);
}
</script>
</body>
</html>
