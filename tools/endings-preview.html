<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Endings — preview harness</title>
<!-- QA harness (2026-07-27): renders the shared NovaEnding component for any game,
     with a NO-OP speak (no audio, no /v2/tts) and NovaRec present-but-not-started
     (so feedback/end no-op — zero network). Purely to eyeball / screenshot the arc. -->
<script src="../nova-session-rec.js"></script>
<script src="../nova-ending.js"></script>
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var cfg = {
    game: q.get('game') || 'joined',
    name: q.get('name') || null,
    bestMoment: q.has('best') ? q.get('best') : null,
    lang: q.get('lang') || 'en',
    speak: function(){},                 // silent — QA only
    stats: { qa: true },
    onAgain: function(){ document.body.setAttribute('data-nav','again'); },
    onBye: function(){ document.body.setAttribute('data-nav','bye'); },
  };
  // Optional: auto-advance to the hook beat for screenshots (?tap=love)
  var win = NovaEnding.show(cfg);
  if (q.get('tap')) {
    setTimeout(function(){
      var faces = document.querySelectorAll('#nova-ending .ne-face');
      var idx = { love:0, ok:1, meh:2 }[q.get('tap')] || 0;
      if (faces[idx]) faces[idx].click();
    }, 2900);
  }
  window.__endingReady = true;
</script>
</body>
</html>
