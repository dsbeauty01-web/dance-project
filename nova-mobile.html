<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Nova Dance — Mobile</title>
<!--
  NOVA DANCE — MOBILE (NOVA-MOBILE-MASTER / NOVA-MOBILE-UX-SPEC)
  Locked foundation: 60% camera (bottom) / 40% Nova (top). NO live avatar — Nova is an
  ILLUSTRATION with idle/talking/excited states + breathing + reactive glow + voice.
  This kills the Runway latency tax AND the Runway-400 blocker (her face engine is gone).
  Shared light = nova-light.js (PRESETS.upgroove). Game = Up Groove (launch game).
  Voice: captions + local fillers now (graceful voice-out state); EVI audio-only wireable.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;700&display=swap');
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;-webkit-user-select:none;user-select:none}
  :root{ --gold:#FFD76E; --pink:#FF6FD8; --violet:#B06FFF; --mint:#8DFFD9; --bg:#0d0725; }
  html,body{height:100%;background:var(--bg);font-family:'Quicksand',system-ui,sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ── NOVA (the star) ── */
  #nova{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(130% 100% at 50% 20%, #3b1d6e 0%, #1d0d3e 60%, #0d0725 100%)}
  #nova-glow{position:absolute;width:84vw;max-width:460px;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,110,.5) 0%, rgba(255,111,216,.22) 40%, transparent 68%);
    filter:blur(10px);animation:halo 3.4s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
  #nova-fig{position:relative;width:min(72vw,46svh);aspect-ratio:.78;border-radius:28px;
    background:center 8%/cover no-repeat url('nova-alive.png'), center 12%/cover no-repeat url('nova-face.png');
    box-shadow:0 0 0 3px rgba(255,215,110,.85), 0 22px 70px rgba(176,111,255,.4);
    animation:breathe 3.2s ease-in-out infinite;transition:transform .25s ease, box-shadow .25s ease}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  #nova.talking #nova-glow{animation-duration:1.4s;opacity:1}
  #nova.talking #nova-fig{box-shadow:0 0 0 4px #ffe9ae,0 0 54px 10px rgba(255,190,90,.65),0 22px 70px rgba(0,0,0,.45)}
  #nova.excited #nova-fig{transform:scale(1.06);box-shadow:0 0 0 5px var(--mint),0 0 70px 14px rgba(141,255,217,.55),0 22px 70px rgba(0,0,0,.45)}
  #nova.excited #nova-glow{background:radial-gradient(circle, rgba(141,255,217,.55) 0%, rgba(255,215,110,.28) 42%, transparent 70%);animation-duration:.9s}
  #nova.small #nova-fig{width:min(46vw,30svh)}
  #nova-name{position:absolute;bottom:8px;left:16px;font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.65);opacity:.95}
  /* her line — white speech bubble (mockup B2) */
  #cap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%) translateY(8px);max-width:92%;z-index:4;
    background:rgba(255,255,255,.97);color:#33124a;padding:9px 18px;border-radius:20px;
    font-family:'Baloo 2',cursive;font-weight:700;font-size:clamp(16px,4.6vw,21px);text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;white-space:nowrap}
  #cap.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* glow feedback channel */
  #nova.g-idle  #nova-glow{background:radial-gradient(circle, rgba(168,120,255,.4) 0%, rgba(120,80,200,.16) 45%, transparent 70%)}
  #nova.g-hit   #nova-glow{background:radial-gradient(circle, rgba(141,255,217,.6) 0%, rgba(141,255,217,.2) 42%, transparent 68%);animation-duration:.8s}
  #nova.g-streak#nova-glow{background:radial-gradient(circle, rgba(255,111,216,.64) 0%, rgba(255,111,216,.22) 42%, transparent 70%);animation-duration:.7s}
  #nova.g-miss  #nova-glow{background:radial-gradient(circle, rgba(255,210,90,.46) 0%, rgba(255,170,60,.18) 44%, transparent 68%)}
  #nova.g-speak #nova-glow{background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,240,210,.2) 44%, transparent 66%);animation-duration:1.2s}

  /* ── MODES: full = Nova main (62/38) · voice = GAME SPLIT (44/56, she stays) ── */
  #nova,#stage{ transition: flex-basis .55s cubic-bezier(.4,0,.2,1), height .55s cubic-bezier(.4,0,.2,1); }
  #app.full  #nova{ flex:0 0 62svh; height:62svh } #app.full  #stage{ flex:1 1 38svh; height:38svh }
  #app.voice #nova{ flex:0 0 44svh; height:44svh } #app.voice #stage{ flex:1 1 56svh; height:56svh }
  #app.voice #nova-fig{ width:min(52vw,34svh) }
  #tunnel{ position:fixed; inset:0; z-index:30; background:#0d0725; opacity:0; pointer-events:none; transition:opacity .3s ease }
  #tunnel.on{ opacity:1 }

  /* ── CAMERA (the kid) ── */
  #stage{position:relative;background:#06070b;overflow:hidden}
  #cam,#fx{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
  #cam{background:#06070b} #fx{pointer-events:none}
  #stage::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(13,7,37,.5),transparent 22%)}
  #you-tag{position:absolute;top:8px;left:10px;z-index:3;padding:4px 12px;border-radius:13px;background:rgba(0,0,0,.55);
    font-family:'Baloo 2',cursive;font-weight:800;font-size:13.5px;color:var(--mint)}
  #guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;height:86%;z-index:3;
    border:3px dashed rgba(255,215,110,.75);border-radius:24px;box-shadow:0 0 30px rgba(255,215,110,.3) inset;
    opacity:0;transition:opacity .3s ease;pointer-events:none}
  #guide.show{opacity:1;animation:guidePulse 1.6s ease-in-out infinite}
  #guide.fit{border-color:var(--mint);box-shadow:0 0 50px rgba(141,255,217,.55) inset;animation:none}
  @keyframes guidePulse{0%,100%{border-color:rgba(255,215,110,.6)}50%{border-color:rgba(255,215,110,1)}}
  #streak{position:absolute;top:8px;right:10px;z-index:3;font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;color:var(--gold);
    background:rgba(10,6,18,.6);padding:4px 12px;border-radius:14px;opacity:0;transition:opacity .3s}
  #streak.show{opacity:1}
  #ref{position:absolute;top:8px;left:8px;width:26vw;max-width:120px;aspect-ratio:.7;border-radius:12px;overflow:hidden;
    border:2px solid rgba(255,255,255,.25);background:#160a2e;opacity:0;transition:opacity .3s;z-index:3}
  #ref.show{opacity:.96}
  #ref video{width:100%;height:100%;object-fit:cover}
  #ref .lbl{position:absolute;bottom:0;width:100%;text-align:center;font-size:10px;background:rgba(0,0,0,.5);padding:2px}

  /* ── CUE — big emoji on the seam (mockup C) ── */
  #cue{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:12;width:96px;height:96px;border-radius:50%;
    background:rgba(20,10,45,.78);backdrop-filter:blur(8px);border:3px solid rgba(255,215,110,.9);
    display:flex;align-items:center;justify-content:center;font-size:50px;opacity:0;transition:opacity .25s, transform .25s;
    box-shadow:0 10px 40px rgba(255,190,80,.45);pointer-events:none}
  #cue.show{opacity:1}
  #cue.pop{transform:translate(-50%,-50%) scale(1.14)}

  /* ── SCREENS ── */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:24px;padding-top:8svh;gap:12px;background:radial-gradient(130% 90% at 50% 0%,#3b1d6e,#0d0725 72%)}
  .screen.hidden{display:none}
  .heroimg{width:min(78vw,340px);aspect-ratio:.75;border-radius:34px;object-fit:cover;object-position:50% 8%;
    box-shadow:0 24px 80px rgba(255,111,216,.35),0 0 0 3px rgba(255,255,255,.15)}
  .hero{font-family:'Baloo 2',cursive;font-size:clamp(30px,9.6vw,46px);font-weight:800;text-shadow:0 0 26px rgba(255,150,220,.55)}
  .sub{font-size:clamp(16px,4.6vw,19px);line-height:1.45;color:#d9c9ff;max-width:86%}
  .sub b{color:var(--gold)}
  .big-btn{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    min-width:76vw;min-height:70px;border:none;border-radius:36px;cursor:pointer;color:#2a0f34;
    font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(20px,6vw,27px);
    background:linear-gradient(93deg,#ffb46e,#ff6fd8 60%,#b06fff);
    box-shadow:0 14px 40px rgba(255,111,216,.45)}
  .big-btn:active{transform:translateX(-50%) scale(.97)}
  .mini{font-size:14px;color:#9d8bd0;position:absolute;bottom:10px;width:100%}
  #fb{display:flex;gap:18px;margin-top:6px}
  #fb button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);font-size:34px;cursor:pointer}
  #fb button:active{transform:scale(.92);border-color:var(--gold)}
  #warn{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:25;font-size:15.5px;color:#ffd76e;
    background:rgba(20,10,40,.75);backdrop-filter:blur(6px);padding:9px 18px;border-radius:16px;opacity:0;transition:opacity .3s;text-align:center;max-width:88vw}
  #warn.show{opacity:1}

  /* ── CAPTURE overlay (mockup B1 — she sees you) ── */
  #s-capture{position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .4s}
  #s-capture.show{opacity:1}
  #iris{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:min(84vw,380px);aspect-ratio:1;border-radius:50%;
    border:2.5px dashed rgba(255,215,110,.8);box-shadow:inset 0 0 60px rgba(255,200,80,.14);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #cap-status{position:absolute;top:max(14px,env(safe-area-inset-top));width:100%;text-align:center;font-size:16px;font-weight:700;color:#ffe9b0;
    text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #cap-line{position:absolute;bottom:15svh;width:100%;text-align:center;font-family:'Baloo 2',cursive;font-weight:800;
    font-size:clamp(26px,8vw,38px);color:#fff;text-shadow:0 0 26px rgba(255,200,120,.55);opacity:0;transition:opacity .4s}
  #cap-line.show{opacity:1}
  #cap-nova{position:absolute;left:18px;bottom:24svh;width:96px;height:96px;border-radius:50%;overflow:hidden;
    border:3px solid #ff9ee4;box-shadow:0 12px 34px rgba(255,111,216,.5);
    background:center 8%/cover url('nova-alive.png'), center 12%/cover url('nova-face.png')}
  #cap-react{position:absolute;left:104px;bottom:31svh;padding:8px 14px;border-radius:18px 18px 18px 4px;background:#fff;
    color:#3a1030;font-weight:700;font-size:15.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
  #cap-react.show{opacity:1}

  /* ── NAME sheet (mockup B2 thumb bar) ── */
  #s-name{position:fixed;left:0;right:0;bottom:0;z-index:22;padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex;gap:12px;transform:translateY(110%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
  #s-name.show{transform:translateY(0)}
  #talk-btn{flex:1.7;min-height:70px;border:none;border-radius:35px;cursor:pointer;color:#3a1030;
    font-family:'Baloo 2',cursive;font-weight:800;font-size:20px;
    background:linear-gradient(93deg,#ff9ec0,#ff6fd8 70%,#e35cff);
    box-shadow:0 14px 40px rgba(255,111,216,.45), inset 0 2px 8px rgba(255,255,255,.45)}
  #talk-btn:active{transform:scale(.98)}
  #talk-btn.rec{background:linear-gradient(93deg,#8dffd9,#4dd8a8);box-shadow:0 0 34px rgba(141,255,217,.6)}
  #type-btn{flex:1;min-height:70px;border-radius:35px;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);
    color:#e7dcff;font-weight:700;font-size:17px;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div id="tunnel"></div>
<div id="app" class="full">
  <!-- TOP 40% — Nova illustration -->
  <div id="nova" class="idle">
    <div id="nova-glow"></div>
    <div id="nova-fig"></div>
    <div id="cap"></div>
    <div id="nova-name">Nova</div>
  </div>
  <!-- BOTTOM 60% — camera -->
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="fx"></canvas>
    <div id="guide"></div>
    <div id="streak"></div>
    <div id="ref" class="hidden-ref"><video id="ref-vid" playsinline muted loop></video><div class="lbl">watch me</div></div>
    <div id="you-tag">you ⭐</div>
  </div>
  <div id="cue"></div>
</div>

<!-- 0 · Launch -->
<div class="screen" id="s-launch">
  <img class="heroimg" src="nova-alive.png" onerror="this.src='nova-face.png'">
  <div class="hero">Hi, I'm Nova! 👋</div>
  <div class="sub">I teach <b>real dance moves</b> — and I can <b>see you</b> do them. Ready?</div>
  <button class="big-btn" id="play-btn">▶ Play with Nova</button>
  <div class="mini">made for little dancers 💜</div>
</div>

<!-- B1 · CAPTURE — the moment she sees you -->
<div id="s-capture">
  <div id="cap-status">✨ Nova is looking at you…</div>
  <div id="iris"></div>
  <div id="cap-nova"></div>
  <div id="cap-react">WOW — there you are!! 😍</div>
  <div id="cap-line">She can SEE you! ⭐</div>
</div>

<!-- name thumb bar -->
<div id="s-name">
  <button id="talk-btn">🎤 Hold to talk</button>
  <button id="type-btn">⌨️ Type</button>
</div>

<!-- 4 · Ending -->
<div class="screen hidden" id="s-end">
  <div class="hero" id="end-line">You were a STAR! 🌟</div>
  <div class="sub" id="end-learn"></div>
  <div style="font-size:13px;opacity:.7" id="end-stars"></div>
  <div class="sub" style="margin-top:6px">How was that?</div>
  <div id="fb">
    <button data-fb="happy">😀</button><button data-fb="ok">😐</button><button data-fb="sad">😞</button>
  </div>
  <button class="big-btn" id="again-btn">🔄 Dance again</button>
</div>

<div id="warn"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script src="nova-report.js"></script>
<script src="nova-tracker.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cam=$('cam'), fx=$('fx'), fxc=fx.getContext('2d'), novaEl=$('nova');
let detector=null, stream=null, rafId=0, eng=null;
const det={ present:false, joints:0, headDX:0, shTilt:0, hipDX:0, motion:0, framingOK:false, spanFrac:0, lowerVisible:false };
let prevKp=null, smooth={};
window.__novaDet=()=>det;
const game={ running:false, score:0, combo:0, maxCombo:0, hits:0, total:0, cleanHits:0 };

// ── NOVA companion: states + voice (captions + local fillers; EVI audio-only wireable) ──
let capT=0;
function novaState(s){ novaEl.classList.remove('idle','talking','excited'); novaEl.classList.add(s);
  if(s!=='idle'){ clearTimeout(novaState._t); novaState._t=setTimeout(()=>{ novaEl.classList.remove('talking','excited'); novaEl.classList.add('idle'); }, s==='excited'?1400:1800); } }
function novaSay(text, state){ const c=$('cap'); c.textContent=text; c.classList.add('show'); novaState(state||'talking'); glow('speak');
  speak(text); clearTimeout(capT); capT=setTimeout(()=>c.classList.remove('show'), 2600); }
// WITNESS-MODE glow-border feedback channel: idle→purple, hit→green, streak→magenta, miss→amber, speak→white
function glow(s){ novaEl.classList.remove('g-idle','g-hit','g-streak','g-miss','g-speak'); novaEl.classList.add('g-'+s);
  if(s!=='idle'){ clearTimeout(glow._t); glow._t=setTimeout(()=>{ novaEl.classList.remove('g-hit','g-streak','g-miss','g-speak'); novaEl.classList.add('g-idle'); }, 1100); } }
// STATE MACHINE: 'full' = Nova big + talking (intro/end); 'voice' = figure away, voice + glow only (dancing)
function setMode(m){ const a=$('app'); if(a){ a.classList.remove('full','voice'); a.classList.add(m); } }
async function tunnel(){ const t=$('tunnel'); if(t) t.classList.add('on'); glow('speak'); await sleep(330); if(t) t.classList.remove('on'); await sleep(140); }
async function novaReturn(){ setMode('full'); novaState('talking'); glow('speak');   // bring her back at the end
  const line = game.maxCombo>=4 ? "You go BIG when it's fast — I love that! 💜" : game.cleanHits>=4 ? "Your moves were so clean! ✨" : "You found your groove! 💜";
  novaSay(line,'excited'); await sleep(2400); }
function speak(t){ if(!/[?&](novoice|nonova)/.test(location.search)){ try{ const u=new SpeechSynthesisUtterance(t.replace(/[✨🌟💜🤚]/g,'')); u.rate=1.05; u.pitch=1.25; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} } }
function warn(t){ const w=$('warn'); if(!t){ w.classList.remove('show'); return; } w.textContent=t; w.classList.add('show'); clearTimeout(warn._t); warn._t=setTimeout(()=>w.classList.remove('show'),2600); }

// ── camera + model (in-context permission) ──
async function ensureCamera(){
  if(stream) return true;
  try{ stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:720}, height:{ideal:1280} }, audio:false });
    cam.srcObject=stream; await cam.play(); sizeFx(); return true;
  }catch(e){ warn("I can't see you yet — tap to let me in! 📷"); return false; }
}
async function ensureModel(){ if(detector) return;
  try{ await tf.setBackend('webgl'); }catch(e){ try{ await tf.setBackend('cpu'); }catch(_){ } } await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{ modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }); }
function sizeFx(){ if(cam.videoWidth){ fx.width=cam.videoWidth; fx.height=cam.videoHeight; } }
cam.addEventListener('loadedmetadata', sizeFx); addEventListener('resize', sizeFx);

// coords: estimatePoses(flipHorizontal:true) → mirror X for the selfie overlay (object-fit:cover)
function coverMap(){ const cw=fx.width||1, ch=fx.height||1, ew=fx.clientWidth||cw, eh=fx.clientHeight||ch;
  // fx buffer == video buffer; element is object-fit:cover. Draw in buffer space; CSS covers identically to #cam.
  return { sx:1, sy:1 }; }
const KP=(kps,n)=>kps.find(k=>k.name===n);
function sm(key,x,y){ const a=.6; if(!smooth[key])smooth[key]={x,y}; smooth[key].x=smooth[key].x*a+x*(1-a); smooth[key].y=smooth[key].y*a+y*(1-a); return smooth[key]; }

function analyze(kps){
  const MIN=.3; det.joints=kps.filter(k=>k.score>MIN).length;
  const ls=KP(kps,'left_shoulder'),rs=KP(kps,'right_shoulder'),no=KP(kps,'nose'),lh=KP(kps,'left_hip'),rh=KP(kps,'right_hip');
  det.present= ls&&rs&&ls.score>MIN&&rs.score>MIN; if(!det.present){ return; }
  const Ls=sm('ls',ls.x,ls.y),Rs=sm('rs',rs.x,rs.y); const sw=Math.max(Math.abs(Ls.x-Rs.x),60);
  const midX=(Ls.x+Rs.x)/2;
  det.headDX = (no&&no.score>MIN)? ((sm('no',no.x,no.y).x - midX)/sw) : 0;
  det.shTilt = (Rs.y-Ls.y)/sw;
  det.hipDX  = (lh&&rh&&lh.score>MIN&&rh.score>MIN)? (((lh.x+rh.x)/2 - midX)/sw) : 0;
  det.lowerVisible = !!((lh&&lh.score>MIN)||(rh&&rh.score>MIN));
  const vw=cam.videoWidth||720; det.spanFrac=sw/vw;
  det.framingOK = det.present && det.joints>=8 && det.spanFrac>0.10 && det.spanFrac<0.55;
  if(prevKp){ let tot=0,c=0; for(let i=0;i<kps.length;i++){ if(kps[i].score>MIN&&prevKp[i]&&prevKp[i].score>MIN){ tot+=Math.hypot(kps[i].x-prevKp[i].x,kps[i].y-prevKp[i].y); c++; } } if(c) det.motion=.6*det.motion+.4*Math.min(1,(tot/c)/sw*3); }
  prevKp=kps.map(k=>({x:k.x,y:k.y,score:k.score}));
}

// ── light: shared engine, anchors picked here (ears not nose, ≥0.5) ──
const GATE=0.5;
function anchorsFor(cueKey, m, X, Y){
  const ok=k=>k&&k.score>=GATE, pt=k=>({x:X(k),y:Y(k)});
  const side=(a,b,L)=>{ const A=ok(a)?pt(a):null,B=ok(b)?pt(b):null; if(A&&B) return L?(A.x<B.x?A:B):(A.x>B.x?A:B); return A||B||null; };
  const both=(a,b)=>{ const o=[]; if(ok(a))o.push(pt(a)); if(ok(b))o.push(pt(b)); return o; };
  const out=[];
  if(/head/.test(cueKey)){ if(/left/.test(cueKey)){const p=side(m.left_ear,m.right_ear,true);if(p)out.push(p);} else if(/right/.test(cueKey)){const p=side(m.left_ear,m.right_ear,false);if(p)out.push(p);} else out.push(...both(m.left_ear,m.right_ear)); }
  else if(/shoulder/.test(cueKey)){ if(/left/.test(cueKey)){const p=side(m.left_shoulder,m.right_shoulder,true);if(p)out.push(p);} else if(/right/.test(cueKey)){const p=side(m.left_shoulder,m.right_shoulder,false);if(p)out.push(p);} else out.push(...both(m.left_shoulder,m.right_shoulder)); }
  else if(/hip/.test(cueKey)){ out.push(...both(m.left_hip,m.right_hip)); }
  else if(/free/.test(cueKey)){ out.push(...both(m.left_ear,m.right_ear), ...both(m.left_hip,m.right_hip)); }
  return out;
}
function bodyCenter(m,X,Y){ const ok=k=>k&&k.score>=GATE; const ps=[m.left_shoulder,m.right_shoulder,m.left_hip,m.right_hip].filter(ok);
  if(!ps.length) return null; let sx=0,sy=0; ps.forEach(k=>{sx+=X(k);sy+=Y(k);}); return {x:sx/ps.length,y:sy/ps.length}; }

let _cuePart=null, _cueState='armed', _cueQual=null;
function renderLight(kps){
  if(!window.NovaLight) return;
  if(!eng){ eng=window.NovaLight.create(fxc, window.NovaLight.PRESETS.upgroove); }
  const cw=fx.width, ch=fx.height;
  const X=p=>cw-p.x, Y=p=>p.y;   // mirror X (flipHorizontal:true already gave selfie coords; buffer==video)
  const m={}; kps.forEach(k=>m[k.name]=k);
  const ls=m.left_shoulder, rs=m.right_shoulder;
  const unit=(ls&&rs&&ls.score>=GATE&&rs.score>=GATE)?Math.hypot(X(ls)-X(rs),Y(ls)-Y(rs)):180;
  const k=Math.max(.4,Math.min(3,unit/220));
  const anchors=_cuePart?anchorsFor(_cuePart,m,X,Y):[];
  const center=bodyCenter(m,X,Y);
  const qMap={armed:.6,hit:.85,streak:.95,messy:.35,miss:.2};
  const quality=(_cueQual!=null)?_cueQual:(qMap[_cueState]||.6);
  let dir=null; if(_cuePart&&!/free/.test(_cuePart)) dir=/right/i.test(_cuePart)?'right':/left/i.test(_cuePart)?'left':(/shoulder|hip/.test(_cuePart)?'up':null);
  eng.render({ anchors, center, k, W:cw, H:ch, quality, velocity:0, dir, active:!!_cuePart, now:performance.now() });
}
function clearLight(){ if(eng) eng.reset(); fxc.clearRect(0,0,fx.width,fx.height); }

async function loop(){
  if(detector && cam.readyState>=2){
    let poses=[]; try{ poses=await detector.estimatePoses(cam,{flipHorizontal:true}); }catch(e){}
    if(poses[0]){ window.__lastPoseKeypoints=poses[0].keypoints; analyze(poses[0].keypoints);
      if(window.__captureMode){ drawCaptureDots(poses[0].keypoints); } else { renderLight(poses[0].keypoints); } }
    else { det.present=false; if(eng) eng.render({anchors:[],center:null,k:1,W:fx.width,H:fx.height,quality:.6,active:false,now:performance.now()}); }
  }
  rafId=requestAnimationFrame(loop);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setCue(part,state){ _cuePart=part; _cueState=state||'armed'; _cueQual=null; if(eng)eng.reset(); try{ showCue(part); }catch(e){} }

function drawCaptureDots(kps){
  fxc.clearRect(0,0,fx.width,fx.height);
  const names=['nose','left_shoulder','right_shoulder','left_wrist','right_wrist','left_hip','right_hip'];
  kps.forEach(k=>{ if(k.score>0.4 && names.includes(k.name)){
    const x=fx.width-k.x, y=k.y;
    const g=fxc.createRadialGradient(x,y,2,x,y,16);
    g.addColorStop(0,'#ffe9ae'); g.addColorStop(.5,'rgba(255,201,77,.85)'); g.addColorStop(1,'rgba(255,201,77,0)');
    fxc.fillStyle=g; fxc.beginPath(); fxc.arc(x,y,16,0,Math.PI*2); fxc.fill(); } });
}
const CUE_EMOJI={ 'head-left':'🙆','head-right':'🙆','shoulder-left':'🤷','shoulder-right':'🤷','hips-left':'🕺','hips-right':'🕺','free':'💃' };
function showCue(part){ const c=$('cue'); if(!part){ c.classList.remove('show'); return; }
  c.textContent=CUE_EMOJI[part]||'✨'; c.classList.add('show'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  const novaH=$('nova').getBoundingClientRect().height; c.style.top=novaH+'px'; }

async function captureMoment(){
  window.__captureMode=true; $('s-capture').classList.add('show');
  const dl=performance.now()+6000;
  while(performance.now()<dl && !det.present){ await sleep(150); }
  await sleep(700);
  $('cap-react').classList.add('show'); speak('WOW — there you are!');
  await sleep(900); $('cap-line').classList.add('show');
  await sleep(1600);
  $('s-capture').classList.remove('show'); $('cap-react').classList.remove('show'); $('cap-line').classList.remove('show');
  window.__captureMode=false; clearLight();
}

let kidName='';
try{ kidName=localStorage.getItem('nova-kid-name')||''; }catch(e){}
function saveName(n){ kidName=n; try{ localStorage.setItem('nova-kid-name',n); }catch(e){} }
async function nameMoment(){
  if(kidName){ novaSay(kidName+'!! You came BACK! 💜','excited'); await sleep(2100); return; }
  novaSay("What's your name? ✨",'talking'); $('s-name').classList.add('show');
  const got = await new Promise(res=>{
    let done=false; const finish=v=>{ if(done) return; done=true; res(v||''); };
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
    const tb=$('talk-btn');
    const start=e=>{ e.preventDefault(); if(!SR){ finish(prompt('Tell Nova your name! 💜')||''); return; }
      try{ rec=new SR(); rec.lang='en-US'; rec.interimResults=false;
        rec.onresult=ev=>{ finish(ev.results[0][0].transcript); }; rec.onerror=()=>finish(''); rec.start();
        tb.classList.add('rec'); tb.textContent='🎤 listening…'; }catch(err){ finish(''); } };
    const stop=e=>{ e.preventDefault(); tb.classList.remove('rec'); tb.textContent='🎤 Hold to talk';
      setTimeout(()=>{ try{ rec&&rec.stop(); }catch(err){} },350); };
    tb.addEventListener('touchstart',start); tb.addEventListener('touchend',stop);
    tb.addEventListener('mousedown',start); tb.addEventListener('mouseup',stop);
    $('type-btn').addEventListener('click',()=>finish(prompt('Tell Nova your name! 💜')||''));
    setTimeout(()=>finish(''), 25000);
  });
  $('s-name').classList.remove('show');
  const name=(got||'').trim().replace(/^(my name is|i am|i'm|im)\s+/i,'').split(/\s+/)[0]||'';
  if(name){ saveName(name.charAt(0).toUpperCase()+name.slice(1));
    novaSay(kidName+'!! I LOVE that name! ✨','excited'); }
  else { novaSay("Okay superstar — that's your name now! ⭐",'excited'); }
  await sleep(1900);
}

// ── FLOW: launch → permission → CAPTURE → frame guide → name → light test → game → ending ──
$('play-btn').addEventListener('click', startExperience);
async function startExperience(){
  $('play-btn').disabled=true; novaSay('Let me see you! 📷','talking');
  const ok=await ensureCamera(); if(!ok){ $('play-btn').disabled=false; return; }
  $('s-launch').classList.add('hidden'); setMode('full');
  await Promise.race([ ensureModel().catch(()=>{}), sleep(12000) ]);
  loop();
  await captureMoment();     // B1: the golden aperture — she SEES you
  await frameGuide();        // universal "stand here"
  await nameMoment();        // B2: name via hold-to-talk / type (remembered for next time)
  await presenceTest();      // the light challenge moment
  // ── PRESS DANCE → switch to VOICE-ONLY (figure away, camera takes the screen) ──
  novaSay("Okay — let's DANCE! 💃",'excited'); await tunnel(); setMode('voice');
  await playGame();          // VOICE-ONLY: glow feedback + voice slots, no figure
  await novaReturn();        // bring Nova back, full + talking
  endGame();
}

// universal frame guide — fit the outline once, lock distance for the session
async function frameGuide(){
  $('guide').classList.add('show'); novaState('small');
  novaSay('Step back till you fit inside the sparkles! ✨','talking');
  const dl=performance.now()+12000; let goodSince=0;
  while(performance.now()<dl){
    if(det.framingOK){ if(!goodSince)goodSince=performance.now(); if(performance.now()-goodSince>1200) break; }
    else { goodSince=0; if(!det.present) warn('come where I can see you 💜'); else if(det.spanFrac>=0.55) warn('scooch back a little! 💜'); else if(det.spanFrac<=0.10) warn('come a bit closer 💜'); else warn('get your head & shoulders in 💜'); }
    await sleep(300);
  }
  warn(''); $('guide').classList.add('fit'); novaSay('Perfect — right there! 💜','excited'); await sleep(900);
  $('guide').classList.remove('show','fit');
}

let presenceSeen=false;
async function presenceTest(){
  const side=Math.random()<.5?'left':'right';
  setCue('shoulder-'+side,'armed'); novaSay('Lift your '+side.toUpperCase()+' shoulder! 🤚','talking');
  const dl=performance.now()+8000;
  while(performance.now()<dl){ if(det.present && Math.abs(det.shTilt)>0.05){ presenceSeen=true; break; } await sleep(110); }
  if(presenceSeen){ _cueState='streak'; _cueQual=.95; novaSay('WHOA — I SAW that! ✨','excited'); }
  else { novaSay('there you are — I see you! 💜','excited'); }
  await sleep(1500); setCue(null);
}

// Up Groove cue sequence (compact): head L/R → shoulders L/R → hips → free
const MOVES={
  'head-left':  {say:'tilt your head LEFT',  pts:100, check:d=>Math.abs(d.headDX)>0.09},
  'head-right': {say:'tilt your head RIGHT', pts:100, check:d=>Math.abs(d.headDX)>0.09},
  'shoulder-left':{say:'lift your LEFT shoulder', pts:120, check:d=>Math.abs(d.shTilt)>0.045},
  'shoulder-right':{say:'lift your RIGHT shoulder',pts:120, check:d=>Math.abs(d.shTilt)>0.045},
  'hips-left':  {say:'sway your hips!', pts:80, visual:true, check:d=>false},
  'hips-right': {say:'sway your hips!', pts:80, visual:true, check:d=>false},
  'free':       {say:'FREESTYLE — go!', pts:120, check:d=>d.motion>0.05},
};
// FULL Up Groove choreography (~46s): slow build → double-speed reverse → freestyle.
const SEQ=[
  ['head-left',1600],['head-right',1600],['head-left',1600],['head-right',1600],
  ['shoulder-left',1700],['shoulder-right',1700],['shoulder-left',1700],['shoulder-right',1700],
  ['hips-left',1600],['hips-right',1600],['hips-left',1600],['hips-right',1600],
  ['hips-right',1000],['hips-left',1000],['shoulder-right',1000],['shoulder-left',1000],
  ['head-right',1000],['head-left',1000],['head-right',1000],['head-left',1000],
  ['free',6000],['free',6000]];
try{ window.CUES=SEQ.map(s=>({action:s[0],dur:s[1]})); }catch(e){}   // expose for nova-report.js
let lastSpeak=0;
async function playGame(){
  game.running=true; game.score=0; game.combo=0; $('streak').classList.add('show');
  novaState('small'); glow('idle'); novaSay("Watch me, then copy! Let's GO 💃",'excited'); await sleep(1200);
  for(const [action,dur] of SEQ){
    if(!game.running) break;
    const mv=MOVES[action]; game.total++;
    setCue(action,'armed'); $('cap').classList.remove('show');
    const end=performance.now()+dur; let resolved=false;
    while(performance.now()<end){
      if(!resolved && det.present && mv.check(det)){ resolved=true; onHit(action,dur,end); }
      await sleep(80);
    }
    if(!resolved){ if(mv.visual){ onHit(action,dur,end); } else { _cueState='miss'; glow('miss'); } }
    await sleep(180); setCue(null); await sleep(120);
  }
  game.running=false; $('streak').classList.remove('show'); setCue(null); clearLight();
}
function onHit(action,dur,end){
  const mv=MOVES[action]; const fast=(end-performance.now())>dur*0.45;
  game.score+=Math.round(mv.pts*(fast?1.4:1)); game.hits++; game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
  const clean=fast||mv.visual; if(clean) game.cleanHits++;
  _cueState=game.combo>=3?'streak':'hit'; _cueQual=clean?.92:.6;
  glow(game.combo>=3?'streak':'hit');   // Nova's border pulses the reaction (Witness Mode channel)
  $('streak').textContent='⭐ '+game.score+'  🔥 '+game.combo;
  // SUBTLE voice: milestones only, 7s cooldown (reaction-engine speak-gate)
  const n=performance.now();
  if((game.combo===1||game.combo===5||game.combo===10) && n-lastSpeak>7000){ lastSpeak=n;
    const part=action.replace(/-(left|right)/,'').replace('hips','hip'); const side=/left/.test(action)?'left':/right/.test(action)?'right':'';
    novaSay(game.combo>=5?('🔥 '+game.combo+' in a row!'):('Yes! that '+(side?side+' ':'')+part+'! ✨'),'excited'); }
}

function endGame(){
  clearLight(); $('streak').classList.remove('show'); novaState('idle');
  const acc=game.total?Math.round(100*game.hits/game.total):0;
  const stars=Math.max(1,Math.min(5,Math.round(acc/20)));
  $('end-stars').textContent='⭐'.repeat(stars)+'   '+game.score+' pts';
  $('end-learn').textContent = game.maxCombo>=4 ? "You go BIG when the music's fast — I love that. 💜"
    : game.cleanHits>=4 ? "Your shoulders were so clean today! 💜" : "You found your groove — let's do it again tomorrow. 💜";
  $('end-line').textContent = stars>=4?'You were a STAR! 🌟':'So good — high five! 🙌';
  $('s-end').classList.remove('hidden');
  novaSay((kidName?kidName+' — s':'S')+'ame time tomorrow? I\'ll be here. 💜','talking');
}
document.querySelectorAll('#fb button').forEach(b=>b.addEventListener('click',()=>{
  try{ localStorage.setItem('nova-fb-'+Date.now(), b.dataset.fb); }catch(e){}
  novaSay('Thank you! 💜','excited'); setTimeout(()=>{ $('s-end').classList.add('hidden'); resetGame(); },700);
}));
$('again-btn').addEventListener('click',()=>{ $('s-end').classList.add('hidden'); resetGame(); });
function resetGame(){ game.combo=0; presenceSeen=false; (async()=>{ setMode('full'); await presenceTest(); novaSay("Again! let's DANCE! 💃",'excited'); await tunnel(); setMode('voice'); await playGame(); await novaReturn(); endGame(); })(); }

// graceful: page hidden → pause speech
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ try{speechSynthesis.cancel();}catch(e){} } });
// self-test hooks
window.__nova={ det, game, setCue, get cuePart(){return _cuePart;}, novaState, frameGuide, presenceTest, playGame };
</script>
