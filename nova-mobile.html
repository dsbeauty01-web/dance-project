<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Nova Dance — Mobile</title>
<!--
  NOVA DANCE — MOBILE (NOVA-MOBILE-MASTER / NOVA-MOBILE-UX-SPEC)
  Locked foundation: 60% camera (bottom) / 40% Nova (top). NO live avatar — Nova is an
  ILLUSTRATION with idle/talking/excited states + breathing + reactive glow + voice.
  This kills the Runway latency tax AND the Runway-400 blocker (her face engine is gone).
  Shared light = nova-light.js (PRESETS.upgroove). Game = Up Groove (launch game).
  Voice: captions + local fillers now (graceful voice-out state); EVI audio-only wireable.
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;-webkit-user-select:none;user-select:none}
  :root{ --gold:#FFD27A; --amber:#FFA63D; --mint:#BFFFC8; --bg:#0a0612; --camH:60svh; --novaH:40svh; }
  html,body{height:100%;background:var(--bg);font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ── TOP 40% — NOVA (illustration + reactive glow, never a frozen PNG) ── */
  #nova{position:relative;height:var(--novaH);flex:0 0 var(--novaH);display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 30%, #2a1052 0%, #160a2e 55%, #0a0612 100%);overflow:hidden}
  #nova-glow{position:absolute;width:78vw;max-width:420px;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(255,210,122,.55) 0%, rgba(255,166,61,.25) 38%, transparent 68%);
    filter:blur(8px);animation:halo 3.4s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.05);opacity:1}}
  #nova-fig{position:relative;width:34vh;max-width:230px;aspect-ratio:.82;border-radius:24px;
    background:center 22%/cover no-repeat url('nova-face.png');
    box-shadow:0 0 0 4px rgba(255,210,122,.85),0 10px 40px rgba(0,0,0,.45);
    animation:breathe 3.2s ease-in-out infinite;transition:transform .25s ease, box-shadow .25s ease}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
  /* states (swap on voice/game events) */
  #nova.talking #nova-glow{animation-duration:1.4s;opacity:1}
  #nova.talking #nova-fig{box-shadow:0 0 0 5px rgba(255,221,150,1),0 0 50px 8px rgba(255,190,90,.7),0 10px 40px rgba(0,0,0,.45)}
  #nova.excited #nova-fig{transform:scale(1.08);box-shadow:0 0 0 6px var(--mint),0 0 70px 14px rgba(191,255,200,.6),0 10px 40px rgba(0,0,0,.45)}
  #nova.excited #nova-glow{background:radial-gradient(circle, rgba(191,255,200,.6) 0%, rgba(255,210,122,.3) 40%, transparent 70%);animation-duration:.9s}
  #nova.small{height:18svh;flex-basis:18svh}
  #nova-name{position:absolute;bottom:6px;font-size:13px;font-weight:700;color:#ffe9c9;opacity:.8;letter-spacing:.5px}
  /* glassmorphic caption (Nova's line) — top-strip, never over the kid */
  #cap{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateY(8px);max-width:90%;
    background:rgba(20,10,40,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);
    padding:7px 16px;border-radius:18px;font-size:clamp(14px,4.2vw,18px);font-weight:600;text-align:center;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;white-space:nowrap;color:#fff}
  #cap.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── BOTTOM 60% — CAMERA (the kid is the star; detection room) ── */
  #stage{position:relative;height:var(--camH);flex:1 1 var(--camH);background:#06070b;overflow:hidden}
  #cam,#fx{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
  #cam{background:#06070b}
  #fx{pointer-events:none}
  /* "stand here" frame guide (universal setup, arm-span width) */
  #guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;height:88%;
    border:3px dashed rgba(255,210,122,.7);border-radius:26px;box-shadow:0 0 30px rgba(255,210,122,.3) inset;
    opacity:0;transition:opacity .3s ease;pointer-events:none}
  #guide.show{opacity:1;animation:guidePulse 1.6s ease-in-out infinite}
  #guide.fit{border-color:var(--mint);box-shadow:0 0 50px rgba(191,255,200,.6) inset;animation:none}
  @keyframes guidePulse{0%,100%{border-color:rgba(255,210,122,.6)}50%{border-color:rgba(255,210,122,1)}}
  /* tiny streak status — top corner, non-interactive */
  #streak{position:absolute;top:8px;right:10px;font-size:13px;font-weight:800;color:var(--gold);
    background:rgba(10,6,18,.5);padding:3px 10px;border-radius:12px;opacity:0;transition:opacity .3s}
  #streak.show{opacity:1}
  /* PiP "watch me" reference (top strip of camera) */
  #ref{position:absolute;top:8px;left:8px;width:26vw;max-width:120px;aspect-ratio:.7;border-radius:12px;overflow:hidden;
    border:2px solid rgba(255,255,255,.25);background:#160a2e;opacity:0;transition:opacity .3s;z-index:3}
  #ref.show{opacity:.96}
  #ref video{width:100%;height:100%;object-fit:cover}
  #ref .lbl{position:absolute;bottom:0;width:100%;text-align:center;font-size:10px;background:rgba(0,0,0,.5);padding:2px}

  /* ── SCREENS / THUMB-ZONE BUTTONS ── */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:14px;background:radial-gradient(120% 90% at 50% 25%,#2a1052,#0a0612 70%)}
  .screen.hidden{display:none}
  .hero{font-size:clamp(26px,8vw,42px);font-weight:800;text-shadow:0 0 24px rgba(255,210,122,.5)}
  .sub{font-size:clamp(14px,4vw,18px);color:#e9d5ff;opacity:.85;max-width:80%}
  .big-btn{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    min-width:72vw;min-height:64px;border:none;border-radius:34px;cursor:pointer;color:#3a0a00;font-weight:800;
    font-size:clamp(18px,5.4vw,24px);background:linear-gradient(160deg,#ffe39a,#ff9ad1);
    box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 26px rgba(255,210,122,.5)}
  .big-btn:active{transform:translateX(-50%) scale(.97)}
  .mini{font-size:13px;color:#cdb8ff;opacity:.7;position:absolute;bottom:8px}
  /* feedback faces */
  #fb{display:flex;gap:18px;margin-top:8px}
  #fb button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);
    font-size:34px;cursor:pointer}
  #fb button:active{transform:scale(.92);border-color:var(--gold)}
  #warn{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);z-index:25;font-size:15px;color:#ffd27a;
    background:rgba(20,10,40,.7);backdrop-filter:blur(6px);padding:8px 16px;border-radius:16px;opacity:0;transition:opacity .3s;text-align:center;max-width:88vw}
  #warn.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <!-- TOP 40% — Nova illustration -->
  <div id="nova" class="idle">
    <div id="nova-glow"></div>
    <div id="nova-fig"></div>
    <div id="cap"></div>
    <div id="nova-name">Nova</div>
  </div>
  <!-- BOTTOM 60% — camera -->
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="fx"></canvas>
    <div id="guide"></div>
    <div id="streak"></div>
    <div id="ref" class="hidden-ref"><video id="ref-vid" playsinline muted loop></video><div class="lbl">watch me</div></div>
  </div>
</div>

<!-- 0 · Launch -->
<div class="screen" id="s-launch">
  <div class="hero">Hi, I'm Nova! ✨</div>
  <div class="sub">Let's dance together — I'll watch and cheer you on.</div>
  <button class="big-btn" id="play-btn">▶ Play with Nova</button>
  <div class="mini">made for little dancers 💜</div>
</div>

<!-- 4 · Ending -->
<div class="screen hidden" id="s-end">
  <div class="hero" id="end-line">You were a STAR! 🌟</div>
  <div class="sub" id="end-learn"></div>
  <div style="font-size:13px;opacity:.7" id="end-stars"></div>
  <div class="sub" style="margin-top:6px">How was that?</div>
  <div id="fb">
    <button data-fb="happy">😀</button><button data-fb="ok">😐</button><button data-fb="sad">😞</button>
  </div>
  <button class="big-btn" id="again-btn">🔄 Dance again</button>
</div>

<div id="warn"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="nova-light.js"></script>
<script src="nova-report.js"></script>
<script src="nova-tracker.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cam=$('cam'), fx=$('fx'), fxc=fx.getContext('2d'), novaEl=$('nova');
let detector=null, stream=null, rafId=0, eng=null;
const det={ present:false, joints:0, headDX:0, shTilt:0, hipDX:0, motion:0, framingOK:false, spanFrac:0, lowerVisible:false };
let prevKp=null, smooth={};
window.__novaDet=()=>det;
const game={ running:false, score:0, combo:0, maxCombo:0, hits:0, total:0, cleanHits:0 };

// ── NOVA companion: states + voice (captions + local fillers; EVI audio-only wireable) ──
let capT=0;
function novaState(s){ novaEl.classList.remove('idle','talking','excited'); novaEl.classList.add(s);
  if(s!=='idle'){ clearTimeout(novaState._t); novaState._t=setTimeout(()=>{ novaEl.classList.remove('talking','excited'); novaEl.classList.add('idle'); }, s==='excited'?1400:1800); } }
function novaSay(text, state){ const c=$('cap'); c.textContent=text; c.classList.add('show'); novaState(state||'talking');
  speak(text); clearTimeout(capT); capT=setTimeout(()=>c.classList.remove('show'), 2600); }
function speak(t){ if(!/[?&](novoice|nonova)/.test(location.search)){ try{ const u=new SpeechSynthesisUtterance(t.replace(/[✨🌟💜🤚]/g,'')); u.rate=1.05; u.pitch=1.25; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} } }
function warn(t){ const w=$('warn'); if(!t){ w.classList.remove('show'); return; } w.textContent=t; w.classList.add('show'); clearTimeout(warn._t); warn._t=setTimeout(()=>w.classList.remove('show'),2600); }

// ── camera + model (in-context permission) ──
async function ensureCamera(){
  if(stream) return true;
  try{ stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:720}, height:{ideal:1280} }, audio:false });
    cam.srcObject=stream; await cam.play(); sizeFx(); return true;
  }catch(e){ warn("I can't see you yet — tap to let me in! 📷"); return false; }
}
async function ensureModel(){ if(detector) return;
  try{ await tf.setBackend('webgl'); }catch(e){ try{ await tf.setBackend('cpu'); }catch(_){ } } await tf.ready();
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{ modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }); }
function sizeFx(){ if(cam.videoWidth){ fx.width=cam.videoWidth; fx.height=cam.videoHeight; } }
cam.addEventListener('loadedmetadata', sizeFx); addEventListener('resize', sizeFx);

// coords: estimatePoses(flipHorizontal:true) → mirror X for the selfie overlay (object-fit:cover)
function coverMap(){ const cw=fx.width||1, ch=fx.height||1, ew=fx.clientWidth||cw, eh=fx.clientHeight||ch;
  // fx buffer == video buffer; element is object-fit:cover. Draw in buffer space; CSS covers identically to #cam.
  return { sx:1, sy:1 }; }
const KP=(kps,n)=>kps.find(k=>k.name===n);
function sm(key,x,y){ const a=.6; if(!smooth[key])smooth[key]={x,y}; smooth[key].x=smooth[key].x*a+x*(1-a); smooth[key].y=smooth[key].y*a+y*(1-a); return smooth[key]; }

function analyze(kps){
  const MIN=.3; det.joints=kps.filter(k=>k.score>MIN).length;
  const ls=KP(kps,'left_shoulder'),rs=KP(kps,'right_shoulder'),no=KP(kps,'nose'),lh=KP(kps,'left_hip'),rh=KP(kps,'right_hip');
  det.present= ls&&rs&&ls.score>MIN&&rs.score>MIN; if(!det.present){ return; }
  const Ls=sm('ls',ls.x,ls.y),Rs=sm('rs',rs.x,rs.y); const sw=Math.max(Math.abs(Ls.x-Rs.x),60);
  const midX=(Ls.x+Rs.x)/2;
  det.headDX = (no&&no.score>MIN)? ((sm('no',no.x,no.y).x - midX)/sw) : 0;
  det.shTilt = (Rs.y-Ls.y)/sw;
  det.hipDX  = (lh&&rh&&lh.score>MIN&&rh.score>MIN)? (((lh.x+rh.x)/2 - midX)/sw) : 0;
  det.lowerVisible = !!((lh&&lh.score>MIN)||(rh&&rh.score>MIN));
  const vw=cam.videoWidth||720; det.spanFrac=sw/vw;
  det.framingOK = det.present && det.joints>=8 && det.spanFrac>0.10 && det.spanFrac<0.55;
  if(prevKp){ let tot=0,c=0; for(let i=0;i<kps.length;i++){ if(kps[i].score>MIN&&prevKp[i]&&prevKp[i].score>MIN){ tot+=Math.hypot(kps[i].x-prevKp[i].x,kps[i].y-prevKp[i].y); c++; } } if(c) det.motion=.6*det.motion+.4*Math.min(1,(tot/c)/sw*3); }
  prevKp=kps.map(k=>({x:k.x,y:k.y,score:k.score}));
}

// ── light: shared engine, anchors picked here (ears not nose, ≥0.5) ──
const GATE=0.5;
function anchorsFor(cueKey, m, X, Y){
  const ok=k=>k&&k.score>=GATE, pt=k=>({x:X(k),y:Y(k)});
  const side=(a,b,L)=>{ const A=ok(a)?pt(a):null,B=ok(b)?pt(b):null; if(A&&B) return L?(A.x<B.x?A:B):(A.x>B.x?A:B); return A||B||null; };
  const both=(a,b)=>{ const o=[]; if(ok(a))o.push(pt(a)); if(ok(b))o.push(pt(b)); return o; };
  const out=[];
  if(/head/.test(cueKey)){ if(/left/.test(cueKey)){const p=side(m.left_ear,m.right_ear,true);if(p)out.push(p);} else if(/right/.test(cueKey)){const p=side(m.left_ear,m.right_ear,false);if(p)out.push(p);} else out.push(...both(m.left_ear,m.right_ear)); }
  else if(/shoulder/.test(cueKey)){ if(/left/.test(cueKey)){const p=side(m.left_shoulder,m.right_shoulder,true);if(p)out.push(p);} else if(/right/.test(cueKey)){const p=side(m.left_shoulder,m.right_shoulder,false);if(p)out.push(p);} else out.push(...both(m.left_shoulder,m.right_shoulder)); }
  else if(/hip/.test(cueKey)){ out.push(...both(m.left_hip,m.right_hip)); }
  else if(/free/.test(cueKey)){ out.push(...both(m.left_ear,m.right_ear), ...both(m.left_hip,m.right_hip)); }
  return out;
}
function bodyCenter(m,X,Y){ const ok=k=>k&&k.score>=GATE; const ps=[m.left_shoulder,m.right_shoulder,m.left_hip,m.right_hip].filter(ok);
  if(!ps.length) return null; let sx=0,sy=0; ps.forEach(k=>{sx+=X(k);sy+=Y(k);}); return {x:sx/ps.length,y:sy/ps.length}; }

let _cuePart=null, _cueState='armed', _cueQual=null;
function renderLight(kps){
  if(!window.NovaLight) return;
  if(!eng){ eng=window.NovaLight.create(fxc, window.NovaLight.PRESETS.upgroove); }
  const cw=fx.width, ch=fx.height;
  const X=p=>cw-p.x, Y=p=>p.y;   // mirror X (flipHorizontal:true already gave selfie coords; buffer==video)
  const m={}; kps.forEach(k=>m[k.name]=k);
  const ls=m.left_shoulder, rs=m.right_shoulder;
  const unit=(ls&&rs&&ls.score>=GATE&&rs.score>=GATE)?Math.hypot(X(ls)-X(rs),Y(ls)-Y(rs)):180;
  const k=Math.max(.4,Math.min(3,unit/220));
  const anchors=_cuePart?anchorsFor(_cuePart,m,X,Y):[];
  const center=bodyCenter(m,X,Y);
  const qMap={armed:.6,hit:.85,streak:.95,messy:.35,miss:.2};
  const quality=(_cueQual!=null)?_cueQual:(qMap[_cueState]||.6);
  let dir=null; if(_cuePart&&!/free/.test(_cuePart)) dir=/right/i.test(_cuePart)?'right':/left/i.test(_cuePart)?'left':(/shoulder|hip/.test(_cuePart)?'up':null);
  eng.render({ anchors, center, k, W:cw, H:ch, quality, velocity:0, dir, active:!!_cuePart, now:performance.now() });
}
function clearLight(){ if(eng) eng.reset(); fxc.clearRect(0,0,fx.width,fx.height); }

async function loop(){
  if(detector && cam.readyState>=2){
    let poses=[]; try{ poses=await detector.estimatePoses(cam,{flipHorizontal:true}); }catch(e){}
    if(poses[0]){ window.__lastPoseKeypoints=poses[0].keypoints; analyze(poses[0].keypoints); renderLight(poses[0].keypoints); }
    else { det.present=false; if(eng) eng.render({anchors:[],center:null,k:1,W:fx.width,H:fx.height,quality:.6,active:false,now:performance.now()}); }
  }
  rafId=requestAnimationFrame(loop);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setCue(part,state){ _cuePart=part; _cueState=state||'armed'; _cueQual=null; if(eng)eng.reset(); }

// ── FLOW: launch → permission → presence → frame guide → game → ending ──
$('play-btn').addEventListener('click', startExperience);
async function startExperience(){
  $('play-btn').disabled=true; novaSay('Let me see you! 📷','talking');
  const ok=await ensureCamera(); if(!ok){ $('play-btn').disabled=false; return; }
  $('s-launch').classList.add('hidden');
  await Promise.race([ ensureModel().catch(()=>{}), sleep(12000) ]);
  loop();
  await frameGuide();        // universal "stand here" (arm-span width)
  await presenceTest();      // the "she sees me" moment
  await playGame();          // Up Groove cue sequence
  endGame();
}

// universal frame guide — fit the outline once, lock distance for the session
async function frameGuide(){
  $('guide').classList.add('show'); novaState('small');
  novaSay('Step back till you fit inside the sparkles! ✨','talking');
  const dl=performance.now()+12000; let goodSince=0;
  while(performance.now()<dl){
    if(det.framingOK){ if(!goodSince)goodSince=performance.now(); if(performance.now()-goodSince>1200) break; }
    else { goodSince=0; if(!det.present) warn('come where I can see you 💜'); else if(det.spanFrac>=0.55) warn('scooch back a little! 💜'); else if(det.spanFrac<=0.10) warn('come a bit closer 💜'); else warn('get your head & shoulders in 💜'); }
    await sleep(300);
  }
  warn(''); $('guide').classList.add('fit'); novaSay('Perfect — right there! 💜','excited'); await sleep(900);
  $('guide').classList.remove('show','fit');
}

let presenceSeen=false;
async function presenceTest(){
  const side=Math.random()<.5?'left':'right';
  setCue('shoulder-'+side,'armed'); novaSay('Lift your '+side.toUpperCase()+' shoulder! 🤚','talking');
  const dl=performance.now()+8000;
  while(performance.now()<dl){ if(det.present && Math.abs(det.shTilt)>0.05){ presenceSeen=true; break; } await sleep(110); }
  if(presenceSeen){ _cueState='streak'; _cueQual=.95; novaSay('WHOA — I SAW that! ✨','excited'); }
  else { novaSay('there you are — I see you! 💜','excited'); }
  await sleep(1500); setCue(null);
}

// Up Groove cue sequence (compact): head L/R → shoulders L/R → hips → free
const MOVES={
  'head-left':  {say:'tilt your head LEFT',  pts:100, check:d=>Math.abs(d.headDX)>0.09},
  'head-right': {say:'tilt your head RIGHT', pts:100, check:d=>Math.abs(d.headDX)>0.09},
  'shoulder-left':{say:'lift your LEFT shoulder', pts:120, check:d=>Math.abs(d.shTilt)>0.045},
  'shoulder-right':{say:'lift your RIGHT shoulder',pts:120, check:d=>Math.abs(d.shTilt)>0.045},
  'hips-left':  {say:'sway your hips!', pts:80, visual:true, check:d=>false},
  'hips-right': {say:'sway your hips!', pts:80, visual:true, check:d=>false},
  'free':       {say:'FREESTYLE — go!', pts:120, check:d=>d.motion>0.05},
};
const SEQ=[['head-left',1500],['head-right',1500],['shoulder-left',1600],['shoulder-right',1600],
  ['hips-left',1500],['hips-right',1500],['head-left',1300],['shoulder-right',1300],['free',5000]];
try{ window.CUES=SEQ.map(s=>({action:s[0],dur:s[1]})); }catch(e){}   // expose for nova-report.js
let lastSpeak=0;
async function playGame(){
  game.running=true; game.score=0; game.combo=0; $('streak').classList.add('show');
  novaState('small'); novaSay("Watch me, then copy! Let's GO 💃",'excited'); await sleep(1200);
  for(const [action,dur] of SEQ){
    if(!game.running) break;
    const mv=MOVES[action]; game.total++;
    setCue(action,'armed'); $('cap').classList.remove('show');
    const end=performance.now()+dur; let resolved=false;
    while(performance.now()<end){
      if(!resolved && det.present && mv.check(det)){ resolved=true; onHit(action,dur,end); }
      await sleep(80);
    }
    if(!resolved){ if(mv.visual){ onHit(action,dur,end); } else { _cueState='miss'; } }
    await sleep(180); setCue(null); await sleep(120);
  }
  game.running=false; $('streak').classList.remove('show'); setCue(null); clearLight();
}
function onHit(action,dur,end){
  const mv=MOVES[action]; const fast=(end-performance.now())>dur*0.45;
  game.score+=Math.round(mv.pts*(fast?1.4:1)); game.hits++; game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
  const clean=fast||mv.visual; if(clean) game.cleanHits++;
  _cueState=game.combo>=3?'streak':'hit'; _cueQual=clean?.92:.6;
  $('streak').textContent='🔥 '+game.combo;
  // SUBTLE voice: milestones only, 7s cooldown (reaction-engine speak-gate)
  const n=performance.now();
  if((game.combo===1||game.combo===5||game.combo===10) && n-lastSpeak>7000){ lastSpeak=n;
    const part=action.replace(/-(left|right)/,'').replace('hips','hip'); const side=/left/.test(action)?'left':/right/.test(action)?'right':'';
    novaSay(game.combo>=5?('🔥 '+game.combo+' in a row!'):('Yes! that '+(side?side+' ':'')+part+'! ✨'),'excited'); }
}

function endGame(){
  clearLight(); $('streak').classList.remove('show'); novaState('idle');
  const acc=game.total?Math.round(100*game.hits/game.total):0;
  const stars=Math.max(1,Math.min(5,Math.round(acc/20)));
  $('end-stars').textContent='⭐'.repeat(stars)+'   '+game.score+' pts';
  $('end-learn').textContent = game.maxCombo>=4 ? "You go BIG when the music's fast — I love that. 💜"
    : game.cleanHits>=4 ? "Your shoulders were so clean today! 💜" : "You found your groove — let's do it again tomorrow. 💜";
  $('end-line').textContent = stars>=4?'You were a STAR! 🌟':'So good — high five! 🙌';
  $('s-end').classList.remove('hidden');
  novaSay('Same time tomorrow? I\'ll be here. 💜','talking');
}
document.querySelectorAll('#fb button').forEach(b=>b.addEventListener('click',()=>{
  try{ localStorage.setItem('nova-fb-'+Date.now(), b.dataset.fb); }catch(e){}
  novaSay('Thank you! 💜','excited'); setTimeout(()=>{ $('s-end').classList.add('hidden'); resetGame(); },700);
}));
$('again-btn').addEventListener('click',()=>{ $('s-end').classList.add('hidden'); resetGame(); });
function resetGame(){ game.combo=0; presenceSeen=false; (async()=>{ await presenceTest(); await playGame(); endGame(); })(); }

// graceful: page hidden → pause speech
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ try{speechSynthesis.cancel();}catch(e){} } });
// self-test hooks
window.__nova={ det, game, setCue, get cuePart(){return _cuePart;}, novaState, frameGuide, presenceTest, playGame };
</script>
