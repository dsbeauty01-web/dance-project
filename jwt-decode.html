<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Runway JWT Decode</title>
<style>
  body {
    font-family: monospace;
    background: #1a0d2b;
    color: #fff;
    padding: 40px;
    text-align: center;
  }
  h1 { color: #fb7185; }
  button {
    font-size: 32px;
    padding: 30px 60px;
    background: linear-gradient(135deg, #e11d48, #fb7185);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    margin: 30px;
    font-family: monospace;
    font-weight: bold;
  }
  button:hover { transform: scale(1.05); }
  button:disabled { opacity: 0.5; cursor: wait; }

  #result {
    margin-top: 40px;
    padding: 30px;
    border-radius: 16px;
    font-size: 16px;
    text-align: left;
    word-break: break-all;
    min-height: 100px;
  }
  .success { background: #14532d; border: 2px solid #22c55e; }
  .error   { background: #7f1d1d; border: 2px solid #ef4444; }
  .waiting { background: #422006; border: 2px solid #eab308; }
  pre { white-space: pre-wrap; margin: 0; font-size: 14px; line-height: 1.5; }
  .highlight { background: #fbbf24; color: #000; padding: 2px 6px; font-weight: bold; }
</style>
</head>
<body>

<h1>🔓 JWT Decoder — find the LiveKit URL</h1>
<p>Click → the page calls Worker → decodes the JWT → shows what's inside.<br>
<strong>Just screenshot the result.</strong> No copying needed.</p>

<button id="testBtn" onclick="runTest()">▶ DECODE</button>

<div id="result"></div>

<script>
async function runTest() {
  const btn = document.getElementById('testBtn');
  const result = document.getElementById('result');

  btn.disabled = true;
  btn.textContent = '⏳ Working...';

  result.className = 'waiting';
  result.innerHTML = '<pre>⏳ Calling Worker, waiting for session...</pre>';

  try {
    const res = await fetch('https://long-art-8269r.dsbeauty01.workers.dev/runway-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatarId: 'music-superstar' })
    });

    const data = await res.json();

    if (!data.sessionKey) {
      result.className = 'error';
      result.innerHTML = `<pre>❌ No sessionKey returned.\n\n${JSON.stringify(data, null, 2)}</pre>`;
      btn.disabled = false;
      btn.textContent = '🔄 TRY AGAIN';
      return;
    }

    // Decode the JWT
    const parts = data.sessionKey.split('.');
    const headerB64 = parts[0];
    const payloadB64 = parts[1];

    const fixB64 = s => s.replace(/-/g, '+').replace(/_/g, '/');
    const header = JSON.parse(atob(fixB64(headerB64)));
    const payload = JSON.parse(atob(fixB64(payloadB64)));

    // Show whole response + decoded JWT
    result.className = 'success';
    result.innerHTML = `
<pre>✅ Worker returned this whole object:

${JSON.stringify(data, null, 2)}


🔍 JWT HEADER:

${JSON.stringify(header, null, 2)}


🔍 JWT PAYLOAD (this is what we need):

${JSON.stringify(payload, null, 2)}


📸 SCREENSHOT EVERYTHING ABOVE and send to Claude.
The LiveKit URL field is hiding in the payload somewhere.</pre>`;

  } catch (err) {
    result.className = 'error';
    result.innerHTML = `<pre>❌ Error: ${err.message}</pre>`;
  }

  btn.disabled = false;
  btn.textContent = '🔄 RUN AGAIN';
}
</script>

</body>
</html>
