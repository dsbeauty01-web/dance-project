<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nova — Voice (EVI 3 · Kora)</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; font-family:system-ui,Segoe UI,sans-serif; color:#fff;
    background:radial-gradient(circle at 50% -10%, #3a1060, #0c001c 72%); overflow:hidden; }
  #wrap{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; }
  h1{ margin:0; font-size:clamp(20px,5vw,30px); letter-spacing:.5px; }
  #orb{ width:min(46vw,210px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #ffe39a, #ff8ae2 55%, #8a5cff 100%);
    box-shadow:0 0 60px rgba(255,138,226,.6); transition:transform .12s ease, box-shadow .12s ease; }
  #orb.listen{ box-shadow:0 0 50px rgba(110,231,255,.7); }
  #orb.talk{ animation:talk .5s ease-in-out infinite; }
  @keyframes talk{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.09) } }
  #status{ font-size:15px; color:#d9c6f5; min-height:20px; text-align:center; }
  #cap{ font-size:14px; color:#fff; background:rgba(0,0,0,.35); padding:8px 14px; border-radius:14px;
    max-width:90%; min-height:22px; text-align:center; }
  button{ border:none; border-radius:26px; padding:15px 30px; font-size:17px; font-weight:800; cursor:pointer; }
  #start{ background:linear-gradient(90deg,#ffd84d,#ff8ae2); color:#3a0a00; }
  #stop{ background:rgba(255,255,255,.15); color:#fff; display:none; }
  .row{ display:flex; gap:12px; }
  #keybox{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:none; gap:6px; z-index:5; }
  #keybox input{ padding:8px 10px; border-radius:10px; border:1px solid #555; width:60vw; max-width:340px; }
  #err{ color:#ff9db0; font-size:13px; max-width:90%; text-align:center; }
</style>
</head>
<body>
<div id="keybox"><input id="keyin" placeholder="paste Hume API key" /><button id="keygo" style="background:#6ee7ff;color:#04210f;padding:8px 14px;border-radius:10px;">go</button></div>
<div id="wrap">
  <h1>✨ Talk to Nova</h1>
  <div id="orb"></div>
  <div id="status">tap to start</div>
  <div id="cap"></div>
  <div class="row">
    <button id="start">🎤 Start</button>
    <button id="stop">Stop</button>
  </div>
  <div id="err"></div>
</div>

<script type="module">
const CONFIG_ID = 'bddc965a-0b47-44f3-97b8-37ce89526d65';   // Nova-Kora-EVI3 (public, not a secret)
const $ = id => document.getElementById(id);
const orb=$('orb'), status=$('status'), cap=$('cap'), err=$('err');

// API key: from URL (#k=... or ?key=...) so it's never committed; else ask.
function getKey(){
  const h=new URLSearchParams(location.hash.slice(1)), q=new URLSearchParams(location.search);
  return h.get('k')||q.get('key')||localStorage.getItem('hume_key')||'';
}

let socket, audioCtx, micStream, recorder, playing=false;
const queue=[]; let playingNow=false;

async function connect(){
  let key=getKey();
  if(!key){ $('keybox').style.display='flex'; status.textContent='paste your Hume API key above, then tap go'; return; }
  localStorage.setItem('hume_key', key);
  status.textContent='connecting to Nova…'; err.textContent='';
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
  }catch(e){ err.textContent='mic blocked: '+e.message; return; }

  const url=`wss://api.hume.ai/v0/evi/chat?config_id=${CONFIG_ID}&api_key=${encodeURIComponent(key)}`;
  socket = new WebSocket(url);
  socket.onopen = ()=>{ status.textContent='say hi to Nova!'; orb.classList.add('listen');
    $('start').style.display='none'; $('stop').style.display='inline-block';
    startMic();
    // nudge her to greet first
    try{ socket.send(JSON.stringify({ type:'user_input', text:'Hi Nova!' })); }catch(e){}
  };
  socket.onerror = ()=>{ err.textContent='connection error (check the API key)'; };
  socket.onclose = (e)=>{ status.textContent='disconnected'; orb.classList.remove('listen','talk'); cleanupMic();
    if(e.code===1008||e.code===3000) err.textContent='auth failed — wrong/expired API key'; };
  socket.onmessage = onMessage;
}

function startMic(){
  // send mic audio as webm/opus chunks (EVI auto-detects)
  const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  recorder = new MediaRecorder(micStream, { mimeType:mime });
  recorder.ondataavailable = async (ev)=>{
    if(!ev.data || ev.data.size<10 || socket.readyState!==1) return;
    const b64 = await blobToB64(ev.data);
    socket.send(JSON.stringify({ type:'audio_input', data:b64 }));
  };
  recorder.start(120);   // emit a chunk every 120ms
}
function cleanupMic(){ try{ recorder&&recorder.stop(); }catch(e){} try{ micStream&&micStream.getTracks().forEach(t=>t.stop()); }catch(e){} }

function onMessage(ev){
  let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
  switch(msg.type){
    case 'user_message': cap.textContent='🧒 '+(msg.message?.content||''); orb.classList.add('listen'); break;
    case 'assistant_message': cap.textContent='💜 '+(msg.message?.content||''); break;
    case 'audio_output': enqueue(msg.data); break;
    case 'user_interruption': stopPlayback(); break;
    case 'assistant_end': orb.classList.remove('talk'); orb.classList.add('listen'); status.textContent='your turn — talk!'; break;
    case 'error': err.textContent='Nova error: '+(msg.message||''); break;
  }
}

// playback queue (EVI sends audio_output chunks as base64 wav)
function enqueue(b64){ queue.push(b64); if(!playingNow) playNext(); }
async function playNext(){
  if(!queue.length){ playingNow=false; return; }
  playingNow=true; orb.classList.add('talk'); orb.classList.remove('listen'); status.textContent='Nova is talking…';
  const b64=queue.shift();
  try{
    const buf = await audioCtx.decodeAudioData(b64ToArrayBuffer(b64));
    const src = audioCtx.createBufferSource(); src.buffer=buf; src.connect(audioCtx.destination);
    src.onended = playNext; src.start();
  }catch(e){ playNext(); }
}
function stopPlayback(){ queue.length=0; }

function blobToB64(blob){ return new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob); }); }
function b64ToArrayBuffer(b64){ const bin=atob(b64); const len=bin.length; const bytes=new Uint8Array(len); for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }

$('start').onclick = connect;
$('stop').onclick = ()=>{ try{ socket&&socket.close(); }catch(e){} $('stop').style.display='none'; $('start').style.display='inline-block'; status.textContent='tap to start'; };
$('keygo').onclick = ()=>{ const v=$('keyin').value.trim(); if(v){ localStorage.setItem('hume_key',v); $('keybox').style.display='none'; connect(); } };
</script>
</body>
</html>
