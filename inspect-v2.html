<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Runway Session Inspector v2</title>
<style>
  body {
    font-family: monospace;
    background: #1a0d2b;
    color: #fff;
    padding: 30px;
  }
  h1 { color: #fb7185; text-align: center; }
  button {
    display: block;
    margin: 30px auto;
    font-size: 28px;
    padding: 25px 50px;
    background: linear-gradient(135deg, #e11d48, #fb7185);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: monospace;
    font-weight: bold;
  }
  button:disabled { opacity: 0.5; cursor: wait; }

  .box {
    margin: 20px 0;
    padding: 20px;
    border-radius: 12px;
    background: #2d1448;
    border: 1px solid #6a3eff;
  }
  .box h3 { color: #fb7185; margin: 0 0 10px 0; font-size: 16px; }
  pre { white-space: pre-wrap; word-break: break-all; margin: 0; font-size: 13px; line-height: 1.5; }
  .err { background: #4c1d24; border-color: #ef4444; }
  .ok  { background: #14532d; border-color: #22c55e; }
</style>
</head>
<body>

<h1>🔬 Runway Session Inspector v2</h1>
<p style="text-align:center">Tries to read every part of the response. <strong>Screenshot the whole page.</strong></p>

<button id="testBtn" onclick="runTest()">▶ INSPECT</button>

<div id="results"></div>

<script>
function tryDecode(label, str) {
  // Try base64 decode (with URL-safe variants), then JSON-parse if possible
  const fixed = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = fixed + '==='.slice((fixed.length + 3) % 4);

  let decoded;
  try {
    decoded = atob(padded);
  } catch(e) {
    return { label, raw: str, error: 'base64 decode failed: ' + e.message };
  }

  // Try JSON parse
  let parsed = null;
  try {
    parsed = JSON.parse(decoded);
  } catch(e) {
    // Not JSON. Show raw decoded text instead (first 500 chars).
    return { label, raw: str.substring(0, 80) + '...', decoded: decoded.substring(0, 500), parsed: null };
  }

  return { label, raw: str.substring(0, 80) + '...', parsed };
}

function addBox(title, content, isError = false) {
  const box = document.createElement('div');
  box.className = 'box' + (isError ? ' err' : '');
  box.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
  document.getElementById('results').appendChild(box);
}

async function runTest() {
  const btn = document.getElementById('testBtn');
  const results = document.getElementById('results');
  results.innerHTML = '';

  btn.disabled = true;
  btn.textContent = '⏳ Working...';

  try {
    const res = await fetch('https://long-art-8269r.dsbeauty01.workers.dev/runway-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatarId: 'music-superstar' })
    });

    const data = await res.json();

    // Show the FULL raw response from the worker
    addBox('1. FULL response from your Worker', JSON.stringify(data, null, 2));

    if (!data.sessionKey) {
      addBox('❌ No sessionKey', 'Stop here — no key to decode.', true);
      btn.disabled = false; btn.textContent = '🔄 RUN AGAIN'; return;
    }

    const key = data.sessionKey;
    addBox('2. The full sessionKey', key);

    // sessionKey format check
    addBox('3. sessionKey starts with', key.substring(0, 4));

    // The key has "stk_" prefix. Strip it before splitting.
    const stripped = key.startsWith('stk_') ? key.substring(4) : key;
    const parts = stripped.split('.');
    addBox('4. Number of dot-separated parts (after stripping stk_)', parts.length + ' parts');

    // Try to decode each part
    parts.forEach((part, i) => {
      if (part.length === 0) {
        addBox(`Part ${i + 1}: empty`, '(empty — likely the signature for unsigned JWTs)');
        return;
      }
      const result = tryDecode(`Part ${i + 1}`, part);
      if (result.parsed) {
        addBox(`Part ${i + 1}: JSON ✓`, JSON.stringify(result.parsed, null, 2));
      } else if (result.decoded) {
        addBox(`Part ${i + 1}: decoded text (not JSON)`, result.decoded);
      } else {
        addBox(`Part ${i + 1}: error`, result.error || 'unknown', true);
      }
    });

    addBox('✅ Done', 'Screenshot everything above and send to Claude.', false);

  } catch (err) {
    addBox('❌ Error', err.message + '\n\n' + (err.stack || ''), true);
  }

  btn.disabled = false;
  btn.textContent = '🔄 RUN AGAIN';
}
</script>

</body>
</html>
